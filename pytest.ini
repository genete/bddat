# Configuración de pytest (#1004). Solo fija dónde están los tests.
#
# Sin esto, `pytest` a secas desde la raíz recorre todo el repo y se interrumpe
# en la recogida:
#   - docs_prueba/temp/test*.txt   → los toma por doctest (UnicodeDecodeError).
#     Es la carpeta de temporales (REGLAS_BASH.md): un `test_*.py` de paso ahí
#     ni siquiera fallaría, se ejecutaría como un test más.
#   - scripts/cobertura_por_test.py → lo toma por test (termina en `_test.py`).
#
# Con una ruta explícita (`pytest tests/smoke`, un fichero, un nodeid) no cambia
# nada: `testpaths` solo actúa cuando no se pasa ninguna.
[pytest]
testpaths = tests
