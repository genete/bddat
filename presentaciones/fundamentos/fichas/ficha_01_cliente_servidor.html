<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha 1 · Cliente y servidor</title>
<style>
/* ===== Base común de las fichas BDDAT: copiar tal cual a cada ficha ===== */
:root{
  --fondo:#fff; --tarjeta:#F7F6F2; --borde:#D3D1C7; --borde-fuerte:#888780;
  --texto:#2C2C2A; --texto-2:#5F5E5A;
  --ida:#185FA5;      /* petición: lo que va */
  --vuelta:#3B6D11;   /* respuesta: lo que vuelve */
  --plan:#854F0B;     /* reservado: lo marcado ⚠️ (plan, aún no construido) */
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--fondo);overflow:hidden}
body{font-family:"Segoe UI",Roboto,Arial,sans-serif;color:var(--texto)}

/* Lienzo fijo de 1280x720 que se escala para caber en cualquier ventana */
#escenario{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center}

/* Aparición por pasos: cada elemento lleva data-paso="N" y se muestra al llegar a N */
.paso{opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s ease}
.paso.on{opacity:var(--op,1);transform:none}

/* Iconos de línea (el sprite está al principio del body) */
.ico{fill:none;stroke:currentColor;stroke-width:var(--s,1.5);stroke-linecap:round;stroke-linejoin:round}

/* Tarjeta: la forma común de todo "equipo" o "pieza" */
.tarjeta{background:var(--tarjeta);border:2px solid var(--borde);border-radius:18px;
  display:flex;flex-direction:column;align-items:center;justify-content:center}
.tarjeta.fuerte{border-color:var(--borde-fuerte)}
.tarjeta.punteada{background:transparent;border-style:dashed;border-color:var(--borde-fuerte);border-radius:12px}
.nombre{font-size:30px;font-weight:600}
.sub{font-size:20px;color:var(--texto-2)}

/* Conexión: línea que se dibuja + punta + rótulo + cita */
.flecha{width:100%;text-align:center}
.flecha.ida{color:var(--ida)}
.flecha.vuelta{color:var(--vuelta)}
.flecha .et{font-size:24px;font-weight:600;padding:4px 0}
.flecha .cita{font-size:19px;color:var(--texto-2)}
.tubo{display:flex;align-items:center}
.linea{flex:1;height:5px;border-radius:3px;background:currentColor;transform:scaleX(0);transition:transform .6s ease .1s}
.ida .linea{transform-origin:left center}
.vuelta .linea{transform-origin:right center}
.flecha.on .linea{transform:scaleX(1)}
.punta{width:30px;height:30px;fill:currentColor;flex:none;opacity:0;transition:opacity .2s ease .6s}
.ida .punta{margin-left:-8px}
.vuelta .punta{margin-right:-8px}
.flecha.on .punta{opacity:1}

/* Frase de cierre al pie */
.cierre{position:absolute;left:80px;right:80px;bottom:62px;text-align:center;font-size:32px;
  font-weight:600;border-top:2px solid var(--borde);padding-top:22px}

#ayuda{position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:14px;color:#B4B2A9;
  transition:opacity .4s}
@media (prefers-reduced-motion:reduce){.paso,.linea,.punta,#ayuda{transition:none}}

/* ===== Propio de esta ficha ===== */
.lienzo{position:absolute;left:80px;right:80px;top:40px;bottom:150px;
  display:grid;grid-template-columns:340px 1fr 340px;column-gap:30px;align-items:center}
.col-clientes{display:flex;flex-direction:column;gap:18px}
.cliente{height:110px;gap:14px;flex-direction:row;color:var(--texto-2)}
.cliente.principal{height:250px;flex-direction:column;gap:6px}
.cliente .fila{display:flex;align-items:center;gap:16px}
.col-red{display:flex;flex-direction:column;align-items:center;gap:36px}
.red{display:flex;align-items:center;gap:10px;font-size:21px;color:var(--texto-2)}
.servidor{padding:30px 22px;gap:8px;height:330px}
.servidor .datos{display:flex;align-items:center;gap:10px;padding:8px 16px;margin-top:12px;
  font-size:19px;color:var(--texto-2)}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-persona" viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></symbol>
  <symbol id="i-pc" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M3 8h18M7 20h10M9 16v4M15 16v4"/></symbol>
  <symbol id="i-servidor" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5v.01M7 16.5v.01M11 7.5h6M11 16.5h6"/></symbol>
  <symbol id="i-datos" viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></symbol>
  <symbol id="i-red" viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="19" r="2"/><path d="M12 7v5M12 12l-6 5.5M12 12l6 5.5"/></symbol>
</svg>

<div id="escenario">
  <div class="lienzo">

    <div class="col-clientes">
      <div class="tarjeta cliente paso" data-paso="5" style="--op:.7">
        <svg class="ico" width="36" height="36" style="--s:1.7"><use href="#i-persona"/></svg>
        <svg class="ico" width="64" height="64" style="--s:1.1"><use href="#i-pc"/></svg>
      </div>
      <div class="tarjeta fuerte cliente principal paso" data-paso="1" style="color:var(--texto)">
        <div class="fila">
          <svg class="ico" width="44" height="44" style="--s:1.5;color:var(--texto-2)"><use href="#i-persona"/></svg>
          <svg class="ico" width="96" height="96" style="--s:0.95"><use href="#i-pc"/></svg>
        </div>
        <div class="nombre">Navegador</div>
        <div class="sub">pinta y recoge</div>
      </div>
      <div class="tarjeta cliente paso" data-paso="5" style="--op:.5">
        <svg class="ico" width="36" height="36" style="--s:1.7"><use href="#i-persona"/></svg>
        <svg class="ico" width="64" height="64" style="--s:1.1"><use href="#i-pc"/></svg>
      </div>
    </div>

    <div class="col-red">
      <div class="red paso" data-paso="3">
        <svg class="ico" width="32" height="32" style="--s:1.6"><use href="#i-red"/></svg>red corporativa
      </div>
      <div class="flecha ida paso" data-paso="3">
        <div class="et">petición</div>
        <div class="tubo"><span class="linea"></span><svg class="punta" viewBox="0 0 24 24"><path d="M4 3l17 9-17 9z"/></svg></div>
        <div class="cita">«dame el expediente 123»</div>
      </div>
      <div class="flecha vuelta paso" data-paso="4">
        <div class="tubo"><svg class="punta" viewBox="0 0 24 24"><path d="M20 3L3 12l17 9z"/></svg><span class="linea"></span></div>
        <div class="et">respuesta</div>
        <div class="cita">«aquí lo tienes»</div>
      </div>
    </div>

    <div class="tarjeta fuerte servidor paso" data-paso="2">
      <svg class="ico" width="120" height="120" style="--s:0.8"><use href="#i-servidor"/></svg>
      <div class="nombre">Servidor</div>
      <div class="sub">decide y guarda</div>
      <div class="tarjeta punteada datos">
        <svg class="ico" width="28" height="28" style="--s:1.7"><use href="#i-datos"/></svg>los datos, en un sitio
      </div>
    </div>

  </div>
  <div class="cierre paso" data-paso="5">Muchos clientes, un solo servidor: todos ven lo mismo</div>
</div>

<div id="ayuda">← → o clic para avanzar</div>

<script>
(function(){
  var MAX = 5, paso = 1;
  var els = [].slice.call(document.querySelectorAll('[data-paso]'));
  var esc = document.getElementById('escenario');
  var ayuda = document.getElementById('ayuda');

  function pintar(){
    els.forEach(function(e){ e.classList.toggle('on', +e.getAttribute('data-paso') <= paso); });
  }
  function ir(n){
    paso = Math.max(1, Math.min(MAX, n));
    pintar();
    ayuda.style.opacity = 0;
  }
  function escalar(){
    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
    esc.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
  }

  document.addEventListener('keydown', function(ev){
    var k = ev.key;
    if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter') { ir(paso + 1); ev.preventDefault(); }
    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { ir(paso - 1); ev.preventDefault(); }
    else if (k === 'Home') ir(1);
    else if (k === 'End') ir(MAX);
  });
  document.addEventListener('click', function(){ ir(paso + 1); });
  window.addEventListener('resize', escalar);

  escalar();
  /* #todo muestra la ficha completa (útil para sacar una imagen); #paso=N empieza en el paso N */
  var h = location.hash, m = h.match(/paso=(\d+)/);
  if (h === '#todo') { paso = MAX; ayuda.style.display = 'none'; }
  else if (m) paso = Math.max(1, Math.min(MAX, +m[1]));
  requestAnimationFrame(pintar);
})();
</script>
</body>
</html>
