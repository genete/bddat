d || !NAV[e.key]) return;\n    e.stopImmediatePropagation(); e.preventDefault();\n    parent.postMessage({tecla: e.key}, '*');\n  }, true);\n  document.addEventListener('click', function(e){\n    if (!e.isTrusted) return;\n    e.stopImmediatePropagation();\n    parent.postMessage({cmd: 'next'}, '*');\n  }, true);\n\n  window.addEventListener('load', function(){\n    setTimeout(function(){\n      window.dispatchEvent(new Event('resize'));\n      parent.postMessage({listo: true}, '*');\n    }, 60);\n  });\n})();\n<\/script>\n\n<svg width=\"0\" height=\"0\" style=\"position:absolute\" aria-hidden=\"true\">\n  <symbol id=\"i-pc\" viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"12\" rx=\"2\"/><path d=\"M3 8h18M7 20h10M9 16v4M15 16v4\"/><\/symbol>\n  <symbol id=\"i-check\" viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M8 12.5l3 3 5-6\"/><\/symbol>\n  <symbol id=\"i-llave\" viewBox=\"0 0 24 24\"><circle cx=\"8\" cy=\"15\" r=\"4\"/><path d=\"M11 12l9-9M16 7l3 3M14 9l2 2\"/><\/symbol>\n  <symbol id=\"i-capas\" viewBox=\"0 0 24 24\"><path d=\"M12 3l9 5-9 5-9-5zM3 13l9 5 9-5\"/><\/symbol>\n  <symbol id=\"i-ayuda\" viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17v.01\"/><\/symbol>\n  <symbol id=\"i-descarga\" viewBox=\"0 0 24 24\"><path d=\"M12 4v11M7 11l5 5 5-5M5 20h14\"/><\/symbol>\n  <symbol id=\"i-cursor\" viewBox=\"0 0 24 24\"><path d=\"M6 3l13 9-6 1.5L10.5 20z\"/><\/symbol>\n<\/svg>\n\n<div id=\"escenario\">\n  <div class=\"lienzo\">\n\n    <div class=\"fila1\">\n      <div class=\"tarjeta fuerte puesto paso\" data-paso=\"1\">\n        <svg class=\"ico\" width=\"64\" height=\"64\" style=\"--s:1.1\"><use href=\"#i-pc\"/><\/svg>\n        <div class=\"nombre\">Puesto de usuario<\/div>\n        <div class=\"sub\">solo necesita el navegador<\/div>\n        <div class=\"vent\">\n          <div class=\"bar\"><i><\/i><i><\/i><i><\/i><\/div>\n          <div class=\"cuerpo\"><svg class=\"ico\" width=\"30\" height=\"30\" style=\"--s:1.7\"><use href=\"#i-check\"/><\/svg>nada más<\/div>\n        <\/div>\n      <\/div>\n\n      <div class=\"tarjeta costes paso\" data-paso=\"2\">\n        <div class=\"tit\">Instalar programas en cada PC es caro<\/div>\n        <div class=\"fila\">\n          <div class=\"pieza\"><svg class=\"ico\" width=\"30\" height=\"30\" style=\"--s:1.6\"><use href=\"#i-llave\"/><\/svg>permisos de administrador<\/div>\n          <div class=\"pieza\"><svg class=\"ico\" width=\"30\" height=\"30\" style=\"--s:1.6\"><use href=\"#i-capas\"/><\/svg>versiones distintas<\/div>\n          <div class=\"pieza\"><svg class=\"ico\" width=\"30\" height=\"30\" style=\"--s:1.6\"><use href=\"#i-ayuda\"/><\/svg>soporte<\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"fila2\">\n      <div class=\"tarjeta fuerte caso paso\" data-paso=\"3\">\n        <div class=\"etiq hoy\">hoy<\/div>\n        <div class=\"cab\">\n          <svg class=\"ico\" width=\"44\" height=\"44\" style=\"--s:1.4\"><use href=\"#i-descarga\"/><\/svg>\n          <div class=\"nombre\">Una excepción<\/div>\n        <\/div>\n        <div class=\"sub\">un pequeño instalador en cada PC, para abrir carpetas desde la web<\/div>\n      <\/div>\n\n      <div class=\"cambia\">\n        <div class=\"rot paso\" data-paso=\"4\">después<\/div>\n        <div class=\"flecha neutra ida paso\" data-paso=\"4\"><div class=\"tubo\"><span class=\"linea\"><\/span><svg class=\"punta\" viewBox=\"0 0 24 24\"><path d=\"M4 3l17 9-17 9z\"/><\/svg><\/div><\/div>\n      <\/div>\n\n      <div class=\"tarjeta caso plan paso\" data-paso=\"4\">\n        <div class=\"etiq\">probado, sin construir<\/div>\n        <div class=\"cab\">\n          <svg class=\"ico\" width=\"44\" height=\"44\" style=\"--s:1.4\"><use href=\"#i-cursor\"/><\/svg>\n          <div class=\"nombre\">Un botón del navegador<\/div>\n        <\/div>\n        <div class=\"sub\">abre LibreOffice, el programa que la Junta ya tiene: nada que instalar<\/div>\n      <\/div>\n    <\/div>\n\n  <\/div>\n  <div class=\"cierre paso\" data-paso=\"5\">Se usa desde el navegador: el puesto no necesita nada más<\/div>\n<\/div>\n\n<div id=\"ayuda\">← → o clic para avanzar<\/div>\n\n<script>\n(function(){\n  var MAX = 5, paso = 1;\n  var els = [].slice.call(document.querySelectorAll('[data-paso]'));\n  var esc = document.getElementById('escenario');\n  var ayuda = document.getElementById('ayuda');\n\n  function pintar(){\n    els.forEach(function(e){ e.classList.toggle('on', +e.getAttribute('data-paso') <= paso); });\n  }\n  function ir(n){\n    paso = Math.max(1, Math.min(MAX, n));\n    pintar();\n    ayuda.style.opacity = 0;\n  }\n  function escalar(){\n    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);\n    esc.style.transform = 'translate(-50%,-50%) scale(' + s + ')';\n  }\n\n  document.addEventListener('keydown', function(ev){\n    var k = ev.key;\n    if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter') { ir(paso + 1); ev.preventDefault(); }\n    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { ir(paso - 1); ev.preventDefault(); }\n    else if (k === 'Home') ir(1);\n    else if (k === 'End') ir(MAX);\n  });\n  document.addEventListener('click', function(){ ir(paso + 1); });\n  window.addEventListener('resize', escalar);\n\n  escalar();\n  /* #todo muestra la ficha completa (útil para sacar una imagen); #paso=N empieza en el paso N */\n  var h = location.hash, m = h.match(/paso=(\\d+)/);\n  if (h === '#todo') { paso = MAX; ayuda.style.display = 'none'; }\n  else if (m) paso = Math.max(1, Math.min(MAX, +m[1]));\n  requestAnimationFrame(pintar);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"titulo": "Ficha 14 · El servidor decide", "html": "<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Ficha 14 · El servidor decide<\/title>\n<style>\n/* ===== Base común de las fichas BDDAT: copiar tal cual a cada ficha ===== */\n:root{\n  --fondo:#fff; --tarjeta:#F7F6F2; --borde:#D3D1C7; --borde-fuerte:#888780;\n  --texto:#2C2C2A; --texto-2:#5F5E5A;\n  --ida:#185FA5;      /* petición: lo que va */\n  --vuelta:#3B6D11;   /* respuesta: lo que vuelve */\n  --plan:#854F0B;     /* reservado: lo marcado ⚠️ (plan, aún no construido) */\n}\n*{box-sizing:border-box;margin:0}\nhtml,body{height:100%;background:var(--fondo);overflow:hidden}\nbody{font-family:\"Segoe UI\",Roboto,Arial,sans-serif;color:var(--texto)}\n\n/* Lienzo fijo de 1280x720 que se escala para caber en cualquier ventana */\n#escenario{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center}\n\n/* Aparición por pasos: cada elemento lleva data-paso=\"N\" y se muestra al llegar a N */\n.paso{opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s ease}\n.paso.on{opacity:var(--op,1);transform:none}\n\n/* Iconos de línea (el sprite está al principio del body) */\n.ico{fill:none;stroke:currentColor;stroke-width:var(--s,1.5);stroke-linecap:round;stroke-linejoin:round}\n\n/* Tarjeta: la forma común de todo \"equipo\" o \"pieza\" */\n.tarjeta{background:var(--tarjeta);border:2px solid var(--borde);border-radius:18px;\n  display:flex;flex-direction:column;align-items:center;justify-content:center}\n.tarjeta.fuerte{border-color:var(--borde-fuerte)}\n.tarjeta.punteada{background:transparent;border-style:dashed;border-color:var(--borde-fuerte);border-radius:12px}\n.nombre{font-size:30px;font-weight:600}\n.sub{font-size:20px;color:var(--texto-2)}\n\n/* Conexión: línea que se dibuja + punta + rótulo + cita */\n.flecha{width:100%;text-align:center}\n.flecha.ida{color:var(--ida)}\n.flecha.vuelta{color:var(--vuelta)}\n.flecha .et{font-size:24px;font-weight:600;padding:4px 0}\n.flecha .cita{font-size:19px;color:var(--texto-2)}\n.tubo{display:flex;align-items:center}\n.linea{flex:1;height:5px;border-rad height:12px;border-radius:50%;background:var(--vuelta)}\n\n/* La flecha del estado ya calculado */\n.paso-estado{padding:0 10px;display:flex;flex-direction:column;justify-content:center}\n.paso-estado .rot{font-size:20px;font-weight:600;color:var(--vuelta);text-align:center;padding-bottom:2px}\n.paso-estado .nota{font-size:17px;font-style:italic;color:var(--texto-2);text-align:center;padding-top:4px}\n\n/* Por qué no al revés: tres razones */\n.razones{display:flex;flex-direction:column;gap:8px}\n.razones .cap{font-size:22px;font-weight:600;color:var(--texto-2)}\n.fila{display:flex;gap:12px}\n.pieza{flex:1;display:flex;align-items:flex-start;gap:10px;background:#fff;border:2px solid var(--borde-fuerte);\n  border-radius:12px;padding:8px 12px;color:var(--texto);text-align:left}\n.pieza .ico{flex:none;margin-top:2px}\n.pieza .t{font-size:20px;font-weight:600;line-height:1.15}\n.pieza .s{font-size:17px;color:var(--texto-2);line-height:1.2}\n<\/style>\n<\/head>\n<body>\n<script>\n(function(){\n  var st = document.createElement('style');\n  st.textContent = '#ayuda{display:none!important}';\n  document.head.appendChild(st);\n\n  function conPaso(){ return [].slice.call(document.querySelectorAll('[data-paso]')); }\n  function maximo(){\n    return Math.max.apply(null, conPaso().map(function(e){ return +e.getAttribute('data-paso'); }));\n  }\n  function actual(){\n    var v = conPaso().filter(function(e){ return e.classList.contains('on'); })\n      .map(function(e){ return +e.getAttribute('data-paso'); });\n    return Math.max.apply(null, [1].concat(v));\n  }\n  function tecla(k){ document.dispatchEvent(new KeyboardEvent('keydown', {key: k, bubbles: true})); }\n\n  window.addEventListener('message', function(ev){\n    var m = ev.data || {};\n    if (m.cmd === 'next') {\n      if (actual() >= maximo()) parent.postMessage({fin: 'fin'}, '*'); else tecla('ArrowRight');\n    } else if (m.cmd === 'prev') {\n      if (actual() <= 1) parent.postMessage({fin: 'inicio'}, '*'); else tecla('ArrowLeft');\n    } else if (m.cmd === 'ultimo') {\n      tecla('End');\n    }\n  });\n\n  var NAV = {ArrowRight:1, ArrowLeft:1, ArrowUp:1, ArrowDown:1, ' ':1, PageDown:1, PageUp:1,\n             Enter:1, Backspace:1, Home:1, End:1, f:1, F:1};\n  document.addEventListener('keydown', function(e){\n    if (!e.isTrusted || !NAV[e.key]) return;\n    e.stopImmediatePropagation(); e.preventDefault();\n    parent.postMessage({tecla: e.key}, '*');\n  }, true);\n  document.addEventListener('click', function(e){\n    if (!e.isTrusted) return;\n    e.stopImmediatePropagation();\n    parent.postMessage({cmd: 'next'}, '*');\n  }, true);\n\n  window.addEventListener('load', function(){\n    setTimeout(function(){\n      window.dispatchEvent(new Event('resize'));\n      parent.postMessage({listo: true}, '*');\n    }, 60);\n  });\n})();\n<\/script>\n\n<svg width=\"0\" height=\"0\" style=\"position:absolute\" aria-hidden=\"true\">\n  <symbol id=\"i-pc\" viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"12\" rx=\"2\"/><path d=\"M3 8h18M7 20h10M9 16v4M15 16v4\"/><\/symbol>\n  <symbol id=\"i-servidor\" viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"7\" rx=\"2\"/><rect x=\"3\" y=\"13\" width=\"18\" height=\"7\" rx=\"2\"/><path d=\"M7 7.5v.01M7 16.5v.01M11 7.5h6M11 16.5h6\"/><\/symbol>\n  <symbol id=\"i-filtro\" viewBox=\"0 0 24 24\"><path d=\"M3 5h18l-7 8v6l-4-2v-4z\"/><\/symbol>\n  <symbol id=\"i-arbol\" viewBox=\"0 0 24 24\"><rect x=\"4\" y=\"3\" width=\"6\" height=\"5\" rx=\"1\"/><rect x=\"12\" y=\"10\" width=\"8\" height=\"4\" rx=\"1\"/><rect x=\"12\" y=\"17\" width=\"8\" height=\"4\" rx=\"1\"/><path d=\"M7 8v10h5M7 12h5\"/><\/symbol>\n  <symbol id=\"i-orden\" viewBox=\"0 0 24 24\"><path d=\"M8 4v16M5 7l3-3 3 3M16 20V4M13 17l3 3 3-3\"/><\/symbol>\n  <symbol id=\"i-check\" viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M8 12.5l3 3 5-6\"/><\/symbol>\n  <symbol id=\"i-reloj\" viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M12 7v5l3 2\"/><\/symbol>\n  <symbol id=\"i-balanza\" viewBox=\"0 0 24 24\"><path d=\"M12 4v16M6 20h12M5 8h14M5 8l-2.5 6a3 3 0 0 0 5 0zM19 8l-2.5 6a3 3 0 0 0 5 0z\"/><\/symbol>\n  <symbol id=\"i-archivo\" viewBox=\"0 0 24 24\"><path d=\"M6 3h8l4 4v14H6zM14 3v4h4\"/><\/symbol>\n  <symbol id=\"i-copias\" viewBox=\"0 0 24 24\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2\"/><path d=\"M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2\"/><\/symbol>\n  <symbol id=\"i-repetir\" viewBox=\"0 0 24 24\"><path d=\"M4 12a8 8 0 0 1 13.5-5.8L20 8.5M20 4v4.5h-4.5M20 12a8 8 0 0 1-13.5 5.8L4 15.5M4 20v-4.5h4.5\"/><\/symbol>\n  <symbol id=\"i-caja\" viewBox=\"0 0 24 24\"><path d=\"M12 3l8 4.5v9L12 21l-8-4.5v-9zM4 7.5l8 4.5 8-4.5M12 12v9\"/><\/symbol>\n<\/svg>\n\n<div id=\"escenario\">\n  <div class=\"lienzo\">\n\n    <div class=\"arriba\">\n\n      <div class=\"tarjeta fuerte lado paso\" data-paso=\"2\">\n        <div class=\"cab-c\">\n          <svg class=\"ico\" width=\"48\" height=\"48\" style=\"--s:1.3\"><use href=\"#i-pc\"/><\/svg>\n          <div><div class=\"nombre\">Navegador<\/div><div class=\"sub\">pinta<\/div><\/div>\n        <\/div>\n        <div class=\"item\"><svg class=\"ico\" width=\"28\" height=\"28\" style=\"--s:1.7\"><use href=\"#i-filtro\"/><\/svg>filtrar un listado ya cargado<\/div>\n        <div class=\"item\"><svg class=\"ico\" width=\"28\" height=\"28\" style=\"--s:1.7\"><use href=\"#i-arbol\"/><\/svg>dibujar un árbol que se despliega<\/div>\n        <div class=\"item\"><svg class=\"ico\" width=\"28\" height=\"28\" style=\"--s:1.7\"><use href=\"#i-orden\"/><\/svg>reordenar columnas<\/div>\n        <div class=\"pinta\">recibe «en plazo» y lo pinta <span class=\"pildora\"><i><\/i>en plazo<\/span><\/div>\n      <\/div>\n\n      <div class=\"paso-estado\">\n        <div class=\"rot paso\" data-paso=\"2\">«en plazo»<\/div>\n        <div class=\"flecha vuelta paso\" data-paso=\"2\"><div class=\"tubo\"><svg class=\"punta\" viewBox=\"0 0 24 24\"><path d=\"M20 3L3 12l17 9z\"/><\/svg><span class=\"linea\"><\/span><\/div><\/div>\n        <div class=\"nota paso\" data-paso=\"2\">ya calculado<\/div>\n      <\/div>\n\n      <div class=\"tarjeta fuerte lado paso\" data-paso=\"1\">\n        <div class=\"cab-c\">\n          <svg class=\"ico\" width=\"48\" height=\"48\" style=\"--s:1.3\"><use href=\"#i-servidor\"/><\/svg>\n          <div><div class=\"nombre\">Servidor<\/div><div class=\"sub\">decide<\/div><\/div>\n        <\/div>\n        <div class=\"item\"><svg class=\"ico\" width=\"28\" height=\"28\" style=\"--s:1.7\"><use href=\"#i-check\"/><\/svg>estados<\/div>\n        <div class=\"item\"><svg class=\"ico\" width=\"28\" height=\"28\" style=\"--s:1.7\"><use href=\"#i-reloj\"/><\/svg>plazos<\/div>\n        <div class=\"item\"><svg class=\"ico\" width=\"28\" height=\"28\" style=\"--s:1.7\"><use href=\"#i-balanza\"/><\/svg>reglas<\/div>\n        <div class=\"item\"><svg class=\"ico\" width=\"28\" height=\"28\" style=\"--s:1.7\"><use href=\"#i-archivo\"/><\/svg>generar ficheros<\/div>\n      <\/div>\n\n    <\/div>\n\n    <div class=\"razones\">\n      <div class=\"cap paso\" data-paso=\"3\">Por qué no al revés<\/div>\n      <div class=\"fila\">\n        <div class=\"pieza paso\" data-paso=\"3\">\n          <svg class=\"ico\" width=\"28\" height=\"28\" style=\"--s:1.7\"><use href=\"#i-copias\"/><\/svg>\n          <div><div class=\"t\">Dos copias de la lógica<\/div><div class=\"s\">en dos lenguajes; con el tiempo, se separan<\/div><\/div>\n        <\/div>\n        <div class=\"pieza paso\" data-paso=\"4\">\n          <svg class=\"ico\" width=\"28\" height=\"28\" style=\"--s:1.7\"><use href=\"#i-repetir\"/><\/svg>\n          <div><div class=\"t\">El servidor lo repite<\/div><div class=\"s\">al guardar, lo comprueba otra vez<\/div><\/div>\n        <\/div>\n        <div class=\"pieza paso\" data-paso=\"5\">\n          <svg class=\"ico\" width=\"28\" height=\"28\" style=\"--s:1.7\"><use href=\"#i-caja\"/><\/svg>\n          <div><div class=\"t\">Las herramientas, en el servidor<\/div><div class=\"s\">no habría que repartirlas por cada PC<\/div><\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n\n  <\/div>\n  <div class=\"cierre paso\" data-paso=\"6\">El navegador pinta, el servidor decide: una sola verdad<\/div>\n<\/div>\n\n<div id=\"ayuda\">← → o clic para avanzar<\/div>\n\n<script>\n(function(){\n  var MAX = 6, paso = 1;\n  var els = [].slice.call(document.querySelectorAll('[data-paso]'));\n  var esc = document.getElementById('escenario');\n  var ayuda = document.getElementById('ayuda');\n\n  function pintar(){\n    els.forEach(function(e){ e.classList.toggle('on', +e.getAttribute('data-paso') <= paso); });\n  }\n  function ir(n){\n    paso = Math.max(1, Math.min(MAX, n));\n    pintar();\n    ayuda.style.opacity = 0;\n  }\n  function escalar(){\n    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);\n    esc.style.transform = 'translate(-50%,-50%) scale(' + s + ')';\n  }\n\n  document.addEventListener('keydown', function(ev){\n    var k = ev.key;\n    if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter') { ir(paso + 1); ev.preventDefault(); }\n    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { ir(paso - 1); ev.preventDefault(); }\n    else if (k === 'Home') ir(1);\n    else if (k === 'End') ir(MAX);\n  });\n  document.addEventListener('click', function(){ ir(paso + 1); });\n  window.addEventListener('resize', escalar);\n\n  escalar();\n  /* #todo muestra la ficha completa (útil para sacar una imagen); #paso=N empieza en el paso N */\n  var h = location.hash, m = h.match(/paso=(\\d+)/);\n  if (h === '#todo') { paso = MAX; ayuda.style.display = 'none'; }\n  else if (m) paso = Math.max(1, Math.min(MAX, +m[1]));\n  requestAnimationFrame(pintar);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"titulo": "Ficha 15 · La configuración, fuera del código", "html": "<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Ficha 15 · La configuración, fuera del código<\/title>\n<style>\n/* ===== Base común de las fichas BDDAT: copiar tal cual a cada ficha ===== */\n:root{\n  --fondo:#fff; --tarjeta:#F7F6F2; --borde:#D3D1C7; --borde-fuerte:#888780;\n  --texto:#2C2C2A; --texto-2:#5F5E5A;\n  --ida:#185FA5;      /* petición: lo que va */\n  --vuelta:#3B6D11;   /* respuesta: lo que vuelve */\n  --plan:#854F0B;     /* reservado: lo marcado ⚠️ (plan, aún no construido) */\n}\n*{box-sizing:border-box;margin:0}\nhtml,body{height:100%;background:var(--fondo);overflow:hidden}\nbody{font-family:\"Segoe UI\",Roboto,Arial,sans-serif;color:var(--texto)}\n\n/* Lienzo fijo de 1280x720 que se escala para caber en cualquier ventana */\n#escenario{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center}\n\n/* Aparición por pasos: cada elemento lleva data-paso=\"N\" y se muestra al llegar a N */\n.paso{opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s ease}\n.paso.on{opacity:var(--op,1);transform:none}\n\n/* Iconos de línea (el sprite está al principio del body) */\n.ico{fill:none;stroke:currentColor;stroke-width:var(--s,1.5);stroke-linecap:round;stroke-linejoin:round}\n\n/* Tarjeta: la forma común de todo \"equipo\" o \"pieza\" */\n.tarjeta{background:var(--tarjeta);border:2px solid var(--borde);border-radius:18px;\n  display:flex;flex-direction:column;align-items:center;justify-content:center}\n.tarjeta.fuerte{border-color:var(--borde-fuerte)}\n.tarjeta.punteada{background:transparent;border-style:dashed;border-color:var(--borde-fuerte);border-radius:12px}\n.nombre{font-size:30px;font-weight:600}\n.sub{font-size:20px;color:var(--texto-2)}\n\n/* Conexión: línea que se dibuja + punta + rótulo + cita */\n.flecha{width:100%;text-align:center}\n.flecha.ida{color:var(--ida)}\n.flecha.vuelta{color:var(--vuelta)}\n.flecha .et{font-size:24px;font-weight:600;padding:4px 0}\n.flecha .cita{font-size:19px;color:var(--texto-2)}\n.tubo{display:flex;align-items:center}\n.linea{flex:1;height:5px;border-radius:3px;background:currentColor;transform:scaleX(0);transition:transform .6s ease .1s}\n.ida .linea{transform-origin:left center}\n.vuelta .linea{transform-origin:right center}\n.flecha.on .linea{transform:scaleX(1)}\n.punta{width:30px;height:30px;fill:currentColor;flex:none;opacity:0;transition:opacity .2s ease .6s}\n.ida .punta{margin-left:-8px}\n.vuelta .punta{margin-right:-8px}\n.flecha.on .punta{opacity:1}\n\n/* Frase de cierre al pie */\n.cierre{position:absolute;left:80px;right:80px;bottom:62px;text-align:center;font-size:32px;\n  font-weight:600;border-top:2px solid var(--borde);padding-top:22px}\n\n#ayuda{position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:14px;color:#B4B2A9;\n  transition:opacity .4s}\n@media (prefers-reduced-motion:reduce){.paso,.linea,.punta,#ayuda{transition:none}}\n\n/* ===== Propio de esta ficha ===== */\n.lienzo{position:absolute;left:80px;right:80px;top:26px;bottom:150px;display:flex;flex-direction:column;\n  justify-content:center;gap:22px}\n\n/* La figura: el programa a la izquierda, tres configuraciones a la derecha, alineadas por filas */\n.fig{display:grid;grid-template-columns:270px 100px 1fr;grid-template-rows:54px 82px 82px 82px;row-gap:8px}\n.prog{grid-column:1;grid-row:2 / span 3;padding:18px;gap:8px;color:var(--texto)}\n.prog .nombre{font-size:27px;text-align:center;line-height:1.15}\n.prog .sub{font-size:18px;text-align:center;line-height:1.25}\n.fl{grid-column:2;display:flex;align-items:center;padding:0 6px}\n.flecha.neutra{color:var(--borde-fuerte)}\n\n/* Cada fila es una configuración: un nombre y tres valores */\n.cols{grid-column:3;display:grid;grid-template-columns:170px 1fr 1fr 1fr;column-gap:10px;align-items:center}\n.cols.tit{padding:0 16px;align-items:end}\n.cols.tit .c{font-size:17px;font-weight:600;color:var(--texto-2);line-height:1.15;padding-bottom:4px}\n.env{position:relative;padding:0 16px;border-radius:14px}\n.env.plan{border-color:var(--plan)}\n.env .n{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:600}\n.v{font-size:19px;color:var(--texto-2);line-height:1.2}\n.v.sec{font-size:22px;letter-spacing:2px;color:var(--texto)}\n.etiq{position:absolute;top:-13px;right:14px;background:#fff;border:1.5px solid var(--plan);\n  color:var(--plan);border-radius:8px;padding:0 9px;font-size:15px;font-weight:600;line-height:1.4}\n\n/* Por qué se separan: tres razones */\n.razones{display:flex;flex-direction:column;gap:8px}\n.razones .cap{font-size:22px;font-weight:600;color:var(--texto-2)}\n.fila{display:flex;gap:12px}\n.pieza{flex:1;display:flex;align-items:flex-start;gap:10px;background:#fff;border:2px solid var(--borde-fuerte);\n  border-radius:12px;padding:8px 12px;color:var(--texto);text-align:left}\n.pieza .ico{flex:none;margin-top:2px}\n.pieza .t{font-size:20px;font-weight:600;line-height:1.15}\n.pieza .s{font-size:17px;color:var(--texto-2);line-height:1.2}\n<\/style>\n<\/head>\n<body>\n<script>\n(function(){\n  var st = document.createElement('style');\n  st.textContent = '#ayuda{display:none!important}';\n  document.head.appendChild(st);\n\n  function conPaso(){ return [].slice.call(document.querySelectorAll('[data-paso]')); }\n  function maximo(){\n    return Math.max.apply(null, conPaso().map(function(e){ return +e.getAttribute('data-paso'); }));\n  }\n  function actual(){\n    var v = conPaso().filter(function(e){ return e.classList.contains('on'); })\n      .map(function(e){ return +e.getAttribute('data-paso'); });\n    return Math.max.apply(null, [1].concat(v));\n  }\n  function tecla(k){ document.dispatchEvent(new KeyboardEvent('keydown', {key: k, bubbles: true})); }\n\n  window.addEventListener('message', function(ev){\n    var m = ev.data || {};\n    if (m.cmd === 'next') {\n      if (actual() >= maximo()) parent.postMessage({fin: 'fin'}, '*'); else tecla('ArrowRight');\n    } else if (m.cmd === 'prev') {\n      if (actual() <= 1) parent.postMessage({fin: 'inicio'}, '*'); else tecla('ArrowLeft');\n    } else if (m.cmd === 'ultimo') {\n      tecla('End');\n    }\n  });\n\n  var NAV = {ArrowRight:1, ArrowLeft:1, ArrowUp:1, ArrowDown:1, ' ':1, PageDown:1, PageUp:1,\n             Enter:1, Backspace:1, Home:1, End:1, f:1, F:1};\n  document.addEventListener('keydown', function(e){\n    if (!e.isTrusted || !NAV[e.key]) return;\n    e.stopImmediatePropagation(); e.preventDefault();\n    parent.postMessage({tecla: e.key}, '*');\n  }, true);\n  document.addEventListener('click', function(e){\n    if (!e.isTrusted) return;\n    e.stopImmediatePropagation();\n    parent.postMessage({cmd: 'next'}, '*');\n  }, true);\n\n  window.addEventListener('load', function(){\n    setTimeout(function(){\n      window.dispatchEvent(new Event('resize'));\n      parent.postMessage({listo: true}, '*');\n    }, 60);\n  });\n})();\n<\/script>\n\n<svg width=\"0\" height=\"0\" style=\"position:absolute\" aria-hidden=\"true\">\n  <symbol id=\"i-codigo\" viewBox=\"0 0 24 24\"><path d=\"M7 8l-4 4 4 4M17 8l4 4-4 4M14 4l-4 16\"/><\/symbol>\n  <symbol id=\"i-ficha\" viewBox=\"0 0 24 24\"><path d=\"M6 3h8l4 4v14H6zM14 3v4h4M9 12h6M9 16h6\"/><\/symbol>\n  <symbol id=\"i-llave\" viewBox=\"0 0 24 24\"><circle cx=\"8\" cy=\"15\" r=\"4\"/><path d=\"M11 12l9-9M16 7l3 3M14 9l2 2\"/><\/symbol>\n  <symbol id=\"i-copias\" viewBox=\"0 0 24 24\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2\"/><path d=\"M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2\"/><\/symbol>\n  <symbol id=\"i-ajustes\" viewBox=\"0 0 24 24\"><path d=\"M4 7h10M18 7h2M4 17h2M10 17h10\"/><circle cx=\"16\" cy=\"7\" r=\"2\"/><circle cx=\"8\" cy=\"17\" r=\"2\"/><\/symbol>\n<\/svg>\n\n<div id=\"escenario\">\n  <div class=\"lienzo\">\n\n    <div class=\"fig\">\n\n      <div class=\"tarjeta fuerte prog paso\" data-paso=\"1\">\n        <svg class=\"ico\" width=\"72\" height=\"72\" style=\"--s:1.1\"><use href=\"#i-codigo\"/><\/svg>\n        <div class=\"nombre\">El mismo programa<\/div>\n        <div class=\"sub\">el mismo código en todos los sitios<\/div>\n      <\/div>\n\n      <div class=\"cols tit paso\" data-paso=\"2\" style=\"grid-row:1\">\n        <div><\/div>\n        <div class=\"c\">dirección de la base de datos<\/div>\n        <div class=\"c\">carpetas de ficheros<\/div>\n        <div class=\"c\">clave secreta<\/div>\n      <\/div>\n\n      <div class=\"fl\" style=\"grid-row:2\"><div class=\"flecha neutra vuelta paso\" data-paso=\"2\"><div class=\"tubo\"><svg class=\"punta\" viewBox=\"0 0 24 24\"><path d=\"M20 3L3 12l17 9z\"/><\/svg><span class=\"linea\"><\/span><\/div><\/div><\/div>\n      <div class=\"cols tarjeta env paso\" data-paso=\"2\" style=\"grid-row:2;border-color:var(--borde-fuerte)\">\n        <div class=\"n\"><svg class=\"ico\" width=\"30\" height=\"30\" style=\"--s:1.6\"><use href=\"#i-ficha\"/><\/svg>Desarrollo<\/div>\n        <div class=\"v\">la suya<\/div><div class=\"v\">las suyas<\/div><div class=\"v sec\">••••••••<\/div>\n      <\/div>\n\n      <div class=\"fl\" style=\"grid-row:3\"><div class=\"flecha neutra vuelta paso\" data-paso=\"3\"><div class=\"tubo\"><svg class=\"punta\" viewBox=\"0 0 24 24\"><path d=\"M20 3L3 12l17 9z\"/><\/svg><span class=\"linea\"><\/span><\/div><\/div><\/div>\n      <div class=\"cols tarjeta env paso\" data-paso=\"3\" style=\"grid-row:3;border-color:var(--borde-fuerte)\">\n        <div class=\"n\"><svg class=\"ico\" width=\"30\" height=\"30\" style=\"--s:1.6\"><use href=\"#i-ficha\"/><\/svg>Pruebas<\/div>\n        <div class=\"v\">la suya<\/div><div class=\"v\">las suyas<\/div><div class=\"v sec\">••••••••<\/div>\n      <\/div>\n\n      <div class=\"fl\" style=\"grid-row:4\"><div class=\"flecha neutra vuelta paso\" data-paso=\"4\"><div class=\"tubo\"><svg class=\"punta\" viewBox=\"0 0 24 24\"><path d=\"M20 3L3 12l17 9z\"/><\/svg><span class=\"linea\"><\/span><\/div><\/div><\/div>\n      <div class=\"cols tarjeta env plan paso\" data-paso=\"4\" style=\"grid-row:4\">\n        <div class=\"etiq\">plan<\/div>\n        <div class=\"n\"><svg class=\"ico\" width=\"30\" height=\"30\" style=\"--s:1.6\"><use href=\"#i-ficha\"/><\/svg>Producción<\/div>\n        <div class=\"v\">la suya<\/div><div class=\"v\">las suyas<\/div><div class=\"v sec\">••••••••<\/div>\n      <\/div>\n\n    <\/div>\n\n    <div class=\"razones\">\n      <div class=\"cap paso\" data-paso=\"5\">Por qué se separan el programa y su configuración<\/div>\n      <div class=\"fila\">\n        <div class=\"pieza paso\" data-paso=\"5\">\n          <svg class=\"ico\" width=\"28\" height=\"28\" style=\"--s:1.7\"><use href=\"#i-copias\"/><\/svg>\n          <div><div class=\"t\">Un solo programa<\/div><div class=\"s\">el mismo código sirve en todos los sitios: no hay copias que se separen<\/div><\/div>\n        <\/div>\n        <div class=\"pieza paso\" data-paso=\"6\">\n          <svg class=\"ico\" width=\"28\" height=\"28\" style=\"--s:1.7\"><use href=\"#i-llave\"/><\/svg>\n          <div><div class=\"t\">Los secretos no viajan con el código<\/div><div class=\"s\">el código se comparte; las claves, no<\/div><\/div>\n        <\/div>\n        <div class=\"pieza paso\" data-paso=\"7\">\n          <svg class=\"ico\" width=\"28\" height=\"28\" style=\"--s:1.7\"><use href=\"#i-ajustes\"/><\/svg>\n          <div><div class=\"t\">Cambiar un valor no es cambiar el programa<\/div><div class=\"s\">se edita un fichero, no el código<\/div><\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n\n  <\/div>\n  <div class=\"cierre paso\" data-paso=\"8\">El mismo programa en todas partes; solo cambia la configuración<\/div>\n<\/div>\n\n<div id=\"ayuda\">← → o clic para avanzar<\/div>\n\n<script>\n(function(){\n  var MAX = 8, paso = 1;\n  var els = [].slice.call(document.querySelectorAll('[data-paso]'));\n  var esc = document.getElementById('escenario');\n  var ayuda = document.getElementById('ayuda');\n\n  function pintar(){\n    els.forEach(function(e){ e.classList.toggle('on', +e.getAttribute('data-paso') <= paso); });\n  }\n  function ir(n){\n    paso = Math.max(1, Math.min(MAX, n));\n    pintar();\n    ayuda.style.opacity = 0;\n  }\n  function escalar(){\n    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);\n    esc.style.transform = 'translate(-50%,-50%) scale(' + s + ')';\n  }\n\n  document.addEventListener('keydown', function(ev){\n    var k = ev.key;\n    if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter') { ir(paso + 1); ev.preventDefault(); }\n    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { ir(paso - 1); ev.preventDefault(); }\n    else if (k === 'Home') ir(1);\n    else if (k === 'End') ir(MAX);\n  });\n  document.addEventListener('click', function(){ ir(paso + 1); });\n  window.addEventListener('resize', escalar);\n\n  escalar();\n  /* #todo muestra la ficha completa (útil para sacar una imagen); #paso=N empieza en el paso N */\n  var h = location.hash, m = h.match(/paso=(\\d+)/);\n  if (h === '#todo') { paso = MAX; ayuda.style.display = 'none'; }\n  else if (m) paso = Math.max(1, Math.min(MAX, +m[1]));\n  requestAnimationFrame(pintar);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"titulo": "Ficha 16 · Software libre", "html": "<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Ficha 16 · Software libre<\/title>\n<style>\n/* ===== Base común de las fichas BDDAT: copiar tal cual a cada ficha ===== */\n:root{\n  --fondo:#fff; --tarjeta:#F7F6F2; --borde:#D3D1C7; --borde-fuerte:#888780;\n  --texto:#2C2C2A; --texto-2:#5F5E5A;\n  --ida:#185FA5;      /* petición: lo que va */\n  --vuelta:#3B6D11;   /* respuesta: lo que vuelve */\n  --plan:#854F0B;     /* reservado: lo marcado ⚠️ (plan, aún no construido) */\n}\n*{box-sizing:border-box;margin:0}\nhtml,body{height:100%;background:var(--fondo);overflow:hidden}\nbody{font-family:\"Segoe UI\",Roboto,Arial,sans-serif;color:var(--texto)}\n\n/* Lienzo fijo de 1280x720 que se escala para caber en cualquier ventana */\n#escenario{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center}\n\n/* Aparición por pasos: cada elemento lleva data-paso=\"N\" y se muestra al llegar a N */\n.paso{opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s ease}\n.paso.on{opacity:var(--op,1);transform:none}\n\n/* Iconos de línea (el sprite está al principio del body) */\n.ico{fill:none;stroke:currentColor;stroke-width:var(--s,1.5);stroke-linecap:round;stroke-linejoin:round}\n\n/* Tarjeta: la forma común de todo \"equipo\" o \"pieza\" */\n.tarjeta{background:var(--tarjeta);border:2px solid var(--borde);border-radius:18px;\n  display:flex;flex-direction:column;align-items:center;justify-content:center}\n.tarjeta.fuerte{border-color:var(--borde-fuerte)}\n.tarjeta.punteada{background:transparent;border-style:dashed;border-color:var(--borde-fuerte);border-radius:12px}\n.nombre{font-size:30px;font-weight:600}\n.sub{font-size:20px;color:var(--texto-2)}\n\n/* Conexión: línea que se dibuja + punta + rótulo + cita */\n.flecha{width:100%;text-align:center}\n.flecha.ida{color:var(--ida)}\n.flecha.vuelta{color:var(--vuelta)}\n.flecha .et{font-size:24px;font-weight:600;padding:4px 0}\n.flecha .cita{font-size:19px;color:var(--texto-2)}\n.tubo{display:flex;align-items:center}\n.linea{flex:1;height:5px;border-radius:3px;background:currentColor;transform:scaleX(0);transition:transform .6s ease .1s}\n.ida .linea{transform-origin:left center}\n.vuelta .linea{transform-origin:right center}\n.flecha.on .linea{transform:scaleX(1)}\n.punta{width:30px;height:30px;fill:currentColor;flex:none;opacity:0;transition:opacity .2s ease .6s}\n.ida .punta{margin-left:-8px}\n.vuelta .punta{margin-right:-8px}\n.flecha.on .punta{opacity:1}\n\n/* Frase de cierre al pie */\n.cierre{position:absolute;left:80px;right:80px;bottom:62px;text-align:center;font-size:32px;\n  font-weight:600;border-top:2px solid var(--borde);padding-top:22px}\n\n#ayuda{position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:14px;color:#B4B2A9;\n  transition:opacity .4s}\n@media (prefers-reduced-motion:reduce){.paso,.linea,.punta,#ayuda{transition:none}}\n\n/* ===== Propio de esta ficha ===== */\n.lienzo{position:absolute;left:80px;right:80px;top:26px;bottom:150px;display:flex;flex-direction:column;\n  justify-content:center;gap:18px}\n.arriba{display:grid;grid-template-columns:1fr 520px;column-gap:24px;align-items:stretch}\n\n/* Las piezas, agrupadas por capa, todas libres */\n.piezas{padding:18px 22px 18px;gap:6px;align-items:stretch;justify-content:flex-start;text-align:left;color:var(--texto)}\n.cab-c{display:flex;align-items:center;gap:12px;margin-bottom:6px}\n.cab-c .nombre{font-size:27px;line-height:1.1}\n.cab-c .sub{font-size:19px;line-height:1.2}\n.cero{margin-left:auto;display:flex;align-items:baseline;gap:8px;border:2px solid var(--borde-fuerte);border-radius:12px;\n  background:#fff;padding:4px 14px}\n.cero b{font-size:28px;font-weight:600}\n.cero span{font-size:17px;color:var(--texto-2)}\n.capa{display:flex;align-items:center;gap:12px;min-height:40px}\n.capa .l{width:118px;flex:none;font-size:17px;color:var(--texto-2)}\n.chip{background:#fff;border:2px solid var(--borde-fuerte);border-radius:10px;padding:3px 12px;font-size:19px;font-weight:600}\n\n/* Dos tarjetas: la licencia y la Orden */\n.dos{display:flex;flex-direction:column;gap:14px}\n.caso{flex:1;padding:16px 18px;gap:6px;align-items:stretch;justify-content:center;text-align:left;color:var(--texto)}\n.caso .cab{display:flex;align-items:center;gap:12px}\n.caso .nombre{font-size:25px;line-height:1.15}\n.caso .sub{font-size:18px;line-height:1.3;margin-top:2px}\n\n/* Por qué importa */\n.importa{flex-direction:row;justify-content:flex-start;gap:16px;padding:14px 20px;text-align:left;color:var(--texto);\n  border-color:var(--borde-fuerte);background:#fff}\n.importa .t{font-size:22px;font-weight:600;line-height:1.15}\n.importa .s{font-size:19px;color:var(--texto-2);line-height:1.3;margin-top:2px}\n<\/style>\n<\/head>\n<body>\n<script>\n(function(){\n  var st = document.createElement('style');\n  st.textContent = '#ayuda{display:none!important}';\n  document.head.appendChild(st);\n\n  function conPaso(){ return [].slice.call(document.querySelectorAll('[data-paso]')); }\n  function maximo(){\n    return Math.max.apply(null, conPaso().map(function(e){ return +e.getAttribute('data-paso'); }));\n  }\n  function actual(){\n    var v = conPaso().filter(function(e){ return e.classList.contains('on'); })\n      .map(function(e){ return +e.getAttribute('data-paso'); });\n    return Math.max.apply(null, [1].concat(v));\n  }\n  function tecla(k){ document.dispatchEvent(new KeyboardEvent('keydown', {key: k, bubbles: true})); }\n\n  window.addEventListener('message', function(ev){\n    var m = ev.data || {};\n    if (m.cmd === 'next') {\n      if (actual() >= maximo()) parent.postMessage({fin: 'fin'}, '*'); else tecla('ArrowRight');\n    } else if (m.cmd === 'prev') {\n      if (actual() <= 1) parent.postMessage({fin: 'inicio'}, '*'); else tecla('ArrowLeft');\n    } else if (m.cmd === 'ultimo') {\n      tecla('End');\n    }\n  });\n\n  var NAV = {ArrowRight:1, ArrowLeft:1, ArrowUp:1, ArrowDown:1, ' ':1, PageDown:1, PageUp:1,\n             Enter:1, Backspace:1, Home:1, End:1, f:1, F:1};\n  document.addEventListener('keydown', function(e){\n    if (!e.isTrusted || !NAV[e.key]) return;\n    e.stopImmediatePropagation(); e.preventDefault();\n    parent.postMessage({tecla: e.key}, '*');\n  }, true);\n  document.addEventListener('click', function(e){\n    if (!e.isTrusted) return;\n    e.stopImmediatePropagation();\n    parent.postMessage({cmd: 'next'}, '*');\n  }, true);\n\n  window.addEventListener('load', function(){\n    setTimeout(function(){\n      window.dispatchEvent(new Event('resize'));\n      parent.postMessage({listo: true}, '*');\n    }, 60);\n  });\n})();\n<\/script>\n\n<svg width=\"0\" height=\"0\" style=\"position:absolute\" aria-hidden=\"true\">\n  <symbol id=\"i-candado-abierto\" viewBox=\"0 0 24 24\"><rect x=\"5\" y=\"11\" width=\"14\" height=\"10\" rx=\"2\"/><path d=\"M8 11V8a4 4 0 0 1 7.5-2\"/><\/symbol>\n  <symbol id=\"i-libro\" viewBox=\"0 0 24 24\"><path d=\"M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 19a2 2 0 0 0 2 2h13M8 7h7\"/><\/symbol>\n  <symbol id=\"i-balanza\" viewBox=\"0 0 24 24\"><path d=\"M12 4v16M6 20h12M5 8h14M5 8l-2.5 6a3 3 0 0 0 5 0zM19 8l-2.5 6a3 3 0 0 0 5 0z\"/><\/symbol>\n  <symbol id=\"i-grupo\" viewBox=\"0 0 24 24\"><circle cx=\"9\" cy=\"7\" r=\"3.5\"/><path d=\"M3 20v-1.5A4.5 4.5 0 0 1 7.5 14h3a4.5 4.5 0 0 1 4.5 4.5V20\"/><circle cx=\"17\" cy=\"8\" r=\"2.8\"/><path d=\"M17 14h1a4 4 0 0 1 4 4v1.5\"/><\/symbol>\n<\/svg>\n\n<div id=\"escenario\">\n  <div class=\"lienzo\">\n\n    <div class=\"arriba\">\n\n      <div class=\"tarjeta fuerte piezas paso\" data-paso=\"1\">\n        <div class=\"cab-c\">\n          <svg class=\"ico\" width=\"46\" height=\"46\" style=\"--s:1.3\"><use href=\"#i-candado-abierto\"/><\/svg>\n          <div><div class=\"nombre\">Las piezas<\/div><div class=\"sub\">todas, software libre<\/div><\/div>\n          <div class=\"cero paso\" data-paso=\"2\"><b>0 €<\/b><span>en licencias<\/span><\/div>\n        <\/div>\n        <div class=\"capa\"><div class=\"l\">Navegador<\/div><div class=\"chip\">Bootstrap<\/div><div class=\"chip\">React<\/div><\/div>\n        <div class=\"capa\"><div class=\"l\">Servidor<\/div><div class=\"chip\">Python<\/div><div class=\"chip\">Flask<\/div><div class=\"chip\">SQLAlchemy<\/div><\/div>\n        <div class=\"capa\"><div class=\"l\">Datos<\/div><div class=\"chip\">PostgreSQL<\/div><\/div>\n        <div class=\"capa\"><div class=\"l\">Sistema<\/div><div class=\"chip\">Linux<\/div><div class=\"chip\">nginx<\/div><\/div>\n        <div class=\"capa\"><div class=\"l\">Contenedores<\/div><div class=\"chip\">Docker Engine<\/div><\/div>\n        <div class=\"capa\"><div class=\"l\">Oficina<\/div><div class=\"chip\">LibreOffice<\/div><\/div>\n      <\/div>\n\n      <div class=\"dos\">\n        <div class=\"tarjeta fuerte caso paso\" data-paso=\"3\">\n          <div class=\"cab\">\n            <svg class=\"ico\" width=\"42\" height=\"42\" style=\"--s:1.4\"><use href=\"#i-libro\"/><\/svg>\n            <div class=\"nombre\">Licencia europea EUPL v1.2<\/div>\n          <\/div>\n          <div class=\"sub\">el código de la aplicación se distribuye con ella<\/div>\n        <\/div>\n        <div class=\"tarjeta fuerte caso paso\" data-paso=\"4\">\n          <div class=\"cab\">\n            <svg class=\"ico\" width=\"42\" height=\"42\" style=\"--s:1.4\"><use href=\"#i-balanza\"/><\/svg>\n            <div class=\"nombre\">Orden de 21 de febrero de 2005<\/div>\n          <\/div>\n          <div class=\"sub\">el software de la Junta, hecho por su personal o a medida, es software libre y su código se pone a disposición pública, salvo causa justificada<\/div>\n        <\/div>\n      <\/div>\n\n    <\/div>\n\n    <div class=\"tarjeta importa paso\" data-paso=\"5\">\n      <svg class=\"ico\" width=\"48\" height=\"48\" style=\"--s:1.3\"><use href=\"#i-grupo\"/><\/svg>\n      <div><div class=\"t\">Por qué importa<\/div><div class=\"s\">quien lo herede, otra provincia u otra administración, lo mantiene con perfiles y herramientas corrientes, no con un producto cerrado<\/div><\/div>\n    <\/div>\n\n  <\/div>\n  <div class=\"cierre paso\" data-paso=\"6\">Nada depende de un proveedor ni de una licencia<\/div>\n<\/div>\n\n<div id=\"ayuda\">← → o clic para avanzar<\/div>\n\n<script>\n(function(){\n  var MAX = 6, paso = 1;\n  var els = [].slice.call(document.querySelectorAll('[data-paso]'));\n  var esc = document.getElementById('escenario');\n  var ayuda = document.getElementById('ayuda');\n\n  function pintar(){\n    els.forEach(function(e){ e.classList.toggle('on', +e.getAttribute('data-paso') <= paso); });\n  }\n  function ir(n){\n    paso = Math.max(1, Math.min(MAX, n));\n    pintar();\n    ayuda.style.opacity = 0;\n  }\n  function escalar(){\n    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);\n    esc.style.transform = 'translate(-50%,-50%) scale(' + s + ')';\n  }\n\n  document.addEventListener('keydown', function(ev){\n    var k = ev.key;\n    if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter') { ir(paso + 1); ev.preventDefault(); }\n    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { ir(paso - 1); ev.preventDefault(); }\n    else if (k === 'Home') ir(1);\n    else if (k === 'End') ir(MAX);\n  });\n  document.addEventListener('click', function(){ ir(paso + 1); });\n  window.addEventListener('resize', escalar);\n\n  escalar();\n  /* #todo muestra la ficha completa (útil para sacar una imagen); #paso=N empieza en el paso N */\n  var h = location.hash, m = h.match(/paso=(\\d+)/);\n  if (h === '#todo') { paso = MAX; ayuda.style.display = 'none'; }\n  else if (m) paso = Math.max(1, Math.min(MAX, +m[1]));\n  requestAnimationFrame(pintar);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}];

(function(){
  var marco = document.getElementById('marco');
  var capa = document.getElementById('capa');
  var info = document.getElementById('info');
  var idx = 0, listo = false, alUltimo = false, aviso = null;

  function avisar(texto){
    info.textContent = texto;
    info.classList.add('ver');
    clearTimeout(aviso);
    aviso = setTimeout(function(){ info.classList.remove('ver'); }, 2600);
  }

  function mostrar(i, ultimo){
    idx = i; listo = false; alUltimo = !!ultimo;
    marco.srcdoc = FICHAS[i].html;
    document.title = FICHAS[i].titulo;
    try { history.replaceState(null, '', '#' + (i + 1)); } catch (e) {}
    avisar((i + 1) + ' / ' + FICHAS.length + '  ·  ' + FICHAS[i].titulo);
  }

  function enviar(cmd){ if (listo) marco.contentWindow.postMessage({cmd: cmd}, '*'); }
  function siguiente(){ enviar('next'); }
  function anterior(){ enviar('prev'); }

  function pantallaCompleta(){
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  }

  function tecla(k){
    if (k === 'ArrowRight' || k === 'ArrowDown' || k === ' ' || k === 'PageDown' || k === 'Enter') siguiente();
    else if (k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp' || k === 'Backspace') anterior();
    else if (k === 'Home') mostrar(0, false);
    else if (k === 'End') mostrar(FICHAS.length - 1, true);
    else if (k === 'f' || k === 'F') pantallaCompleta();
    else return false;
    return true;
  }

  window.addEventListener('message', function(ev){
    if (ev.source !== marco.contentWindow) return;
    var m = ev.data || {};
    if (m.listo) {
      listo = true;
      if (alUltimo) { alUltimo = false; enviar('ultimo'); }
    } else if (m.fin === 'fin') {
      if (idx < FICHAS.length - 1) mostrar(idx + 1, false); else avisar('fin de la presentación');
    } else if (m.fin === 'inicio') {
      if (idx > 0) mostrar(idx - 1, true);
    } else if (m.cmd === 'next') {
      siguiente();
    } else if (m.tecla) {
      tecla(m.tecla);
    }
  });

  document.addEventListener('keydown', function(e){
    if (e.ctrlKey || e.altKey || e.metaKey) return;
    if (tecla(e.key)) e.preventDefault();
  });
  capa.addEventListener('click', siguiente);

  /* #N empieza en la ficha N (empezando por 1) */
  var n = parseInt(location.hash.slice(1), 10);
  mostrar(n >= 1 && n <= FICHAS.length ? n - 1 : 0, false);
  window.__ficha = function(){ return idx; };
})();
</script>
