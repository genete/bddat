{display:none!important}';\n  document.head.appendChild(st);\n\n  function conPaso(){ return [].slice.call(document.querySelectorAll('[data-paso]')); }\n  function maximo(){\n    return Math.max.apply(null, conPaso().map(function(e){ return +e.getAttribute('data-paso'); }));\n  }\n  function actual(){\n    var v = conPaso().filter(function(e){ return e.classList.contains('on'); })\n      .map(function(e){ return +e.getAttribute('data-paso'); });\n    return Math.max.apply(null, [1].concat(v));\n  }\n  function tecla(k){ document.dispatchEvent(new KeyboardEvent('keydown', {key: k, bubbles: true})); }\n\n  window.addEventListener('message', function(ev){\n    var m = ev.data || {};\n    if (m.cmd === 'next') {\n      if (actual() >= maximo()) parent.postMessage({fin: 'fin'}, '*'); else tecla('ArrowRight');\n    } else if (m.cmd === 'prev') {\n      if (actual() <= 1) parent.postMessage({fin: 'inicio'}, '*'); else tecla('ArrowLeft');\n    } else if (m.cmd === 'ultimo') {\n      tecla('End');\n    }\n  });\n\n  var NAV = {ArrowRight:1, ArrowLeft:1, ArrowUp:1, ArrowDown:1, ' ':1, PageDown:1, PageUp:1,\n             Enter:1, Backspace:1, Home:1, End:1, f:1, F:1};\n  document.addEventListener('keydown', function(e){\n    if (!e.isTrusted || !NAV[e.key]) return;\n    e.stopImmediatePropagation(); e.preventDefault();\n    parent.postMessage({tecla: e.key}, '*');\n  }, true);\n  document.addEventListener('click', function(e){\n    if (!e.isTrusted) return;\n    e.stopImmediatePropagation();\n    parent.postMessage({cmd: 'next'}, '*');\n  }, true);\n\n  window.addEventListener('load', function(){\n    setTimeout(function(){\n      window.dispatchEvent(new Event('resize'));\n      parent.postMessage({listo: true}, '*');\n    }, 60);\n  });\n})();\n<\/script>\n\n<svg width=\"0\" height=\"0\" style=\"position:absolute\" aria-hidden=\"true\">\n  <symbol id=\"i-persona\" viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"7\" r=\"4\"/><path d=\"M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2\"/> ass=\"tarjeta fuerte servidor paso\" data-paso=\"2\" style=\"--op:.75\">\n      <svg class=\"ico\" width=\"72\" height=\"72\" style=\"--s:1.1\"><use href=\"#i-servidor\"/><\/svg>\n      <div class=\"nombre\">Servidor<\/div>\n    <\/div>\n\n  <\/div>\n  <div class=\"cierre paso\" data-paso=\"8\">En BDDAT: imagen de la Junta, y React solo en 5 zonas<\/div>\n<\/div>\n\n<div id=\"ayuda\">← → o clic para avanzar<\/div>\n\n<script>\n(function(){\n  var MAX = 8, paso = 1;\n  var els = [].slice.call(document.querySelectorAll('[data-paso]'));\n  var esc = document.getElementById('escenario');\n  var ayuda = document.getElementById('ayuda');\n\n  function pintar(){\n    els.forEach(function(e){ e.classList.toggle('on', +e.getAttribute('data-paso') <= paso); });\n  }\n  function ir(n){\n    paso = Math.max(1, Math.min(MAX, n));\n    pintar();\n    ayuda.style.opacity = 0;\n  }\n  function escalar(){\n    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);\n    esc.style.transform = 'translate(-50%,-50%) scale(' + s + ')';\n  }\n\n  document.addEventListener('keydown', function(ev){\n    var k = ev.key;\n    if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter') { ir(paso + 1); ev.preventDefault(); }\n    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { ir(paso - 1); ev.preventDefault(); }\n    else if (k === 'Home') ir(1);\n    else if (k === 'End') ir(MAX);\n  });\n  document.addEventListener('click', function(){ ir(paso + 1); });\n  window.addEventListener('resize', escalar);\n\n  escalar();\n  /* #todo muestra la ficha completa (útil para sacar una imagen); #paso=N empieza en el paso N */\n  var h = location.hash, m = h.match(/paso=(\\d+)/);\n  if (h === '#todo') { paso = MAX; ayuda.style.display = 'none'; }\n  else if (m) paso = Math.max(1, Math.min(MAX, +m[1]));\n  requestAnimationFrame(pintar);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"titulo": "Ficha 3 · El backend", "html": "<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Ficha 3 · El backend<\/title>\n<style>\n/* ===== Base común de las fichas BDDAT: copiar tal cual a cada ficha ===== */\n:root{\n  --fondo:#fff; --tarjeta:#F7F6F2; --borde:#D3D1C7; --borde-fuerte:#888780;\n  --texto:#2C2C2A; --texto-2:#5F5E5A;\n  --ida:#185FA5;      /* petición: lo que va */\n  --vuelta:#3B6D11;   /* respuesta: lo que vuelve */\n  --plan:#854F0B;     /* reservado: lo marcado ⚠️ (plan, aún no construido) */\n}\n*{box-sizing:border-box;margin:0}\nhtml,body{height:100%;background:var(--fondo);overflow:hidden}\nbody{font-family:\"Segoe UI\",Roboto,Arial,sans-serif;color:var(--texto)}\n\n/* Lienzo fijo de 1280x720 que se escala para caber en cualquier ventana */\n#escenario{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center}\n\n/* Aparición por pasos: cada elemento lleva data-paso=\"N\" y se muestra al llegar a N */\n.paso{opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s ease}\n.paso.on{opacity:var(--op,1);transform:none}\n\n/* Iconos de línea (el sprite está al principio del body) */\n.ico{fill:none;stroke:currentColor;stroke-width:var(--s,1.5);stroke-linecap:round;stroke-linejoin:round}\n\n/* Tarjeta: la forma común de todo \"equipo\" o \"pieza\" */\n.tarjeta{background:var(--tarjeta);border:2px solid var(--borde);border-radius:18px;\n  display:flex;flex-direction:column;align-items:center;justify-content:center}\n.tarjeta.fuerte{border-color:var(--borde-fuerte)}\n.tarjeta.punteada{background:transparent;border-style:dashed;border-color:var(--borde-fuerte);border-radius:12px}\n.nombre{font-size:30px;font-weight:600}\n.sub{font-size:20px;color:var(--texto-2)}\n\n/* Conexión: línea que se dibuja + punta + rótulo + cita */\n.flecha{width:100%;text-align:center}\n.flecha.ida{color:var(--ida)}\n.flecha.vuelta{color:var(--vuelta)}\n.flecha .et{font-size:24px;font-weight:600;padding:4px 0}\n.flecha .cita{font-size:19px;color:var(--texto-2)}\n.tubo{display:flex;align-items:center}\n.linea{flex:1;height:5px;border-radius:3px;background:currentColor;transform:scaleX(0);transition:transform .6s ease .1s}\n.ida .linea{transform-origin:left center}\n.vuelta .linea{transform-origin:right center}\n.flecha.on .linea{transform:scaleX(1)}\n.punta{width:30px;height:30px;fill:currentColor;flex:none;opacity:0;transition:opacity .2s ease .6s}\n.ida .punta{margin-left:-8px}\n.vuelta .punta{margin-right:-8px}\n.flecha.on .punta{opacity:1}\n\n/* Frase de cierre al pie */\n.cierre{position:absolute;left:80px;right:80px;bottom:62px;text-align:center;font-size:32px;\n  font-weight:600;border-top:2px solid var(--borde);padding-top:22px}\n\n#ayuda{position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:14px;color:#B4B2A9;\n  transition:opacity .4s}\n@media (prefers-reduced-motion:reduce){.paso,.linea,.punta,#ayuda{transition:none}}\n\n/* ===== Propio de esta ficha ===== */\n.lienzo{position:absolute;left:80px;right:80px;top:40px;bottom:150px;\n  display:grid;grid-template-columns:190px 140px 1fr;align-items:center}\n\n/* Navegador reducido: viene de la ficha 1, aquí solo es quien pide */\n.navegador{padding:20px 12px;gap:8px;color:var(--texto)}\n.navegador .fila{display:flex;align-items:center;gap:10px}\n.navegador .nombre{font-size:24px}\n.col-flechas{display:flex;flex-direction:column;gap:34px;padding:0 10px}\n\n/* Ventana del servidor: la caja que contiene todo el backend */\n.ventana{background:#fff;border:2px solid var(--borde-fuerte);border-radius:18px;overflow:hidden}\n.barra{height:46px;background:var(--tarjeta);border-bottom:2px solid var(--borde);\n  display:flex;align-items:center;gap:10px;padding:0 20px;font-size:19px;color:var(--texto-2)}\n.cuerpo{padding:16px 22px 22px}\n.cabecera{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px;min-height:66px}\n.cabecera .tit{display:flex;align-items:baseline;gap:14px}\n.cabecera b{font-size:32px;font-weight:600}\n.cabecera .tit span{font-size:22px;color:var(--texto-2)}\n\n/* Las cuatro tareas, en orden de arriba abajo */\n.etapa{width:100%;height:74px;flex-direction:row;justify-content:flex-start;gap:16px;\n  padding:0 18px;text-align:left;color:var(--texto)}\n.etapa .tx{flex:1}\n.etapa .nombre{font-size:24px;line-height:1.2}\n.etapa .sub{font-size:18px;line-height:1.2}\n.baja{display:flex;justify-content:center;height:20px;color:var(--borde-fuerte)}\n\n/* Herramientas que se apoyan en una tarea (misma pieza que en la ficha 2) */\n.pieza{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--borde-fuerte);\n  border-radius:12px;padding:6px 12px;color:var(--texto);text-align:left}\n.pieza .t{font-size:20px;font-weight:600;line-height:1.15}\n.pieza .s{font-size:17px;color:var(--texto-2);line-height:1.2}\n.etapa .pieza{width:214px}\n<\/style>\n<\/head>\n<body>\n<script>\n(function(){\n  var st = document.createElement('style');\n  st.textContent = '#ayuda{display:none!important}';\n  document.head.appendChild(st);\n\n  function conPaso(){ return [].slice.call(document.querySelectorAll('[data-paso]')); }\n  function maximo(){\n    return Math.max.apply(null, conPaso().map(function(e){ return +e.getAttribute('data-paso'); }));\n  }\n  function actual(){\n    var v = conPaso().filter(function(e){ return e.classList.contains('on'); })\n      .map(function(e){ return +e.getAttribute('data-paso'); });\n    return Math.max.apply(null, [1].concat(v));\n  }\n  function tecla(k){ document.dispatchEvent(new KeyboardEvent('keydown', {key: k, bubbles: true})); }\n\n  window.addEventListener('message', function(ev){\n    var m = ev.data || {};\n    if (m.cmd === 'next') {\n      if (actual() >= maximo()) parent.postMessage({fin: 'fin'}, '*'); else tecla('ArrowRight');\n    } else if (m.cmd === 'prev') {\n      if (actual() <= 1) parent.postMessage({fin: 'inicio'}, '*'); else tecla('ArrowLeft');\n    } else if (m.cmd === 'ultimo') {\n      tecla('End');\n    }\n  });\n\n  var NAV = {ArrowRight:1, ArrowLeft:1, ArrowUp:1, ArrowDown:1, ' ':1, PageDown:1, PageUp:1,\n             Enter:1, Backspace:1, Home:1, End:1, f:1, F:1};\n  document.addEventListener('keydown', function(e){\n    if (!e.isTrusted || !NAV[e.key]) return;\n    e.stopImmediatePropagation(); e.preventDefault();\n    parent.postMessage({tecla: e.key}, '*');\n  }, true);\n  document.addEventListener('click', function(e){\n    if (!e.isTrusted) return;\n    e.stopImmediatePropagation();\n    parent.postMessage({cmd: 'next'}, '*');\n  }, true);\n\n  window.addEventListener('load', function(){\n    setTimeout(function(){\n      window.dispatchEvent(new Event('resize'));\n      parent.postMessage({listo: true}, '*');\n    }, 60);\n  });\n})();\n<\/script>\n\n<svg width=\"0\" height=\"0\" style=\"position:absolute\" aria-hidden=\"true\">\n  <symbol id=\"i-persona\" viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"7\" r=\"4\"/><path d=\"M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2\"/><\/symbol>\n  <symbol id=\"i-pc\" viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"12\" rx=\"2\"/><path d=\"M3 8h18M7 20h10M9 16v4M15 16v4\"/><\/symbol>\n  <symbol id=\"i-servidor\" viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"7\" rx=\"2\"/><rect x=\"3\" y=\"13\" width=\"18\" height=\"7\" rx=\"2\"/><path d=\"M7 7.5v.01M7 16.5v.01M11 7.5h6M11 16.5h6\"/><\/symbol>\n  <symbol id=\"i-datos\" viewBox=\"0 0 24 24\"><ellipse cx=\"12\" cy=\"6\" rx=\"8\" ry=\"3\"/><path d=\"M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6\"/><\/symbol>\n  <symbol id=\"i-bandeja\" viewBox=\"0 0 24 24\"><path d=\"M4 13l2.5-8h11L20 13v6H4zM4 13h5l1 2h4l1-2h5\"/><\/symbol>\n  <symbol id=\"i-escudo\" viewBox=\"0 0 24 24\"><path d=\"M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM9 12l2 2 4-4\"/><\/symbol>\n  <symbol id=\"i-engranaje\" viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"3\"/><circle cx=\"12\" cy=\"12\" r=\"6.5\"/><path d=\"M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1\"/><\/symbol>\n  <symbol id=\"i-matraz\" viewBox=\"0 0 24 24\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4A2 2 0 0 0 19 18l-5-9V3M8 15h8\"/><\/symbol>\n  <symbol id=\"i-llave\" viewBox=\"0 0 24 24\"><circle cx=\"8\" cy=\"15\" r=\"4\"/><path d=\"M11 12l9-9M16 7l3 3M14 9l2 2\"/><\/symbol>\n  <symbol id=\"i-plantilla\" viewBox=\"0 0 24 24\"><rect x=\"4\" y=\"4\" width=\"16\" height=\"16\" rx=\"2\"/><path d=\"M4 9h16M9 9v11\"/><\/symbol>\n  <symbol id=\"i-ojo-no\" viewBox=\"0 0 24 24\"><path d=\"M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M4 4l16 16\"/><\/symbol>\n<\/svg>\n\n<div id=\"escenario\">\n  <div class=\"lienzo\">\n\n    <div class=\"tarjeta fuerte navegador paso\" data-paso=\"2\" style=\"--op:.75\">\n      <div class=\"fila\">\n        <svg class=\"ico\" width=\"30\" height=\"30\" style=\"--s:1.6;color:var(--texto-2)\"><use href=\"#i-persona\"/><\/svg>\n        <svg class=\"ico\" width=\"64\" height=\"64\" style=\"--s:1.1\"><use href=\"#i-pc\"/><\/svg>\n      <\/div>\n      <div class=\"nombre\">Navegador<\/div>\n    <\/div>\n\n    <div class=\"col-flechas\">\n      <div class=\"flecha ida paso\" data-paso=\"2\">\n        <div class=\"et\">petición<\/div>\n        <div class=\"tubo\"><span class=\"linea\"><\/span><svg class=\"punta\" viewBox=\"0 0 24 24\"><path d=\"M4 3l17 9-17 9z\"/><\/svg><\/div>\n      <\/div>\n      <div class=\"flecha vuelta paso\" data-paso=\"6\">\n        <div class=\"tubo\"><svg class=\"punta\" viewBox=\"0 0 24 24\"><path d=\"M20 3L3 12l17 9z\"/><\/svg><span class=\"linea\"><\/span><\/div>\n        <div class=\"et\">respuesta<\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"ventana paso\" data-paso=\"1\">\n      <div class=\"barra\">\n        <svg class=\"ico\" width=\"26\" height=\"26\" style=\"--s:1.6\"><use href=\"#i-servidor\"/><\/svg>Servidor\n      <\/div>\n      <div class=\"cuerpo\">\n        <div class=\"cabecera\">\n          <div class=\"tit\"><b>Backend<\/b><span>donde se decide y se guarda<\/span><\/div>\n          <div class=\"pieza paso\" data-paso=\"7\">\n            <svg class=\"ico\" width=\"30\" height=\"30\" style=\"--s:1.7\"><use href=\"#i-matraz\"/><\/svg>\n            <div><div class=\"t\">Python + Flask<\/div><div class=\"s\">lenguaje y estructura ya hecha<\/div><\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"tarjeta etapa paso\" data-paso=\"3\">\n          <svg class=\"ico\" width=\"40\" height=\"40\" style=\"--s:1.4\"><use href=\"#i-bandeja\"/><\/svg>\n          <div class=\"tx\"><div class=\"nombre\">Recibe<\/div><div class=\"sub\">la petición del navegador<\/div><\/div>\n        <\/div>\n        <div class=\"baja paso\" data-paso=\"4\"><svg class=\"ico\" width=\"22\" height=\"20\" viewBox=\"0 0 24 24\" style=\"--s:2.2\"><path d=\"M6 9l6 6 6-6\"/><\/svg><\/div>\n\n        <div class=\"tarjeta etapa paso\" data-paso=\"4\">\n          <svg class=\"ico\" width=\"40\" height=\"40\" style=\"--s:1.4\"><use href=\"#i-escudo\"/><\/svg>\n          <div class=\"tx\"><div class=\"nombre\">Comprueba<\/div><div class=\"sub\">quién eres y qué puedes hacer<\/div><\/div>\n          <div class=\"pieza paso\" data-paso=\"8\">\n            <svg class=\"ico\" width=\"28\" height=\"28\" style=\"--s:1.7\"><use href=\"#i-llave\"/><\/svg>\n            <div><div class=\"t\">Flask-Login<\/div><div class=\"s\">inicio de sesión<\/div><\/div>\n          <\/div>\n        <\/div>\n        <div class=\"baja paso\" data-paso=\"5\"><svg class=\"ico\" width=\"22\" height=\"20\" viewBox=\"0 0 24 24\" style=\"--s:2.2\"><path d=\"M6 9l6 6 6-6\"/><\/svg><\/div>\n\n        <div class=\"tarjeta etapa paso\" data-paso=\"5\">\n          <svg class=\"ico\" width=\"40\" height=\"40\" style=\"--s:1.4\"><use href=\"#i-engranaje\"/><\/svg>\n          <div class=\"tx\"><div class=\"nombre\">Aplica la lógica<\/div><div class=\"sub\">reglas, cálculos, documentos<\/div><\/div>\n        <\/div>\n        <div class=\"baja paso\" data-paso=\"6\"><svg class=\"ico\" width=\"22\" height=\"20\" viewBox=\"0 0 24 24\" style=\"--s:2.2\"><path d=\"M6 9l6 6 6-6\"/><\/svg><\/div>\n\n        <div class=\"tarjeta etapa paso\" data-paso=\"6\">\n          <svg class=\"ico\" width=\"40\" height=\"40\" style=\"--s:1.4\"><use href=\"#i-datos\"/><\/svg>\n          <div class=\"tx\"><div class=\"nombre\">Habla con la base de datos<\/div><div class=\"sub\">y devuelve la respuesta<\/div><\/div>\n          <div class=\"pieza paso\" data-paso=\"9\">\n            <svg class=\"ico\" width=\"28\" height=\"28\" style=\"--s:1.7\"><use href=\"#i-plantilla\"/><\/svg>\n            <div><div class=\"t\">Jinja<\/div><div class=\"s\">monta las páginas<\/div><\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n\n  <\/div>\n  <div class=\"cierre paso\" data-paso=\"9\">\n    <svg class=\"ico\" width=\"36\" height=\"36\" style=\"--s:1.5;vertical-align:-8px;margin-right:12px\"><use href=\"#i-ojo-no\"/><\/svg>El navegador no ve este código: aquí viven la seguridad y las reglas\n  <\/div>\n<\/div>\n\n<div id=\"ayuda\">← → o clic para avanzar<\/div>\n\n<script>\n(function(){\n  var MAX = 9, paso = 1;\n  var els = [].slice.call(document.querySelectorAll('[data-paso]'));\n  var esc = document.getElementById('escenario');\n  var ayuda = document.getElementById('ayuda');\n\n  function pintar(){\n    els.forEach(function(e){ e.classList.toggle('on', +e.getAttribute('data-paso') <= paso); });\n  }\n  function ir(n){\n    paso = Math.max(1, Math.min(MAX, n));\n    pintar();\n    ayuda.style.opacity = 0;\n  }\n  function escalar(){\n    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);\n    esc.style.transform = 'translate(-50%,-50%) scale(' + s + ')';\n  }\n\n  document.addEventListener('keydown', function(ev){\n    var k = ev.key;\n    if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter') { ir(paso + 1); ev.preventDefault(); }\n    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { ir(paso - 1); ev.preventDefault(); }\n    else if (k === 'Home') ir(1);\n    else if (k === 'End') ir(MAX);\n  });\n  document.addEventListener('click', function(){ ir(paso + 1); });\n  window.addEventListener('resize', escalar);\n\n  escalar();\n  /* #todo muestra la ficha completa (útil para sacar una imagen); #paso=N empieza en el paso N */\n  var h = location.hash, m = h.match(/paso=(\\d+)/);\n  if (h === '#todo') { paso = MAX; ayuda.style.display = 'none'; }\n  else if (m) paso = Math.max(1, Math.min(MAX, +m[1]));\n  requestAnimationFrame(pintar);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"titulo": "Ficha 4 · Petición y respuesta", "html": "<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Ficha 4 · Petición y respuesta<\/title>\n<style>\n/* ===== Base común de las fichas BDDAT: copiar tal cual a cada ficha ===== */\n:root{\n  --fondo:#fff; --tarjeta:#F7F6F2; --borde:#D3D1C7; --borde-fuerte:#888780;\n  --texto:#2C2C2A; --texto-2:#5F5E5A;\n  --ida:#185FA5;      /* petición: lo que va */\n  --vuelta:#3B6D11;   /* respuesta: lo que vuelve */\n  --plan:#854F0B;     /* reservado: lo marcado ⚠️ (plan, aún no construido) */\n}\n*{box-sizing:border-box;margin:0}\nhtml,body{height:100%;background:var(--fondo);overflow:hidden}\nbody{font-family:\"Segoe UI\",Roboto,Arial,sans-serif;color:var(--texto)}\n\n/* Lienzo fijo de 1280x720 que se escala para caber en cualquier ventana */\n#escenario{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center}\n\n/* Aparición por pasos: cada elemento lleva data-paso=\"N\" y se muestra al llegar a N */\n.paso{opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s ease}\n.paso.on{opacity:var(--op,1);transform:none}\n\n/* Iconos de línea (el sprite está al principio del body) */\n.ico{fill:none;stroke:currentColor;stroke-width:var(--s,1.5);stroke-linecap:round;stroke-linejoin:round}\n\n/* Tarjeta: la forma común de todo \"equipo\" o \"pieza\" */\n.tarjeta{background:var(--tarjeta);border:2px solid var(--borde);border-radius:18px;\n  display:flex;flex-direction:column;align-items:center;justify-content:center}\n.tarjeta.fuerte{border-color:var(--borde-fuerte)}\n.tarjeta.punteada{background:transparent;border-style:dashed;border-color:var(--borde-fuerte);border-radius:12px}\n.nombre{font-size:30px;font-weight:600}\n.sub{font-size:20px;color:var(--texto-2)}\n\n/* Conexión: línea que se dibuja + punta + rótulo + cita */\n.flecha{width:100%;text-align:center}\n.flecha.ida{color:var(--ida)}\n.flecha.vuelta{color:var(--vuelta)}\n.flecha .et{font-size:24px;font-weight:600;padding:4px 0}\n.flecha .cita{font-size:19px;color:var(--texto-2)}\n.tubo{display:flex;align-items:center}\n.linea{flex:1;height:5px;border-radius:3px;background:currentColor;transform:scaleX(0);transition:transform .6s ease .1s}\n.ida .linea{transform-origin:left center}\n.vuelta .linea{transform-origin:right center}\n.flecha.on .linea{transform:scaleX(1)}\n.punta{width:30px;height:30px;fill:currentColor;flex:none;opacity:0;transition:opacity .2s ease .6s}\n.ida .punta{margin-left:-8px}\n.vuelta .punta{margin-right:-8px}\n.flecha.on .punta{opacity:1}\n\n/* Frase de cierre al pie */\n.cierre{position:absolute;left:80px;right:80px;bottom:62px;text-align:center;font-size:32px;\n  font-weight:600;border-top:2px solid var(--borde);padding-top:22px}\n\n#ayuda{position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:14px;color:#B4B2A9;\n  transition:opacity .4s}\n@media (prefers-reduced-motion:reduce){.paso,.linea,.punta,#ayuda{transition:none}}\n\n/* ===== Propio de esta ficha ===== */\n.lienzo{position:absolute;left:80px;right:80px;top:40px;bottom:150px;\n  display:grid;grid-template-columns:150px 1fr 150px;align-content:center}\n\n/* Los dos extremos del tubo: quien pregunta y quien contesta */\n.extremo{gap:10px;padding:0 8px;color:var(--texto)}\n.extremo.izq{border-radius:18px 0 0 18px}\n.extremo.der{border-radius:0 18px 18px 0}\n.extremo .nombre{font-size:24px}\n.extremo .fila{display:flex;align-items:center;gap:8px}\n\n/* El tubo por donde viajan los mensajes */\n.tunel{position:relative;background:#fff;border-top:2px solid var(--borde);border-bottom:2px solid var(--borde);\n  padding:30px 0;display:flex;flex-direction:column;gap:30px}\n.carril{position:relative;display:flex;align-items:center;justify-content:center}\n.carril.c1{height:124px}\n.carril.c2{height:206px}\n.carril .tubo{position:absolute;left:0;right:0;top:50%;margin-top:-15px}\n\n/* El mensaje: una tarjeta blanca sobre la flecha, con sus campos */\n.sobre{position:relative;z-index:1;background:#fff;border:3px solid;border-radius:14px;\n  padding:18px 22px 12px;display:flex;text-align:left;color:var(--texto)}\n.ida .sobre{border-color:var(--ida)}\n.vuelta .sobre{border-color:var(--vuelta)}\n.sobre .rot{position:absolute;top:-17px;left:18px;background:#fff;padding:0 10px;font-size:22px;font-weight:600}\n.ida .rot{color:var(--ida)}\n.vuelta .rot{color:var(--vuelta)}\n.campo{padding:0 24px;border-left:2px solid var(--borde)}\n.campo:first-of-type{border-left:none;padding-left:0}\n.campo:last-child{padding-right:0}\n.campo .k{font-size:17px;color:var(--texto-2);margin-bottom:2px}\n.campo .v{font-size:24px;font-weight:600;line-height:1.25}\n.mono{font-family:Consolas,\"Courier New\",monospace}\n.campo .v.mono{font-size:22px}\n.campo .l{font-size:20px;line-height:1.3}\n.campo .l b{font-family:Consolas,\"Courier New\",monospace;font-weight:600}\n.campo.cookie{display:flex;align-items:center;gap:12px}\n.opc{margin-top:8px}\n.opc .s{font-size:17px;color:var(--texto-2);line-height:1.2}\n\n/* Candado: lo que protege el viaje; ámbar porque aún es plan */\n.candado{position:absolute;top:-21px;left:0;right:0;margin:0 auto;width:max-content;background:#fff;\n  border:2px solid var(--plan);border-radius:12px;padding:5px 14px;display:flex;align-items:center;gap:10px;\n  font-size:20px;font-weight:600;color:var(--texto);z-index:2}\n.candado .plan{font-size:16px;font-weight:600;color:var(--plan);border:1.5px solid var(--plan);\n  border-radius:8px;padding:0 7px}\n<\/style>\n<\/head>\n<body>\n<script>\n(function(){\n  var st = document.createElement('style');\n  st.textContent = '#ayuda{display:none!important}';\n  document.head.appendChild(st);\n\n  function conPaso(){ return [].slice.call(document.querySelectorAll('[data-paso]')); }\n  function maximo(){\n    return Math.max.apply(null, conPaso().map(function(e){ return +e.getAttribute('data-paso'); }));\n  }\n  function actual(){\n    var v = conPaso().filter(function(e){ return e.classList.contains('on'); })\n      .map(function(e){ return +e.getAttribute('data-paso'); });\n    return Math.max.apply(null, [1].concat(v));\n  }\n  function tecla(k){ document.dispatchEvent(new KeyboardEvent('keydown', {key: k, bubbles: true})); }\n\n  window.addEventListener('message', function(ev){\n    var m = ev.data || {};\n    if (m.cmd === 'next') {\n      if (actual() >= maximo()) parent.postMessage({fin: 'fin'}, '*'); else tecla('ArrowRight');\n    } else if (m.cmd === 'prev') {\n      if (actual() <= 1) parent.postMessage({fin: 'inicio'}, '*'); else tecla('ArrowLeft');\n    } else if (m.cmd === 'ultimo') {\n      tecla('End');\n    }\n  });\n\n  var NAV = {ArrowRight:1, ArrowLeft:1, ArrowUp:1, ArrowDown:1, ' ':1, PageDown:1, PageUp:1,\n             Enter:1, Backspace:1, Home:1, End:1, f:1, F:1};\n  document.addEventListener('keydown', function(e){\n    if (!e.isTrusted || !NAV[e.key]) return;\n    e.stopImmediatePropagation(); e.preventDefault();\n    parent.postMessage({tecla: e.key}, '*');\n  }, true);\n  document.addEventListener('click', function(e){\n    if (!e.isTrusted) return;\n    e.stopImmediatePropagation();\n    parent.postMessage({cmd: 'next'}, '*');\n  }, true);\n\n  window.addEventListener('load', function(){\n    setTimeout(function(){\n      window.dispatchEvent(new Event('resize'));\n      parent.postMessage({listo: true}, '*');\n    }, 60);\n  });\n})();\n<\/script>\n\n<svg width=\"0\" height=\"0\" style=\"position:absolute\" aria-hidden=\"true\">\n  <symbol id=\"i-persona\" viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"7\" r=\"4\"/><path d=\"M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2\"/><\/symbol>\n  <symbol id=\"i-pc\" viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"12\" rx=\"2\"/><path d=\"M3 8h18M7 20h10M9 16v4M15 16v4\"/><\/symbol>\n  <symbol id=\"i-servidor\" viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"7\" rx=\"2\"/><rect x=\"3\" y=\"13\" width=\"18\" height=\"7\" rx=\"2\"/><path d=\"M7 7.5v.01M7 16.5v.01M11 7.5h6M11 16.5h6\"/><\/symbol>\n  <symbol id=\"i-galleta\" viewBox=\"0 0 24 24\"><path d=\"M21 12.5A9 9 0 1 1 11.5 3a3.5 3.5 0 0 0 4.5 4.5A3.5 3.5 0 0 0 21 12.5z\"/><path d=\"M8.5 10v.01M11 15v.01M15.5 14.5v.01M7.5 14v.01\"/><\/symbol>\n  <symbol id=\"i-candado\" viewBox=\"0 0 24 24\"><rect x=\"5\" y=\"11\" width=\"14\" height=\"10\" rx=\"2\"/><path d=\"M8 11V8a4 4 0 0 1 8 0v3\"/><\/symbol>\n<\/svg>\n\n<div id=\"escenario\">\n  <div class=\"lienzo\">\n\n    <div class=\"tarjeta fuerte extremo izq paso\" data-paso=\"1\">\n      <div class=\"fila\">\n        <svg class=\"ico\" width=\"28\" height=\"28\" style=\"--s:1.6;color:var(--texto-2)\"><use href=\"#i-persona\"/><\/svg>\n        <svg class=\"ico\" width=\"60\" height=\"60\" style=\"--s:1.1\"><use href=\"#i-pc\"/><\/svg>\n      <\/div>\n      <div class=\"nombre\">Navegador<\/div>\n    <\/div>\n\n    <div class=\"tunel\">\n\n      <div class=\"candado paso\" data-paso=\"9\">\n        <svg class=\"ico\" width=\"26\" height=\"26\" style=\"--s:1.7\"><use href=\"#i-candado\"/><\/svg>HTTPS: el viaje va cifrado<span class=\"plan\">plan<\/span>\n      <\/div>\n\n      <div class=\"carril c1 flecha ida paso\" data-paso=\"2\">\n        <div class=\"tubo\"><span class=\"linea\"><\/span><svg class=\"punta\" viewBox=\"0 0 24 24\"><path d=\"M4 3l17 9-17 9z\"/><\/svg><\/div>\n        <div class=\"sobre\">\n          <div class=\"rot\">Petición<\/div>\n          <div class=\"campo\"><div class=\"k\">dirección<\/div><div class=\"v mono\">/expedientes/123<\/div><\/div>\n          <div class=\"campo paso\" data-paso=\"3\"><div class=\"k\">verbo<\/div>\n            <div class=\"l\"><b>GET<\/b> pedir<\/div><div class=\"l\"><b>POST<\/b> enviar o cambiar<\/div><\/div>\n          <div class=\"campo cookie paso\" data-paso=\"4\">\n            <svg class=\"ico\" width=\"40\" height=\"40\" style=\"--s:1.4\"><use href=\"#i-galleta\"/><\/svg>\n            <div><div class=\"k\">cookie<\/div><div class=\"v\">quién eres<\/div><\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <div class=\"carril c2 flecha vuelta paso\" data-paso=\"5\">\n        <div class=\"tubo\"><svg class=\"punta\" viewBox=\"0 0 24 24\"><path d=\"M20 3L3 12l17 9z\"/><\/svg><span class=\"linea\"><\/span><\/div>\n        <div class=\"sobre\">\n          <div class=\"rot\">Respuesta<\/div>\n          <div class=\"campo\"><div class=\"k\">código<\/div>\n            <div class=\"l\"><b>200<\/b> bien<\/div>\n            <div class=\"l paso\" data-paso=\"6\"><b>404<\/b> no existe<\/div>\n            <div class=\"l paso\" data-paso=\"6\"><b>403<\/b> no permitido<\/div>\n            <div class=\"l paso\" data-paso=\"6\"><b>500<\/b> fallo del servidor<\/div><\/div>\n          <div class=\"campo paso\" data-paso=\"7\"><div class=\"k\">contenido<\/div><div class=\"v\">lo que pediste<\/div>\n            <div class=\"opc paso\" data-paso=\"8\"><div class=\"l\"><b>HTML<\/b> página ya hecha<\/div><div class=\"s\">recarga la página<\/div><\/div>\n            <div class=\"opc paso\" data-paso=\"8\"><div class=\"l\"><b>JSON<\/b> solo los datos<\/div><div class=\"s\">sin recargar<\/div><\/div><\/div>\n        <\/div>\n      <\/div>\n\n    <\/div>\n\n    <div class=\"tarjeta fuerte extremo der paso\" data-paso=\"1\">\n      <svg class=\"ico\" width=\"72\" height=\"72\" style=\"--s:1.1\"><use href=\"#i-servidor\"/><\/svg>\n      <div class=\"nombre\">Servidor<\/div>\n    <\/div>\n\n  <\/div>\n  <div class=\"cierre paso\" data-paso=\"10\">El navegador pregunta, el servidor contesta: nunca al revés<\/div>\n<\/div>\n\n<div id=\"ayuda\">← → o clic para avanzar<\/div>\n\n<script>\n(function(){\n  var MAX = 10, paso = 1;\n  var els = [].slice.call(document.querySelectorAll('[data-paso]'));\n  var esc = document.getElementById('escenario');\n  var ayuda = document.getElementById('ayuda');\n\n  function pintar(){\n    els.forEach(function(e){ e.classList.toggle('on', +e.getAttribute('data-paso') <= paso); });\n  }\n  function ir(n){\n    paso = Math.max(1, Math.min(MAX, n));\n    pintar();\n    ayuda.style.opacity = 0;\n  }\n  function escalar(){\n    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);\n    esc.style.transform = 'translate(-50%,-50%) scale(' + s + ')';\n  }\n\n  document.addEventListener('keydown', function(ev){\n    var k = ev.key;\n    if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter') { ir(paso + 1); ev.preventDefault(); }\n    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { ir(paso - 1); ev.preventDefault(); }\n    else if (k === 'Home') ir(1);\n    else if (k === 'End') ir(MAX);\n  });\n  document.addEventListener('click', function(){ ir(paso + 1); });\n  window.addEventListener('resize', escalar);\n\n  escalar();\n  /* #todo muestra la ficha completa (útil para sacar una imagen); #paso=N empieza en el paso N */\n  var h = location.hash, m = h.match(/paso=(\\d+)/);\n  if (h === '#todo') { paso = MAX; ayuda.style.display = 'none'; }\n  else if (m) paso = Math.max(1, Math.min(MAX, +m[1]));\n  requestAnimationFrame(pintar);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"titulo": "Ficha 5 · La base de datos", "html": "<!DOCTYPE n.linea{flex:1;height:5px;border-radius:3px;background:currentColor;transform:scaleX(0);transition:transform .6s ease .1s}\n.ida .linea{transform-origin:left center}\n.vuelta .linea{transform-origin:right center}\n.flecha.on .linea{transform:scaleX(1)}\n.punta{width:30px;height:30px;fill:currentColor;flex:none;opacity:0;transition:opacity .2s ease .6s}\n.ida .punta{margin-left:-8px}\n.vuelta .punta{margin-right:-8px}\n.flecha.on .punta{opacity:1}\n\n/* Frase de cierre al pie */\n.cierre{position:absolute;left:80px;right:80px;bottom:62px;text-align:center;font-size:32px;\n  font-weight:600;border-top:2px solid var(--borde);padding-top:22px}\n\n#ayuda{position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:14px;color:#B4B2A9;\n  transition:opacity .4s}\n@media (prefers-reduced-motion:reduce){.paso,.linea,.punta,#ayuda{transition:none}}\n\n/* ===== Propio de esta ficha ===== */\n.lienzo{position:absolute;left:80px;right:80px;top:40px;bottom:150px;\n  display:grid;grid-template-columns:280px 70px 420px 110px 240px;row-gap:28px;align-content:center}\n.app{grid-column:1;grid-row:1}\n.fl1{grid-column:2;grid-row:1}\n.sqla{grid-column:3;grid-row:1}\n.fl2{grid-column:4;grid-row:1}\n.bd{grid-column:5;grid-row:1 / span 2}\n.alem{grid-column:1 / span 3;grid-row:2}\n.fl3{grid-column:4;grid-row:2}\n\n/* Los dos extremos: cada uno habla su idioma */\n.app,.bd{padding:20px 14px;gap:4px;color:var(--texto)}\n.app .nombre,.bd .nombre{font-size:27px;margin-top:4px}\n.codigo{font-family:Consolas,\"Courier New\",monospace;font-size:16px;font-weight:600;background:#fff;\n  border:2px solid var(--borde);border-radius:8px;padding:5px 9px;margin-top:12px;color:var(--texto)}\n\n/* Flechas cortas entre piezas: dos carriles, ida y vuelta */\n.col-fl{display:flex;flex-direction:column;justify-content:center;gap:26px;padding:0 4px}\n.fl3{display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 4px}\n.flecha.neutra{color:var(--borde-fuerte)}\n.fl3 .et{font-size:18px;font-weight:600;color:var(--texto-2);padding-top:6px}\n\n/* Las dos herramientas */\n.sqla,.alem{padding:20px 22px;gap:12px;align-items:stretch;justify-content:flex-start;text-align:left;color:var(--texto)}\n.cab{display:flex;align-items:center;gap:16px}\n.cab .nombre{line-height:1.15}\n.cab .sub{line-height:1.2}\n.chips{display:flex;gap:14px}\n.sqla .chips{flex-direction:column;gap:8px}\n.chips .pieza{flex:1}\n\n/* Ventaja: una pieza pequeña colgada de la herramienta (misma pieza que en las fichas 2 y 3) */\n.pieza{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--borde-fuerte);\n  border-radius:12px;padding:6px 12px;color:var(--texto);text-align:left}\n.pieza .t{font-size:20px;font-weight:600;line-height:1.15}\n.pieza .s{font-size:17px;color:var(--texto-2);line-height:1.2}\n\n/* Los ficheros de migración de Alembic */\n.fila-a{display:flex;align-items:center;gap:26px}\n.cab-a{display:flex;flex-direction:column;align-items:center;width:170px;gap:2px}\n.folios .cap{font-size:17px;font-style:italic;color:var(--texto-2);margin-bottom:6px}\n.folios .fila{display:flex;align-items:center;gap:8px}\n.folio{width:150px;min-height:62px;background:#fff;border:2px solid var(--borde-fuerte);border-radius:8px;padding:6px 8px}\n.folio .n{font-family:Consolas,\"Courier New\",monospace;font-size:16px;font-weight:600;color:var(--texto-2)}\n.folio .x{font-size:18px;font-weight:600;line-height:1.2;white-space:nowrap}\n.sig{color:var(--borde-fuerte)}\n<\/style>\n<\/head>\n<body>\n<script>\n(function(){\n  var st = document.createElement('style');\n  st.textContent = '#ayuda{display:none!important}';\n  document.head.appendChild(st);\n\n  function conPaso(){ return [].slice.call(document.querySelectorAll('[data-paso]')); }\n  function maximo(){\n    return Math.max.apply(null, conPaso().map(function(e){ return +e.getAttribute('data-paso'); }));\n  }\n  function actual(){\n    var v = conPaso().filter(function(e){ return e.classList.contains('on'); })\n      .map(function(e){ return +e.getAttribute('data-paso'); });\n    return Math.max.apply(null, [1].concat(v));\n  }\n  function tecla(k){ document.dispatchEvent(new KeyboardEvent('keydown', {key: k, bubbles: true})); }\n\n  window.addEventListener('message', function(ev){\n    var m = ev.data || {};\n    if (m.cmd === 'next') {\n      if (actual() >= maximo()) parent.postMessage({fin: 'fin'}, '*'); else tecla('ArrowRight');\n    } else if (m.cmd === 'prev') {\n      if (actual() <= 1) parent.postMessage({fin: 'inicio'}, '*'); else tecla('ArrowLeft');\n    } else if (m.cmd === 'ultimo') {\n      tecla('End');\n    }\n  });\n\n  var NAV = {ArrowRight:1, ArrowLeft:1, ArrowUp:1, ArrowDown:1, ' ':1, PageDown:1, PageUp:1,\n             Enter:1, Backspace:1, Home:1, End:1, f:1, F:1};\n  document.addEventListener('keydown', function(e){\n    if (!e.isTrusted || !NAV[e.key]) return;\n    e.stopImmediatePropagation(); e.preventDefault();\n    parent.postMessage({tecla: e.key}, '*');\n  }, true);\n  document.addEventListener('click', function(e){\n    if (!e.isTrusted) return;\n    e.stopImmediatePropagation();\n    parent.postMessage({cmd: 'next'}, '*');\n  }, true);\n\n  window.addEventListener('load', function(){\n    setTimeout(function(){\n      window.dispatchEvent(new Event('resize'));\n      parent.postMessage({listo: true}, '*');\n    }, 60);\n  });\n})();\n<\/script>\n\n<svg width=\"0\" height=\"0\" style=\"position:absolute\" aria-hidden=\"true\">\n  <symbol id=\"i-codigo\" viewBox=\"0 0 24 24\"><path d=\"M7 8l-4 4 4 4M17 8l4 4-4 4M14 4l-4 16\"/><\/symbol>\n  <symbol id=\"i-datos\" viewBox=\"0 0 24 24\"><ellipse cx=\"12\" cy=\"6\" rx=\"8\" ry=\"3\"/><path d=\"M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6\"/><\/symbol>\n  <symbol id=\"i-traducir\" viewBox=\"0 0 24 24\"><path d=\"M4 8h15M15 4l4 4-4 4M20 16H5M9 12l-4 4 4 4\"/><\/symbol>\n  <symbol id=\"i-sello\" viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"9\" r=\"5.5\"/><path d=\"M8.5 14L7 21l5-2.5L17 21l-1.5-7\"/><\/symbol>\n  <symbol id=\"i-escudo\" viewBox=\"0 0 24 24\"><path d=\"M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM9 12l2 2 4-4\"/><\/symbol>\n  <symbol id=\"i-lista\" viewBox=\"0 0 24 24\"><path d=\"M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2\"/><\/symbol>\n  <symbol id=\"i-capas\" viewBox=\"0 0 24 24\"><path d=\"M12 3l9 5-9 5-9-5zM3 13l9 5 9-5\"/><\/symbol>\n  <symbol id=\"i-copia\" viewBox=\"0 0 24 24\"><rect x=\"8\" y=\"8\" width=\"12\" height=\"12\" rx=\"2\"/><path d=\"M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2\"/><\/symbol>\n<\/svg>\n\n<div id=\"escenario\">\n  <div class=\"lienzo\">\n\n    <div class=\"tarjeta fuerte app paso\" data-paso=\"1\">\n      <svg class=\"ico\" width=\"64\" height=\"64\" style=\"--s:1.2\"><use href=\"#i-codigo\"/><\/svg>\n      <div class=\"nombre\">Aplicación<\/div>\n      <div class=\"sub\">habla Python<\/div>\n      <div class=\"codigo paso\" data-paso=\"3\">expediente.solicitudes<\/div>\n    <\/div>\n\n    <div class=\"col-fl fl1\">\n      <div class=\"flecha ida paso\" data-paso=\"2\"><div class=\"tubo\"><span class=\"linea\"><\/span><svg class=\"punta\" viewBox=\"0 0 24 24\"><path d=\"M4 3l17 9-17 9z\"/><\/svg><\/div><\/div>\n      <div class=\"flecha vuelta paso\" data-paso=\"2\"><div class=\"tubo\"><svg class=\"punta\" viewBox=\"0 0 24 24\"><path d=\"M20 3L3 12l17 9z\"/><\/svg><span class=\"linea\"><\/span><\/div><\/div>\n    <\/div>\n\n    <div class=\"tarjeta fuerte sqla paso\" data-paso=\"2\">\n      <div class=\"cab\">\n        <svg class=\"ico\" width=\"56\" height=\"56\" style=\"--s:1.4\"><use href=\"#i-traducir\"/><\/svg>\n        <div><div class=\"nombre\">SQLAlchemy<\/div><div class=\"sub\">el traductor<\/div><\/div>\n      <\/div>\n      <div class=\"chips\">\n        <div class=\"pieza paso\" data-paso=\"4\">\n          <svg class=\"ico\" width=\"28\" height=\"28\" style=\"--s:1.7\"><use href=\"#i-escudo\"/><\/svg>\n          <div><div class=\"t\">Seguridad<\/div><div class=\"s\">nadie cuela órdenes maliciosas<\/div><\/div>\n        <\/div>\n        <div class=\"pieza paso\" data-paso=\"5\">\n          <svg class=\"ico\" width=\"28\" height=\"28\" style=\"--s:1.7\"><use href=\"#i-lista\"/><\/svg>\n          <div><div class=\"t\">Menos código, menos errores<\/div><div class=\"s\">de expediente a solicitudes, directo<\/div><\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"col-fl fl2\">\n      <div class=\"flecha ida paso\" data-paso=\"2\"><div class=\"tubo\"><span class=\"linea\"><\/span><svg class=\"punta\" viewBox=\"0 0 24 24\"><path d=\"M4 3l17 9-17 9z\"/><\/svg><\/div><\/div>\n      <div class=\"flecha vuelta paso\" data-paso=\"2\"><div class=\"tubo\"><svg class=\"punta\" viewBox=\"0 0 24 24\"><path d=\"M20 3L3 12l17 9z\"/><\/svg><span class=\"linea\"><\/span><\/div><\/div>\n    <\/div>\n\n    <div class=\"tarjeta fuerte bd paso\" data-paso=\"1\">\n      <svg class=\"ico\" width=\"80\" height=\"80\" style=\"--s:1\"><use href=\"#i-datos\"/><\/svg>\n      <div class=\"nombre\">Base de datos<\/div>\n      <div class=\"sub\">habla SQL<\/div>\n      <div class=\"codigo paso\" data-paso=\"3\">SELECT … WHERE …<\/div>\n    <\/div>\n\n    <div class=\"tarjeta fuerte alem paso\" data-paso=\"6\">\n      <div class=\"fila-a\">\n        <div class=\"cab-a\">\n          <svg class=\"ico\" width=\"56\" height=\"56\" style=\"--s:1.4\"><use href=\"#i-sello\"/><\/svg>\n          <div class=\"nombre\">Alembic<\/div>\n          <div class=\"sub\">el notario<\/div>\n        <\/div>\n        <div class=\"folios\">\n          <div class=\"cap\">un fichero por cambio, ordenado y fechado<\/div>\n          <div class=\"fila\">\n            <div class=\"folio\"><div class=\"n\">001<\/div><div class=\"x\">crear tabla<\/div><\/div>\n            <svg class=\"ico sig\" width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" style=\"--s:2.4\"><path d=\"M9 5l7 7-7 7\"/><\/svg>\n            <div class=\"folio\"><div class=\"n\">002<\/div><div class=\"x\">nueva columna<\/div><\/div>\n            <svg class=\"ico sig\" width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" style=\"--s:2.4\"><path d=\"M9 5l7 7-7 7\"/><\/svg>\n            <div class=\"folio\"><div class=\"n\">003<\/div><div class=\"x\">y así sigue<\/div><\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n      <div class=\"chips\">\n        <div class=\"pieza paso\" data-paso=\"7\">\n          <svg class=\"ico\" width=\"28\" height=\"28\" style=\"--s:1.7\"><use href=\"#i-capas\"/><\/svg>\n          <div><div class=\"t\">Estructura versionada<\/div><div class=\"s\">cualquier instalación nace igual<\/div><\/div>\n        <\/div>\n        <div class=\"pieza paso\" data-paso=\"8\">\n          <svg class=\"ico\" width=\"28\" height=\"28\" style=\"--s:1.7\"><use href=\"#i-copia\"/><\/svg>\n          <div><div class=\"t\">Pruebas y producción<\/div><div class=\"s\">se construyen por el mismo camino<\/div><\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"fl3\">\n      <div class=\"flecha neutra ida paso\" data-paso=\"6\"><div class=\"tubo\"><span class=\"linea\"><\/span><svg class=\"punta\" viewBox=\"0 0 24 24\"><path d=\"M4 3l17 9-17 9z\"/><\/svg><\/div><\/div>\n      <div class=\"et paso\" data-paso=\"6\">en orden<\/div>\n    <\/div>\n\n  <\/div>\n  <div class=\"cierre paso\" data-paso=\"9\">SQLAlchemy traduce; Alembic deja constancia de cada cambio<\/div>\n<\/div>\n\n<div id=\"ayuda\">← → o clic para avanzar<\/div>\n\n<script>\n(function(){\n  var MAX = 9, paso = 1;\n  var els = [].slice.call(document.querySelectorAll('[data-paso]'));\n  var esc = document.getElementById('escenario');\n  var ayuda = document.getElementById('ayuda');\n\n  function pintar(){\n    els.forEach(function(e){ e.classList.toggle('on', +e.getAttribute('data-paso') <= paso); });\n  }\n  function ir(n){\n    paso = Math.max(1, Math.min(MAX, n));\n    pintar();\n    ayuda.style.opacity = 0;\n  }\n  function escalar(){\n    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);\n    esc.style.transform = 'translate(-50%,-50%) scale(' + s + ')';\n  }\n\n  document.addEventListener('keydown', function(ev){\n    var k = ev.key;\n    if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter') { ir(paso + 1); ev.preventDefault(); }\n    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { ir(paso - 1); ev.preventDefault(); }\n    else if (k === 'Home') ir(1);\n    else if (k === 'End') ir(MAX);\n  });\n  document.addEventListener('click', function(){ ir(paso + 1); });\n  window.addEventListener('resize', escalar);\n\n  escalar();\n  /* #todo muestra la ficha completa (útil para sacar una imagen); #paso=N empieza en el paso N */\n  var h = location.hash, m = h.match(/paso=(\\d+)/);\n  if (h === '#todo') { paso = MAX; ayuda.style.display = 'none'; }\n  else if (m) paso = Math.max(1, Math.min(MAX, +m[1]));\n  requestAnimationFrame(pintar);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"titulo": "Ficha mapa · Las piezas de un vistazo", "html": "<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Ficha mapa · Las piezas de un vistazo<\/title>\n<style>\n/* ===== Base común de las fichas BDDAT: copiar tal cual a cada ficha ===== */\n:root{\n  --fondo:#fff; --tarjeta:#F7F6F2; --borde:#D3D1C7; --borde-fuerte:#888780;\n  --texto:#2C2C2A; --texto-2:#5F5E5A;\n  --ida:#185FA5;      /* petición: lo que va */\n  --vuelta:#3B6D11;   /* respuesta: lo que vuelve */\n  --plan:#854F0B;     /* reservado: lo marcado ⚠️ (plan, aún no construido) */\n}\n*{box-sizing:border-box;margin:0}\nhtml,body{height:100%;background:var(--fondo);overflow:hidden}\nbody{font-family:\"Segoe UI\",Roboto,Arial,sans-serif;color:var(--texto)}\n\n/* Lienzo fijo de 1280x720 que se escala para caber en cualquier ventana */\n#escenario{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin ont-size:18px;line-height:1.2}\n\n/* El tamaño, dibujado como barra: datos (claro) y ficheros (oscuro) */\n.bloque{display:flex;flex-direction:column;gap:6px}\n.et-b{font-size:18px;color:var(--texto-2)}\n.barra{display:flex;height:50px;border:2px solid var(--borde-fuerte);border-radius:10px;overflow:hidden;background:#fff}\n.barra.corta{width:58px}\n.seg-d{width:54px;flex:none;background:var(--borde);color:var(--texto);display:flex;align-items:center;\n  justify-content:center;font-size:16px;font-weight:600}\n.seg-f{flex:1;background:var(--texto-2);color:#fff;display:flex;align-items:center;justify-content:center;\n  font-size:20px;font-weight:600}\n\n/* El enlace: de lo ligero a lo pesado */\n.enlace-v{display:flex;align-items:center;gap:12px;height:48px;margin-left:15px;color:var(--borde-fuerte)}\n.enlace-v .tx{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:600;color:var(--texto-2)}\n\n/* El veredicto, al pie de cada columna */\n.veredicto{margin-top:auto;display:flex;align-items:center;gap:14px;border-top:2px solid var(--borde);padding-top:14px}\n.veredicto .nombre{font-size:27px;line-height:1.1}\n.veredicto .sub{font-size:18px;line-height:1.2}\n<\/style>\n<\/head>\n<body>\n<script>\n(function(){\n  var st = document.createElement('style');\n  st.textContent = '#ayuda{display:none!important}';\n  document.head.appendChild(st);\n\n  function conPaso(){ return [].slice.call(document.querySelectorAll('[data-paso]')); }\n  function maximo(){\n    return Math.max.apply(null, conPaso().map(function(e){ return +e.getAttribute('data-paso'); }));\n  }\n  function actual(){\n    var v = conPaso().filter(function(e){ return e.classList.contains('on'); })\n      .map(function(e){ return +e.getAttribute('data-paso'); });\n    return Math.max.apply(null, [1].concat(v));\n  }\n  function tecla(k){ document.dispatchEvent(new KeyboardEvent('keydown', {key: k, bubbles: true})); }\n\n  window.addEventListener('message', function(ev){\n    var m = ev.data || {};\n    if (m.cmd === 'next') {\n      if (actual() >= maximo()) parent.postMessage({fin: 'fin'}, '*'); else tecla('ArrowRight');\n    } else if (m.cmd === 'prev') {\n      if (actual() <= 1) parent.postMessage({fin: 'inicio'}, '*'); else tecla('ArrowLeft');\n    } else if (m.cmd === 'ultimo') {\n      tecla('End');\n    }\n  });\n\n  var NAV = {ArrowRight:1, ArrowLeft:1, ArrowUp:1, ArrowDown:1, ' ':1, PageDown:1, PageUp:1,\n             Enter:1, Backspace:1, Home:1, End:1, f:1, F:1};\n  document.addEventListener('keydown', function(e){\n    if (!e.isTrusted || !NAV[e.key]) return;\n    e.stopImmediatePropagation(); e.preventDefault();\n    parent.postMessage({tecla: e.key}, '*');\n  }, true);\n  document.addEventListener('click', function(e){\n    if (!e.isTrusted) return;\n    e.stopImmediatePropagation();\n    parent.postMessage({cmd: 'next'}, '*');\n  }, true);\n\n  window.addEventListener('load', function(){\n    setTimeout(function(){\n      window.dispatchEvent(new Event('resize'));\n      parent.postMessage({listo: true}, '*');\n    }, 60);\n  });\n})();\n<\/script>\n\n<svg width=\"0\" height=\"0\" style=\"position:absolute\" aria-hidden=\"true\">\n  <symbol id=\"i-datos\" viewBox=\"0 0 24 24\"><ellipse cx=\"12\" cy=\"6\" rx=\"8\" ry=\"3\"/><path d=\"M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6\"/><\/symbol>\n  <symbol id=\"i-carpeta\" viewBox=\"0 0 24 24\"><path d=\"M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z\"/><\/symbol>\n  <symbol id=\"i-reloj-arena\" viewBox=\"0 0 24 24\"><path d=\"M6 3h12M6 21h12M7 3v4a5 5 0 0 0 2 4l1 1-1 1a5 5 0 0 0-2 4v4M17 3v4a5 5 0 0 1-2 4l-1 1 1 1a5 5 0 0 1 2 4v4\"/><\/symbol>\n  <symbol id=\"i-rayo\" viewBox=\"0 0 24 24\"><path d=\"M13 3L5 14h6l-1 7 8-11h-6z\"/><\/symbol>\n  <symbol id=\"i-enlace\" viewBox=\"0 0 24 24\"><path d=\"M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1\"/><\/symbol>\n<\/svg>\n\n<div id=\"escenario\">\n  <div class=\"lienzo\">\n\n    <div class=\"tarjeta fuerte panel\">\n      <div class=\"ph paso\" data-paso=\"1\">\n        <svg class=\"ico\" width=\"44\" height=\"44\" style=\"--s:1.2\"><use href=\"#i-datos\"/><\/svg>\n        <div><div class=\"nombre\">Todo dentro<\/div><div class=\"sub\">los ficheros, en la base de datos<\/div><\/div>\n      <\/div>\n      <div class=\"bloque paso\" data-paso=\"1\">\n        <div class=\"et-b\">PostgreSQL<\/div>\n        <div class=\"barra\"><div class=\"seg-d\">datos<\/div><div class=\"seg-f\">ficheros<\/div><\/div>\n      <\/div>\n      <div class=\"veredicto paso\" data-paso=\"2\">\n        <svg class=\"ico\" width=\"44\" height=\"44\" style=\"--s:1.3\"><use href=\"#i-reloj-arena\"/><\/svg>\n        <div><div class=\"nombre\">Pesada y lenta<\/div><div class=\"sub\">las copias de seguridad tardan<\/div><\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"tarjeta fuerte panel\">\n      <div class=\"ph paso\" data-paso=\"3\">\n        <svg class=\"ico\" width=\"44\" height=\"44\" style=\"--s:1.2\"><use href=\"#i-carpeta\"/><\/svg>\n        <div><div class=\"nombre\">Separados<\/div><div class=\"sub\">lo ligero dentro, lo pesado fuera<\/div><\/div>\n      <\/div>\n      <div class=\"bloque paso\" data-paso=\"3\">\n        <div class=\"et-b\">PostgreSQL<\/div>\n        <div class=\"barra corta\"><div class=\"seg-d\">datos<\/div><\/div>\n      <\/div>\n      <div class=\"enlace-v paso\" data-paso=\"4\">\n        <svg class=\"ico\" width=\"28\" height=\"44\" viewBox=\"0 0 28 44\" style=\"--s:3\"><path d=\"M14 2v34M5 28l9 10 9-10\"/><\/svg>\n        <div class=\"tx\"><svg class=\"ico\" width=\"26\" height=\"26\" style=\"--s:1.8\"><use href=\"#i-enlace\"/><\/svg>enlace<\/div>\n      <\/div>\n      <div class=\"bloque paso\" data-paso=\"3\">\n        <div class=\"et-b\">servidor de archivos<\/div>\n        <div class=\"barra\"><div class=\"seg-f\">ficheros<\/div><\/div>\n      <\/div>\n      <div class=\"veredicto paso\" data-paso=\"5\">\n        <svg class=\"ico\" width=\"44\" height=\"44\" style=\"--s:1.3\"><use href=\"#i-rayo\"/><\/svg>\n        <div><div class=\"nombre\">Ligera y rápida<\/div><div class=\"sub\">copias pequeñas, consultas ágiles<\/div><\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"nota\">esquema, sin escala<\/div>\n\n  <\/div>\n  <div class=\"cierre paso\" data-paso=\"6\">Lo pesado, fuera; en la base de datos, solo el enlace<\/div>\n<\/div>\n\n<div id=\"ayuda\">← → o clic para avanzar<\/div>\n\n<script>\n(function(){\n  var MAX = 6, paso = 1;\n  var els = [].slice.call(document.querySelectorAll('[data-paso]'));\n  var esc = document.getElementById('escenario');\n  var ayuda = document.getElementById('ayuda');\n\n  function pintar(){\n    els.forEach(function(e){ e.classList.toggle('on', +e.getAttribute('data-paso') <= paso); });\n  }\n  function ir(n){\n    paso = Math.max(1, Math.min(MAX, n));\n    pintar();\n    ayuda.style.opacity = 0;\n  }\n  function escalar(){\n    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);\n    esc.style.transform = 'translate(-50%,-50%) scale(' + s + ')';\n  }\n\n  document.addEventListener('keydown', function(ev){\n    var k = ev.key;\n    if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter') { ir(paso + 1); ev.preventDefault(); }\n    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { ir(paso - 1); ev.preventDefault(); }\n    else if (k === 'Home') ir(1);\n    else if (k === 'End') ir(MAX);\n  });\n  document.addEventListener('click', function(){ ir(paso + 1); });\n  window.addEventListener('resize', escalar);\n\n  escalar();\n  /* #todo muestra la ficha completa (útil para sacar una imagen); #paso=N empieza en el paso N */\n  var h = location.hash, m = h.match(/paso=(\\d+)/);\n  if (h === '#todo') { paso = MAX; ayuda.style.display = 'none'; }\n  else if (m) paso = Math.max(1, Math.min(MAX, +m[1]));\n  requestAnimationFrame(pintar);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"titulo": "Ficha 8 · Dónde corre", "html": "<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Ficha 8 · Dónde corre<\/title>\n<style>\n/* ===== Base común de las fichas BDDAT: copiar tal cual a cada ficha ===== */\n:root{\n  --fondo:#fff; --tarjeta:#F7F6F2; --borde:#D3D1C7; --borde-fuerte:#888780;\n  --texto:#2C2C2A; --texto-2:#5F5E5A;\n  --ida:#185FA5;      /* petición: lo que va */\n  --vuelta:#3B6D11;   /* respuesta: lo que vuelve */\n  --plan:#854F0B;     /* reservado: lo marcado ⚠️ (plan, aún no construido) */\n}\n*{box-sizing:border-box;margin:0}\nhtml,body{height:100%;background:var(--fondo);overflow:hidden}\nbody{font-family:\"Segoe UI\",Roboto,Arial,sans-serif;color:var(--texto)}\n\n/* Lienzo fijo de 1280x720 que se escala para caber en cualquier ventana */\n#escenario{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center}\n\n/* Aparición por pasos: cada elemento lleva data-paso=\"N\" y se muestra al llegar a N */\n.paso{opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s ease}\n.paso.on{opacity:var(--op,1);transform:none}\n\n/* Iconos de línea (el sprite está al principio del body) */\n.ico{fill:none;stroke:currentColor;stroke-width:var(--s,1.5);stroke-linecap:round;stroke-linejoin:round}\n\n/* Tarjeta: la forma común de todo \"equipo\" o \"pieza\" */\n.tarjeta{background:var(--tarjeta);border:2px solid var(--borde);border-radius:18px;\n  display:flex;flex-direction:column;align-items:center;justify-content:center}\n.tarjeta.fuerte{border-color:var(--borde-fuerte)}\n.tarjeta.punteada{background:transparent;border-style:dashed;border-color:var(--borde-fuerte);border-radius:12px}\n.nombre{font-size:30px;font-weight:600}\n.sub{font-size:20px;color:var(--texto-2)}\n\n/* Conexión: línea que se dibuja + punta + rótulo + cita */\n.flecha{width:100%;text-align:center}\n.flecha.ida{color:var(--ida)}\n.flecha.vuelta{color:var(--vuelta)}\n.flecha .et{font-size:24px;font-weight:600;padding:4px 0}\n.flecha .cita{font-size:19px;color:var(--texto-2)}\n.tubo{display:flex;align-items:center}\n.linea{flex:1;height:5px;border-radius:3px;background:currentColor;transform:scaleX(0);transition:transform .6s ease .1s}\n.ida .linea{transform-origin:left center}\n.vuelta .linea{transform-origin:right center}\n.flecha.on .linea{transform:scaleX(1)}\n.punta{width:30px;height:30px;fill:currentColor;flex:none;opacity:0;transition:opacity .2s ease .6s}\n.ida .punta{margin-left:-8px}\n.vuelta .punta{margin-right:-8px}\n.flecha.on .punta{opacity:1}\n\n/* Frase de cierre al pie */\n.cierre{position:absolute;left:80px;right:80px;bottom:62px;text-align:center;font-size:32px;\n  font-weight:600;border-top:2px solid var(--borde);padding-top:22px}\n\n#ayuda{position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:14px;color:#B4B2A9;\n  transition:opacity .4s}\n@media (prefers-reduced-motion:reduce){.paso,.linea,.punta,#ayuda{transition:none}}\n\n/* ===== Propio de esta ficha ===== */\n.lienzo{position:absolute;left:80px;right:80px;top:30px;bottom:150px;\n  display:grid;grid-template-columns:360px 130px 630px;align-content:center;align-items:stretch}\n\n/* Etiqueta ámbar sobre el borde: lo que aún no está decidido */\n.etiq{position:absolute;top:-14px;right:16px;background:#fff;border:1.5px solid var(--plan);\n  color:var(--plan);border-radius:8px;padding:0 9px;font-size:16px;font-weight:600;line-height:1.4}\n\n/* El PC de trabajo, a la izquierda */\n.pc{position:relative;padding:20px 18px;gap:8px;align-items:stretch;justify-content:flex-start;\n  text-align:left;color:var(--texto)}\n.cab-c{display:flex;align-items:center;gap:12px}\n.cab-c .nombre{font-size:26px;line-height:1.1}\n.cab-c .sub{font-size:18px;line-height:1.2}\n\n/* Las dos piezas que corren juntas: la aplicación y la base de datos */\n.juntas{display:flex;gap:10px;margin-top:6px}\n.pieza{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--borde-fuerte);\n  border-radius:12px;padding:6px 12px;color:var(--texto);text-align:left}\n.pieza .t{font-size:20px;font-weight:600;line-height:1.15}\n.pieza .s{font-size:17px;color:var(--texto-2);line-height:1.2}\n.pieza.ancha{align-items:flex-start;margin-top:auto}\n\n/* Producción: dos alternativas */\n.prod{position:relative;padding:22px 20px 20px;gap:10px;align-items:stretch;justify-content:flex-start;\n  border-color:var(--plan);color:var(--texto)}\n.prod .cab-c{margin-bottom:2px}\n.alt{width:100%;min-height:100px;padding:12px 16px;flex-direction:row;justify-content:space-between;gap:14px;\n  text-align:left;background:#fff;border-color:var(--borde-fuerte);border-radius:14px}\n.alt .cab-c .nombre{font-size:24px}\n.alt .juntas{margin-top:0}\n.o{align-self:center;width:36px;height:36px;border-radius:50%;border:2px solid var(--borde-fuerte);background:#fff;\n  display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;color:var(--texto-2)}\n\n/* La entrega, de uno a otro */\n.entrega{align-self:center;padding:0 10px}\n.flecha.neutra{color:var(--borde-fuerte)}\n.entrega .rot{font-size:20px;font-weight:600;color:var(--texto-2);text-align:center;padding-bottom:2px}\n<\/style>\n<\/head>\n<body>\n<script>\n(function(){\n  var st = document.createElement('style');\n  st.textContent = '#ayuda{display:none!important}';\n  document.head.appendChild(st);\n\n  function conPaso(){ return [].slice.call(document.querySelectorAll('[data-paso]')); }\n  function maximo(){\n    return Math.max.apply(null, conPaso().map(function(e){ return +e.getAttribute('data-paso'); }));\n  }\n  function actual(){\n    var v = conPaso().filter(function(e){ return e.classList.contains('on'); })\n      .map(function(e){ return +e.getAttribute('data-paso'); });\n    return Math.max.apply(null, [1].concat(v));\n  }\n  function tecla(k){ document.dispatchEvent(new KeyboardEvent('keydown', {key: k, bubbles: true})); }\n\n  window.addEventListener('message', function(ev){\n    var m = ev.data || {};\n    if (m.cmd === 'next') {\n      if (actual() >= maximo()) parent.postMessage({fin: 'fin'}, '*'); else tecla('ArrowRight');\n    } else if (m.cmd === 'prev') {\n      if (actual() <= 1) parent.postMessage({fin: 'inicio'}, '*'); else tecla('ArrowLeft');\n    } else if (m.cmd === 'ultimo') {\n      tecla('End');\n    }\n  });\n\n  var NAV = {ArrowRight:1, ArrowLeft:1, ArrowUp:1, ArrowDown:1, ' ':1, PageDown:1, PageUp:1,\n             Enter:1, Backspace:1, Home:1, End:1, f:1, F:1};\n  document.addEventListener('keydown', function(e){\n    if (!e.isTrusted || !NAV[e.key]) return;\n    e.stopImmediatePropagation(); e.preventDefault();\n    parent.postMessage({tecla: e.key}, '*');\n  }, true);\n  document.addEventListener('click', function(e){\n    if (!e.isTrusted) return;\n    e.stopImmediatePropagation();\n    parent.postMessage({cmd: 'next'}, '*');\n  }, true);\n\n  window.addEventListener('load', function(){\n    setTimeout(function(){\n      window.dispatchEvent(new Event('resize'));\n      parent.postMessage({listo: true}, '*');\n    }, 60);\n  });\n})();\n<\/script>\n\n<svg width=\"0\" height=\"0\" style=\"position:absolute\" aria-hidden=\"true\">\n  <symbol id=\"i-pc\" viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"12\" rx=\"2\"/><path d=\"M3 8h18M7 20h10M9 16v4M15 16v4\"/><\/symbol>\n  <symbol id=\"i-servidor\" viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"7\" rx=\"2\"/><rect x=\"3\" y=\"13\" width=\"18\" height=\"7\" rx=\"2\"/><path d=\"M7 7.5v.01M7 16.5v.01M11 7.5h6M11 16.5h6\"/><\/symbol>\n  <symbol id=\"i-red\" viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"5\" r=\"2\"/><circle cx=\"5\" cy=\"19\" r=\"2\"/><circle cx=\"19\" cy=\"19\" r=\"2\"/><path d=\"M12 7v5M12 12l-6 5.5M12 12l6 5.5\"/><\/symbol>\n  <symbol id=\"i-matraz\" viewBox=\"0 0 24 24\"><path d=\"M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4A2 2 0 0 0 19 18l-5-9V3M8 15h8\"/><\/symbol>\n ementById('escenario');\n  var ayuda = document.getElementById('ayuda');\n\n  function pintar(){\n    els.forEach(function(e){ e.classList.toggle('on', +e.getAttribute('data-paso') <= paso); });\n  }\n  function ir(n){\n    paso = Math.max(1, Math.min(MAX, n));\n    pintar();\n    ayuda.style.opacity = 0;\n  }\n  function escalar(){\n    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);\n    esc.style.transform = 'translate(-50%,-50%) scale(' + s + ')';\n  }\n\n  document.addEventListener('keydown', function(ev){\n    var k = ev.key;\n    if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter') { ir(paso + 1); ev.preventDefault(); }\n    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { ir(paso - 1); ev.preventDefault(); }\n    else if (k === 'Home') ir(1);\n    else if (k === 'End') ir(MAX);\n  });\n  document.addEventListener('click', function(){ ir(paso + 1); });\n  window.addEventListener('resize', escalar);\n\n  escalar();\n  /* #todo muestra la ficha completa (útil para sacar una imagen); #paso=N empieza en el paso N */\n  var h = location.hash, m = h.match(/paso=(\\d+)/);\n  if (h === '#todo') { paso = MAX; ayuda.style.display = 'none'; }\n  else if (m) paso = Math.max(1, Math.min(MAX, +m[1]));\n  requestAnimationFrame(pintar);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"titulo": "Ficha 9 · Los escalones", "html": "<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Ficha 9 · Los escalones<\/title>\n<style>\n/* ===== Base común de las fichas BDDAT: copiar tal cual a cada ficha ===== */\n:root{\n  --fondo:#fff; --tarjeta:#F7F6F2; --borde:#D3D1C7; --borde-fuerte:#888780;\n  --texto:#2C2C2A; --texto-2:#5F5E5A;\n  --ida:#185FA5;      /* petición: lo que va */\n  --vuelta:#3B6D11;   /* respuesta: lo que vuelve */\n  --plan:#854F0B;     /* reservado: lo marcado ⚠️ (plan, aún no construido) */\n}\n*{box-sizing:border-box;margin:0}\nhtml,body{height:100%;background:var(--fondo);overflow:hidden}\nbody{font-family:\"Segoe UI\",Roboto,Arial,sans-serif;color:var(--texto)}\n\n/* Lienzo fijo de 1280x720 que se escala para caber en cualquier ventana */\n#escenario{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center}\n\n/* Aparición por pasos: cada elemento lleva data-paso=\"N\" y se muestra al llegar a N */\n.paso{opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s ease}\n.paso.on{opacity:var(--op,1);transform:none}\n\n/* Iconos de línea (el sprite está al principio del body) */\n.ico{fill:none;stroke:currentColor;stroke-width:var(--s,1.5);stroke-linecap:round;stroke-linejoin:round}\n\n/* Tarjeta: la forma común de todo \"equipo\" o \"pieza\" */\n.tarjeta{background:var(--tarjeta);border:2px solid var(--borde);border-radius:18px;\n  display:flex;flex-direction:column;align-items:center;justify-content:center}\n.tarjeta.fuerte{border-color:var(--borde-fuerte)}\n.tarjeta.punteada{background:transparent;border-style:dashed;border-color:var(--borde-fuerte);border-radius:12px}\n.nombre{font-size:30px;font-weight:600}\n.sub{font-size:20px;color:var(--texto-2)}\n\n/* Conexión: línea que se dibuja + punta + rótulo + cita */\n.flecha{width:100%;text-align:center}\n.flecha.ida{color:var(--ida)}\n.flecha.vuelta{color:var(--vuelta)}\n.flecha .et{font-size:24px;font-weight:600;padding:4px 0}\n.flecha .cita{font-size:19px;color:var(--texto-2)}\n.tubo{display:flex;align-items:center}\n.linea{flex:1;height:5px;border-radius:3px;background:currentColor;transform:scaleX(0);transition:transform .6s ease .1s}\n.ida .linea{transform-origin:left center}\n.vuelta .linea{transform-origin:right center}\n.flecha.on .linea{transform:scaleX(1)}\n.punta{width:30px;height:30px;fill:currentColor;flex:none;opacity:0;transition:opacity .2s ease .6s}\n.ida .punta{margin-left:-8px}\n.vuelta .punta{margin-right:-8px}\n.flecha.on .punta{opacity:1}\n\n/* Frase de cierre al pie */\n.cierre{position:absolute;left:80px;right:80px;bottom:62px;text-align:center;font-size:32px;\n  font-weight:600;border-top:2px solid var(--borde);padding-top:22px}\n\n#ayuda{position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:14px;color:#B4B2A9;\n  transition:opacity .4s}\n@media (prefers-reduced-motion:reduce){.paso,.linea,.punta,#ayuda{transition:none}}\n\n/* ===== Propio de esta ficha ===== */\n/* La escalera: cuatro tarjetas que suben de izquierda a derecha */\n.lienzo{position:absolute;left:80px;right:80px;top:30px;bottom:150px;display:flex;align-items:flex-end;\n  justify-content:center;gap:20px;padding-bottom:40px}\n.esc{position:relative;width:258px;height:292px;padding:18px 16px;gap:8px;align-items:stretch;\n  justify-content:flex-start;text-align:left;color:var(--texto)}\n.esc:nth-child(2){margin-bottom:34px}\n.esc:nth-child(3){margin-bottom:68px}\n.esc:nth-child(4){margin-bottom:102px}\n.esc .cab{display:flex;align-items:center;gap:10px}\n.esc .nombre{font-size:25px;line-height:1.1}\n.esc .sub{font-size:18px;line-height:1.25}\n.esc.plan{border-color:var(--plan)}\n.etiq{position:absolute;top:-14px;right:14px;background:#fff;border:1.5px solid var(--plan);\n  color:var(--plan);border-radius:8px;padding:0 9px;font-size:16px;font-weight:600;line-height:1.4}\n\n/* Lo que hay dentro de cada escalón: su base de datos, y las pruebas */\n.chips{margin-top:auto;display:flex;flex-direction:column;gap:8px}\n.pieza{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--borde-fuerte);\n  border-radius:12px;padding:5px 10px;color:var(--texto);text-align:left}\n.pieza .t{font-size:18px;font-weight:600;line-height:1.15}\n.pieza .s{font-size:16px;color:var(--texto-2);line-height:1.2}\n.pieza.vacia{visibility:hidden}\n<\/style>\n<\/head>\n<body>\n<script>\n(function(){\n  var st = document.createElement('style');\n  st.textContent = '#ayuda{display:none!important}';\n  document.head.appendChild(st);\n\n  function conPaso(){ return [].slice.call(document.querySelectorAll('[data-paso]')); }\n  function maximo(){\n    return Math.max.apply(null, conPaso().map(function(e){ return +e.getAttribute('data-paso'); }));\n  }\n  function actual(){\n    var v = conPaso().filter(function(e){ return e.classList.contains('on'); })\n      .map(function(e){ return +e.getAttribute('data-paso'); });\n    return Math.max.apply(null, [1].concat(v));\n  }\n  function tecla(k){ document.dispatchEvent(new KeyboardEvent('keydown', {key: k, bubbles: true})); }\n\n  window.addEventListener('message', function(ev){\n    var m = ev.data || {};\n    if (m.cmd === 'next') {\n      if (actual() >= maximo()) parent.postMessage({fin: 'fin'}, '*'); else tecla('ArrowRight');\n    } else if (m.cmd === 'prev') {\n      if (actual() <= 1) parent.postMessage({fin: 'inicio'}, '*'); else tecla('ArrowLeft');\n    } else if (m.cmd === 'ultimo') {\n      tecla('End');\n    }\n  });\n\n  var NAV = {ArrowRight:1, ArrowLeft:1, ArrowUp:1, ArrowDown:1, ' ':1, PageDown:1, PageUp:1,\n             Enter:1, Backspace:1, Home:1, End:1, f:1, F:1};\n  document.addEventListener('keydown', function(e){\n    if (!e.isTrusted || !NAV[e.key]) return;\n    e.stopImmediatePropagation(); e.preventDefault();\n    parent.postMessage({tecla: e.key}, '*');\n  }, true);\n  document.addEventListener('click', function(e){\n    if (!e.isTrusted) return;\n    e.stopImmediatePropagation();\n    parent.postMessage({cmd: 'next'}, '*');\n  }, true);\n\n  window.addEventListener('load', function(){\n    setTimeout(function(){\n      window.dispatchEvent(new Event('resize'));\n      parent.postMessage({listo: true}, '*');\n    }, 60);\n  });\n})();\n<\/script>\n\n<svg width=\"0\" height=\"0\" style=\"position:absolute\" aria-hidden=\"true\">\n  <symbol id=\"i-codigo\" viewBox=\"0 0 24 24\"><path d=\"M7 8l-4 4 4 4M17 8l4 4-4 4M14 4l-4 16\"/><\/symbol>\n  <symbol id=\"i-grupo\" viewBox=\"0 0 24 24\"><circle cx=\"9\" cy=\"7\" r=\"3.5\"/><path d= align:center;padding-top:6px}\n<\/style>\n<\/head>\n<body>\n<script>\n(function(){\n  var st = document.createElement('style');\n  st.textContent = '#ayuda{display:none!important}';\n  document.head.appendChild(st);\n\n  function conPaso(){ return [].slice.call(document.querySelectorAll('[data-paso]')); }\n  function maximo(){\n    return Math.max.apply(null, conPaso().map(function(e){ return +e.getAttribute('data-paso'); }));\n  }\n  function actual(){\n    var v = conPaso().filter(function(e){ return e.classList.contains('on'); })\n      .map(function(e){ return +e.getAttribute('data-paso'); });\n    return Math.max.apply(null, [1].concat(v));\n  }\n  function tecla(k){ document.dispatchEvent(new KeyboardEvent('keydown', {key: k, bubbles: true})); }\n\n  window.addEventListener('message', function(ev){\n    var m = ev.data || {};\n    if (m.cmd === 'next') {\n      if (actual() >= maximo()) parent.postMessage({fin: 'fin'}, '*'); else tecla('ArrowRight');\n    } else if (m.cmd === 'prev') {\n      if (actual() <= 1) parent.postMessage({fin: 'inicio'}, '*'); else tecla('ArrowLeft');\n    } else if (m.cmd === 'ultimo') {\n      tecla('End');\n    }\n  });\n\n  var NAV = {ArrowRight:1, ArrowLeft:1, ArrowUp:1, ArrowDown:1, ' ':1, PageDown:1, PageUp:1,\n             Enter:1, Backspace:1, Home:1, End:1, f:1, F:1};\n  document.addEventListener('keydown', function(e){\n    if (!e.isTrusted || !NAV[e.key]) return;\n    e.stopImmediatePropagation(); e.preventDefault();\n    parent.postMessage({tecla: e.key}, '*');\n  }, true);\n  document.addEventListener('click', function(e){\n    if (!e.isTrusted) return;\n    e.stopImmediatePropagation();\n    parent.postMessage({cmd: 'next'}, '*');\n  }, true);\n\n  window.addEventListener('load', function(){\n    setTimeout(function(){\n      window.dispatchEvent(new Event('resize'));\n      parent.postMessage({listo: true}, '*');\n    }, 60);\n  });\n})();\n<\/script>\n\n<svg width=\"0\" height=\"0\" style=\"position:absolute\" aria-hidden=\"true\">\n  <symbol id=\"i-encender\" viewBox=\"0 0 24 24\"><path d=\"M12 3v8M7.5 6.5a8 8 0 1 0 9 0\"/><\/symbol>\n  <symbol id=\"i-red\" viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"5\" r=\"2\"/><circle cx=\"5\" cy=\"19\" r=\"2\"/><circle cx=\"19\" cy=\"19\" r=\"2\"/><path d=\"M12 7v5M12 12l-6 5.5M12 12l6 5.5\"/><\/symbol>\n  <symbol id=\"i-escudo\" viewBox=\"0 0 24 24\"><path d=\"M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM9 12l2 2 4-4\"/><\/symbol>\n  <symbol id=\"i-memoria\" viewBox=\"0 0 24 24\"><rect x=\"6\" y=\"6\" width=\"12\" height=\"12\" rx=\"2\"/><path d=\"M9 3v3M15 3v3M9 18v3M15 18v3M3 9h3M3 15h3M18 9h3M18 15h3\"/><\/symbol>\n  <symbol id=\"i-terminal\" viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"16\" rx=\"2\"/><path d=\"M7 9l3 3-3 3M12 15h5\"/><\/symbol>\n<\/svg>\n\n<div id=\"escenario\">\n  <div class=\"lienzo\">\n\n    <div class=\"tabla\">\n\n      <div class=\"col etiquetas\">\n        <div class=\"cab\"><\/div>\n        <div class=\"fila paso\" data-paso=\"2\"><svg class=\"ico\" width=\"30\" height=\"30\" style=\"--s:1.7\"><use href=\"#i-encender\"/><\/svg>Arranque tras reiniciar<\/div>\n        <div class=\"fila paso\" data-paso=\"3\"><svg class=\"ico\" width=\"30\" height=\"30\" style=\"--s:1.7\"><use href=\"#i-red\"/><\/svg>Red<\/div>\n        <div class=\"fila paso\" data-paso=\"4\"><svg class=\"ico\" width=\"30\" height=\"30\" style=\"--s:1.7\"><use href=\"#i-escudo\"/><\/svg>Antivirus corporativo<\/div>\n        <div class=\"fila paso\" data-paso=\"5\"><svg class=\"ico\" width=\"30\" height=\"30\" style=\"--s:1.7\"><use href=\"#i-memoria\"/><\/svg>Memoria en reposo<\/div>\n        <div class=\"fila paso\" data-paso=\"6\"><svg class=\"ico\" width=\"30\" height=\"30\" style=\"--s:1.7\"><use href=\"#i-terminal\"/><\/svg>Acceso remoto<\/div>\n      <\/div>\n\n      <div class=\"tarjeta col paso\" data-paso=\"1\" style=\"border-radius:18px 0 0 18px\">\n        <div class=\"cab\"><div class=\"nombre\">Windows con Linux p >\n      <div class=\"v act\">v3<\/div>\n      <div class=\"atras\"><svg class=\"ico\" width=\"26\" height=\"26\" style=\"--s:1.8\"><use href=\"#i-deshacer\"/><\/svg>volver atrás: la versión anterior del código; los datos, con su copia<\/div>\n    <\/div>\n\n  <\/div>\n  <div class=\"cierre paso\" data-paso=\"6\">Una caja cerrada: se sustituye entera, nunca se toca por dentro<\/div>\n<\/div>\n\n<div id=\"ayuda\">← → o clic para avanzar<\/div>\n\n<script>\n(function(){\n  var MAX = 6, paso = 1;\n  var els = [].slice.call(document.querySelectorAll('[data-paso]'));\n  var esc = document.getElementById('escenario');\n  var ayuda = document.getElementById('ayuda');\n\n  function pintar(){\n    els.forEach(function(e){ e.classList.toggle('on', +e.getAttribute('data-paso') <= paso); });\n  }\n  function ir(n){\n    paso = Math.max(1, Math.min(MAX, n));\n    pintar();\n    ayuda.style.opacity = 0;\n  }\n  function escalar(){\n    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);\n    esc.style.transform = 'translate(-50%,-50%) scale(' + s + ')';\n  }\n\n  document.addEventListener('keydown', function(ev){\n    var k = ev.key;\n    if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter') { ir(paso + 1); ev.preventDefault(); }\n    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { ir(paso - 1); ev.preventDefault(); }\n    else if (k === 'Home') ir(1);\n    else if (k === 'End') ir(MAX);\n  });\n  document.addEventListener('click', function(){ ir(paso + 1); });\n  window.addEventListener('resize', escalar);\n\n  escalar();\n  /* #todo muestra la ficha completa (útil para sacar una imagen); #paso=N empieza en el paso N */\n  var h = location.hash, m = h.match(/paso=(\\d+)/);\n  if (h === '#todo') { paso = MAX; ayuda.style.display = 'none'; }\n  else if (m) paso = Math.max(1, Math.min(MAX, +m[1]));\n  requestAnimationFrame(pintar);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"titulo": "Ficha 12 · Uno o varios procesos", "h  <= paso); });\n  }\n  function ir(n){\n    paso = Math.max(1, Math.min(MAX, n));\n    pintar();\n    ayuda.style.opacity = 0;\n  }\n  function escalar(){\n    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);\n    esc.style.transform = 'translate(-50%,-50%) scale(' + s + ')';\n  }\n\n  document.addEventListener('keydown', function(ev){\n    var k = ev.key;\n    if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter') { ir(paso + 1); ev.preventDefault(); }\n    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { ir(paso - 1); ev.preventDefault(); }\n    else if (k === 'Home') ir(1);\n    else if (k === 'End') ir(MAX);\n  });\n  document.addEventListener('click', function(){ ir(paso + 1); });\n  window.addEventListener('resize', escalar);\n\n  escalar();\n  /* #todo muestra la ficha completa (útil para sacar una imagen); #paso=N empieza en el paso N */\n  var h = location.hash, m = h.match(/paso=(\\d+)/);\n  if (h === '#todo') { paso = MAX; ayuda.style.display = 'none'; }\n  else if (m) paso = Math.max(1, Math.min(MAX, +m[1]));\n  requestAnimationFrame(pintar);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"titulo": "Ficha 13 · Nada que instalar", "html": "<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Ficha 13 · Nada que instalar<\/title>\n<style>\n/* ===== Base común de las fichas BDDAT: copiar tal cual a cada ficha ===== */\n:root{\n  --fondo:#fff; --tarjeta:#F7F6F2; --borde:#D3D1C7; --borde-fuerte:#888780;\n  --texto:#2C2C2A; --texto-2:#5F5E5A;\n  --ida:#185FA5;      /* petición: lo que va */\n  --vuelta:#3B6D11;   /* respuesta: lo que vuelve */\n  --plan:#854F0B;     /* reservado: lo marcado ⚠️ (plan, aún no construido) */\n}\n*{box-sizing:border-box;margin:0}\nhtml,body{height:100%;background:var(--fondo);overflow:hidden}\nbody{font-family:\"Segoe UI\",Roboto,Arial,sans-serif;color:var(--texto)}\n\n/* Lien borde);padding-top:22px}\n\n#ayuda{position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:14px;color:#B4B2A9;\n  transition:opacity .4s}\n@media (prefers-reduced-motion:reduce){.paso,.linea,.punta,#ayuda{transition:none}}\n\n/* ===== Propio de esta ficha ===== */\n.lienzo{position:absolute;left:80px;right:80px;top:30px;bottom:150px;display:flex;flex-direction:column;\n  justify-content:center;gap:34px}\n.fila1{display:grid;grid-template-columns:360px 1fr;column-gap:28px;align-items:stretch}\n.fila2{display:grid;grid-template-columns:1fr 120px 1fr;align-items:center}\n\n/* Etiqueta ámbar sobre el borde: lo que aún no está construido */\n.etiq{position:absolute;top:-14px;right:16px;background:#fff;border:1.5px solid var(--plan);\n  color:var(--plan);border-radius:8px;padding:0 9px;font-size:16px;font-weight:600;line-height:1.4}\n.etiq.hoy{border-color:var(--borde-fuerte);color:var(--texto-2)}\n\n/* El puesto: un PC con un navegador y nada más */\n.puesto{padding:18px 18px 20px;gap:8px;color:var(--texto)}\n.puesto .nombre{font-size:26px}\n.puesto .sub{font-size:18px}\n.vent{width:100%;margin-top:6px;border:2px solid var(--borde-fuerte);border-radius:10px;background:#fff;overflow:hidden}\n.vent .bar{height:22px;background:var(--tarjeta);border-bottom:2px solid var(--borde);display:flex;align-items:center;gap:5px;padding:0 9px}\n.vent .bar i{width:8px;height:8px;border:1.5px solid var(--borde-fuerte);border-radius:50%}\n.vent .cuerpo{height:56px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:22px;font-weight:600}\n\n/* Lo que cuesta instalar en cada PC */\n.costes{padding:18px 20px 20px;gap:14px;align-items:stretch;justify-content:center;text-align:left;color:var(--texto)}\n.costes .tit{font-size:26px;font-weight:600;line-height:1.1}\n.costes .fila{display:flex;gap:12px}\n.pieza{flex:1;display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--borde-fuerte);\n  border-radius:12px;padding:10px 12px;color:var(--
