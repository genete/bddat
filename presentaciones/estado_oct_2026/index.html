io'}, '*'); else tecla('ArrowLeft');\n    } else if (m.cmd === 'ultimo') {\n      tecla('End');\n    }\n  });\n\n  var NAV = {ArrowRight:1, ArrowLeft:1, ArrowUp:1, ArrowDown:1, ' ':1, PageDown:1, PageUp:1,\n             Enter:1, Backspace:1, Home:1, End:1, f:1, F:1};\n  document.addEventListener('keydown', function(e){\n    if (!e.isTrusted || !NAV[e.key]) return;\n    e.stopImmediatePropagation(); e.preventDefault();\n    parent.postMessage({tecla: e.key}, '*');\n  }, true);\n  document.addEventListener('click', function(e){\n    if (!e.isTrusted) return;\n    e.stopImmediatePropagation();\n    parent.postMessage({cmd: 'next'}, '*');\n  }, true);\n\n  window.addEventListener('load', function(){\n    setTimeout(function(){\n      window.dispatchEvent(new Event('resize'));\n      parent.postMessage({listo: true}, '*');\n    }, 60);\n  });\n})();\n<\/script>\n\n<div id=\"escenario\">\n  <div class=\"cab paso\" data-paso=\"1\">\n    <div class=\"proy\">BDDAT<\/div>\n    <h1>Repaso de lo presentado en mayo<\/h1>\n    <div class=\"sub\">y qué ha cambiado desde entonces<\/div>\n  <\/div>\n\n  <div class=\"etapas\">\n    <div class=\"etapa paso\" data-paso=\"2\">\n      <div class=\"num\">Primero<\/div>\n      <div class=\"nombre\">Repaso<\/div>\n      <div class=\"desc\">Las frases de mayo, tal como se dijeron. Las que siguen siendo ciertas se quedan como están.<\/div>\n    <\/div>\n    <div class=\"etapa cambia paso\" data-paso=\"3\">\n      <div class=\"num\">Después<\/div>\n      <div class=\"nombre\">Cambios<\/div>\n      <div class=\"desc\">Las que ya no son exactas se atenúan y aparece su corrección, con el mismo número.<\/div>\n      <div class=\"marca\"><span><span class=\"circ\">1<\/span> la frase de mayo<\/span><span><span class=\"circ lleno\">1<\/span> su corrección<\/span><\/div>\n    <\/div>\n    <div class=\"etapa cambia paso\" data-paso=\"4\">\n      <div class=\"num\">Además<\/div>\n      <div class=\"nombre\">Novedades<\/div>\n      <div class=\"desc\">Lo ze:14px;font-weight:600;display:flex;align-items:center;justify-content:center;\n  transition:background .4s,color .4s}\n.fila.atenuada{opacity:.38}\n.fila.atenuada .m{background:var(--cambio);color:#fff}\n\n/* Nota: lo que cambia (con el número de su frase) o lo nuevo (sin frase) */\n.nota{background:#fff;border:2px solid var(--cambio);border-radius:14px;padding:12px 16px;margin-bottom:12px;\n  font-size:19px;line-height:1.32}\n.nota .n{display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--cambio);color:#fff;\n  font-size:14px;font-weight:600;align-items:center;justify-content:center;margin-right:8px;vertical-align:1px}\n.nota .tag{display:inline-block;font-size:13px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;\n  color:var(--cambio);border:2px solid var(--cambio);border-radius:8px;padding:0 8px;margin-right:8px}\n.nota p+p{margin-top:8px}\n.nota .ap{color:var(--texto-2)}\n\n/* ===== Propio de esta ficha ===== */\n<\/style>\n<\/head>\n<body>\n<script>\n(function(){\n  var st = document.createElement('style');\n  st.textContent = '#ayuda{display:none!important}';\n  document.head.appendChild(st);\n\n  function conPaso(){ return [].slice.call(document.querySelectorAll('[data-paso]')); }\n  function maximo(){\n    return Math.max.apply(null, conPaso().map(function(e){ return +e.getAttribute('data-paso'); }));\n  }\n  function actual(){\n    var v = conPaso().filter(function(e){ return e.classList.contains('on'); })\n      .map(function(e){ return +e.getAttribute('data-paso'); });\n    return Math.max.apply(null, [1].concat(v));\n  }\n  function tecla(k){ document.dispatchEvent(new KeyboardEvent('keydown', {key: k, bubbles: true})); }\n\n  window.addEventListener('message', function(ev){\n    var m = ev.data || {};\n    if (m.cmd === 'next') {\n      if (actual() >= maximo()) parent.postMessage({fin: 'fin'}, '*'); else tecla('ArrowRight');\n    } else if (m.cmd === 'prev') {\n      if (actual() <= 1) parent.postMessage({fin: 'inicio'}, '*'); else tecla('ArrowLeft');\n    } else if (m.cmd === 'ultimo') {\n      tecla('End');\n    }\n  });\n\n  var NAV = {ArrowRight:1, ArrowLeft:1, ArrowUp:1, ArrowDown:1, ' ':1, PageDown:1, PageUp:1,\n             Enter:1, Backspace:1, Home:1, End:1, f:1, F:1};\n  document.addEventListener('keydown', function(e){\n    if (!e.isTrusted || !NAV[e.key]) return;\n    e.stopImmediatePropagation(); e.preventDefault();\n    parent.postMessage({tecla: e.key}, '*');\n  }, true);\n  document.addEventListener('click', function(e){\n    if (!e.isTrusted) return;\n    e.stopImmediatePropagation();\n    parent.postMessage({cmd: 'next'}, '*');\n  }, true);\n\n  window.addEventListener('load', function(){\n    setTimeout(function(){\n      window.dispatchEvent(new Event('resize'));\n      parent.postMessage({listo: true}, '*');\n    }, 60);\n  });\n})();\n<\/script>\n\n<div id=\"escenario\">\n  <div class=\"cab\"><h1>Principios de diseño<\/h1><\/div>\n\n  <div class=\"cols\">\n    <div class=\"paso\" data-paso=\"1\">\n      <div class=\"fila\"><span class=\"m\"><\/span><span><b>Abstracción del procedimiento<\/b> — Todo procedimiento administrativo es un conjunto de tareas que manejan documentos y fechas<\/span><\/div>\n      <div class=\"fila\"><span class=\"m\"><\/span><span><b>Minimalismo estructural<\/b> — La semántica vive en los tipos, no en la multiplicación de campos<\/span><\/div>\n      <div class=\"fila\"><span class=\"m\"><\/span><span><b>Una sola fuente de la verdad<\/b> — Cada dato existe en un único lugar; el resto apunta a él<\/span><\/div>\n      <div class=\"fila\"><span class=\"m\"><\/span><span><b>Separación datos / reglas<\/b> — Las tablas guardan hechos; las reglas viven separadas, no en código<\/span><\/div>\n      <div class=\"fila\"><span class=\"m\"><\/span><span><b>Motor configurable con escape<\/b> — Cambiar comportamiento es modificar registros, no reescribir código; ninguna regla crea un callejón sin salida<\/span><\/div>\n      <div class=\"fila\"><span class=\"m\"><\/span><span><b>Justificación normativa<\/b> — La cadena Ley → variables → reglas → tramitación garantiza trazabilidad y seguridad jurídica<\/span><\/div>\n      <div class=\"fila cambia\" data-corr=\"2\"><span class=\"m\">1<\/span><span><b>Despliegue progresivo<\/b> — De la libertad total a la restricción, pasando por el aviso; los usuarios aprenden el sistema antes de que el sistema los controle<\/span><\/div>\n      <div class=\"fila\"><span class=\"m\"><\/span><span><b>Validación no obstructiva<\/b> — Avisos visuales discretos; nunca interrumpir el flujo de trabajo<\/span><\/div>\n      <div class=\"fila\"><span class=\"m\"><\/span><span><b>Mínimo privilegio y trazabilidad<\/b> — Cada rol tiene solo los permisos que necesita; toda acción queda ligada a un usuario<\/span><\/div>\n    <\/div>\n\n    <div>\n      <div class=\"nota paso\" data-paso=\"2\">\n        <p><span class=\"n\">1<\/span>El motor de reglas pasa a ser <b>previo a producción<\/b>.<\/p>\n        <p>Se añade poder apagarlo en tres modos: <b>bloqueo<\/b>, <b>aviso<\/b>, <b>sin avisos<\/b>.<\/p>\n      <\/div>\n      <div class=\"nota paso\" data-paso=\"3\">\n        <p><span class=\"tag\">Nuevo<\/span><b>Invariantes<\/b><\/p>\n        <p>El motor de reglas cubre la normativa, que puede cambiar. La integridad estructural de BDDAT se cubre con un conjunto de invariantes, para lo que el motor no puede cubrir.<\/p>\n        <p>En general se pueden saltar con escape, pero algunos no: una evidencia irreversible (notificado al exterior) no tiene escape; se arregla con actos posteriores.<\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/div>\n\n<div id=\"ayuda\">← → o clic para avanzar<\/div>\n\n<script>\n(function(){\n  var MAX = 3, paso = 1;\n  var els = [].slice.call(document.querySelectorAll('[data-paso]'));\n  var filas = [].slice.call(document.querySelectorAll('[data-corr]'));\n  var esc = document.getElementById('escenario');\n  var ayuda = document.getElementById('ayuda');\n\n  function pintar(){\n    els.forEach(function(e){ e.classList.toggle('on', +e.getAttribute('data-paso') <= paso); });\n    filas.forEach(function(e){ e.classList.toggle('atenuada', +e.getAttribute('data-corr') <= paso); });\n  }\n  function ir(n){\n    paso = Math.max(1, Math.min(MAX, n));\n    pintar();\n    ayuda.style.opacity = 0;\n  }\n  function escalar(){\n    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);\n    esc.style.transform = 'translate(-50%,-50%) scale(' + s + ')';\n  }\n\n  document.addEventListener('keydown', function(ev){\n    var k = ev.key;\n    if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter') { ir(paso + 1); ev.preventDefault(); }\n    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { ir(paso - 1); ev.preventDefault(); }\n    else if (k === 'Home') ir(1);\n    else if (k === 'End') ir(MAX);\n  });\n  document.addEventListener('click', function(){ ir(paso + 1); });\n  window.addEventListener('resize', escalar);\n\n  escalar();\n  /* #todo muestra la ficha completa (útil para sacar una imagen); #paso=N empieza en el paso N */\n  var h = location.hash, m = h.match(/paso=(\\d+)/);\n  if (h === '#todo') { paso = MAX; ayuda.style.display = 'none'; }\n  else if (m) paso = Math.max(1, Math.min(MAX, +m[1]));\n  requestAnimationFrame(pintar);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"titulo": "Ficha 2 · Límites", "html": "<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Ficha 2 · Límites<\/title>\n<style>\n/* ===== Base común de las fichas BDDAT: copiar tal cual a cada ficha ===== */\n:root{\n  --fondo:#fff; --tarjeta:#F7F6F2; --borde:#D3D1C7; --borde-fuerte:#888780;\n  --texto:#2C2C2A; --texto-2:#5F5E5A;\n  --cambio:#0F6E56;   /* lo que ha cambiado o es nuevo desde mayo */\n}\n*{box-sizing:border-box;margin:0}\nhtml,body{height:100%;background:var(--fondo);overflow:hidden}\nbody{font-family:\"Segoe UI\",Roboto,Arial,sans-serif;color:var(--texto)}\n\n/* Lienzo fijo de 1280x720 que se escala para caber en cualquier ventana */\n#escenario{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center}\n\n/* Aparición por pasos: cada elemento lleva data-paso=\"N\" y se muestra al llegar a N */\n.paso{opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s ease}\n.paso.on{opacity:1;transform:none}\n\n#ayuda{position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:14px;color:#B4B2A9;\n  transition:opacity .4s}\n@media (prefers-reduced-motion:reduce){.paso,.fila,#ayuda{transition:none}}\n\n/* ===== Base de las fichas de repaso: izquierda lo dicho en mayo, derecha lo que cambia ===== */\n.cab{position:absolute;left:60px;right:60px;top:26px}\n.cab h1{font-size:40px;font-weight:600;line-height:1.1}\n.cols{position:absolute;left:60px;right:60px;top:92px;bottom:34px;display:grid;\n  grid-template-columns:1fr 430px;column-gap:40px}\n\n/* Frase de mayo. Las que cambian llevan un círculo numerado; al aparecer su nota se atenúan */\n.fila{display:flex;gap:12px;padding:6px 0;font-size:18px;line-height:1.3;transition:opacity .6s ease}\n.fila b{font-weight:600}\n.fila .m{flex:none;width:26px;height:26px;margin-top:-1px}\n.fila.cambia .m{border:2px solid var(--cambio);border-radius:50%;color:var(--cambio);\n  font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;\n  transition:background .4s,color .4s}\n.fila.atenuada{opacity:.38}\n.fila.atenuada .m{background:var(--cambio);color:#fff}\n\n/* Nota: lo que cambia (con el número de su frase) o lo nuevo (sin frase) */\n.nota{background:#fff;border:2px solid var(--cambio);border-radius:14px;padding:12px 16px;margin-bottom:12px;\n  font-size:19px;line-height:1.32}\n.nota .n{display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--cambio);color:#fff;\n  font-size:14px;font-weight:600;align-items:center;justify-content:center;margin-right:8px;vertical-align:1px}\n.nota .tag{display:inline-block;font-size:13px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;\n  color:var(--cambio);border:2px solid var(--cambio);border-radius:8px;padding:0 8px;margin-right:8px}\n.nota p+p{margin-top:8px}\n.nota .ap{color:var(--texto-2)}\n\n/* ===== Propio de esta ficha: pocas frases, letra mayor ===== */\n.fila{font-size:23px;padding:14px 0}\n.fila .m{margin-top:2px}\n.nota{font-size:20px}\n<\/style>\n<\/head>\n<body>\n<script>\n(function(){\n  var st = document.createElement('style');\n  st.textContent = '#ayuda{display:none!important}';\n  document.head.appendChild(st);\n\n  function conPaso(){ return [].slice.call(document.querySelectorAll('[data-paso]')); }\n  function maximo(){\n    return Math.max.apply(null, conPaso().map(function(e){ return +e.getAttribute('data-paso'); }));\n  }\n  function actual(){\n    var v = conPaso().filter(function(e){ return e.classList.contains('on'); })\n      .map(function(e){ return +e.getAttribute('data-paso'); });\n    return Math.max.apply(null, [1].concat(v));\n  }\n  function tecla(k){ document.dispatchEvent(new KeyboardEvent('keydown', {key: k, bubbles: true})); }\n\n  window.addEventListener('message', function(ev){\n    var m = ev.data || {};\n    if (m.cmd === 'next') {\n      if (actual() >= maximo()) parent.postMessage({fin: 'fin'}, '*'); else tecla('ArrowRight');\n    } else if (m.cmd === 'prev') {\n      if (actual() <= 1) parent.postMessage({fin: 'inicio'}, '*'); else tecla('ArrowLeft');\n    } else if (m.cmd === 'ultimo') {\n      tecla('End');\n    }\n  });\n\n  var NAV = {ArrowRight:1, ArrowLeft:1, ArrowUp:1, ArrowDown:1, ' ':1, PageDown:1, PageUp:1,\n             Enter:1, Backspace:1, Home:1, End:1, f:1, F:1};\n  document.addEventListener('keydown', function(e){\n    if (!e.isTrusted || !NAV[e.key]) return;\n    e.stopImmediatePropagation(); e.preventDefault();\n    parent.postMessage({tecla: e.key}, '*');\n  }, true);\n  document.addEventListener('click', function(e){\n    if (!e.isTrusted) return;\n    e.stopImmediatePropagation();\n    parent.postMessage({cmd: 'next'}, '*');\n  }, true);\n\n  window.addEventListener('load', function(){\n    setTimeout(function(){\n      window.dispatchEvent(new Event('resize'));\n      parent.postMessage({listo: true}, '*');\n    }, 60);\n  });\n})();\n<\/script>\n\n<div id=\"escenario\">\n  <div class=\"cab\"><h1>Límites<\/h1><\/div>\n\n  <div class=\"cols\">\n    <div class=\"paso\" data-paso=\"1\">\n      <div class=\"fila cambia\" data-corr=\"2\"><span class=\"m\">1<\/span><span><b>No integra el portafirmas<\/b> — los documentos generados se firman por los canales habituales<\/span><\/div>\n      <div class=\"fila cambia\" data-corr=\"2\"><span class=\"m\">1<\/span><span><b>No envía notificaciones con NOTIFICA ni conecta con el SEDEBOJA<\/b> — esas gestiones siguen haciéndose fuera<\/span><\/div>\n      <div class=\"fila cambia\" data-corr=\"3\"><span class=\"m\">2<\/span><span><b>Los archivos no se custodian en la base de datos.<\/b> Se siguen guardando en el servidor de archivos. Solo se guarda la localización, con el riesgo de rotura del enlace si se mueve o borra el archivo del servidor.<\/span><\/div>\n    <\/div>\n\n    <div>\n      <div class=\"nota paso\" data-paso=\"2\">\n        <p><span class=\"n\">1<\/span>No integra <b>Portafirmas<\/b> directamente pero está previsto integrar <b>BandeJA<\/b> y <b>Notifica-PNT<\/b> de forma indirecta mediante <b>Playwright<\/b>.<\/p>\n        <p class=\"ap\">SEDEBOJA no se ha estudiado, potencialmente posible.<\/p>\n      <\/div>\n      <div class=\"nota paso\" data-paso=\"3\">\n        <p><span class=\"n\">2<\/span>Está en implementación la <b>custodia de los archivos fuera de BDDAT<\/b>.<\/p>\n        <p>Inicialmente esa custodia externa la creamos nosotros, como una especie de librería, pero podría sustituirse por un gestor documental distinto (<b>Alfresco<\/b>).<\/p>\n        <p>Ya no habrá posibilidad de romper un vínculo en BDDAT borrando a mano un fichero enlazado.<\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/div>\n\n<div id=\"ayuda\">← → o clic para avanzar<\/div>\n\n<script>\n(function(){\n  var MAX = 3, paso = 1;\n  var els = [].slice.call(document.querySelectorAll('[data-paso]'));\n  var filas = [].slice.call(document.querySelectorAll('[data-corr]'));\n  var esc = document.getElementById('escenario');\n  var ayuda = document.getElementById('ayuda');\n\n  function pintar(){\n    els.forEach(function(e){ e.classList.toggle('on', +e.getAttribute('data-paso') <= paso); });\n    filas.forEach(function(e){ e.classList.toggle('atenuada', +e.getAttribute('data-corr') <= paso); });\n  }\n  function ir(n){\n    paso = Math.max(1, Math.min(MAX, n));\n    pintar();\n    ayuda.style.opacity = 0;\n  }\n  function escalar(){\n    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);\n    esc.style.transform = 'translate(-50%,-50%) scale(' + s + ')';\n  }\n\n  document.addEventListener('keydown', function(ev){\n    var k = ev.key;\n    if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter') { ir(paso + 1); ev.preventDefault(); }\n    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { ir(paso - 1); ev.preventDefault(); }\n    else if (k === 'Home') ir(1);\n    else if (k === 'End') ir(MAX);\n  });\n  document.addEventListener('click', function(){ ir(paso + 1); });\n  window.addEventListener('resize', escalar);\n\n  escalar();\n  /* #todo muestra la ficha completa (útil para sacar una imagen); #paso=N empieza en el paso N */\n  var h = location.hash, m = h.match(/paso=(\\d+)/);\n  if (h === '#todo') { paso = MAX; ayuda.style.display = 'none'; }\n  else if (m) paso = Math.max(1, Math.min(MAX, +m[1]));\n  requestAnimationFrame(pintar);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}];

(function(){
  var marco = document.getElementById('marco');
  var capa = document.getElementById('capa');
  var info = document.getElementById('info');
  var idx = 0, listo = false, alUltimo = false, aviso = null;

  function avisar(texto){
    info.textContent = texto;
    info.classList.add('ver');
    clearTimeout(aviso);
    aviso = setTimeout(function(){ info.classList.remove('ver'); }, 2600);
  }

  function mostrar(i, ultimo){
    idx = i; listo = false; alUltimo = !!ultimo;
    marco.srcdoc = FICHAS[i].html;
    document.title = FICHAS[i].titulo;
    try { history.replaceState(null, '', '#' + (i + 1)); } catch (e) {}
    avisar((i + 1) + ' / ' + FICHAS.length + '  ·  ' + FICHAS[i].titulo);
  }

  function enviar(cmd){ if (listo) marco.contentWindow.postMessage({cmd: cmd}, '*'); }
  function siguiente(){ enviar('next'); }
  function anterior(){ enviar('prev'); }

  function pantallaCompleta(){
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  }

  function tecla(k){
    if (k === 'ArrowRight' || k === 'ArrowDown' || k === ' ' || k === 'PageDown' || k === 'Enter') siguiente();
    else if (k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp' || k === 'Backspace') anterior();
    else if (k === 'Home') mostrar(0, false);
    else if (k === 'End') mostrar(FICHAS.length - 1, true);
    else if (k === 'f' || k === 'F') pantallaCompleta();
    else return false;
    return true;
  }

  window.addEventListener('message', function(ev){
    if (ev.source !== marco.contentWindow) return;
    var m = ev.data || {};
    if (m.listo) {
      listo = true;
      if (alUltimo) { alUltimo = false; enviar('ultimo'); }
    } else if (m.fin === 'fin') {
      if (idx < FICHAS.length - 1) mostrar(idx + 1, false); else avisar('fin de la presentación');
    } else if (m.fin === 'inicio') {
      if (idx > 0) mostrar(idx - 1, true);
    } else if (m.cmd === 'next') {
      siguiente();
    } else if (m.tecla) {
      tecla(m.tecla);
    }
  });

  document.addEventListener('keydown', function(e){
    if (e.ctrlKey || e.altKey || e.metaKey) return;
    if (tecla(e.key)) e.preventDefault();
  });
  capa.addEventListener('click', siguiente);

  /* #N empieza en la ficha N (empezando por 1) */
  var n = parseInt(location.hash.slice(1), 10);
  mostrar(n >= 1 && n <= FICHAS.length ? n - 1 : 0, false);
  window.__ficha = function(){ return idx; };
})();
</script>

</html>
