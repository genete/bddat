io'}, '*'); else tecla('ArrowLeft');\n    } else if (m.cmd === 'ultimo') {\n      tecla('End');\n    }\n  });\n\n  var NAV = {ArrowRight:1, ArrowLeft:1, ArrowUp:1, ArrowDown:1, ' ':1, PageDown:1, PageUp:1,\n             Enter:1, Backspace:1, Home:1, End:1, f:1, F:1};\n  document.addEventListener('keydown', function(e){\n    if (!e.isTrusted || !NAV[e.key]) return;\n    e.stopImmediatePropagation(); e.preventDefault();\n    parent.postMessage({tecla: e.key}, '*');\n  }, true);\n  document.addEventListener('click', function(e){\n    if (!e.isTrusted) return;\n    e.stopImmediatePropagation();\n    parent.postMessage({cmd: 'next'}, '*');\n  }, true);\n\n  window.addEventListener('load', function(){\n    setTimeout(function(){\n      window.dispatchEvent(new Event('resize'));\n      parent.postMessage({listo: true}, '*');\n    }, 60);\n  });\n})();\n<\/script>\n\n<div id=\"escenario\">\n  <div class=\"cab paso\" data-paso=\"1\">\n    <div class=\"proy\">BDDAT<\/div>\n    <h1>Repaso de lo presentado en mayo<\/h1>\n    <div class=\"sub\">y qué ha cambiado desde entonces<\/div>\n  <\/div>\n\n  <div class=\"etapas\">\n    <div class=\"etapa paso\" data-paso=\"2\">\n      <div class=\"num\">Primero<\/div>\n      <div class=\"nombre\">Repaso<\/div>\n      <div class=\"desc\">Las frases de mayo, tal como se dijeron. Las que siguen siendo ciertas se quedan como están.<\/div>\n    <\/div>\n    <div class=\"etapa cambia paso\" data-paso=\"3\">\n      <div class=\"num\">Después<\/div>\n      <div class=\"nombre\">Cambios<\/div>\n      <div class=\"desc\">Las que ya no son exactas se atenúan y aparece su corrección, con el mismo número.<\/div>\n      <div class=\"marca\"><span><span class=\"circ\">1<\/span> la frase de mayo<\/span><span><span class=\"circ lleno\">1<\/span> su corrección<\/span><\/div>\n    <\/div>\n    <div class=\"etapa cambia paso\" data-paso=\"4\">\n      <div class=\"num\">Además<\/div>\n      <div class=\"nombre\">Novedades<\/div>\n      <div class=\"desc\">Lo ze:14px;font-weight:600;display:flex;align-items:center;justify-content:center;\n  transition:background .4s,color .4s}\n.fila.atenuada{opacity:.38}\n.fila.atenuada .m{background:var(--cambio);color:#fff}\n\n/* Nota: lo que cambia (con el número de su frase) o lo nuevo (sin frase) */\n.nota{background:#fff;border:2px solid var(--cambio);border-radius:14px;padding:12px 16px;margin-bottom:12px;\n  font-size:19px;line-height:1.32}\n.nota .n{display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--cambio);color:#fff;\n  font-size:14px;font-weight:600;align-items:center;justify-content:center;margin-right:8px;vertical-align:1px}\n.nota .tag{display:inline-block;font-size:13px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;\n  color:var(--cambio);border:2px solid var(--cambio);border-radius:8px;padding:0 8px;margin-right:8px}\n.nota p+p{margin-top:8px}\n.nota .ap{color:var(--texto-2)}\n\n/* ===== Propio de esta ficha ===== */\n<\/style>\n<\/head>\n<body>\n<script>\n(function(){\n  var st = document.createElement('style');\n  st.textContent = '#ayuda{display:none!important}';\n  document.head.appendChild(st);\n\n  function conPaso(){ return [].slice.call(document.querySelectorAll('[data-paso]')); }\n  function maximo(){\n    return Math.max.apply(null, conPaso().map(function(e){ return +e.getAttribute('data-paso'); }));\n  }\n  function actual(){\n    var v = conPaso().filter(function(e){ return e.classList.contains('on'); })\n      .map(function(e){ return +e.getAttribute('data-paso'); });\n    return Math.max.apply(null, [1].concat(v));\n  }\n  function tecla(k){ document.dispatchEvent(new KeyboardEvent('keydown', {key: k, bubbles: true})); }\n\n  window.addEventListener('message', function(ev){\n    var m = ev.data || {};\n    if (m.cmd === 'next') {\n      if (actual() >= maximo()) parent.postMessage({fin: 'fin'}, '*'); else tecla('ArrowRight');\n    } else if (m.cmd === 'prev') {\n      if (actual() <= 1) parent.postMessage({fin: 'inicio'}, '*'); else tecla('ArrowLeft');\n    } else if (m.cmd === 'ultimo') {\n      tecla('End');\n    }\n  });\n\n  var NAV = {ArrowRight:1, ArrowLeft:1, ArrowUp:1, ArrowDown:1, ' ':1, PageDown:1, PageUp:1,\n             Enter:1, Backspace:1, Home:1, End:1, f:1, F:1};\n  document.addEventListener('keydown', function(e){\n    if (!e.isTrusted || !NAV[e.key]) return;\n    e.stopImmediatePropagation(); e.preventDefault();\n    parent.postMessage({tecla: e.key}, '*');\n  }, true);\n  document.addEventListener('click', function(e){\n    if (!e.isTrusted) return;\n    e.stopImmediatePropagation();\n    parent.postMessage({cmd: 'next'}, '*');\n  }, true);\n\n  window.addEventListener('load', function(){\n    setTimeout(function(){\n      window.dispatchEvent(new Event('resize'));\n      parent.postMessage({listo: true}, '*');\n    }, 60);\n  });\n})();\n<\/script>\n\n<div id=\"escenario\">\n  <div class=\"cab\"><h1>Principios de diseño<\/h1><\/div>\n\n  <div class=\"cols\">\n    <div class=\"paso\" data-paso=\"1\">\n      <div class=\"fila\"><span class=\"m\"><\/span><span><b>Abstracción del procedimiento<\/b> — Todo procedimiento administrativo es un conjunto de tareas que manejan documentos y fechas<\/span><\/div>\n      <div class=\"fila\"><span class=\"m\"><\/span><span><b>Minimalismo estructural<\/b> — La semántica vive en los tipos, no en la multiplicación de campos<\/span><\/div>\n      <div class=\"fila\"><span class=\"m\"><\/span><span><b>Una sola fuente de la verdad<\/b> — Cada dato existe en un único lugar; el resto apunta a él<\/span><\/div>\n      <div class=\"fila\"><span class=\"m\"><\/span><span><b>Separación datos / reglas<\/b> — Las tablas guardan hechos; las reglas viven separadas, no en código<\/span><\/div>\n      <div class=\"fila\"><span class=\"m\"><\/span><span><b>Motor configurable con escape<\/b> — Cambiar comportamiento es modificar registros, no reescribir código; ninguna regla crea un callejón sin salida<\/span><\/div>\n      <div class=\"fila\"><span class=\"m\"><\/span><span><b>Justificación normativa<\/b> — La cadena Ley → variables → reglas → tramitación garantiza trazabilidad y seguridad jurídica<\/span><\/div>\n      <div class=\"fila cambia\" data-corr=\"2\"><span class=\"m\">1<\/span><span><b>Despliegue progresivo<\/b> — De la libertad total a la restricción, pasando por el aviso; los usuarios aprenden el sistema antes de que el sistema los controle<\/span><\/div>\n      <div class=\"fila\"><span class=\"m\"><\/span><span><b>Validación no obstructiva<\/b> — Avisos visuales discretos; nunca interrumpir el flujo de trabajo<\/span><\/div>\n      <div class=\"fila\"><span class=\"m\"><\/span><span><b>Mínimo privilegio y trazabilidad<\/b> — Cada rol tiene solo los permisos que necesita; toda acción queda ligada a un usuario<\/span><\/div>\n    <\/div>\n\n    <div>\n      <div class=\"nota paso\" data-paso=\"2\">\n        <p><span class=\"n\">1<\/span>El motor de reglas pasa a ser <b>previo a producción<\/b>.<\/p>\n        <p>Se añade poder cambiar su modo: <b>Bloquear<\/b>, <b>Solo advertir<\/b> o <b>Inactivo<\/b>.<\/p>\n      <\/div>\n      <div class=\"nota paso\" data-paso=\"3\">\n        <p><span class=\"tag\">Nuevo<\/span><b>Invariantes<\/b><\/p>\n        <p>El motor de reglas cubre la normativa, que puede cambiar. La integridad estructural de BDDAT se cubre con un conjunto de invariantes, para lo que el motor no puede cubrir.<\/p>\n        <p>En general se pueden saltar con escape, pero algunos no: una evidencia irreversible (notificado al exterior) no tiene escape; se arregla con actos posteriores.<\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/div>\n\n<div id=\"ayuda\">← → o clic para avanzar<\/div>\n\n<script>\n(function(){\n  var MAX = 3, paso = 1;\n  var els = [].slice.call(document.querySelectorAll('[data-paso]'));\n  var filas = [].slice.call(document.querySelectorAll('[data-corr]'));\n  var esc = document.getElementById('escenario');\n  var ayuda = document.getElementById('ayuda');\n\ ios ya no acceden a los ficheros directamente: solo BDDAT y el grupo con acceso al almacén. Así, el riesgo de romper un vínculo borrando a mano un fichero queda limitado a ese grupo.<\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/div>\n\n<div id=\"ayuda\">← → o clic para avanzar<\/div>\n\n<script>\n(function(){\n  var MAX = 3, paso = 1;\n  var els = [].slice.call(document.querySelectorAll('[data-paso]'));\n  var filas = [].slice.call(document.querySelectorAll('[data-corr]'));\n  var esc = document.getElementById('escenario');\n  var ayuda = document.getElementById('ayuda');\n\n  function pintar(){\n    els.forEach(function(e){ e.classList.toggle('on', +e.getAttribute('data-paso') <= paso); });\n    filas.forEach(function(e){ e.classList.toggle('atenuada', +e.getAttribute('data-corr') <= paso); });\n  }\n  function ir(n){\n    paso = Math.max(1, Math.min(MAX, n));\n    pintar();\n    ayuda.style.opacity = 0;\n  }\n  function escalar(){\n    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);\n    esc.style.transform = 'translate(-50%,-50%) scale(' + s + ')';\n  }\n\n  document.addEventListener('keydown', function(ev){\n    var k = ev.key;\n    if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter') { ir(paso + 1); ev.preventDefault(); }\n    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { ir(paso - 1); ev.preventDefault(); }\n    else if (k === 'Home') ir(1);\n    else if (k === 'End') ir(MAX);\n  });\n  document.addEventListener('click', function(){ ir(paso + 1); });\n  window.addEventListener('resize', escalar);\n\n  escalar();\n  /* #todo muestra la ficha completa (útil para sacar una imagen); #paso=N empieza en el paso N */\n  var h = location.hash, m = h.match(/paso=(\\d+)/);\n  if (h === '#todo') { paso = MAX; ayuda.style.display = 'none'; }\n  else if (m) paso = Math.max(1, Math.min(MAX, +m[1]));\n  requestAnimationFrame(pintar);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"titulo": "Ficha 3 · Roles", a interfaz se organiza en zonas<\/span><\/div>\n\n  <div class=\"marco\">\n    <div class=\"z z-cab paso\" data-paso=\"1\" data-actual=\"1\">\n      <div class=\"nm\"><span class=\"nz\">1<\/span>Cabecera<\/div>\n      <span class=\"chip\">Buscador global<\/span><span class=\"chip\">Modo del motor<\/span><span class=\"chip\">Alertas y mensajes<\/span><span class=\"chip\">Perfil y salida<\/span>\n    <\/div>\n    <div class=\"z z-lat paso\" data-paso=\"2\" data-actual=\"2\">\n      <div class=\"nm\"><span class=\"nz\">2<\/span><\/div>\n      Menú lateral\n    <\/div>\n    <div class=\"z z-cue paso\" data-paso=\"3\" data-actual=\"3\">\n      <div class=\"nm\"><span class=\"nz\">3<\/span>Cuerpo<\/div>\n      <span class=\"chip\">Listados<\/span><span class=\"chip\">Formularios<\/span><span class=\"chip\">Islas React<\/span>\n    <\/div>\n    <div class=\"z z-ins paso\" data-paso=\"4\" data-actual=\"4\">\n      <div class=\"nm\"><span class=\"nz\">4<\/span>Inspector<\/div>\n      Detalle y acciones del elemento seleccionado\n    <\/div>\n    <div class=\"z z-pan paso\" data-paso=\"5\" data-actual=\"5\">\n      <div class=\"nm\"><span class=\"nz\">5<\/span>Panel inferior<\/div>\n      Bitácora y avisos (colapsable)\n    <\/div>\n    <div class=\"z z-pie paso\" data-paso=\"6\" data-actual=\"6\">\n      <div class=\"nm\"><span class=\"nz\">6<\/span>Pie de página<\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"desc\">\n    <div class=\"zi paso\" data-paso=\"1\"><div class=\"t\"><span class=\"nz\">1<\/span>Cabecera<\/div>Buscador global, modo del motor, alertas y mensajes, y menú de perfil y salida.<\/div>\n    <div class=\"zi paso\" data-paso=\"2\"><div class=\"t\"><span class=\"nz\">2<\/span>Menú lateral izquierdo<\/div>Accesos directos a las principales áreas de trabajo.<\/div>\n    <div class=\"zi paso\" data-paso=\"3\"><div class=\"t\"><span class=\"nz\">3<\/span>Cuerpo<\/div>Zona central de contenido principal: listados, formularios e islas React (el árbol del expediente, de momento).<\/div>\n    <div class=\"zi paso\" data-paso=\"4\"><div class=\"t\"><span class=\"nz\">4<\/span>Inspector<\/div>Deslizable desde la derecha. Aparece cuando se selecciona algo en los listados o en el árbol. Al principio da la información de detalle, pero permite editar el elemento o más acciones según el caso.<\/div>\n    <div class=\"zi paso\" data-paso=\"5\"><div class=\"t\"><span class=\"nz\">5<\/span>Panel inferior<\/div>Para la vista de bitácora y avisos. Colapsable.<\/div>\n    <div class=\"zi paso\" data-paso=\"6\"><div class=\"t\"><span class=\"nz\">6<\/span>Pie de página<\/div>Hoy solo lleva el «Acerca de», pero puede tener un papel en el futuro.<\/div>\n  <\/div>\n<\/div>\n\n<div id=\"ayuda\">← → o clic para avanzar<\/div>\n\n<script>\n(function(){\n  var MAX = 6, paso = 1;\n  var els = [].slice.call(document.querySelectorAll('[data-paso]'));\n  var zonas = [].slice.call(document.querySelectorAll('[data-actual]'));\n  var esc = document.getElementById('escenario');\n  var ayuda = document.getElementById('ayuda');\n\n  function pintar(){\n    els.forEach(function(e){ e.classList.toggle('on', +e.getAttribute('data-paso') <= paso); });\n    zonas.forEach(function(e){ e.classList.toggle('actual', +e.getAttribute('data-actual') === paso); });\n  }\n  function ir(n){\n    paso = Math.max(1, Math.min(MAX, n));\n    pintar();\n    ayuda.style.opacity = 0;\n  }\n  function escalar(){\n    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);\n    esc.style.transform = 'translate(-50%,-50%) scale(' + s + ')';\n  }\n\n  document.addEventListener('keydown', function(ev){\n    var k = ev.key;\n    if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter') { ir(paso + 1); ev.preventDefault(); }\n    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { ir(paso - 1); ev.preventDefault(); }\n    else if (k === 'Home') ir(1);\n    else if (k === 'End') ir(MAX);\n  });\n  document.addEventListener('click', function(){ ir(paso + 1); });\n  window.addEventListener('resize', escalar);\n\n  escalar();\n  /* #todo muestra la ficha completa (útil para sacar una imagen); #paso=N empieza en el paso N */\n  var h = location.hash, m = h.match(/paso=(\\d+)/);\n  if (h === '#todo') { paso = MAX; ayuda.style.display = 'none'; }\n  else if (m) paso = Math.max(1, Math.min(MAX, +m[1]));\n  requestAnimationFrame(pintar);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"titulo": "Ficha 5 · Expediente y procedimiento", "html": "<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Ficha 5 · Expediente y procedimiento<\/title>\n<style>\n/* ===== Base común de las fichas BDDAT: copiar tal cual a cada ficha ===== */\n:root{\n  --fondo:#fff; --tarjeta:#F7F6F2; --borde:#D3D1C7; --borde-fuerte:#888780;\n  --texto:#2C2C2A; --texto-2:#5F5E5A;\n  --cambio:#0F6E56;   /* lo que ha cambiado o es nuevo desde mayo */\n}\n*{box-sizing:border-box;margin:0}\nhtml,body{height:100%;background:var(--fondo);overflow:hidden}\nbody{font-family:\"Segoe UI\",Roboto,Arial,sans-serif;color:var(--texto)}\n\n/* Lienzo fijo de 1280x720 que se escala para caber en cualquier ventana */\n#escenario{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center}\n\n/* Aparición por pasos: cada elemento lleva data-paso=\"N\" y se muestra al llegar a N */\n.paso{opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s ease}\n.paso.on{opacity:1;transform:none}\n\n#ayuda{position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:14px;color:#B4B2A9;\n  transition:opacity .4s}\n@media (prefers-reduced-motion:reduce){.paso,.fila,#ayuda{transition:none}}\n\n/* ===== Base de las fichas de repaso: izquierda lo dicho en mayo, derecha lo que cambia ===== */\n.cab{position:absolute;left:60px;right:60px;top:26px}\n.cab h1{font-size:40px;font-weight:600;line-height:1.1}\n.cols{position:absolute;left:60px;right:60px;top:92px;bottom:34px;display:grid;\n  grid-template-columns:1fr 430px;column-gap:40px}\n\n/* Frase de mayo. Las que cambian llevan un círculo numerado; al aparecer su nota se atenúan */\n.fila{display:flex;gap:12px;padding:6px 0;font-size:18px;line-height:1.3;transition:opacity .6s ease}\n.fila b{font-weight:600}\n.fila .m{flex:none;width:26px;height:26px;margin-top:-1px}\n.fila.cambia .m{border:2px solid var(--cambio);border-radius:50%;color:var(--cambio);\n  font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;\n  transition:background .4s,color .4s}\n.fila.atenuada{opacity:.38}\n.fila.atenuada .m{background:var(--cambio);color:#fff}\n\n/* Nota: lo que cambia (con el número de su frase) o lo nuevo (sin frase) */\n.nota{background:#fff;border:2px solid var(--cambio);border-radius:14px;padding:12px 16px;margin-bottom:12px;\n  font-size:19px;line-height:1.32}\n.nota .n{display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--cambio);color:#fff;\n  font-size:14px;font-weight:600;align-items:center;justify-content:center;margin-right:8px;vertical-align:1px}\n.nota .tag{display:inline-block;font-size:13px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;\n  color:var(--cambio);border:2px solid var(--cambio);border-radius:8px;padding:0 8px;margin-right:8px}\n.nota p+p{margin-top:8px}\n.nota .ap{color:var(--texto-2)}\n\n/* ===== Propio de esta ficha: notas más anchas y letra algo menor ===== */\n.cols{grid-template-columns:1fr 500px}\n.fila{font-size:20px;padding:9px 0}\n.fila .m{margin-top:1px}\n.fila.sub{padding-left:38px;padding-top:0}\n.nota{font-size:18px;padding:11px 16px;margin-bottom:10px}\n<\/style>\n<\/head>\n<body>\n<script>\n(function(){\n  var st = document.createElement('style');\n  st.textContent = '#ayuda{display:none!important}';\n  document.head.appendChild(st);\n\n  function conPaso(){ return [].slice.call(document.querySelectorAll('[data-paso]')); }\n  function maximo(){\n    return Math.max.apply(null, conPaso().map(function(e){ return +e.getAttribute('data-paso'); }));\n  }\n  function actual(){\n    var v = conPaso().filter(function(e){ return e.classList.contains('on'); })\n      .map(function(e){ return +e.getAttribute('data-paso'); });\n    return Math.max.apply(null, [1].concat(v));\n  }\n  function tecla(k){ document.dispatchEvent(new KeyboardEvent('keydown', {key: k, bubbles: true})); }\n\n  window.addEventListener('message', function(ev){\n    var m = ev.data || {};\n    if (m.cmd === 'next') {\n      if (actual() >= maximo()) parent.postMessage({fin: 'fin'}, '*'); else tecla('ArrowRight');\n    } else if (m.cmd === 'prev') {\n      if (actual() <= 1) parent.postMessage({fin: 'inicio'}, '*'); else tecla('ArrowLeft');\n    } else if (m.cmd === 'ultimo') {\n      tecla('End');\n    }\n  });\n\n  var NAV = {ArrowRight:1, ArrowLeft:1, ArrowUp:1, ArrowDown:1, ' ':1, PageDown:1, PageUp:1,\n             Enter:1, Backspace:1, Home:1, End:1, f:1, F:1};\n  document.addEventListener('keydown', function(e){\n    if (!e.isTrusted || !NAV[e.key]) return;\n    e.stopImmediatePropagation(); e.preventDefault();\n    parent.postMessage({tecla: e.key}, '*');\n  }, true);\n  document.addEventListener('click', function(e){\n    if (!e.isTrusted) return;\n    e.stopImmediatePropagation();\n    parent.postMessage({cmd: 'next'}, '*');\n  }, true);\n\n  window.addEventListener('load', function(){\n    setTimeout(function(){\n      window.dispatchEvent(new Event('resize'));\n      parent.postMessage({listo: true}, '*');\n    }, 60);\n  });\n})();\n<\/script>\n\n<div id=\"escenario\">\n  <div class=\"cab\"><h1>Expediente y procedimiento<\/h1><\/div>\n\n  <div class=\"cols\">\n    <div class=\"paso\" data-paso=\"1\">\n      <div class=\"fila\"><span class=\"m\"><\/span><span><b>Un expediente es siempre un proyecto.<\/b> La estructura refleja el procedimiento legal real: la semántica del procedimiento vive en los tipos, no en los campos.<\/span><\/div>\n      <div class=\"fila\"><span class=\"m\"><\/span><span><b>Estructura en capas:<\/b><\/span><\/div>\n      <div class=\"fila sub cambia\" data-corr=\"2\"><span class=\"m\">1<\/span><span><b>Expediente → Solicitud → Fase → Trámite → Tarea.<\/b><\/span><\/div>\n      <div class=\"fila cambia\" data-corr=\"3\"><span class=\"m\">2<\/span><span><b>El sistema muestra en todo momento<\/b> en qué punto está cada solicitud y qué acción toca a continuación<\/span><\/div>\n      <div class=\"fila\"><span class=\"m\"><\/span><span><b>Varias fases del mismo expediente pueden avanzar en paralelo<\/b> — siempre que sean compatibles<\/span><\/div>\n      <div class=\"fila\"><span class=\"m\"><\/span><span><b>Si la situación lo requiere, el tramitador puede salirse del flujo estándar justificadamente<\/b> — quedará registro en el cuaderno de bitácora<\/span><\/div>\n    <\/div>\n\n    <div>\n      <div class=\"nota paso\" data-paso=\"2\">\n        <p><span class=\"n\">1<\/span>Las <b>tareas pasan de 7 a 4<\/b>: ANALIZAR, ELABORAR, NOTIFICAR y ESPERAR PLAZO.<\/p>\n      <\/div>\n      <div class=\"nota paso\" data-paso=\"3\">\n        <p><span class=\"n\">2<\/span>La acción que toca a continuación se muestra mediante <b>petición (certificados)<\/b>.<\/p>\n        <p>El usuario puede moverse por el expediente como quiera, siempre que los <b>invariantes<\/b> o las <b>reglas<\/b> no lo impidan.<\/p>\n        <p>Tablas de tareas y documentos por trámite, <b>configurables<\/b>. La de trámites por fase existe, pero <b>aún no se puede editar<\/b>.<\/p>\n      <\/div>\n      <div class=\"nota paso\" data-paso=\"4\">\n        <p><span class=\"tag\">Nuevo<\/span><b>El expediente es el conjunto de documentos vinculados.<\/b><\/p>\n        <p>Los documentos no vinculados no forman parte del expediente. Aun así, un documento podría estar vinculado por operatividad y marcado como que no forma parte del expediente.<\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/div>\n\n<div id=\"ayuda\">← → o clic para avanzar<\/div>\n\n<script>\n(function(){\n  var MAX = 4, paso = 1;\n  var els = [].slice.call(document.querySelectorAll('[data-paso]'));\n  var filas = [].slice.call(document.querySelectorAll('[data-corr]'));\n  var esc = document.getElementById('escenario');\n  var ayuda = document.getElementById('ayuda');\n\n  function pintar(){\n    els.forEach(function(e){ e.classList.toggle('on', +e.getAttribute('data-paso') <= paso); });\n    filas.forEach(function(e){ e.classList.toggle('atenuada', +e.getAttribute('data-corr') <= paso); });\n  }\n  function ir(n){\n    paso = Math.max(1, Math.min(MAX, n));\n    pintar();\n    ayuda.style.opacity = 0;\n  }\n  function escalar(){\n    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);\n    esc.style.transform = 'translate(-50%,-50%) scale(' + s + ')';\n  }\n\n  document.addEventListener('keydown', function(ev){\n    var k = ev.key;\n    if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter') { ir(paso + 1); ev.preventDefault(); }\n    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { ir(paso - 1); ev.preventDefault(); }\n    else if (k === 'Home') ir(1);\n    else if (k === 'End') ir(MAX);\n  });\n  document.addEventListener('click', function(){ ir(paso + 1); });\n  window.addEventListener('resize', escalar);\n\n  escalar();\n  /* #todo muestra la ficha completa (útil para sacar una imagen); #paso=N empieza en el paso N */\n  var h = location.hash, m = h.match(/paso=(\\d+)/);\n  if (h === '#todo') { paso = MAX; ayuda.style.display = 'none'; }\n  else if (m) paso = Math.max(1, Math.min(MAX, +m[1]));\n  requestAnimationFrame(pintar);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"titulo": "Ficha 5b · Las tareas: de 7 a 4", "html": "<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Ficha 5b · Las tareas: de 7 a 4<\/title>\n<style>\n/* ===== Base común de las fichas BDDAT: copiar tal cual a cada ficha ===== */\n:root{\n  --fondo:#fff; --tarjeta:#F7F6F2; --borde:#D3D1C7; --borde-fuerte:#888780;\n  --texto:#2C2C2A; --texto-2:#5F5E5A;\n  --cambio:#0F6E56;   /* lo que ha cambiado o es nuevo desde mayo */\n}\n*{box-sizing:border-box;margin:0}\nhtml,body{height:100%;background:var(--fondo);overflow:hidden}\nbody{font-family:\"Segoe UI\",Roboto,Arial,sans-serif;color:var(--texto)}\n\n/* Lienzo fijo de 1280x720 que se escala para caber en cualquier ventana */\n#escenario{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center}\n\n/* Aparición por pasos: cada elemento lleva data-paso=\"N\" y se muestra al llegar a N */\n.paso{opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s ease}\n.paso.on{opacity:1;transform:none}\n\n#ayuda{position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:14px;color:#B4B2A9;\n  transition:opacity .4s}\n@media (prefers-reduced-motion:reduce){.paso,#ayuda{transition:none}}\n\n/* ===== Propio de esta ficha: de las 7 tareas de mayo a las 4 de ahora ===== */\n.cab{position:absolute;left:60px;right:60px;top:26px}\n.cab h1{font-size:40px;font-weight:600;line-height:1.1}\n\n/* Tablero: las posiciones van fijas (filas de 58 px) para alinear cada tarea con su destino */\n.tabla{position:absolute;left:60px;top:96px;width:1160px;height:600px}\n.col-t{position:absolute;top:0;font-size:15px;letter-spacing:.07em;text-transform:uppercase;color:var(--texto-2)}\n.col-t.nuevo{color:var(--cambio)}\n.chip{position:absolute;display:flex;align-items:center;padding:0 16px;border-radius:12px;font-size:21px;font-weight:600;\n  background:var(--tarjeta);border:2px solid var(--borde)}\n.antes{left:0;width:270px;height:46px}\n.ahora{left:370px;width:300px;border-color:var(--cambio);background:#fff;color:var(--cambio)}\n.ahora.igual{border-color:var(--borde-fuerte);color:var(--texto)}\n.ahora.fuera{border-style:dashed;border-color:var(--borde-fuerte);background:transparent;color:var(--texto-2);font-weight:400;font-size:19px}\n\n/* Flechas y llaves que unen cada tarea de mayo con su destino */\n.fl{position:absolute;height:3px;background:var(--cambio);border-radius:2px}\n.fl::after{content:\"\";position:absolute;right:-2px;top:-7px;border-left:14px solid var(--cambio);\n  border-top:8px solid transparent;border-bottom:8px solid transparent}\n.fl.igual{background:var(--borde-fuerte)}\n.fl.igual::after{border-left-color:var(--borde-fuerte)}\n.llave{position:absolute;left:280px;width:24px;border:3px solid var(--cambio);border-left:none;border-radius:0 12px 12px 0}\n\n/* Explicación a la derecha de cada cambio */\n.exp{position:absolute;left:710px;width:450px;display:flex;align-items:center;font-size:19px;line-height:1.3;color:var(--texto)}\n.exp b{font-weight:600}\n\n/* Vinculaciones al pie */\n.vinc{position:absolute;left:0;top:478px;width:1160px;height:96px;border:2px solid var(--cambio);border-radius:16px;background:#fff;\n  display:flex;align-items:center;gap:22px;padding:0 24px}\n.vinc .t{font-size:21px;font-weight:600;flex:none;width:300px;line-height:1.2}\n.vinc .chip{position:static;height:48px;border-color:var(--cambio);background:#fff;color:var(--cambio)}\n<\/style>\n<\/head>\n<body>\n<script>\n(function(){\n  var st = document.createElement('style');\n  st.textContent = '#ayuda{display:none!important}';\n  document.head.appendChild(st);\n\n  function conPaso(){ return [].slice.call(document.querySelectorAll('[data-paso]')); }\n  function maximo(){\n    return Math.max.apply(null, conPaso().map(function(e){ return +e.getAttribute('data-paso'); }));\n  }\n  function actual(){\n    var v = conPaso().filter(function(e){ return e.classList.contains('on'); })\n      .map(function(e){ return +e.getAttribute('data-paso'); });\n    return Math.max.apply(null, [1].concat(v));\n  }\n  function tecla(k){ document.dispatchEvent(new KeyboardEvent('keydown', {key: k, bubbles: true})); }\n\n  window.addEventListener('message', function(ev){\n    var m = ev.data || {};\n    if (m.cmd === 'next') {\n      if (actual() >= maximo()) parent.postMessage({fin: 'fin'}, '*'); else tecla('ArrowRight');\n    } else if (m.cmd === 'prev') {\n      if (actual() <= 1) parent.postMessage({fin: 'inicio'}, '*'); else tecla('ArrowLeft');\n    } else if (m.cmd === 'ultimo') {\n      tecla('End');\n    }\n  });\n\n  var NAV = {ArrowRight:1, ArrowLeft:1, ArrowUp:1, ArrowDown:1, ' ':1, PageDown:1, PageUp:1,\n             Enter:1, Backspace:1, Home:1, End:1, f:1, F:1};\n  document.addEventListener('keydown', function(e){\n    if (!e.isTrusted || !NAV[e.key]) return;\n    e.stopImmediatePropagation(); e.preventDefault();\n    parent.postMessage({tecla: e.key}, '*');\n  }, true);\n  document.addEventListener('click', function(e){\n    if (!e.isTrusted) return;\n    e.stopImmediatePropagation();\n    parent.postMessage({cmd: 'next'}, '*');\n  }, true);\n\n  window.addEventListener('load', function(){\n    setTimeout(function(){\n      window.dispatchEvent(new Event('resize'));\n      parent.postMessage({listo: true}, '*');\n    }, 60);\n  });\n})();\n<\/script>\n\n<div id=\"escenario\">\n  <div class=\"cab\"><h1>Las tareas: de 7 a 4<\/h1><\/div>\n\n  <div class=\"tabla\">\n    <div class=\"col-t paso\" data-paso=\"1\" style=\"left:0;top:8px\">Mayo · 7 tareas<\/div>\n    <div class=\"col-t nuevo paso\" data-paso=\"2\" style=\"left:370px;top:8px\">Ahora · 4 tareas<\/div>\n\n    <!-- Mayo: las siete tareas (filas de 58 px desde y=40) -->\n    <div class=\"chip antes paso\" data-paso=\"1\" style=\"top:40px\">ANALIZAR<\/div>\n    <div class=\"chip antes paso\" data-paso=\"1\" style=\"top:98px\">REDACTAR<\/div>\n    <div class=\"chip antes paso\" data-paso=\"1\" style=\"top:156px\">FIRMAR<\/div>\n    <div class=\"chip antes paso\" data-paso=\"1\" style=\"top:214px\">NOTIFICAR<\/div>\n    <div class=\"chip antes paso\" data-paso=\"1\" style=\"top:272px\">PUBLICAR<\/div>\n    <div class=\"chip antes paso\" data-paso=\"1\" style=\"top:330px\">ESPERAR PLAZO<\/div>\n    <div class=\"chip antes paso\" data-paso=\"1\" style=\"top:388px\">INCORPORAR<\/div>\n\n    <!-- Paso 2: las que se quedan igual -->\n    <div class=\"fl igual paso\" data-paso=\"2\" style=\"left:282px;top:62px;width:84px\"><\/div>\n    <div class=\"chip ahora igual paso\" data-paso=\"2\" style=\"top:40px;height:46px\">ANALIZAR<\/div>\n    <div class=\"fl igual paso\" data-paso=\"2\" style=\"left:282px;top:352px;width:84px\"><\/div>\n    <div class=\"chip ahora igual paso\" data-paso=\"2\" style=\"top:330px;height:46px\">ESPERAR PLAZO<\/div>\n\n    <!-- Paso 3: REDACTAR y FIRMAR se funden en ELABORAR -->\n    <div class=\"llave paso\" data-paso=\"3\" style=\"top:121px;height:58px\"><\/div>\n    <div class=\"fl paso\" data-paso=\"3\" style=\"left:304px;top:149px;width:62px\"><\/div>\n    <div class=\"chip ahora paso\" data-paso=\"3\" style=\"top:98px;height:104px\">ELABORAR<\/div>\n    <div class=\"exp paso\" data-paso=\"3\" style=\"top:98px;height:104px\"><span><b>REDACTAR<\/b> y <b>FIRMAR<\/b> se funden en <b>ELABORAR<\/b>.<\/span><\/div>\n\n    <!-- Paso 4: PUBLICAR se absorbe en NOTIFICAR -->\n    <div class=\"llave paso\" data-paso=\"4\" style=\"top:237px;height:58px\"><\/div>\n    <div class=\"fl paso\" data-paso=\"4\" style=\"left:304px;top:265px;width:62px\"><\/div>\n    <div class=\"chip ahora paso\" data-paso=\"4\" style=\"top:214px;height:104px\">NOTIFICAR<\/div>\n    <div class=\"exp paso\" data-paso=\"4\" style=\"top:214px;height:104px\"><span><b>PUBLICAR<\/b> desaparece: era una especialización de <b>NOTIFICAR<\/b>.<\/span><\/div>\n\n    <!-- Paso 5: INCORPORAR desaparece -->\n    <div class=\"fl igual paso\" data-paso=\"5\" style=\"left:282px;top:410px;width:84px\"><\/div>\n    <div class=\"chip ahora fuera paso\" data-paso=\"5\" style=\"top:388px;height:46px\">desaparece<\/div>\n    <div class=\"exp paso\" data-paso=\"5\" style=\"top:380px;height:62px\"><span><b>INCORPORAR<\/b> desaparece: como acto, es el que se realiza al vincular un documento a una tarea.<\/span><\/div>\n\n    <!-- Paso 6: las vinculaciones de documento -->\n    <div class=\"vinc paso\" data-paso=\"6\">\n      <div class=\"t\">Las vinculaciones de documento son<\/div>\n      <div class=\"chip\">CONSUMIDO (N)<\/div>\n      <div class=\"chip\">PRODUCIDO (1)<\/div>\n    <\/div>\n  <\/div>\n<\/div>\n\n<div id=\"ayuda\">← → o clic para avanzar<\/div>\n\n<script>\n(function(){\n  var MAX = 6, paso = 1;\n  var els = [].slice.call(document.querySelectorAll('[data-paso]'));\n  var esc = document.getElementById('escenario');\n  var ayuda = document.getElementById('ayuda');\n\n  function pintar(){\n    els.forEach(function(e){ e.classList.toggle('on', +e.getAttribute('data-paso') <= paso); });\n  }\n  function ir(n){\n    paso = Math.max(1, Math.min(MAX, n));\n    pintar();\n    ayuda.style.opacity = 0;\n  }\n  function escalar(){\n    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);\n    esc.style.transform = 'translate(-50%,-50%) scale(' + s + ')';\n  }\n\n  document.addEventListener('keydown', function(ev){\n    var k = ev.key;\n    if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter') { ir(paso + 1); ev.preventDefault(); }\n    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { ir(paso - 1); ev.preventDefault(); }\n    else if (k === 'Home') ir(1);\n    else if (k === 'End') ir(MAX);\n  });\n  document.addEventListener('click', function(){ ir(paso + 1); });\n  window.addEventListener('resize', escalar);\n\n  escalar();\n  /* #todo muestra la ficha completa (útil para sacar una imagen); #paso=N empieza en el paso N */\n  var h = location.hash, m = h.match(/paso=(\\d+)/);\n  if (h === '#todo') { paso = MAX; ayuda.style.display = 'none'; }\n  else if (m) paso = Math.max(1, Math.min(MAX, +m[1]));\n  requestAnimationFrame(pintar);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"titulo": "Ficha 6 · Entidades", "html": "<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Ficha 6 · Entidades<\/title>\n<style>\n/* ===== Base común de las fichas BDDAT: copiar tal cual a cada ficha ===== */\n:root{\n  --fondo:#fff; --tarjeta:#F7F6F2; --borde:#D3D1C7; --borde-fuerte:#888780;\n  --texto:#2C2C2A; --texto-2:#5F5E5A;\n  --cambio:#0F6E56;   /* lo que ha cambiado o es nuevo desde mayo */\n}\n*{box-sizing:border-box;margin:0}\nhtml,body{height:100%;background:var(--fondo);overflow:hidden}\nbody{font-family:\"Segoe UI\",Roboto,Arial,sans-serif;color:var(--texto)}\n\n/* Lienzo fijo de 1280x720 que se escala para caber en cualquier ventana */\n#escenario{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center}\n\n/* Aparición por pasos: cada elemento lleva data-paso=\"N\" y se muestra al llegar a N */\n.paso{opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s ease}\n.paso.on{opacity:1;transform:none}\n\n#ayuda{position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:14px;color:#B4B2A9;\n  transition:opacity .4s}\n@media (prefers-reduced-motion:reduce){.paso,.fila,#ayuda{transition:none}}\n\n/* ===== Base de las fichas de repaso: izquierda lo dicho en mayo, derecha lo que cambia ===== */\n.cab{position:absolute;left:60px;right:60px;top:26px}\n.cab h1{font-size:40px;font-weight:600;line-height:1.1}\n.cols{position:absolute;left:60px;right:60px;top:92px;bottom:34px;display:grid;\n  grid-template-columns:1fr 430px;column-gap:40px}\n\n/* Frase de mayo. Las que cambian llevan un círculo numerado; al aparecer su nota se atenúan */\n.fila{display:flex;gap:12px;padding:6px 0;font-size:18px;line-height:1.3;transition:opacity .6s ease}\n.fila b{font-weight:600}\n.fila .m{flex:none;width:26px;height:26px;margin-top:-1px}\n.fila.cambia .m{border:2px solid var(--cambio);border-radius:50%;color:var(--cambio);\n  font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;\n  transition:background .4s,color .4s}\n.fila.atenuada{opacity:.38}\n.fila.atenuada .m{background:var(--cambio);color:#fff}\n\n/* Nota: lo que cambia (con el número de su frase) o lo nuevo (sin frase) */\n.nota{background:#fff;border:2px solid var(--cambio);border-radius:14px;padding:12px 16px;margin-bottom:12px;\n  font-size:19px;line-height:1.32}\n.nota .n{display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--cambio);color:#fff;\n  font-size:14px;font-weight:600;align-items:center;justify-content:center;margin-right:8px;vertical-align:1px}\n.nota .tag{display:inline-block;font-size:13px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;\n  color:var(--cambio);border:2px solid var(--cambio);border-radius:8px;padding:0 8px;margin-right:8px}\n.nota p+p{margin-top:8px}\n.nota .ap{color:var(--texto-2)}\n\n/* ===== Propio de esta ficha: seis frases largas, letra algo menor ===== */\n.cols{grid-template-columns:1fr 410px}\n.fila{font-size:17px;padding:5px 0;line-height:1.28}\n.nota{font-size:17.5px;padding:11px 15px;margin-bottom:10px}\n<\/style>\n<\/head>\n<body>\n<script>\n(function(){\n  var st = document.createElement('style');\n  st.textContent = '#ayuda{display:none!important}';\n  document.head.appendChild(st);\n\n  function conPaso(){ return [].slice.call(document.querySelectorAll('[data-paso]')); }\n  function maximo(){\n    return Math.max.apply(null, conPaso().map(function(e){ return +e.getAttribute('data-paso'); }));\n  }\n  function actual(){\n    var v = conPaso().filter(function(e){ return e.classList.contains('on'); })\n      .map(function(e){ return +e.getAttribute('data-paso'); });\n    return Math.max.apply(null, [1].concat(v));\n  }\n  function tecla(k){ document.dispatchEvent(new KeyboardEvent('keydown', {key: k, bubbles: true})); }\n\n  window.addEventListener('message', function(ev){\n    var m = ev.data || {};\n    if (m.cmd === 'next') {\n      if (actual() >= maximo()) parent.postMessage({fin: 'fin'}, '*'); else tecla('ArrowRight');\n    } else if (m.cmd === 'prev') {\n      if (actual() <= 1) parent.postMessage({fin: 'inicio'}, '*'); else tecla('ArrowLeft');\n    } else if (m.cmd === 'ultimo') {\n      tecla('End');\n    }\n  });\n\n  var NAV = {ArrowRight:1, ArrowLeft:1, ArrowUp:1, ArrowDown:1, ' ':1, PageDown:1, PageUp:1,\n             Enter:1, Backspace:1, Home:1, End:1, f:1, F:1};\n  document.addEventListener('keydown', function(e){\n    if (!e.isTrusted || !NAV[e.key]) return;\n    e.stopImmediatePropagation(); e.preventDefault();\n    parent.postMessage({tecla: e.key}, '*');\n  }, true);\n  document.addEventListener('click', function(e){\n    if (!e.isTrusted) return;\n    e.stopImmediatePropagation();\n    parent.postMessage({cmd: 'next'}, '*');\n  }, true);\n\n  window.addEventListener('load', function(){\n    setTimeout(function(){\n      window.dispatchEvent(new Event('resize'));\n      parent.postMessage({listo: true}, '*');\n    }, 60);\n  });\n})();\n<\/script>\n\n<div id=\"escenario\">\n  <div class=\"cab\"><h1>Entidades<\/h1><\/div>\n\n  <div class=\"cols\">\n    <div class=\"paso\" data-paso=\"1\">\n      <div class=\"fila\"><span class=\"m\"><\/span><span><b>En un expediente intervienen actores de naturaleza muy distinta:<\/b> el titular que promueve la instalación, los organismos que emiten condicionados, la Diputación que publica en el BOP, el Ayuntamiento afectado…<\/span><\/div>\n      <div class=\"fila\"><span class=\"m\"><\/span><span><b>La solución obvia es una tabla por tipo:<\/b> titulares, organismos, ayuntamientos… El problema: la misma organización puede actuar en varios roles a la vez y los datos de contacto se duplican. Al duplicarse divergen, y ya no hay una sola fuente de la verdad.<\/span><\/div>\n      <div class=\"fila cambia\" data-corr=\"2\"><span class=\"m\">1<\/span><span><b>BDDAT usa una sola tabla entidades<\/b> con campos comunes (NIF, nombre, dirección, contacto) y tres roles booleanos que se activan según el contexto del trámite: rol_titular · rol_consultado · rol_publicador<\/span><\/div>\n      <div class=\"fila cambia\" data-corr=\"3\"><span class=\"m\">2<\/span><span><b>El campo tipo_titular<\/b> permite filtrar y segmentar titulares por sus características propias — gran distribuidora, promotor privado, organismo público — y aplicar lógicas diferenciadas cuando el procedimiento lo requiere<\/span><\/div>\n      <div class=\"fila\"><span class=\"m\"><\/span><span><b>Una entidad puede además autorizar a otra para actuar en su nombre:<\/b> si una empresa gestora representa a un titular, el sistema lo registra. La autoautorización es implícita — el titular siempre puede actuar por sí mismo<\/span><\/div>\n      <div class=\"fila cambia\" data-corr=\"4\"><span class=\"m\">3<\/span><span><b>Cada entidad puede tener además distintas direcciones de notificación según el rol que desempeña:<\/b> e-distribución como titular recibe los escritos en su departamento de tramitaciones; como empresa consultada, en su área técnica. El sistema sabe siempre a quién dirigirse — y en qué canal.<\/span><\/div>\n    <\/div>\n\n    <div>\n      <div class=\"nota paso\" data-paso=\"2\">\n        <p><span class=\"n\">1<\/span>Las <b>direcciones de notificación<\/b> ya no son un campo de la entidad: cada entidad tiene las suyas y cada una sirve a uno o varios roles.<\/p>\n        <p>La ficha conserva una dirección general.<\/p>\n      <\/div>\n      <div class=\"nota paso\" data-paso=\"3\">\n        <p><span class=\"n\">2<\/span>El tipo de titular hoy solo sirve para <b>filtrar y segmentar<\/b> (en el seguimiento). Aún no se aplica ninguna lógica diferenciada por tipo.<\/p>\n      <\/div>\n      <div class=\"nota paso\" data-paso=\"4\">\n        <p><span class=\"n\">3<\/span>Al <b>solicitante<\/b> no se le busca dirección por rol: se usa la <b>sede indicada en su solicitud<\/b> o, si no hay, la ficha.<\/p>\n        <p>El <b>canal<\/b> no lo elige el sistema: se deduce del justificante que se vincula después.<\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/div>\n\n<div id=\"ayuda\">← → o clic para avanzar<\/div>\n\n<script>\n(function(){\n  var MAX = 4, paso = 1;\n  var els = [].slice.call(document.querySelectorAll('[data-paso]'));\n  var filas = [].slice.call(document.querySelectorAll('[data-corr]'));\n  var esc = document.getElementById('escenario');\n  var ayuda = document.getElementById('ayuda');\n\n  function pintar(){\n    els.forEach(function(e){ e.classList.toggle('on', +e.getAttribute('data-paso') <= paso); });\n    filas.forEach(function(e){ e.classList.toggle('atenuada', +e.getAttribute('data-corr') <= paso); });\n  }\n  function ir(n){\n    paso = Math.max(1, Math.min(MAX, n));\n    pintar();\n    ayuda.style.opacity = 0;\n  }\n  function escalar(){\n    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);\n    esc.style.transform = 'translate(-50%,-50%) scale(' + s + ')';\n  }\n\n  document.addEventListener('keydown', function(ev){\n    var k = ev.key;\n    if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter') { ir(paso + 1); ev.preventDefault(); }\n    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { ir(paso - 1); ev.preventDefault(); }\n    else if (k === 'Home') ir(1);\n    else if (k === 'End') ir(MAX);\n  });\n  document.addEventListener('click', function(){ ir(paso + 1); });\n  window.addEventListener('resize', escalar);\n\n  escalar();\n  /* #todo muestra la ficha completa (útil para sacar una imagen); #paso=N empieza en el paso N */\n  var h = location.hash, m = h.match(/paso=(\\d+)/);\n  if (h === '#todo') { paso = MAX; ayuda.style.display = 'none'; }\n  else if (m) paso = Math.max(1, Math.min(MAX, +m[1]));\n  requestAnimationFrame(pintar);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"titulo": "Ficha 7 · Documentos", "html": "<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-sca     if (actual() <= 1) parent.postMessage({fin: 'inicio'}, '*'); else tecla('ArrowLeft');\n    } else if (m.cmd === 'ultimo') {\n      tecla('End');\n    }\n  });\n\n  var NAV = {ArrowRight:1, ArrowLeft:1, ArrowUp:1, ArrowDown:1, ' ':1, PageDown:1, PageUp:1,\n             Enter:1, Backspace:1, Home:1, End:1, f:1, F:1};\n  document.addEventListener('keydown', function(e){\n    if (!e.isTrusted || !NAV[e.key]) return;\n    e.stopImmediatePropagation(); e.preventDefault();\n    parent.postMessage({tecla: e.key}, '*');\n  }, true);\n  document.addEventListener('click', function(e){\n    if (!e.isTrusted) return;\n    e.stopImmediatePropagation();\n    parent.postMessage({cmd: 'next'}, '*');\n  }, true);\n\n  window.addEventListener('load', function(){\n    setTimeout(function(){\n      window.dispatchEvent(new Event('resize'));\n      parent.postMessage({listo: true}, '*');\n    }, 60);\n  });\n})();\n<\/script>\n\n<div id=\"escenario\">\n  <div class=\"cab\"><h1>Documentos<\/h1><\/div>\n\n  <div class=\"cols\">\n    <div class=\"paso\" data-paso=\"1\">\n      <div class=\"fila cambia\" data-corr=\"2\"><span class=\"m\">1<\/span><span><b>Todos los documentos de un expediente enlazados a su número de AT<\/b> — BDDAT sabe la ruta en el servidor y permite localizarlos de inmediato<\/span><\/div>\n      <div class=\"fila\"><span class=\"m\"><\/span><span><b>Cada documento tiene una fecha administrativa<\/b> — la que cuenta legalmente, no la del archivo en disco<\/span><\/div>\n      <div class=\"fila cambia\" data-corr=\"3\"><span class=\"m\">2<\/span><span><b>Los documentos se vinculan a las tareas que los generan o consumen:<\/b> el sistema sabe qué borrador produjo qué resolución firmada<\/span><\/div>\n      <div class=\"fila cambia\" data-corr=\"4\"><span class=\"m\">3<\/span><span><b>El administrativo puede cargar documentos al pool pendiente y marcarlos como prioritarios<\/b> — el tramitador los incorpora al flujo cuando toca<\/span><\/div>\n    <\/div>\n\n    <div>\n      <div class=\"nota paso\" data-paso=\"2\">\n        <p><span class=\"n\">1<\/span>Los documentos se guardan en un <b>almacén externo<\/b>, independiente de BDDAT. Los usuarios ya no acceden a él directamente, solo mediante BDDAT, que <b>indexa<\/b> los documentos hacia el almacén.<\/p>\n        <p>Cada expediente tiene un <b>manifiesto<\/b> de sus documentos: si BDDAT fallara, se recuperaría la organización anterior en carpetas y subcarpetas, basada en la estructura de BDDAT.<\/p>\n        <p>En nuestra implementación el almacén es el servidor de red, con acceso solo para un grupo de usuarios. Podría ser un tercer sistema (<b>Alfresco<\/b>).<\/p>\n      <\/div>\n      <div class=\"nota paso\" data-paso=\"3\">\n        <p><span class=\"n\">2<\/span>Cada <b>tipo de documento<\/b> tiene definido a qué tarea se vincula y con qué tipo de vínculo, según a qué trámite pertenezca la tarea.<\/p>\n      <\/div>\n      <div class=\"nota paso\" data-paso=\"4\">\n        <p><span class=\"n\">3<\/span>El pool ya no es una carpeta, pero existe como concepto: son los <b>documentos sin vincular<\/b>.<\/p>\n        <p>Vinculado o no, el fichero siempre está en el almacén.<\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/div>\n\n<div id=\"ayuda\">← → o clic para avanzar<\/div>\n\n<script>\n(function(){\n  var MAX = 4, paso = 1;\n  var els = [].slice.call(document.querySelectorAll('[data-paso]'));\n  var filas = [].slice.call(document.querySelectorAll('[data-corr]'));\n  var esc = document.getElementById('escenario');\n  var ayuda = document.getElementById('ayuda');\n\n  function pintar(){\n    els.forEach(function(e){ e.classList.toggle('on', +e.getAttribute('data-paso') <= paso); });\n    filas.forEach(function(e){ e.classList.toggle('atenuada', +e.getAttribute('data-corr') <= paso); });\n  }\n  function ir(n){\n    paso = Math.max(1, Math.min(MAX, n));\n    pintar();\n    ayuda.style.opacity = 0;\n  }\n  function escalar(){\n    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);\n    esc.style.transform = 'translate(-50%,-50%) scale(' + s + ')';\n  }\n\n  document.addEventListener('keydown', function(ev){\n    var k = ev.key;\n    if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter') { ir(paso + 1); ev.preventDefault(); }\n    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { ir(paso - 1); ev.preventDefault(); }\n    else if (k === 'Home') ir(1);\n    else if (k === 'End') ir(MAX);\n  });\n  document.addEventListener('click', function(){ ir(paso + 1); });\n  window.addEventListener('resize', escalar);\n\n  escalar();\n  /* #todo muestra la ficha completa (útil para sacar una imagen); #paso=N empieza en el paso N */\n  var h = location.hash, m = h.match(/paso=(\\d+)/);\n  if (h === '#todo') { paso = MAX; ayuda.style.display = 'none'; }\n  else if (m) paso = Math.max(1, Math.min(MAX, +m[1]));\n  requestAnimationFrame(pintar);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"titulo": "Ficha 8 · Escritos", "html": "<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Ficha 8 · Escritos<\/title>\n<style>\n/* ===== Base común de las fichas BDDAT: copiar tal cual a cada ficha ===== */\n:root{\n  --fondo:#fff; --tarjeta:#F7F6F2; --borde:#D3D1C7; --borde-fuerte:#888780;\n  --texto:#2C2C2A; --texto-2:#5F5E5A;\n  --cambio:#0F6E56;   /* lo que ha cambiado o es nuevo desde mayo */\n}\n*{box-sizing:border-box;margin:0}\nhtml,body{height:100%;background:var(--fondo);overflow:hidden}\nbody{font-family:\"Segoe UI\",Roboto,Arial,sans-serif;color:var(--texto)}\n\n/* Lienzo fijo de 1280x720 que se escala para caber en cualquier ventana */\n#escenario{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center}\n\n/* Aparición por pasos: cada elemento lleva data-paso=\"N\" y se muestra al llegar a N */\n.paso{opacity:0;transform:translateY(10px);transition:opacity .5s ease,tra mplate-columns:1fr 500px}\n.fila{font-size:19px;padding:9px 0}\n.fila .m{margin-top:1px}\n.nota{font-size:17.5px;padding:10px 16px;margin-bottom:9px}\n<\/style>\n<\/head>\n<body>\n<script>\n(function(){\n  var st = document.createElement('style');\n  st.textContent = '#ayuda{display:none!important}';\n  document.head.appendChild(st);\n\n  function conPaso(){ return [].slice.call(document.querySelectorAll('[data-paso]')); }\n  function maximo(){\n    return Math.max.apply(null, conPaso().map(function(e){ return +e.getAttribute('data-paso'); }));\n  }\n  function actual(){\n    var v = conPaso().filter(function(e){ return e.classList.contains('on'); })\n      .map(function(e){ return +e.getAttribute('data-paso'); });\n    return Math.max.apply(null, [1].concat(v));\n  }\n  function tecla(k){ document.dispatchEvent(new KeyboardEvent('keydown', {key: k, bubbles: true})); }\n\n  window.addEventListener('message', function(ev){\n    var m = ev.data || {};\n    if (m.cmd === 'next') {\n      if (actual() >= maximo()) parent.postMessage({fin: 'fin'}, '*'); else tecla('ArrowRight');\n    } else if (m.cmd === 'prev') {\n      if (actual() <= 1) parent.postMessage({fin: 'inicio'}, '*'); else tecla('ArrowLeft');\n    } else if (m.cmd === 'ultimo') {\n      tecla('End');\n    }\n  });\n\n  var NAV = {ArrowRight:1, ArrowLeft:1, ArrowUp:1, ArrowDown:1, ' ':1, PageDown:1, PageUp:1,\n             Enter:1, Backspace:1, Home:1, End:1, f:1, F:1};\n  document.addEventListener('keydown', function(e){\n    if (!e.isTrusted || !NAV[e.key]) return;\n    e.stopImmediatePropagation(); e.preventDefault();\n    parent.postMessage({tecla: e.key}, '*');\n  }, true);\n  document.addEventListener('click', function(e){\n    if (!e.isTrusted) return;\n    e.stopImmediatePropagation();\n    parent.postMessage({cmd: 'next'}, '*');\n  }, true);\n\n  window.addEventListener('load', function(){\n    setTimeout(function(){\n      window.dispatchEvent(new Event('resize'));\n      parent.postMessage({listo: true}, '*');\n    }, 60);\n  });\n})();\n<\/script>\n\n<div id=\"escenario\">\n  <div class=\"cab\"><h1>Escritos<\/h1><\/div>\n\n  <div class=\"cols\">\n    <div class=\"paso\" data-paso=\"1\">\n      <div class=\"fila cambia\" data-corr=\"2\"><span class=\"m\">1<\/span><span><b>En una tarea REDACTAR, el sistema propone las plantillas disponibles para ese contexto<\/b> y genera el borrador con los datos del expediente ya rellenos<\/span><\/div>\n      <div class=\"fila cambia\" data-corr=\"3\"><span class=\"m\">2<\/span><span><b>El documento se guarda con nombre sistematizado<\/b> y queda registrado en el pool, vinculado a la tarea que lo originó<\/span><\/div>\n      <div class=\"fila cambia\" data-corr=\"4\"><span class=\"m\">3<\/span><span><b>El documento lleva un código estructurado de trazabilidad en el pie de página<\/b> — cuando vuelve firmado al pool, el sistema lo clasifica automáticamente<\/span><\/div>\n      <div class=\"fila\"><span class=\"m\"><\/span><span><b>Las plantillas admiten campos simples, campos calculados, tablas dinámicas y condiciones<\/b> — la plantilla ya sabe qué párrafo poner según el resultado<\/span><\/div>\n      <div class=\"fila cambia\" data-corr=\"5\"><span class=\"m\">4<\/span><span><b>El documento generado es un .docx editable en LibreOffice Writer<\/b> — el tramitador puede ajustarlo si la situación lo requiere<\/span><\/div>\n    <\/div>\n\n    <div>\n      <div class=\"nota paso\" data-paso=\"2\">\n        <p><span class=\"n\">1<\/span>La tarea que genera el escrito es <b>ELABORAR<\/b>.<\/p>\n      <\/div>\n      <div class=\"nota paso\" data-paso=\"3\">\n        <p><span class=\"n\">2<\/span>El pool ya no es una carpeta: el <b>archivo físico<\/b> va al <b>almacén<\/b> y se crea una entrada lógica (el <b>fichero<\/b>) que vincula el documento con el archivo físico.<\/p>\n        <p>Se pueden crear dos documentos contra el mismo fichero físico, siempre que sean de distinto tipo.<\/p>\n      <\/div>\n      <div class=\"nota paso\" data-paso=\"4\">\n        <p><span class=\"n\">3<\/span>El código va en el pie de página del escrito, pero la <b>clasificación automática<\/b> de lo que vuelve firmado <b>aún no está hecha<\/b>.<\/p>\n        <p>Hoy solo se usa para comprobar el vínculo en el requerimiento de subsanación.<\/p>\n      <\/div>\n      <div class=\"nota paso\" data-paso=\"5\">\n        <p><span class=\"n\">4<\/span>El documento generado es <b>.odt<\/b>, editable en LibreOffice Writer.<\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/div>\n\n<div id=\"ayuda\">← → o clic para avanzar<\/div>\n\n<script>\n(function(){\n  var MAX = 5, paso = 1;\n  var els = [].slice.call(document.querySelectorAll('[data-paso]'));\n  var filas = [].slice.call(document.querySelectorAll('[data-corr]'));\n  var esc = document.getElementById('escenario');\n  var ayuda = document.getElementById('ayuda');\n\n  function pintar(){\n    els.forEach(function(e){ e.classList.toggle('on', +e.getAttribute('data-paso') <= paso); });\n    filas.forEach(function(e){ e.classList.toggle('atenuada', +e.getAttribute('data-corr') <= paso); });\n  }\n  function ir(n){\n    paso = Math.max(1, Math.min(MAX, n));\n    pintar();\n    ayuda.style.opacity = 0;\n  }\n  function escalar(){\n    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);\n    esc.style.transform = 'translate(-50%,-50%) scale(' + s + ')';\n  }\n\n  document.addEventListener('keydown', function(ev){\n    var k = ev.key;\n    if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter') { ir(paso + 1); ev.preventDefault(); }\n    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { ir(paso - 1); ev.preventDefault(); }\n    else if (k === 'Home') ir(1);\n    else if (k === 'End') ir(MAX);\n  });\n  document.addEventListener('click', function(){ ir(paso + 1); });\n  window.addEventListener('resize', escalar);\n\n  escalar();\n  /* #todo muestra la ficha completa (útil para sacar una imagen); #paso=N empieza en el paso N */\n  var h = location.hash, m = h.match(/paso=(\\d+)/);\n  if (h === '#todo') { paso = MAX; ayuda.style.display = 'none'; }\n  else if (m) paso = Math.max(1, Math.min(MAX, +m[1]));\n  requestAnimationFrame(pintar);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"titulo": "Ficha 8b · Plantillas y borradores", "html": "<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Ficha 8b · Plantillas y borradores<\/title>\n<style>\n/* ===== Base común de las fichas BDDAT: copiar tal cual a cada ficha ===== */\n:root{\n  --fondo:#fff; --tarjeta:#F7F6F2; --borde:#D3D1C7; --borde-fuerte:#888780;\n  --texto:#2C2C2A; --texto-2:#5F5E5A;\n  --cambio:#0F6E56;   /* lo que ha cambiado o es nuevo desde mayo */\n  --plan:#854F0B;     /* lo decidido que aún no está construido */\n}\n*{box-sizing:border-box;margin:0}\nhtml,body{height:100%;background:var(--fondo);overflow:hidden}\nbody{font-family:\"Segoe UI\",Roboto,Arial,sans-serif;color:var(--texto)}\n\n/* Lienzo fijo de 1280x720 que se escala para caber en cualquier ventana */\n#escenario{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center}\n\n/* Aparición por pasos: cada elemento lleva data-paso=\"N\" y se muestra al llegar a N */\n.paso{opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s ease}\n.paso.on{opacity:1;transform:none}\n\n#ayuda{position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:14px;color:#B4B2A9;\n  transition:opacity .4s}\n@media (prefers-reduced-motion:reduce){.paso,#ayuda{transition:none}}\n\n/* ===== Propio de esta ficha: la novedad de las plantillas y el borrador, en cuatro tarjetas ===== */\n.cab{position:absolute;left:60px;right:60px;top:26px;display:flex;align-items:center;gap:16px}\n.cab h1{font-size:40px;font-weight:600;line-height:1.1}\n.tag{display:inline-block;font-size:13px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;\n  color:var(--cambio);border:2px solid var(--cambio);border-radius:8px;padding:0 8px;white-space:nowrap}\n.tag.plan{color:var(--plan);border-color:var(--plan)}\n.cab .sub{font-size:22px;color:var(--texto-2)}\n\n.lista{position:absolute;left:60px;right:60px;top:110px;display:flex;flex-direction:column;gap:16px}\n.card{display:flex;align-items:center;gap:20px;background:var(--tarjeta);border:2px solid var(--cambio);\n  border-radius:16px;padding:18px 24px;font-size:23px;line-height:1.3}\n.card .nz{flex:none;display:inline-flex;width:34px;height:34px;border-radius:50%;background:var(--cambio);color:#fff;\n  font-size:17px;font-weight:600;align-items:center;justify-content:center}\n.card b{font-weight:600}\n.card .txt{flex:1}\n.card .st{flex:none}\n<\/style>\n<\/head>\n<body>\n<script>\n(function(){\n  var st = document.createElement('style');\n  st.textContent = '#ayuda{display:none!important}';\n  document.head.appendChild(st);\n\n  function conPaso(){ return [].slice.call(document.querySelectorAll('[data-paso]')); }\n  function maximo(){\n    return Math.max.apply(null, conPaso().map(function(e){ return +e.getAttribute('data-paso'); }));\n  }\n  function actual(){\n    var v = conPaso().filter(function(e){ return e.classList.contains('on'); })\n      .map(function(e){ return +e.getAttribute('data-paso'); });\n    return Math.max.apply(null, [1].concat(v));\n  }\n  function tecla(k){ document.dispatchEvent(new KeyboardEvent('keydown', {key: k, bubbles: true})); }\n\n  window.addEventListener('message', function(ev){\n    var m = ev.data || {};\n    if (m.cmd === 'next') {\n      if (actual() >= maximo()) parent.postMessage({fin: 'fin'}, '*'); else tecla('ArrowRight');\n    } else if (m.cmd === 'prev') {\n      if (actual() <= 1) parent.postMessage({fin: 'inicio'}, '*'); else tecla('ArrowLeft');\n    } else if (m.cmd === 'ultimo') {\n      tecla('End');\n    }\n  });\n\n  var NAV = {ArrowRight:1, ArrowLeft:1, ArrowUp:1, ArrowDown:1, ' ':1, PageDown:1, PageUp:1,\n             Enter:1, Backspace:1, Home:1, End:1, f:1, F:1};\n  document.addEventListener('keydown', function(e){\n    if (!e.isTrusted || !NAV[e.key]) return;\n    e.stopImmediatePropagation(); e.preventDefault();\n    parent.postMessage({tecla: e.key}, '*');\n  }, true);\n  document.addEventListener('click', function(e){\n    if (!e.isTrusted) return;\n    e.stopImmediatePropagation();\n    parent.postMessage({cmd: 'next'}, '*');\n  }, true);\n\n  window.addEventListener('load', function(){\n    setTimeout(function(){\n      window.dispatchEvent(new Event('resize'));\n      parent.postMessage({listo: true}, '*');\n    }, 60);\n  });\n})();\n<\/script>\n\n<div id=\"escenario\">\n  <div class=\"cab\"><h1>Escritos<\/h1><span class=\"tag\">Nuevo<\/span><span class=\"sub\">Plantillas y borradores<\/span><\/div>\n\n  <div class=\"lista\">\n    <div class=\"card paso\" data-paso=\"1\">\n      <span class=\"nz\">1<\/span>\n      <span class=\"txt\">Las <b>plantillas<\/b> se crean a mano a partir de unas <b>plantillas base<\/b> versionadas en el código.<\/span>\n    <\/div>\n    <div class=\"card paso\" data-paso=\"2\">\n      <span class=\"nz\">2<\/span>\n      <span class=\"txt\">Las plantillas se custodian en el <b>almacén<\/b>, pero <b>no son documentos<\/b>.<\/span>\n      <span class=\"st tag plan\">Decidido · aún sin implementar<\/span>\n    <\/div>\n    <div class=\"card paso\" data-paso=\"3\">\n      <span class=\"nz\">3<\/span>\n      <span class=\"txt\">El documento generado también se guarda en el almacén. <b>Hasta que se firma se puede editar<\/b>: se guarda sobre el anterior, <b>no se versiona<\/b>.<\/span>\n    <\/div>\n    <div class=\"card paso\" data-paso=\"4\">\n      <span class=\"nz\">4<\/span>\n      <span class=\"txt\">El <b>borrador que va a firma<\/b> también se custodia.<\/span>\n    <\/div>\n  <\/div>\n<\/div>\n\n<div id=\"ayuda\">← → o clic para avanzar<\/div>\n\n<script>\n(function(){\n  var MAX = 4, paso = 1;\n  var els = [].slice.call(document.querySelectorAll('[data-paso]'));\n  var esc = document.getElementById('escenario');\n  var ayuda = document.getElementById('ayuda');\n\n  function pintar(){\n    els.forEach(function(e){ e.classList.toggle('on', +e.getAttribute('data-paso') <= paso); });\n  }\n  function ir(n){\n    paso = Math.max(1, Math.min(MAX, n));\n    pintar();\n    ayuda.style.opacity = 0;\n  }\n  function escalar(){\n    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);\n    esc.style.transform = 'translate(-50%,-50%) scale(' + s + ')';\n  }\n\n  document.addEventListener('keydown', function(ev){\n    var k = ev.key;\n    if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter') { ir(paso + 1); ev.preventDefault(); }\n    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { ir(paso - 1); ev.preventDefault(); }\n    else if (k === 'Home') ir(1);\n    else if (k === 'End') ir(MAX);\n  });\n  document.addEventListener('click', function(){ ir(paso + 1); });\n  window.addEventListener('resize', escalar);\n\n  escalar();\n  /* #todo muestra la ficha completa (útil para sacar una imagen); #paso=N empieza en el paso N */\n  var h = location.hash, m = h.match(/paso=(\\d+)/);\n  if (h === '#todo') { paso = MAX; ayuda.style.display = 'none'; }\n  else if (m) paso = Math.max(1, Math.min(MAX, +m[1]));\n  requestAnimationFrame(pintar);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"titulo": "Ficha 9 · Listados", "html": "<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Ficha 9 · Listados<\/title>\n<style>\n/* ===== Base común de las fichas BDDAT: copiar tal cual a cada ficha ===== */\n:root{\n  --fondo:#fff; --tarjeta:#F7F6F2; --borde:#D3D1C7; --borde-fuerte:#888780;\n  --texto:#2C2C2A; --texto-2:#5F5E5A;\n  --cambio:#0F6E56;   /* lo que ha cambiado o es nuevo desde mayo */\n}\n*{box-sizing:border-box;margin:0}\nhtml,body{height:100%;background:var(--fondo);overflow:hidden}\nbody{font-family:\"Segoe UI\",Roboto,Arial,sans-serif;color:var(--texto)}\n\n/* Lienzo fijo de 1280x720 que se escala para caber en cualquier ventana */\n#escenario{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center}\n\n/* Aparición por pasos: cada elemento lleva data-paso=\"N\" y se muestra al llegar a N */\n.paso{opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s ease}\n.paso.on{opacity:1;transform:none}\n\n#ayuda{position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:14px;color:#B4B2A9;\n  transition:opacity .4s}\n@media (prefers-reduced-motion:reduce){.paso,.fila,#ayuda{transition:none}}\n\n/* ===== Base de las fichas de repaso: izquierda lo dicho en mayo, derecha lo que cambia ===== */\n.cab{position:absolute;left:60px;right:60px;top:26px}\n.cab h1{font-size:40px;font-weight:600;line-height:1.1}\n.cols{position:absolute;left:60px;right:60px;top:92px;bottom:34px;display:grid;\n  grid-template-columns:1fr 430px;column-gap:40px}\n\n/* Frase de mayo. Las que cambian llevan un círculo numerado; al aparecer su nota se atenúan */\n.fila{display:flex;gap:12px;padding:6px 0;font-size:18px;line-height:1.3;transition:opacity .6s ease}\n.fila b{font-weight:600}\n.fila .m{flex:none;width:26px;height:26px;margin-top:-1px}\n.fila.cambia .m{border:2px solid var(--cambio);border-radius:50%;color:var(--cambio);\n  font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;\n  transition:background .4s,color .4s}\n.fila.atenuada{opacity:.38}\n.fila.atenuada .m{background:var(--cambio);color:#fff}\n\n/* Nota: lo que cambia (con el número de su frase) o lo nuevo (sin frase) */\n.nota{background:#fff;border:2px solid var(--cambio);border-radius:14px;padding:12px 16px;margin-bottom:12px;\n  font-size:19px;line-height:1.32}\n.nota .n{display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--cambio);color:#fff;\n  font-size:14px;font-weight:600;align-items:center;justify-content:center;margin-right:8px;vertical-align:1px}\n.nota .tag{display:inline-block;font-size:13px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;\n  color:var(--cambio);border:2px solid var(--cambio);border-radius:8px;padding:0 8px;margin-right:8px}\n.nota p+p{margin-top:8px}\n.nota .ap{color:var(--texto-2)}\n\n/* ===== Propio de esta ficha: seis frases; la nota de los colores lleva una leyenda ===== */\n.cols{grid-template-columns:1fr 500px}\n.fila{font-size:19px;padding:8px 0}\n.fila .m{margin-top:1px}\n.nota{font-size:17px;padding:10px 16px;margin-bottom:9px}\n.ed{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--texto-2);\n  border:1.5px solid var(--borde-fuerte);border-radius:6px;padding:0 6px;margin-left:6px;white-space:nowrap}\n.leyenda{margin-top:6px;display:flex;flex-direction:column;gap:3px}\n.leyenda div{display:flex;align-items:baseline;gap:8px;line-height:1.28}\n.pt{flex:none;width:12px;height:12px;border-radius:50%;transform:translateY(1px)}\n<\/style>\n<\/head>\n<body>\n<script>\n(function(){\n  var st = document.createElement('style');\n  st.textContent = '#ayuda{display:none!important}';\n  document.head.appendChild(st);\n\n  function conPaso(){ return [].slice.call(document.querySelectorAll('[data-paso]')); }\n  function maximo(){\n    return Math.max.apply(null, conPaso().map(function(e){ return +e.getAttribute('data-paso'); }));\n  }\n  function actual(){\n    var v = conPaso().filter(function(e){ return e.classList.contains('on'); })\n      .map(function(e){ return +e.getAttribute('data-paso'); });\n    return Math.max.apply(null, [1].concat(v));\n  }\n  function tecla(k){ document.dispatchEvent(new KeyboardEvent('keydown', {key: k, bubbles: true})); }\n\n  window.addEventListener('message', function(ev){\n    var m = ev.data || {};\n    if (m.cmd === 'next') {\n      if (actual() >= maximo()) parent.postMessage({fin: 'fin'}, '*'); else tecla('ArrowRight');\n    } else if (m.cmd === 'prev') {\n      if (actual() <= 1) parent.postMessage({fin: 'inicio'}, '*'); else tecla('ArrowLeft');\n    } else if (m.cmd === 'ultimo') {\n      tecla('End');\n    }\n  });\n\n  var NAV = {ArrowRight:1, ArrowLeft:1, ArrowUp:1, ArrowDown:1, ' ':1, PageDown:1, PageUp:1,\n             Enter:1, Backspace:1, Home:1, End:1, f:1, F:1};\n  document.addEventListener('keydown', function(e){\n    if (!e.isTrusted || !NAV[e.key]) return;\n    e.stopImmediatePropagation(); e.preventDefault();\n    parent.postMessage({tecla: e.key}, '*');\n  }, true);\n  document.addEventListener('click', function(e){\n    if (!e.isTrusted) return;\n    e.stopImmediatePropagation();\n    parent.postMessage({cmd: 'next'}, '*');\n  }, true);\n\n  window.addEventListener('load', function(){\n    setTimeout(function(){\n      window.dispatchEvent(new Event('resize'));\n      parent.postMessage({listo: true}, '*');\n    }, 60);\n  });\n})();\n<\/script>\n\n<div id=\"escenario\">\n  <div class=\"cab\"><h1>Listados<\/h1><\/div>\n\n  <div class=\"cols\">\n    <div class=\"paso\" data-paso=\"1\">\n      <div class=\"fila\"><span class=\"m\"><\/span><span><b>Cada fila es una solicitud en tramitación.<\/b> Las columnas muestran las pistas del procedimiento, una por fase principal<\/span><\/div>\n      <div class=\"fila\"><span class=\"m\"><\/span><span><b>El estado de cada pista se calcula automáticamente del árbol del expediente<\/b> — el listado siempre refleja la realidad sin que nadie lo actualice a mano<\/span><\/div>\n      <div class=\"fila cambia\" data-corr=\"2\"><span class=\"m\">1<\/span><span><b>Los colores dicen qué toca:<\/b> rojo = actuar, amarillo = en firma, azul = esperando respuesta, verde = terminado<\/span><\/div>\n      <div class=\"fila cambia\" data-corr=\"3\"><span class=\"m\">2<\/span><span><b>El tramitador filtra por estado y trabaja por lotes<\/b> — todos los que hay que firmar hoy, todos los que esperan respuesta de organismos…<\/span><\/div>\n      <div class=\"fila cambia\" data-corr=\"4\"><span class=\"m\">3<\/span><span><b>La jefatura ve el estado global de todos los expedientes y de todos los tramitadores<\/b> — sin preguntar, sin esperar informe <span class=\"ed\">en desarrollo<\/span><\/span><\/div>\n      <div class=\"fila cambia\" data-corr=\"5\"><span class=\"m\">4<\/span><span><b>El administrativo dispone de una vista propia con plazos de IP, respuestas de titulares y acceso directo a la tarea concreta<\/b> <span class=\"ed\">en desarrollo<\/span><\/span><\/div>\n    <\/div>\n\n    <div>\n      <div class=\"nota paso\" data-paso=\"2\">\n        <p><span class=\"n\">1<\/span>Ahora son <b>seis colores<\/b>:<\/p>\n        <div class=\"leyenda\">\n          <div><span class=\"pt\" style=\"background:#C0392B\"><\/span><span><b>rojo<\/b>: el tramitador tiene que actuar<\/span><\/div>\n          <div><span class=\"pt\" style=\"background:#E67E22\"><\/span><span><b>naranja<\/b>: gestión nuestra pendiente (cerrar una fase, repetir una notificación, falta la puesta a disposición en sede)<\/span><\/div>\n          <div><span class=\"pt\" style=\"background:#F1C40F\"><\/span><span><b>amarillo<\/b>: en firma<\/span><\/div>\n          <div><span class=\"pt\" style=\"background:#2E86C1\"><\/span><span><b>azul<\/b>: falta el justificante de la notificación<\/span><\/div>\n          <div><span class=\"pt\" style=\"background:#95A5A6\"><\/span><span><b>gris<\/b>: esperando un plazo<\/span><\/div>\n          <div><span class=\"pt\" style=\"background:#27AE60\"><\/span><span><b>verde<\/b>: terminado<\/span><\/div>\n        <\/div>\n      <\/div>\n      <div class=\"nota paso\" data-paso=\"3\">\n        <p><span class=\"n\">2<\/span>El trabajo por lotes no es una función aparte: es una <b>forma de trabajar gracias a los filtros<\/b>. En realidad se trabaja un expediente cada vez.<\/p>\n      <\/div>\n      <div class=\"nota paso\" data-paso=\"4\">\n        <p><span class=\"n\">3<\/span>El <b>resumen de estado<\/b> de los expedientes está implementado en una primera versión: estado global y por técnico, en Control y Gestión › Estadísticas.<\/p>\n      <\/div>\n      <div class=\"nota paso\" data-paso=\"5\">\n        <p><span class=\"n\">4<\/span>El listado del administrativo está implementado: <b>Tareas y Subidas<\/b>, con la cola de tareas administrativas y la subida de documentos.<\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/div>\n\n<div id=\"ayuda\">← → o clic para avanzar<\/div>\n\n<script>\n(function(){\n  var MAX = 5, paso = 1;\n  var els = [].slice.call(document.querySelectorAll('[data-paso]'));\n  var filas = [].slice.call(document.querySelectorAll('[data-corr]'));\n  var esc = document.getElementById('escenario');\n  var ayuda = document.getElementById('ayuda');\n\n  function pintar(){\n    els.forEach(function(e){ e.classList.toggle('on', +e.getAttribute('data-paso') <= paso); });\n    filas.forEach(function(e){ e.classList.toggle('atenuada', +e.getAttribute('data-corr') <= paso); });\n  }\n  function ir(n){\n    paso = Math.max(1, Math.min(MAX, n));\n    pintar();\n    ayuda.style.opacity = 0;\n  }\n  function escalar(){\n    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);\n    esc.style.transform = 'translate(-50%,-50%) scale(' + s + ')';\n  }\n\n  document.addEventListener('keydown', function(ev){\n    var k = ev.key;\n    if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter') { ir(paso + 1); ev.preventDefault(); }\n    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { ir(paso - 1); ev.preventDefault(); }\n    else if (k === 'Home') ir(1);\n    else if (k === 'End') ir(MAX);\n  });\n  document.addEventListener('click', function(){ ir(paso + 1); });\n  window.addEventListener('resize', escalar);\n\n  escalar();\n  /* #todo muestra la ficha completa (útil para sacar una imagen); #paso=N empieza en el paso N */\n  var h = location.hash, m = h.match(/paso=(\\d+)/);\n  if (h === '#todo') { paso = MAX; ayuda.style.display = 'none'; }\n  else if (m) paso = Math.max(1, Math.min(MAX, +m[1]));\n  requestAnimationFrame(pintar);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}];

(function(){
  var marco = document.getElementById('marco');
  var capa = document.getElementById('capa');
  var info = document.getElementById('info');
  var idx = 0, listo = false, alUltimo = false, aviso = null;

  function avisar(texto){
    info.textContent = texto;
    info.classList.add('ver');
    clearTimeout(aviso);
    aviso = setTimeout(function(){ info.classList.remove('ver'); }, 2600);
  }

  function mostrar(i, ultimo){
    idx = i; listo = false; alUltimo = !!ultimo;
    marco.srcdoc = FICHAS[i].html;
    document.title = FICHAS[i].titulo;
    try { history.replaceState(null, '', '#' + (i + 1)); } catch (e) {}
    avisar((i + 1) + ' / ' + FICHAS.length + '  ·  ' + FICHAS[i].titulo);
  }

  function enviar(cmd){ if (listo) marco.contentWindow.postMessage({cmd: cmd}, '*'); }
  function siguiente(){ enviar('next'); }
  function anterior(){ enviar('prev'); }

  function pantallaCompleta(){
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  }

  function tecla(k){
    if (k === 'ArrowRight' || k === 'ArrowDown' || k === ' ' || k === 'PageDown' || k === 'Enter') siguiente();
    else if (k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp' || k === 'Backspace') anterior();
    else if (k === 'Home') mostrar(0, false);
    else if (k === 'End') mostrar(FICHAS.length - 1, true);
    else if (k === 'f' || k === 'F') pantallaCompleta();
    else return false;
    return true;
  }

  window.addEventListener('message', function(ev){
    if (ev.source !== marco.contentWindow) return;
    var m = ev.data || {};
    if (m.listo) {
      listo = true;
      if (alUltimo) { alUltimo = false; enviar('ultimo'); }
    } else if (m.fin === 'fin') {
      if (idx < FICHAS.length - 1) mostrar(idx + 1, false); else avisar('fin de la presentación');
    } else if (m.fin === 'inicio') {
      if (idx > 0) mostrar(idx - 1, true);
    } else if (m.cmd === 'next') {
      siguiente();
    } else if (m.tecla) {
      tecla(m.tecla);
    }
  });

  document.addEventListener('keydown', function(e){
    if (e.ctrlKey || e.altKey || e.metaKey) return;
    if (tecla(e.key)) e.preventDefault();
  });
  capa.addEventListener('click', siguiente);

  /* #N empieza en la ficha N (empezando por 1) */
  var n = parseInt(location.hash.slice(1), 10);
  mostrar(n >= 1 && n <= FICHAS.length ? n - 1 : 0, false);
  window.__ficha = function(){ return idx; };
})();
</script>
</body>
</html>
