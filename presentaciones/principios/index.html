g\" style=\"position:absolute;left:28px;top:16px;font-size:13px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#B4B2A9\">2 · La estructura<\/div>\n  <div class=\"titulo\">El documento y el expediente<\/div>\n  <div class=\"divisoria paso\" data-paso=\"2\"><\/div>\n\n  <!-- Izquierda: el documento -->\n  <div class=\"c lado paso\" data-paso=\"2\" style=\"left:320px;top:122px\">Documento<\/div>\n\n  <!-- 2 · el fichero físico -->\n  <div class=\"c fichero paso\" data-paso=\"2\" style=\"left:150px;top:330px\">\n    <svg class=\"doc\" width=\"120\" height=\"152\"><use href=\"#i-doc\"/><\/svg>\n    <span class=\"nom\">informe.pdf<\/span>\n  <\/div>\n\n  <!-- 3 y 4 · los metadatos que le pone BDDAT -->\n  <div class=\"enlace paso\" data-paso=\"3\" style=\"left:214px;top:268px;width:112px;transform:rotate(-12deg)\"><\/div>\n  <div class=\"c meta paso\" data-paso=\"3\" style=\"left:326px;top:244px;translate:0 -50%\">\n    <div class=\"et\">tipo de documento<\/div><div class=\"val\">Informe de organismo<\/div>\n  <\/div>\n  <div class=\"enlace paso\" data-paso=\"4\" style=\"left:214px;top:330px;width:112px;transform:rotate(12deg)\"><\/div>\n  <div class=\"c meta paso\" data-paso=\"4\" style=\"left:326px;top:378px;translate:0 -50%\">\n    <div class=\"et\">fecha administrativa<\/div><div class=\"val\">12/05/2026<\/div>\n  <\/div>\n\n  <!-- 5 · la ley -->\n  <div class=\"c cita paso\" data-paso=\"5\" style=\"left:320px;top:560px;width:520px\">\n    <b>Art. 26.2 LPACAP<\/b><br>el documento electrónico lleva una referencia temporal<br>y los metadatos mínimos exigidos\n  <\/div>\n\n  <!-- Derecha: el expediente según la ley -->\n  <div class=\"c lado paso\" data-paso=\"6\" style=\"left:960px;top:122px\">Expediente<\/div>\n\n  <!-- 6 · la definición -->\n  <div class=\"c definicion paso\" data-paso=\"6\" style=\"left:960px;top:228px\">\n    «conjunto ordenado de documentos y actuaciones que sirven de antecedente y fundamento a la resolución administrativa»\n    <span class=\"ref\">Art. 70.1 LPACAP<\/span>\n  <\/div>\n\n  <!-- 7 · los documentos, agregados en orden con su índice -->\n  <div class=\"c carpeta paso\" data-paso=\"7\" style=\"left:960px;top:445px\"><div class=\"pest\"><\/div><\/div>\n  <div id=\"minis\"><\/div>\n\n  <!-- 8 · lo que no forma parte (propuesta) -->\n  <div class=\"c fuera paso\" data-paso=\"8\" style=\"left:960px;top:610px\">\n    <svg class=\"doc\" width=\"40\" height=\"51\"><use href=\"#i-doc\"/><\/svg>\n    <span class=\"t\"><b>borradores, notas, información auxiliar<\/b><br>no forman parte del expediente (art. 70.4)<\/span>\n  <\/div>\n<\/div>\n\n<div id=\"ayuda\">← → o clic para avanzar<\/div>\n\n<script>\n(function(){\n  /* 7 · cinco documentos que entran uno tras otro en la carpeta, numerados */\n  var minis = document.getElementById('minis');\n  for (var i = 0; i < 5; i++) {\n    var d = document.createElement('div');\n    d.className = 'c mini paso';\n    d.setAttribute('data-paso', 7);\n    d.style.left = (790 + i * 85) + 'px';\n    d.style.top = '450px';\n    d.style.transitionDelay = (.3 + i * .25) + 's';\n    d.innerHTML = '<svg class=\"doc\" width=\"54\" height=\"68\"><use href=\"#i-doc\"/><\/svg><span class=\"n\">' + (i + 1) + '<\/span>';\n    minis.appendChild(d);\n  }\n\n  var els = [].slice.call(document.querySelectorAll('[data-paso]'));\n  var MAX = Math.max.apply(null, els.map(function(e){ return +e.getAttribute('data-paso'); }));\n  var paso = 1;\n  var esc = document.getElementById('escenario');\n  var ayuda = document.getElementById('ayuda');\n\n  function pintar(){\n    els.forEach(function(e){ e.classList.toggle('on', +e.getAttribute('data-paso') <= paso); });\n  }\n  function ir(n){\n    paso = Math.max(1, Math.min(MAX, n));\n    pintar();\n    ayuda.style.opacity = 0;\n  }\n  function escalar(){\n    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);\n    esc.style.transform = 'translate(-50%,-50%) scale(' + s + ')';\n  }\n\n  document.addEventListener('keydown', function(ev){\n    var k = ev.key;\n    if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter') { ir(paso + 1); ev.preventDefault(); }\n    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { ir(paso - 1); ev.preventDefault(); }\n    else if (k === 'Home') ir(1);\n    else if (k === 'End') ir(MAX);\n  });\n  document.addEventListener('click', function(){ ir(paso + 1); });\n  window.addEventListener('resize', escalar);\n\n  escalar();\n  /* #todo muestra la ficha completa (útil para sacar una imagen); #paso=N empieza en el paso N */\n  var h = location.hash, m = h.match(/paso=(\\d+)/);\n  if (h === '#todo') { paso = MAX; ayuda.style.display = 'none'; }\n  else if (m) paso = Math.max(1, Math.min(MAX, +m[1]));\n  requestAnimationFrame(pintar);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"titulo": "Ficha 5 · Encapsulamiento y semántica", "html": "<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Ficha 5 · Encapsulamiento y semántica<\/title>\n<style>\n/* ===== Base común de las fichas BDDAT: copiar tal cual a cada ficha ===== */\n:root{\n  --fondo:#fff; --tarjeta:#F7F6F2; --borde:#D3D1C7; --borde-fuerte:#888780;\n  --texto:#2C2C2A; --texto-2:#5F5E5A;\n  --ida:#185FA5;      /* lo que va */\n  --vuelta:#3B6D11;   /* lo que vuelve */\n  --plan:#854F0B;     /* reservado */\n}\n*{box-sizing:border-box;margin:0}\nhtml,body{height:100%;background:var(--fondo);overflow:hidden}\nbody{font-family:\"Segoe UI\",Roboto,Arial,sans-serif;color:var(--texto)}\n\n/* Lienzo fijo de 1280x720 que se escala para caber en cualquier ventana */\n#escenario{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center}\n\n/* Aparición por pasos: cada elemento lleva data-paso=\"N\" y se muestra al llegar a N;\n   con data-hasta=\"M\" se vuelve a ocultar al llegar a M */\n.paso{opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s ease}\n.paso.on{opacity:var(--op,1);transform:none}\n\n#ayuda{position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:14px;color:#B4B2A9;\n  transition:opacity .4s}\n@media (prefers-reduced-motion:reduce){.paso,#ayuda{transition:none}}\n\n/* ===== Propio de esta ficha ===== */\n.titulo{position:absolute;left:0;right:0;top:34px;text-align:center;font-size:30px;font-weight:600}\n.c{position:absolute;translate:-50% -50%;white-space:nowrap}\n\n/* Izquierda: los niveles, cada uno envuelto por el anterior con una llave */\n.nivel{background:var(--tarjeta);border:2px solid var(--borde-fuerte);border-radius:10px;\n  padding:8px 26px;font-size:28px;font-weight:600;min-width:220px;text-align:center}\n.llave path{fill:none;stroke:var(--borde-fuerte);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}\n\n/* Derecha: los tipos del nivel en curso; se sustituyen al bajar de nivel */\n.tipos{position:absolute;left:680px;top:140px;width:560px}\n.tipos h2{font-size:24px;font-weight:600;color:var(--texto-2);margin-bottom:22px}\n.tipos .pildoras{display:flex;flex-wrap:wrap;gap:14px}\n.pil{font-size:23px;font-weight:600;border:2px solid var(--borde-fuerte);border-radius:999px;\n  padding:6px 18px;background:#fff;white-space:nowrap}\n.pil.mas{color:var(--texto-2)}\n<\/style>\n<\/head>\n<body>\n<script>\n(function(){\n  var st = document.createElement('style');\n  st.textContent = '#ayuda{display:none!important}';\n  document.head.appendChild(st);\n\n  function conPaso(){ return [].slice.call(document.querySelectorAll('[data-paso]')); }\n  function maximo(){\n    return Math.max.apply(null, conPaso().map(function(e){ return +e.getAttribute('data-paso'); }));\n  }\n  function actual(){\n    var v = conPaso().filter(function(e){ return e.classList.contains('on'); })\n      .map(function(e){ return +e.getAttribute('data-paso'); });\n    return Math.max.apply(null, [1].concat(v));\n  }\n  function tecla(k){ document.dispatchEvent(new KeyboardEvent('keydown', {key: k, bubbles: true})); }\n\n  window.addEventListener('message', function(ev){\n    var m = ev.data || {};\n    if (m.cmd === 'next') {\n      if (actual() >= maximo()) parent.postMessage({fin: 'fin'}, '*'); else tecla('ArrowRight');\n    } else if (m.cmd === 'prev') {\n      if (actual() <= 1) parent.postMessage({fin: 'inicio'}, '*'); else tecla('ArrowLeft');\n    } else if (m.cmd === 'ultimo') {\n      tecla('End');\n    }\n  });\n\n  var NAV = {ArrowRight:1, ArrowLeft:1, ArrowUp:1, ArrowDown:1, ' ':1, PageDown:1, PageUp:1,\n             Enter:1, Backspace:1, Home:1, End:1, f:1, F:1};\n  document.addEventListener('keydown', function(e){\n    if (!e.isTrusted || !NAV[e.key]) return;\n    e.stopImmediatePropagation(); e.preventDefault();\n    parent.postMessage({tecla: e.key}, '*');\n  }, true);\n  document.addEventListener('click', function(e){\n    if (!e.isTrusted) return;\n    e.stopImmediatePropagation();\n    parent.postMessage({cmd: 'next'}, '*');\n  }, true);\n\n  window.addEventListener('load', function(){\n    setTimeout(function(){\n      window.dispatchEvent(new Event('resize'));\n      parent.postMessage({listo: true}, '*');\n    }, 60);\n  });\n})();\n<\/script>\n\n<div id=\"escenario\">\n  <div class=\"bloque-tag\" style=\"position:absolute;left:28px;top:16px;font-size:13px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#B4B2A9\">2 · La estructura<\/div>\n  <div class=\"titulo\">Encapsulamiento y semántica<\/div>\n  <div id=\"niveles\"><\/div>\n<\/div>\n\n<div id=\"ayuda\">← → o clic para avanzar<\/div>\n\n<script>\n(function(){\n  /* Cada nivel: nombre y sus tipos. Las listas largas acaban en «…». */\n  var NIVELES = [\n    ['Expediente', ['Transporte', 'Distribución', 'Distribución cedida', 'Renovable', 'Autoconsumo',\n                    'Línea directa', 'Convencional', 'Otros']],\n    ['Solicitud',  ['AAP', 'AAC', 'DUP', 'AE provisional', 'AE definitiva', 'AAT', 'Modificación',\n                    'Cierre', 'Desistimiento', 'Renuncia', 'Recurso', 'RAIPEE', 'y combinadas: AAP+AAC…']],\n    ['Fase',       ['Análisis de solicitud', 'Consultas', 'Información pública', 'Compatibilidad ambiental',\n                    'Figura ambiental externa', 'Datos catastrales', 'Consulta al Ministerio',\n                    'Resolución', 'Resolución DUP', '…']],\n    ['Trámite',    ['Análisis documental', 'Requerimiento de subsanación', 'Comunicación de inicio',\n                    'Separata a organismo', 'Traslado al titular', 'Anuncio en el BOE',\n                    'Tablón de ayuntamientos', '…']],\n    ['Tarea',      ['ANALIZAR', 'ELABORAR', 'NOTIFICAR', 'ESPERAR PLAZO']],\n  ];\n  var X = 320, Y0 = 140, DY = 115, ANCHO_LLAVE = 560, ALTO_LLAVE = 40;\n  var esc = document.getElementById('escenario');\n\n  function llave(w, h){\n    /* llave horizontal con la punta arriba (hacia el nivel que envuelve) y los brazos abajo */\n    var m = w / 2, r = 22, y = h / 2;\n    return '<svg class=\"llave\" width=\"' + w + '\" height=\"' + h + '\" viewBox=\"0 0 ' + w + ' ' + h + '\">' +\n      '<path d=\"M2 ' + h + ' Q2 ' + y + ' ' + r + ' ' + y + ' H' + (m - r) + ' Q' + m + ' ' + y + ' ' + m + ' 2' +\n      ' Q' + m + ' ' + y + ' ' + (m + r) + ' ' + y + ' H' + (w - r) + ' Q' + (w - 2) + ' ' + y + ' ' + (w - 2) + ' ' + h + '\"/><\/svg>';\n  }\n  function poner(html, clase, paso, hasta, x, y, retardo){\n    var d = document.createElement('div');\n    d.className = clase + ' paso';\n    d.setAttribute('data-paso', paso);\n    if (hasta) d.setAttribute('data-hasta', hasta);\n    if (x !== null) { d.style.left = x + 'px'; d.style.top = y + 'px'; }\n    if (retardo) d.style.transitionDelay = retardo + 's';\n    d.innerHTML = html;\n    esc.appendChild(d);\n    return d;\n  }\n\n  NIVELES.forEach(function(n, k){\n    var pasoNivel = 2 + 2 * k, pasoTipos = 3 + 2 * k;\n    var y = Y0 + k * DY;\n    if (k > 0) {\n      /* la llave entra con el nivel, entre él y el que lo envuelve */\n      poner(llave(ANCHO_LLAVE, ALTO_LLAVE), 'c', pasoNivel, null, X, y - DY / 2 + 4, 0);\n    }\n    poner('', 'c nivel', pasoNivel, null, X, y, k > 0 ? .25 : 0).textContent = n[0];\n\n    /* los tipos a la derecha: se quitan cuando aparece el nivel siguiente (salvo el último) */\n    var hasta = k < NIVELES.length - 1 ? pasoTipos + 1 : null;\n    var bloque = poner('', 'tipos', pasoTipos, hasta, null, null, 0);\n    var h = document.createElement('h2');\n    h.textContent = 'Tipos de ' + n[0].toLowerCase();\n    bloque.appendChild(h);\n    var p = document.createElement('div');\n    p.className = 'pildoras';\n    n[1].forEach(function(t, i){\n      var s = document.createElement('span');\n      s.className = 'pil paso' + (/…$/.test(t) ? ' mas' : '');\n      s.setAttribute('data-paso', pasoTipos);\n      if (hasta) s.setAttribute('data-hasta', hasta);\n      s.style.transitionDelay = (.1 + i * .08) + 's';\n      s.textContent = t;\n      p.appendChild(s);\n    });\n    bloque.appendChild(p);\n  });\n\n  var els = [].slice.call(document.querySelectorAll('[data-paso]'));\n  var MAX = Math.max.apply(null, els.map(function(e){ return +e.getAttribute('data-paso'); }));\n  var paso = 1;\n  var ayuda = document.getElementById('ayuda');\n\n  function pintar(){\n    els.forEach(function(e){\n      var n = +e.getAttribute('data-paso'), hasta = e.getAttribute('data-hasta');\n      e.classList.toggle('on', n <= paso && (!hasta || paso < +hasta));\n    });\n  }\n  function ir(n){\n    paso = Math.max(1, Math.min(MAX, n));\n    pintar();\n    ayuda.style.opacity = 0;\n  }\n  function escalar(){\n    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);\n    esc.style.transform = 'translate(-50%,-50%) scale(' + s + ')';\n  }\n\n  document.addEventListener('keydown', function(ev){\n    var k = ev.key;\n    if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter') { ir(paso + 1); ev.preventDefault(); }\n    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { ir(paso - 1); ev.preventDefault(); }\n    else if (k === 'Home') ir(1);\n    else if (k === 'End') ir(MAX);\n  });\n  document.addEventListener('click', function(){ ir(paso + 1); });\n  window.addEventListener('resize', escalar);\n\n  escalar();\n  /* #todo muestra la ficha completa (útil para sacar una imagen); #paso=N empieza en el paso N */\n  var hs = location.hash, m = hs.match(/paso=(\\d+)/);\n  if (hs === '#todo') { paso = MAX; ayuda.style.display = 'none'; }\n  else if (m) paso = Math.max(1, Math.min(MAX, +m[1]));\n  requestAnimationFrame(pintar);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"titulo": "Ficha 6 · La tarea y el documento", "html": "<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Ficha 6 · La tarea y el documento<\/title>\n<style>\n/* ===== Base común de las fichas BDDAT: copiar tal cual a cada ficha ===== */\n:root{\n  --fondo:#fff; --tarjeta:#F7F6F2; --borde:#D3D1C7; --borde-fuerte:#888780;\n  --texto:#2C2C2A; --texto-2:#5F5E5A;\n  --ida:#185FA5;      /* lo que va */\n  --vuelta:#3B6D11;   /* lo que vuelve */\n  --plan:#854F0B;     /* reservado */\n}\n*{box-sizing:border-box;margin:0}\nhtml,body{height:100%;background:var(--fondo);overflow:hidden}\nbody{font-family:\"Segoe UI\",Roboto,Arial,sans-serif;color:var(--texto)}\n\n/* Lienzo fijo de 1280x720 que se escala para caber en cualquier ventana */\n#escenario{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center}\n\n/* Aparición por pasos: cada elemento lleva data-paso=\"N\" y se muestra al llegar a N;\n   con data-hasta=\"M\" se vuelve a ocultar al llegar a M */\n.paso{opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s ease}\n.paso.on{opacity:var(--op,1);transform:none}\n\n#ayuda{position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:14px;color:#B4B2A9;\n  transition:opacity .4s}\n@media (prefers-reduced-motion:reduce){.paso,#ayuda{transition:none}}\n\n/* ===== Propio de esta ficha ===== */\n.titulo{position:absolute;left:0;right:0;top:34px;text-align:center;font-size:30px;font-weight:600}\n.c{position:absolute;translate:-50% -50%}\n\n/* Encuadre ESFTT de la tarea, arriba */\n.encuadre{display:flex;align-items:center;gap:10px;white-space:nowrap;font-size:19px;color:var(--texto-2)}\n.encuadre .niv{border:1.5px solid var(--borde-fuerte);border-radius:999px;padding:3px 12px;background:#fff}\n.encuadre .niv small{display:block;font-size:12px;color:var(--borde-fuerte);text-transform:uppercase;letter-spacing:.5px}\n.encuadre .sep{color:var(--borde-fuerte);font-size:22px}\n.encuadre .niv.yo{border-color:var(--texto);color:var(--texto);font-weight:700}\n\n/* La tarea, en el centro */\n.tarea{background:var(--tarjeta);border:3px solid var(--texto);border-radius:14px;padding:16px 34px;\n  font-size:44px;font-weight:700;letter-spacing:.5px;white-space:nowrap}\n\n/* Izquierda: qué hace */\n.hace{width:330px;font-size:26px;line-height:1.35;font-weight:600}\n.hace span{display:block;margin-top:10px;font-size:20px;font-weight:400;color:var(--texto-2)}\n\n/* Derecha: consume y produce */\n.grupo{position:absolute;left:820px;width:430px}\n.grupo .et{font-size:22px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:10px}\n/* la cardinalidad, destacada: consume N, produce 1 */\n.grupo .card{display:inline-flex;align-items:center;justify-content:center;min-width:36px;height:36px;\n  padding:0 8px;border-radius:999px;color:#fff;font-size:21px;font-weight:700}\n.grupo.consume .card{background:var(--ida)}\n.grupo.produce .card{background:var(--vuelta)}\n.grupo .uno{font-size:16px;font-weight:400;color:var(--texto-2)}\n/* icono: varios documentos en consume, uno en produce */\n.grupo .ico{width:40px;height:46px;flex:none}\n.grupo.consume .et{color:var(--ida)}\n.grupo.produce .et{color:var(--vuelta)}\n.grupo .pildoras{display:flex;flex-wrap:wrap;gap:8px}\n.pil{font-size:17px;font-weight:600;border:2px solid var(--borde-fuerte);border-radius:999px;\n  padding:4px 13px;background:#fff;white-space:nowrap}\n.pil .firma{width:26px;height:16px;margin-left:8px;vertical-align:-2px}\n.consume .pil{border-color:var(--ida)}\n.produce .pil{border-color:var(--vuelta)}\n\n/* Flechas entre la tarea y los grupos de la derecha */\n.flecha{position:absolute;overflow:visible}\n.flecha path{fill:none;stroke-width:3;stroke-linecap:round}\n.flecha polygon{stroke:none}\n.flecha.consume path{stroke:var(--ida)} .flecha.consume polygon{fill:var(--ida)}\n.flecha.produce path{stroke:var(--vuelta)} .flecha.produce polygon{fill:var(--vuelta)}\n<\/style>\n<\/head>\n<body>\n<script>\n(function(){\n  var st = document.createElement('style');\n  st.textContent = '#ayuda{display:none!important}';\n  document.head.appendChild(st);\n\n  function conPaso(){ return [].slice.call(document.querySelectorAll('[data-paso]')); }\n  function maximo(){\n    return Math.max.apply(null, conPaso().map(function(e){ return +e.getAttribute('data-paso'); }));\n  }\n  function actual(){\n    var v = conPaso().filter(function(e){ return e.classList.contains('on'); })\n      .map(function(e){ return +e.getAttribute('data-paso'); });\n    return Math.max.apply(null, [1].concat(v));\n  }\n  function tecla(k){ document.dispatchEvent(new KeyboardEvent('keydown', {key: k, bubbles: true})); }\n\n  window.addEventListener('message', function(ev){\n    var m = ev.data || {};\n    if (m.cmd === 'next') {\n      if (actual() >= maximo()) parent.postMessage({fin: 'fin'}, '*'); else tecla('ArrowRight');\n    } else if (m.cmd === 'prev') {\n      if (actual() <= 1) parent.postMessage({fin: 'inicio'}, '*'); else tecla('ArrowLeft');\n    } else if (m.cmd === 'ultimo') {\n      tecla('End');\n    }\n  });\n\n  var NAV = {ArrowRight:1, ArrowLeft:1, ArrowUp:1, ArrowDown:1, ' ':1, PageDown:1, PageUp:1,\n             Enter:1, Backspace:1, Home:1, End:1, f:1, F:1};\n  document.addEventListener('keydown', function(e){\n    if (!e.isTrusted || !NAV[e.key]) return;\n    e.stopImmediatePropagation(); e.preventDefault();\n    parent.postMessage({tecla: e.key}, '*');\n  }, true);\n  document.addEventListener('click', function(e){\n    if (!e.isTrusted) return;\n    e.stopImmediatePropagation();\n    parent.postMessage({cmd: 'next'}, '*');\n  }, true);\n\n  window.addEventListener('load', function(){\n    setTimeout(function(){\n      window.dispatchEvent(new Event('resize'));\n      parent.postMessage({listo: true}, '*');\n    }, 60);\n  });\n})();\n<\/script>\n\n<svg width=\"0\" height=\"0\" style=\"position:absolute\" aria-hidden=\"true\">\n  <!-- un documento -->\n  <symbol id=\"i-doc\" viewBox=\"0 0 40 46\" fill=\"#fff\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linejoin=\"round\">\n    <path d=\"M8 3h18l9 9v31H8z\"/><path d=\"M26 3v9h9\"/>\n    <path fill=\"none\" stroke-width=\"1.8\" stroke-linecap=\"round\" opacity=\".55\" d=\"M13 20h17M13 26h17M13 32h17M13 38h11\"/>\n  <\/symbol>\n  <!-- firma: rúbrica con su línea -->\n  <symbol id=\"i-firma\" viewBox=\"0 0 26 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n    <path d=\"M2 11c2-5 4-8 5-6s-1 7 1 7 3-6 5-6 1 5 3 5 3-3 4-4 2 1 3 1\"/>\n    <path d=\"M2 15h22\" stroke-width=\"1.4\" opacity=\".6\"/>\n  <\/symbol>\n  <!-- varios documentos, apilados -->\n  <symbol id=\"i-docs\" viewBox=\"0 0 40 46\" fill=\"#fff\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linejoin=\"round\">\n    <path d=\"M2 9h16l7 7v28H2z\"/>\n    <path d=\"M8 5h16l7 7v28H8z\"/>\n    <path d=\"M14 1h16l8 8v28H14z\"/><path d=\"M30 1v8h8\"/>\n    <path fill=\"none\" stroke-width=\"1.8\" stroke-linecap=\"round\" opacity=\".55\" d=\"M18 15h15M18 20h15M18 25h15M18 30h10\"/>\n  <\/symbol>\n<\/svg>\n\n<div id=\"escenario\">\n  <div class=\"bloque-tag\" style=\"position:absolute;left:28px;top:16px;font-size:13px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#B4B2A9\">2 · La estructura<\/div>\n  <div class=\"titulo\">La tarea y el documento<\/div>\n<\/div>\n\n<div id=\"ayuda\">← → o clic para avanzar<\/div>\n\n<script>\n(function(){\n  /* Una tarea cada vez: la siguiente sustituye a la anterior.\n     encuadre: tipos de Expediente › Solicitud › Fase › Trámite de un ejemplo real.\n     consume / produce: tipos de documento del catálogo (catalogo_uso.csv). */\n  var TAREAS = [\n    {\n      nombre: 'ANALIZAR',\n      encuadre: ['Distribución', 'AAP', 'Análisis de solicitud', 'Análisis documental'],\n      hace: 'Examina documentación y emite un diagnóstico',\n      matiz: 'Siempre produce un diagnóstico: favorable o desfavorable, con lo que falta',\n      consume: ['Modelo de solicitud', 'Proyecto técnico', 'Justificante de pago de la tasa',\n                'Documentación de subsanación', 'Respuesta del organismo', 'Alegación de IP', '…'],\n      produce: ['Diagnóstico de análisis'],\n    },\n    {\n      nombre: 'ELABORAR',\n      encuadre: ['Distribución', 'AAP', 'Análisis de solicitud', 'Requerimiento de subsanación'],\n      hace: 'Redacta y firma un escrito, en un solo acto',\n      matiz: 'El borrador sale de una plantilla con los datos del expediente',\n      consume: ['Borrador del escrito', 'Diagnóstico de análisis'],\n      produce: ['Oficio de requerimiento de subsanación (F)', 'Oficio de consulta a organismo (F)',\n                'Resolución de autorización (F)', '…'],\n    },\n    {\n      nombre: 'NOTIFICAR',\n      encuadre: ['Distribución', 'AAP', 'Consultas', 'Separata a organismo'],\n      hace: 'Hace llegar el escrito a su destinatario',\n      matiz: 'El canal no se elige: lo dice el justificante',\n      consume: ['Oficio de consulta a organismo (F)', 'Oficio de requerimiento de subsanación (F)',\n                'Resolución de autorización (F)', 'Acuse del primer intento postal', '…'],\n      produce: ['Justificante Notifica-PNT', 'Justificante BandeJA', 'Justificante SIR / ARIES',\n                'Justificante notificación postal', '…'],\n    },\n    {\n      nombre: 'ESPERAR PLAZO',\n      encuadre: ['Distribución', 'AAP', 'Consultas', 'Separata a organismo'],\n      hace: 'Cuenta el plazo y recoge lo que llega',\n      matiz: 'Lo que llega lo examina después un ANALIZAR',\n      consume: ['Justificante de la notificación', 'Justificante publicación BOE', '…'],\n      produce: ['Respuesta del organismo', 'Documentación de subsanación',\n                'Informe preceptivo del Ministerio', 'Certificado de plazo cumplido', '…'],\n    },\n  ];\n  var NIVELES = ['Expediente', 'Solicitud', 'Fase', 'Trámite', 'Tarea'];\n  var PASOS_POR_TAREA = 4;              /* tarea y encuadre · qué hace · consume · produce */\n  var TX = 520, TY = 390;               /* centro de la tarea */\n  var esc = document.getElementById('escenario');\n\n  function poner(clase, paso, hasta, estilo, retardo){\n    var d = document.createElement('div');\n    d.className = clase + ' paso';\n    d.setAttribute('data-paso', paso);\n    if (hasta) d.setAttribute('data-hasta', hasta);\n    if (estilo) d.setAttribute('style', estilo);\n    if (retardo) d.style.transitionDelay = retardo + 's';\n    esc.appendChild(d);\n    return d;\n  }\n  function pildoras(cont, lista, paso, hasta){\n    var p = document.createElement('div');\n    p.className = 'pildoras';\n    lista.forEach(function(t, i){\n      var s = document.createElement('span');\n      s.className = 'pil paso';\n      s.setAttribute('data-paso', paso);\n      if (hasta) s.setAttribute('data-hasta', hasta);\n      s.style.transitionDelay = (.15 + i * .1) + 's';\n      /* «(F)» al final: documento firmado, se pinta con el icono de firma */\n      var firmado = / \\(F\\)$/.test(t);\n      s.textContent = firmado ? t.slice(0, -4) : t;\n      if (firmado) s.insertAdjacentHTML('beforeend', '<svg class=\"firma\" viewBox=\"0 0 26 16\" aria-label=\"firmado\"><use href=\"#i-firma\"/><\/svg>');\n      p.appendChild(s);\n    });\n    cont.appendChild(p);\n  }\n  /* flecha en codo: tramo recto de (x0,y0) a la esquina (xc,yc), esquina redondeada y\n     tramo recto hasta (x1,y1), donde va la punta */\n  function flecha(clase, paso, hasta, x0, y0, xc, yc, x1, y1){\n    var NS = 'http://www.w3.org/2000/svg', R = 18;\n    var svg = document.createElementNS(NS, 'svg');\n    svg.setAttribute('class', 'flecha paso ' + clase);\n    svg.setAttribute('data-paso', paso);\n    if (hasta) svg.setAttribute('data-hasta', hasta);\n    svg.setAttribute('width', 1280); svg.setAttribute('height', 720);\n    svg.setAttribute('style', 'left:0;top:0;transition-delay:.1s');\n    function unit(ax, ay, bx, by){ var l = Math.hypot(bx - ax, by - ay); return [(bx - ax) / l, (by - ay) / l]; }\n    var u1 = unit(x0, y0, xc, yc), u2 = unit(xc, yc, x1, y1);\n    var path = document.createElementNS(NS, 'path');\n    path.setAttribute('d', 'M' + x0 + ' ' + y0 +\n      ' L' + (xc - u1[0] * R) + ' ' + (yc - u1[1] * R) +\n      ' Q' + xc + ' ' + yc + ' ' + (xc + u2[0] * R) + ' ' + (yc + u2[1] * R) +\n      ' L' + x1 + ' ' + y1);\n    svg.appendChild(path);\n    var tx = u2[0], ty = u2[1];\n    var L = 16, W = 7.5;\n    var pol = document.createElementNS(NS, 'polygon');\n    pol.setAttribute('points', [x1, y1, x1 - tx * L - ty * W, y1 - ty * L + tx * W,\n                                x1 - tx * L + ty * W, y1 - ty * L - tx * W].join(' '));\n    svg.appendChild(pol);\n    esc.appendChild(svg);\n  }\n\n  TAREAS.forEach(function(t, k){\n    var p0 = 2 + k * PASOS_POR_TAREA;                       /* primer paso de esta tarea */\n    var hasta = k < TAREAS.length - 1 ? p0 + PASOS_POR_TAREA : null;\n\n    /* encuadre ESFTT y la tarea */\n    var enc = poner('c encuadre', p0, hasta, 'left:640px;top:128px');\n    t.encuadre.concat([t.nombre]).forEach(function(v, i){\n      if (i) { var s = document.createElement('span'); s.className = 'sep'; s.textContent = '›'; enc.appendChild(s); }\n      var n = document.createElement('span');\n      n.className = 'niv' + (i === 4 ? ' yo' : '');\n      n.innerHTML = '<small><\/small>';\n      n.firstChild.textContent = NIVELES[i];\n      n.appendChild(document.createTextNode(v));\n      enc.appendChild(n);\n    });\n    poner('c tarea', p0, hasta, 'left:' + TX + 'px;top:' + TY + 'px' +\n          (t.nombre.length > 10 ? ';font-size:36px' : ''), .2).textContent = t.nombre;\n\n    /* izquierda: qué hace */\n    var h = poner('c hace', p0 + 1, hasta, 'left:180px;top:' + TY + 'px');\n    h.textContent = t.hace;\n    var m = document.createElement('span'); m.textContent = t.matiz; h.appendChild(m);\n\n    /* derecha arriba: consume, con flecha que entra en la tarea */\n    var gc = poner('grupo consume', p0 + 2, hasta, 'top:190px');\n    gc.innerHTML = '<div class=\"et\"><svg class=\"ico\"><use href=\"#i-docs\"/><\/svg>Consume <span class=\"card\">N<\/span><\/div>';\n    pildoras(gc, t.consume, p0 + 2, hasta);\n    /* de Consume, en horizontal, hasta encima de la tarea y bajando a ella */\n    flecha('consume', p0 + 2, hasta, 812, 213, TX, 213, TX, TY - 48);\n\n    /* derecha abajo: produce, con flecha que sale de la tarea */\n    var gp = poner('grupo produce', p0 + 3, hasta, 'top:478px');\n    gp.innerHTML = '<div class=\"et\"><svg class=\"ico\"><use href=\"#i-doc\"/><\/svg>Produce <span class=\"card\">1<\/span>' +\n      (t.produce.length > 1 ? '<span class=\"uno\">uno de estos tipos<\/span>' : '') + '<\/div>';\n    pildoras(gp, t.produce, p0 + 3, hasta);\n    /* de la tarea, bajando y en horizontal, hasta Produce */\n    flecha('produce', p0 + 3, hasta, TX, TY + 48, TX, 501, 812, 501);\n  });\n\n  var els = [].slice.call(document.querySelectorAll('[data-paso]'));\n  var MAX = Math.max.apply(null, els.map(function(e){ return +e.getAttribute('data-paso'); }));\n  var paso = 1;\n  var ayuda = document.getElementById('ayuda');\n\n  function pintar(){\n    els.forEach(function(e){\n      var n = +e.getAttribute('data-paso'), hasta = e.getAttribute('data-hasta');\n      e.classList.toggle('on', n <= paso && (!hasta || paso < +hasta));\n    });\n  }\n  function ir(n){\n    paso = Math.max(1, Math.min(MAX, n));\n    pintar();\n    ayuda.style.opacity = 0;\n  }\n  function escalar(){\n    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);\n    esc.style.transform = 'translate(-50%,-50%) scale(' + s + ')';\n  }\n\n  document.addEventListener('keydown', function(ev){\n    var k = ev.key;\n    if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter') { ir(paso + 1); ev.preventDefault(); }\n    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { ir(paso - 1); ev.preventDefault(); }\n    else if (k === 'Home') ir(1);\n    else if (k === 'End') ir(MAX);\n  });\n  document.addEventListener('click', function(){ ir(paso + 1); });\n  window.addEventListener('resize', escalar);\n\n  escalar();\n  /* #todo muestra la ficha completa (útil para sacar una imagen); #paso=N empieza en el paso N */\n  var hs = location.hash, mm = hs.match(/paso=(\\d+)/);\n  if (hs === '#todo') { paso = MAX; ayuda.style.display = 'none'; }\n  else if (mm) paso = Math.max(1, Math.min(MAX, +mm[1]));\n  requestAnimationFrame(pintar);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"titulo": "Ficha 7 · Las tareas encadenan documentos", "html": "<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Ficha 7 · Las tareas encadenan documentos<\/title>\n<style>\n/* ===== Base común de las fichas BDDAT: copiar tal cual a cada ficha ===== */\n:root{\n  --fondo:#fff; --tarjeta:#F7F6F2; --borde:#D3D1C7; --borde-fuerte:#888780;\n  --texto:#2C2C2A; --texto-2:#5F5E5A;\n  --ida:#185FA5;      /* lo que va */\n  --vuelta:#3B6D11;   /* lo que vuelve */\n  --plan:#854F0B;     /* reservado */\n}\n*{box-sizing:border-box;margin:0}\nhtml,body{height:100%;background:var(--fondo);overflow:hidden}\nbody{font-family:\"Segoe UI\",Roboto,Arial,sans-serif;color:var(--texto)}\n\n/* Lienzo fijo de 1280x720 que se escala para caber en cualquier ventana */\n#escenario{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center}\n\n/* Aparición por pasos: cada elemento lleva data-paso=\"N\" y se muestra al llegar a N */\n.paso{opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s ease}\n.paso.on{opacity:var(--op,1);transform:none}\n\n#ayuda{position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:14px;color:#B4B2A9;\n  transition:opacity .4s}\n@media (prefers-reduced-motion:reduce){.paso,#ayuda{transition:none}}\n\n/* ===== Propio de esta ficha ===== */\n.titulo{position:absolute;left:0;right:0;top:34px;text-align:center;font-size:30px;font-weight:600}\n\n/* Tres cadenas en columna, repartidas en horizontal */\n.cadena{position:absolute;top:96px;width:390px;display:flex;flex-direction:column;align-items:center}\n.cab{text-align:center;margin-bottom:12px}\n.cab .t{font-size:21px;font-weight:700}\n.cab .s{font-size:15px;color:var(--texto-2)}\n\n.tarea{background:var(--tarjeta);border:2.5px solid var(--texto);border-radius:10px;padding:5px 18px;\n  font-size:19px;font-weight:700;letter-spacing:.4px;white-space:nowrap;text-align:center}\n.tarea small{display:block;font-size:13px;font-weight:600;letter-spacing:0;color:var(--texto-2)}\n.doc{display:flex;align-items:center;gap:7px;border:1.8px solid var(--borde-fuerte);border-radius:999px;\n  padding:3px 12px 3px 8px;background:#fff;font-size:15px;font-weight:600;white-space:nowrap;color:var(--texto)}\n.doc .i{width:16px;height:19px;flex:none;color:var(--texto-2)}\n.doc .f{width:22px;height:14px;flex:none;color:var(--texto-2)}\n.baja{width:14px;height:20px;color:var(--borde-fuerte);margin:2px 0}\n<\/style>\n<\/head>\n<body>\n<script>\n(function(){\n  var st = document.createElement('style');\n  st.textContent = '#ayuda{display:none!important}';\n  document.head.appendChild(st);\n\n  function conPaso(){ return [].slice.call(document.querySelectorAll('[data-paso]')); }\n  function maximo(){\n    return Math.max.apply(null, conPaso().map(function(e){ return +e.getAttribute('data-paso'); }));\n  }\n  function actual(){\n    var v = conPaso().filter(function(e){ return e.classList.contains('on'); })\n      .map(function(e){ return +e.getAttribute('data-paso'); });\n    return Math.max.apply(null, [1].concat(v));\n  }\n  function tecla(k){ document.dispatchEvent(new KeyboardEvent('keydown', {key: k, bubbles: true})); }\n\n  window.addEventListener('message', function(ev){\n    var m = ev.data || {};\n    if (m.cmd === 'next') {\n      if (actual() >= maximo()) parent.postMessage({fin: 'fin'}, '*'); else tecla('ArrowRight');\n    } else if (m.cmd === 'prev') {\n      if (actual() <= 1) parent.postMessage({fin: 'inicio'}, '*'); else tecla('ArrowLeft');\n    } else if (m.cmd === 'ultimo') {\n      tecla('End');\n    }\n  });\n\n  var NAV = {ArrowRight:1, ArrowLeft:1, ArrowUp:1, ArrowDown:1, ' ':1, PageDown:1, PageUp:1,\n             Enter:1, Backspace:1, Home:1, End:1, f:1, F:1};\n  document.addEventListener('keydown', function(e){\n    if (!e.isTrusted || !NAV[e.key]) return;\n    e.stopImmediatePropagation(); e.preventDefault();\n    parent.postMessage({tecla: e.key}, '*');\n  }, true);\n  document.addEventListener('click', function(e){\n    if (!e.isTrusted) return;\n    e.stopImmediatePropagation();\n    parent.postMessage({cmd: 'next'}, '*');\n  }, true);\n\n  window.addEventListener('load', function(){\n    setTimeout(function(){\n      window.dispatchEvent(new Event('resize'));\n      parent.postMessage({listo: true}, '*');\n    }, 60);\n  });\n})();\n<\/script>\n\n<svg width=\"0\" height=\"0\" style=\"position:absolute\" aria-hidden=\"true\">\n  <symbol id=\"i-doc\" viewBox=\"0 0 40 46\" fill=\"#fff\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linejoin=\"round\">\n    <path d=\"M8 3h18l9 9v31H8z\"/><path d=\"M26 3v9h9\"/>\n    <path fill=\"none\" stroke-width=\"2.2\" stroke-linecap=\"round\" d=\"M13 21h17M13 28h17M13 35h12\"/>\n  <\/symbol>\n  <symbol id=\"i-firma\" viewBox=\"0 0 26 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n    <path d=\"M2 11c2-5 4-8 5-6s-1 7 1 7 3-6 5-6 1 5 3 5 3-3 4-4 2 1 3 1\"/>\n    <path d=\"M2 15h22\" stroke-width=\"1.4\" opacity=\".6\"/>\n  <\/symbol>\n  <symbol id=\"i-baja\" viewBox=\"0 0 14 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n    <path d=\"M7 2v15M3 13l4 5 4-5\"/>\n  <\/symbol>\n<\/svg>\n\n<div id=\"escenario\">\n  <div class=\"bloque-tag\" style=\"position:absolute;left:28px;top:16px;font-size:13px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#B4B2A9\">2 · La estructura<\/div>\n  <div class=\"titulo\">Las tareas encadenan documentos<\/div>\n<\/div>\n\n<div id=\"ayuda\">← → o clic para avanzar<\/div>\n\n<script>\n(function(){\n  /* Tres trámites de ESTRUCTURA_FTT. Cadena: documento, tarea, documento, tarea…\n     Un documento entre dos tareas lo produce la de arriba y lo consume la de abajo.\n     Texto acabado en « (F)»: documento firmado. Tarea con «·»: lleva subtítulo. */\n  var CADENAS = [\n    { t: 'Requerimiento de subsanación', s: 'Fase: Análisis de solicitud', x: 213, items: [\n      'd:Diagnóstico de análisis', 't:ELABORAR', 'd:Oficio de requerimiento de subsanación (F)',\n      't:NOTIFICAR', 'd:Justificante Notifica-PNT', 't:ESPERAR PLAZO', 'd:Documentación de subsanación',\n      't:ANALIZAR', 'd:Diagnóstico de análisis'] },\n    { t: 'Separata a organismo', s: 'Fase: Consultas', x: 640, items: [\n      'd:Separata del proyecto', 't:ELABORAR', 'd:Oficio de consulta a organismo (F)',\n      't:NOTIFICAR', 'd:Justificante BandeJA', 't:ESPERAR PLAZO', 'd:Respuesta del organismo',\n      't:ANALIZAR', 'd:Diagnóstico de análisis'] },\n    { t: 'Anuncio en el BOP', s: 'Fase: Información pública', x: 1067, items: [\n      'd:Anuncio de información pública', 't:ELABORAR', 'd:Oficio de remisión del anuncio (F)',\n      't:NOTIFICAR', 'd:Justificante SIR', 't:ESPERAR PLAZO·publicación',\n      'd:Anuncio publicado en el BOP', 't:ESPERAR PLAZO·alegaciones', 'd:Certificado de plazo cumplido'] },\n  ];\n  var esc = document.getElementById('escenario');\n\n  CADENAS.forEach(function(c, k){\n    var paso = 2 + k;\n    var col = document.createElement('div');\n    col.className = 'cadena';\n    col.style.left = (c.x - 195) + 'px';\n    var cab = document.createElement('div');\n    cab.className = 'cab paso';\n    cab.setAttribute('data-paso', paso);\n    cab.innerHTML = '<div class=\"t\"><\/div><div class=\"s\"><\/div>';\n    cab.firstChild.textContent = c.t;\n    cab.lastChild.textContent = c.s;\n    col.appendChild(cab);\n\n    c.items.forEach(function(it, i){\n      var retardo = .15 + i * .14;\n      if (i) {\n        var b = document.createElement('div');\n        b.className = 'paso';\n        b.setAttribute('data-paso', paso);\n        b.style.transitionDelay = (retardo - .07) + 's';\n        b.innerHTML = '<svg class=\"baja\"><use href=\"#i-baja\"/><\/svg>';\n        col.appendChild(b);\n      }\n      var e = document.createElement('div');\n      e.setAttribute('data-paso', paso);\n      e.style.transitionDelay = retardo + 's';\n      var tipo = it.slice(0, 2), txt = it.slice(2);\n      if (tipo === 't:') {\n        var partes = txt.split('·');\n        e.className = 'tarea paso';\n        e.textContent = partes[0];\n        if (partes[1]) { var sm = document.createElement('small'); sm.textContent = partes[1]; e.appendChild(sm); }\n      } else {\n        var firmado = / \\(F\\)$/.test(txt);\n        e.className = 'doc paso';\n        e.innerHTML = '<svg class=\"i\"><use href=\"#i-doc\"/><\/svg><span><\/span>' +\n          (firmado ? '<svg class=\"f\" aria-label=\"firmado\"><use href=\"#i-firma\"/><\/svg>' : '');\n        e.querySelector('span').textContent = firmado ? txt.slice(0, -4) : txt;\n      }\n      col.appendChild(e);\n    });\n    esc.appendChild(col);\n  });\n\n  var els = [].slice.call(document.querySelectorAll('[data-paso]'));\n  var MAX = Math.max.apply(null, els.map(function(e){ return +e.getAttribute('data-paso'); }));\n  var paso = 1;\n  var ayuda = document.getElementById('ayuda');\n\n  function pintar(){\n    els.forEach(function(e){ e.classList.toggle('on', +e.getAttribute('data-paso') <= paso); });\n  }\n  function ir(n){\n    paso = Math.max(1, Math.min(MAX, n));\n    pintar();\n    ayuda.style.opacity = 0;\n  }\n  function escalar(){\n    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);\n    esc.style.transform = 'translate(-50%,-50%) scale(' + s + ')';\n  }\n\n  document.addEventListener('keydown', function(ev){\n    var k = ev.key;\n    if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter') { ir(paso + 1); ev.preventDefault(); }\n    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { ir(paso - 1); ev.preventDefault(); }\n    else if (k === 'Home') ir(1);\n    else if (k === 'End') ir(MAX);\n  });\n  document.addEventListener('click', function(){ ir(paso + 1); });\n  window.addEventListener('resize', escalar);\n\n  escalar();\n  /* #todo muestra la ficha completa (útil para sacar una imagen); #paso=N empieza en el paso N */\n  var hs = location.hash, mm = hs.match(/paso=(\\d+)/);\n  if (hs === '#todo') { paso = MAX; ayuda.style.display = 'none'; }\n  else if (mm) paso = Math.max(1, Math.min(MAX, +mm[1]));\n  requestAnimationFrame(pintar);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"titulo": "Ficha 8 · El estado se deriva", "html": "<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Ficha 8 · El estado se deriva<\/title>\n<style>\n/* ===== Base común de las fichas BDDAT: copiar tal cual a cada ficha ===== */\n:root{\n  --fondo:#fff; --tarjeta:#F7F6F2; --borde:#D3D1C7; --borde-fuerte:#888780;\n  --texto:#2C2C2A; --texto-2:#5F5E5A;\n  --ida:#185FA5;      /* lo que va */\n  --vuelta:#3B6D11;   /* lo que vuelve */\n  --plan:#854F0B;     /* reservado */\n}\n*{box-sizing:border-box;margin:0}\nhtml,body{height:100%;background:var(--fondo);overflow:hidden}\nbody{font-family:\"Segoe UI\",Roboto,Arial,sans-serif;color:var(--texto)}\n\n/* Lienzo fijo de 1280x720 que se escala para caber en cualquier ventana */\n#escenario{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center}\n\n/* Aparición por pasos: cada elemento lleva data-paso=\"N\" y se muestra al llegar a N */\n.paso{opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s ease}\n.paso.on{opacity:var(--op,1);transform:none}\n\n#ayuda{position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:14px;color:#B4B2A9;\n  transition:opacity .4s}\n@media (prefers-reduced-motion:reduce){.paso,#ayuda{transition:none}}\n\n/* ===== Propio de esta ficha ===== */\n.titulo{position:absolute;left:0;right:0;top:34px;text-align:center;font-size:30px;font-weight:600}\n/* Los seis colores del semáforo de BDDAT */\n:root{--s-rojo:#C2362B;--s-naranja:#D9731F;--s-amarillo:#D9B300;--s-azul:#185FA5;--s-gris:#9A9890;--s-verde:#3B6D11}\n\n/* El árbol: fase → trámites → tareas */\n#ramas{position:absolute;left:0;top:0;width:1280px;height:720px;overflow:visible}\n#ramas path{fill:none;stroke:var(--borde-fuerte);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}\n.nodo{position:absolute;display:flex;align-items:center;gap:8px;border:2px solid var(--borde-fuerte);border-radius:9px;\n  background:#fff;padding:6px 10px;font-size:16px;font-weight:700;white-space:nowrap}\n.nodo.fase{font-size:20px;background:var(--tarjeta);padding:10px 14px}\n.nodo.tram{background:var(--tarjeta)}\n.nodo small{display:block;font-size:12px;font-weight:600;color:var(--texto-2)}\n.punto{width:16px;height:16px;border-radius:50%;flex:none;border:2px solid #fff;box-shadow:0 0 0 1.5px currentColor;background:currentColor}\n.punto.grande{width:20px;height:20px}\n.rojo{color:var(--s-rojo)} .naranja{color:var(--s-naranja)} .amarillo{color:var(--s-amarillo)}\n.azul{color:var(--s-azul)} .gris{color:var(--s-gris)} .verde{color:var(--s-verde)}\n.nodo .t{color:var(--texto)}\n.porque{position:absolute;font-size:13px;font-weight:600;color:var(--texto-2);white-space:nowrap}\n.regla{position:absolute;font-size:16px;color:var(--texto-2);white-space:nowrap}\n.regla b{color:var(--texto)}\n\n/* El listado de seguimiento: una fila por solicitud */\n.listado{position:absolute;left:40px;top:540px;width:820px;border:2px solid var(--borde-fuerte);border-radius:10px;overflow:hidden;background:#fff}\n.listado .cab,.listado .fila{display:grid;grid-template-columns:80px 110px 1fr 104px 104px 104px 104px;align-items:center}\n.listado .cab{background:var(--tarjeta);font-size:13px;font-weight:700;color:var(--texto-2);text-transform:uppercase;letter-spacing:.4px}\n.listado .cab span,.listado .fila span{padding:7px 10px}\n.listado .fila{font-size:16px;border-top:1px solid var(--borde)}\n.et{display:inline-block;font-style:normal;font-size:12px;font-weight:700;letter-spacing:.4px;border-radius:6px;padding:3px 8px;color:#fff}\n.et.verde{background:var(--s-verde)} .et.amarillo{background:var(--s-amarillo);color:#2C2C2A} .et.gris{background:var(--s-gris)}\n\n/* La leyenda de colores */\n.leyenda{position:absolute;left:910px;top:430px;width:330px;display:flex;flex-direction:column;gap:7px}\n.leyenda h3{font-size:18px;font-weight:700;margin-bottom:2px}\n.leyenda div{display:flex;align-items:center;gap:10px;font-size:16px}\n.leyenda .punto{width:14px;height:14px}\n<\/style>\n<\/head>\n<body>\n<script>\n(function(){\n  var st = document.createElement('style');\n  st.textContent = '#ayuda{display:none!important}';\n  document.head.appendChild(st);\n\n  function conPaso(){ return [].slice.call(document.querySelectorAll('[data-paso]')); }\n  function maximo(){\n    return Math.max.apply(null, conPaso().map(function(e){ return +e.getAttribute('data-paso'); }));\n  }\n  function actual(){\n    var v = conPaso().filter(function(e){ return e.classList.contains('on'); })\n      .map(function(e){ return +e.getAttribute('data-paso'); });\n    return Math.max.apply(null, [1].concat(v));\n  }\n  function tecla(k){ document.dispatchEvent(new KeyboardEvent('keydown', {key: k, bubbles: true})); }\n\n  window.addEventListener('message', function(ev){\n    var m = ev.data || {};\n    if (m.cmd === 'next') {\n      if (actual() >= maximo()) parent.postMessage({fin: 'fin'}, '*'); else tecla('ArrowRight');\n    } else if (m.cmd === 'prev') {\n      if (actual() <= 1) parent.postMessage({fin: 'inicio'}, '*'); else tecla('ArrowLeft');\n    } else if (m.cmd === 'ultimo') {\n      tecla('End');\n    }\n  });\n\n  var NAV = {ArrowRight:1, ArrowLeft:1, ArrowUp:1, ArrowDown:1, ' ':1, PageDown:1, PageUp:1,\n             Enter:1, Backspace:1, Home:1, End:1, f:1, F:1};\n  document.addEventListener('keydown', function(e){\n    if (!e.isTrusted || !NAV[e.key]) return;\n    e.stopImmediatePropagation(); e.preventDefault();\n    parent.postMessage({tecla: e.key}, '*');\n  }, true);\n  document.addEventListener('click', function(e){\n    if (!e.isTrusted) return;\n    e.stopImmediatePropagation();\n    parent.postMessage({cmd: 'next'}, '*');\n  }, true);\n\n  window.addEventListener('load', function(){\n    setTimeout(function(){\n      window.dispatchEvent(new Event('resize'));\n      parent.postMessage({listo: true}, '*');\n    }, 60);\n  });\n})();\n<\/script>\n\n<div id=\"escenario\">\n  <div class=\"bloque-tag\" style=\"position:absolute;left:28px;top:16px;font-size:13px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#B4B2A9\">2 · La estructura<\/div>\n  <div class=\"titulo\">El estado se deriva, no se apunta<\/div>\n\n  <svg id=\"ramas\" viewBox=\"0 0 1280 720\" aria-hidden=\"true\">\n    <g class=\"paso\" data-paso=\"2\">\n      <path d=\"M394 158 H416\"/><path d=\"M551 158 H572\"/><path d=\"M710 158 H731\"/>\n      <path d=\"M394 258 H416\"/>\n      <path d=\"M394 358 H416\"/><path d=\"M551 358 H572\"/>\n    <\/g>\n    <g class=\"paso\" data-paso=\"3\"><path d=\"M206 258 H226 V158 H246 M226 258 H246 M226 258 V358 H246\"/><\/g>\n  <\/svg>\n\n  <!-- 2 · Las tareas: su color sale de sus documentos -->\n  <div class=\"nodo paso\" data-paso=\"2\" style=\"left:416px;top:138px\"><span class=\"punto verde\"><\/span><span class=\"t\">ELABORAR<small>firmado<\/small><\/span><\/div>\n  <div class=\"nodo paso\" data-paso=\"2\" style=\"left:572px;top:138px\"><span class=\"punto verde\"><\/span><span class=\"t\">NOTIFICAR<small>justificante<\/small><\/span><\/div>\n  <div class=\"nodo paso\" data-paso=\"2\" style=\"left:731px;top:138px\"><span class=\"punto gris\"><\/span><span class=\"t\">ESPERAR PLAZO<small>corre el plazo<\/small><\/span><\/div>\n  <div class=\"nodo paso\" data-paso=\"2\" style=\"left:416px;top:238px;transition-delay:.15s\"><span class=\"punto amarillo\"><\/span><span class=\"t\">ELABORAR<small>PDF para firma<\/small><\/span><\/div>\n  <div class=\"nodo paso\" data-paso=\"2\" style=\"left:416px;top:338px;transition-delay:.3s\"><span class=\"punto verde\"><\/span><span class=\"t\">ELABORAR<small>firmado<\/small><\/span><\/div>\n  <div class=\"nodo paso\" data-paso=\"2\" style=\"left:572px;top:338px;transition-delay:.3s\"><span class=\"punto azul\"><\/span><span class=\"t\">NOTIFICAR<small>falta el justificante<\/small><\/span><\/div>\n  <div class=\"regla paso\" data-paso=\"2\" style=\"left:960px;top:230px;transition-delay:.5s\">el color de una tarea<br><b>sale de sus documentos<\/b><\/div>\n\n  <!-- 3 · Los trámites: el más urgente de sus tareas -->\n  <div class=\"nodo tram paso\" data-paso=\"3\" style=\"left:246px;top:138px\"><span class=\"punto gris\"><\/span><span class=\"t\">Separata ADIF<\/span><\/div>\n  <div class=\"nodo tram paso\" data-paso=\"3\" style=\"left:246px;top:238px\"><span class=\"punto amarillo\"><\/span><span class=\"t\">Separata Ayto.<\/span><\/div>\n  <div class=\"nodo tram paso\" data-paso=\"3\" style=\"left:246px;top:338px\"><span class=\"punto azul\"><\/span><span class=\"t\">Separata CHG<\/span><\/div>\n\n  <!-- 4 · La fase: el más urgente de sus trámites -->\n  <div class=\"nodo fase paso\" data-paso=\"4\" style=\"left:40px;top:232px\"><span class=\"punto grande amarillo\"><\/span><span class=\"t\">Consultas<\/span><\/div>\n  <div class=\"regla paso\" data-paso=\"4\" style=\"left:960px;top:330px;transition-delay:.2s\">hacia arriba,<br><b>manda lo más urgente<\/b><\/div>\n\n  <!-- 5 · El listado de seguimiento: una fila por solicitud, una columna por fase -->\n  <div class=\"listado paso\" data-paso=\"5\">\n    <div class=\"cab\"><span>N.º AT<\/span><span>Solicitud<\/span><span>Titular<\/span><span>Análisis<\/span><span>Consultas<\/span><span>IP<\/span><span>Resolución<\/span><\/div>\n    <div class=\"fila\"><span><b>AT-7<\/b><\/span><span>AAP+AAC<\/span><span>Promotora Solar S.L.<\/span>\n      <span><i class=\"et verde\">FIN<\/i><\/span><span><i class=\"et amarillo\">FIRMA<\/i><\/span><span><i class=\"et gris\">PLAZOS<\/i><\/span><span><\/span><\/div>\n  <\/div>\n  <div class=\"regla paso\" data-paso=\"5\" style=\"left:40px;top:480px;transition-delay:.2s\">el listado lee el mismo cálculo: <b>nadie actualiza el estado a mano<\/b><\/div>\n\n  <!-- 6 · Los seis colores -->\n  <div class=\"leyenda paso\" data-paso=\"6\">\n    <h3>Qué dice cada color<\/h3>\n    <div><span class=\"punto rojo\"><\/span>actúa el tramitador<\/div>\n    <div><span class=\"punto naranja\"><\/span>gestión nuestra: cerrar, reintentar<\/div>\n    <div><span class=\"punto amarillo\"><\/span>en firma<\/div>\n    <div><span class=\"punto azul\"><\/span>espera a un externo<\/div>\n    <div><span class=\"punto gris\"><\/span>corre un plazo<\/div>\n    <div><span class=\"punto verde\"><\/span>terminado<\/div>\n  <\/div>\n<\/div>\n\n<div id=\"ayuda\">← → o clic para avanzar<\/div>\n\n<script>\n(function(){\n  var els = [].slice.call(document.querySelectorAll('[data-paso]'));\n  var MAX = Math.max.apply(null, els.map(function(e){ return +e.getAttribute('data-paso'); }));\n  var paso = 1;\n  var esc = document.getElementById('escenario');\n  var ayuda = document.getElementById('ayuda');\n\n  function pintar(){\n    els.forEach(function(e){ e.classList.toggle('on', +e.getAttribute('data-paso') <= paso); });\n  }\n  function ir(n){\n    paso = Math.max(1, Math.min(MAX, n));\n    pintar();\n    ayuda.style.opacity = 0;\n  }\n  function escalar(){\n    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);\n    esc.style.transform = 'translate(-50%,-50%) scale(' + s + ')';\n  }\n\n  document.addEventListener('keydown', function(ev){\n    var k = ev.key;\n    if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter') { ir(paso + 1); ev.preventDefault(); }\n    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { ir(paso - 1); ev.preventDefault(); }\n    else if (k === 'Home') ir(1);\n    else if (k === 'End') ir(MAX);\n  });\n  document.addEventListener('click', function(){ ir(paso + 1); });\n  window.addEventListener('resize', escalar);\n\n  escalar();\n  /* #todo muestra la ficha completa (útil para sacar una imagen); #paso=N empieza en el paso N */\n  var hs = location.hash, mm = hs.match(/paso=(\\d+)/);\n  if (hs === '#todo') { paso = MAX; ayuda.style.display = 'none'; }\n  else if (mm) paso = Math.max(1, Math.min(MAX, +mm[1]));\n  requestAnimationFrame(pintar);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"titulo": "Ficha 9 · De la norma al escape", "html": "<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Ficha 9 · De la norma al escape<\/title>\n<style>\n/* ===== Base común de las fichas BDDAT: copiar tal cual a cada ficha ===== */\n:root{\n  --fondo:#fff; --tarjeta:#F7F6F2; --borde:#D3D1C7; --borde-fuerte:#888780;\n  --texto:#2C2C2A; --texto-2:#5F5E5A;\n  --ida:#185FA5;      /* lo que va */\n  --vuelta:#3B6D11;   /* lo que vuelve */\n  --plan:#854F0B;     /* reservado */\n}\n*{box-sizing:border-box;margin:0}\nhtml,body{height:100%;background:var(--fondo);overflow:hidden}\nbody{font-family:\"Segoe UI\",Roboto,Arial,sans-serif;color:var(--texto)}\n\n/* Lienzo fijo de 1280x720 que se escala para caber en cualquier ventana */\n#escenario{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center}\n\n/* Aparición por pasos: cada elemento lleva data-paso=\"N\" y se muestra al llegar a N */\n.paso{opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s ease}\n.paso.on{opacity:var(--op,1);transform:none}\n\n#ayuda{position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:14px;color:#B4B2A9;\n  transition:opacity .4s}\n@media (prefers-reduced-motion:reduce){.paso,#ayuda,.modo .cursor{transition:none}}\n\n/* ===== Propio de esta ficha ===== */\n.titulo{position:absolute;left:0;right:0;top:34px;text-align:center;font-size:30px;font-weight:600}\n:root{--rojo:#A32D2D}\n\n/* Cinco columnas: una por eslabón de la cadena */\n.col{position:absolute;top:104px;width:224px;display:flex;flex-direction:column;align-items:stretch;gap:12px}\n.cab{background:var(--tarjeta);border:2px solid var(--borde-fuerte);border-radius:10px;padding:8px 10px;\n  font-size:25px;font-weight:700;text-align:center}\n.flecha{position:absolute;top:118px;width:22px;height:24px;color:var(--borde-fuerte)}\n.flecha path{fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}\n\n.et{font-size:14px;font-weight:700;color:var(--texto-2);text-transform:uppercase;letter-spacing:.4px}\n.chips{display:flex;flex-wrap:wrap;gap:6px}\n.chip{font-size:15px;font-weight:600;color:var(--texto-2);border:1.5px solid var(--borde-fuerte);border-radius:999px;\n  padding:2px 10px;background:#fff;white-space:nowrap}\n.tarjeta{border:2px solid var(--borde-fuerte);border-radius:10px;background:#fff;padding:9px 12px;font-size:16px;line-height:1.35}\n.tarjeta b{font-weight:700}\n.tarjeta.ida{border-color:var(--ida)}\n.tarjeta.ida .ref{color:var(--ida)}\n.ref{font-size:14px;font-weight:700}\n.dato{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:2px 0;border-top:1px solid var(--borde)}\n.dato:first-of-type{border-top:none}\n.dato span:first-child{color:var(--texto-2)}\n.dato b{white-space:nowrap}\n.dato.clave b{color:var(--ida)}\n\n/* La regla como fila de una tabla: sujeto, condición, efecto, norma */\n.regla .fila{display:grid;grid-template-columns:62px 1fr;gap:6px;font-size:15px;padding:3px 0;border-top:1px solid var(--borde)}\n.regla .fila:first-child{border-top:none}\n.regla .fila > span:first-child{color:var(--texto-2)}\n.efecto{display:inline-block;font-size:13px;font-weight:700;letter-spacing:.4px;border-radius:6px;padding:1px 7px;color:#fff;background:var(--rojo)}\n\n/* Prohibición: bloquea o advierte, siempre con su porqué */\n.dos{display:flex;gap:8px}\n.dos span{flex:1;text-align:center;font-size:16px;font-weight:700;border-radius:8px;padding:5px 0;border:2px solid var(--rojo)}\n.dos .bloq{background:var(--rojo);color:#fff}\n.dos .adv{color:var(--texto-2);border-color:var(--borde-fuerte)}\n.aviso{border:2px solid var(--rojo);border-left-width:6px;border-radius:8px;background:#FBEFEF;padding:8px 10px;font-size:15px;line-height:1.35}\n.aviso b{display:block;color:var(--rojo);font-size:15px}\n.aviso .ref{color:var(--rojo)}\n\n/* Escape: seguir justificándolo, y queda en la bitácora */\n.boton{align-self:center;font-size:16px;font-weight:700;border:2px solid var(--texto);border-radius:8px;padding:6px 14px;background:#fff}\n.campo{border:1.5px dashed var(--borde-fuerte);border-radius:8px;padding:7px 10px;font-size:15px;color:var(--texto-2);background:#fff}\n.campo i{display:block;margin-top:4px;height:2px;background:var(--borde);border-radius:2px}\n.baja{align-self:center;width:16px;height:22px;color:var(--borde-fuerte)}\n.baja path{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}\n.bitacora{display:flex;align-items:center;gap:10px;border:2px solid var(--texto);border-radius:10px;background:var(--tarjeta);padding:8px 12px}\n.bitacora svg{width:30px;height:34px;flex:none;color:var(--texto)}\n.bitacora .t{font-size:18px;font-weight:700}\n.bitacora .s{font-size:14px;color:var(--texto-2)}\n\n/* El modo del motor, abajo */\n.modos{position:absolute;left:0;right:0;top:570px;display:flex;align-items:center;justify-content:center;gap:22px}\n.modos .rot{font-size:20px;font-weight:600}\n.modo{position:relative;display:flex;border:2px solid var(--texto);border-radius:999px;background:#fff;overflow:hidden}\n.modo span{position:relative;z-index:1;width:150px;text-align:center;font-size:19px;font-weight:600;padding:7px 0;\n  transition:color .3s ease}\n.modo .cursor{position:absolute;z-index:0;top:0;bottom:0;width:150px;left:0;background:var(--texto);border-radius:999px;\n  transition:left .6s ease}\n.modos .nota{font-size:17px;color:var(--texto-2)}\n<\/style>\n<\/head>\n<body>\n<script>\n(function(){\n  var st = document.createElement('style');\n  st.textContent = '#ayuda{display:none!important}';\n  document.head.appendChild(st);\n\n  function conPaso(){ return [].slice.call(document.querySelectorAll('[data-paso]')); }\n  function maximo(){\n    return Math.max.apply(null, conPaso().map(function(e){ return +e.getAttribute('data-paso'); }));\n  }\n  function actual(){\n    var v = conPaso().filter(function(e){ return e.classList.contains('on'); })\n      .map(function(e){ return +e.getAttribute('data-paso'); });\n    return Math.max.apply(null, [1].concat(v));\n  }\n  function tecla(k){ document.dispatchEvent(new KeyboardEvent('keydown', {key: k, bubbles: true})); }\n\n  window.addEventListener('message', function(ev){\n    var m = ev.data || {};\n    if (m.cmd === 'next') {\n      if (actual() >= maximo()) parent.postMessage({fin: 'fin'}, '*'); else tecla('ArrowRight');\n    } else if (m.cmd === 'prev') {\n      if (actual() <= 1) parent.postMessage({fin: 'inicio'}, '*'); else tecla('ArrowLeft');\n    } else if (m.cmd === 'ultimo') {\n      tecla('End');\n    }\n  });\n\n  var NAV = {ArrowRight:1, ArrowLeft:1, ArrowUp:1, ArrowDown:1, ' ':1, PageDown:1, PageUp:1,\n             Enter:1, Backspace:1, Home:1, End:1, f:1, F:1};\n  document.addEventListener('keydown', function(e){\n    if (!e.isTrusted || !NAV[e.key]) return;\n    e.stopImmediatePropagation(); e.preventDefault();\n    parent.postMessage({tecla: e.key}, '*');\n  }, true);\n  document.addEventListener('click', function(e){\n    if (!e.isTrusted) return;\n    e.stopImmediatePropagation();\n    parent.postMessage({cmd: 'next'}, '*');\n  }, true);\n\n  window.addEventListener('load', function(){\n    setTimeout(function(){\n      window.dispatchEvent(new Event('resize'));\n      parent.postMessage({listo: true}, '*');\n    }, 60);\n  });\n})();\n<\/script>\n\n<svg width=\"0\" height=\"0\" style=\"position:absolute\" aria-hidden=\"true\">\n  <symbol id=\"i-cuaderno\" viewBox=\"0 0 30 34\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\">\n    <path d=\"M5 2h20v30H5z\"/><path d=\"M10 2v30\"/><path d=\"M14 10h7M14 15h7M14 20h5\"/>\n  <\/symbol>\n<\/svg>\n\n<div id=\"escenario\">\n  <div class=\"bloque-tag\" style=\"position:absolute;left:28px;top:16px;font-size:13px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#B4B2A9\">3 · El control<\/div>\n  <div class=\"titulo\">De la norma al escape<\/div>\n\n  <!-- 2 · Normas -->\n  <div class=\"col paso\" data-paso=\"2\" style=\"left:40px\">\n    <div class=\"cab\">Normas<\/div>\n    <div class=\"chips\">\n      <span class=\"chip\">LSE<\/span><span class=\"chip\">RD 1955/2000<\/span><span class=\"chip\">LPACAP<\/span>\n      <span class=\"chip\">DL 26/2021<\/span><span class=\"chip\">Decreto 9/2011<\/span><span class=\"chip\">…<\/span>\n    <\/div>\n    <div class=\"tarjeta ida\">\n      <div class=\"ref\">DL 26/2021 · DF 4.ª<\/div>\n      Con AAU, la información pública es obligatoria\n    <\/div>\n  <\/div>\n\n  <svg class=\"flecha paso\" data-paso=\"3\" style=\"left:255px\" viewBox=\"0 0 22 24\"><path d=\"M3 12h15M12 5l7 7-7 7\"/><\/svg>\n\n  <!-- 3 · Contexto de tramitación -->\n  <div class=\"col paso\" data-paso=\"3\" style=\"left:286px\">\n    <div class=\"cab\">Contexto<\/div>\n    <div class=\"et\">Dónde estoy<\/div>\n    <div class=\"tarjeta\">Distribución › AAP<br><b>crear fase Resolución<\/b><\/div>\n    <div class=\"et\">Qué es cierto ahora<\/div>\n    <div class=\"tarjeta\">\n      <div class=\"dato clave\"><span>Instrumento ambiental<\/span><b>AAU<\/b><\/div>\n      <div class=\"dato clave\"><span>Información pública<\/span><b>abierta<\/b><\/div>\n      <div class=\"dato\"><span>Tensión<\/span><b>66 kV<\/b><\/div>\n      <div class=\"dato\"><span>Plazo de la IP<\/span><b>vencido<\/b><\/div>\n    <\/div>\n  <\/div>\n\n  <svg class=\"flecha paso\" data-paso=\"4\" style=\"left:501px\" viewBox=\"0 0 22 24\"><path d=\"M3 12h15M12 5l7 7-7 7\"/><\/svg>\n\n  <!-- 4 · Reglas -->\n  <div class=\"col paso\" data-paso=\"4\" style=\"left:532px\">\n    <div class=\"cab\">Reglas<\/div>\n    <div class=\"tarjeta regla\">\n      <div class=\"fila\"><span>Al crear<\/span><b>Resolución<\/b><\/div>\n      <div class=\"fila\"><span>Si<\/span><span>AAU y la información pública sin cerrar<\/span><\/div>\n      <div class=\"fila\"><span>Efecto<\/span><span><span class=\"efecto\">BLOQUEAR<\/span><\/span><\/div>\n      <div class=\"fila\"><span>Norma<\/span><b>DL 26/2021 DF 4.ª<\/b><\/div>\n    <\/div>\n    <div class=\"chips\">\n      <span class=\"chip\">un registro, no código<\/span><span class=\"chip\">con excepciones<\/span>\n      <span class=\"chip\">la vigencia es de la regla<\/span>\n    <\/div>\n  <\/div>\n\n ayuda = document.getElementById('ayuda');\n\n  /* El cursor del modo recorre Inactivo → Solo avisa → Bloquea al llegar al paso 7 */\n  var modo = document.getElementById('modo'), cursor = modo.querySelector('.cursor');\n  var opciones = [].slice.call(modo.querySelectorAll('span')), relojes = [];\n  function marcar(i){\n    cursor.style.left = (i * 150) + 'px';\n    opciones.forEach(function(s, k){ s.style.color = k === i ? '#fff' : ''; });\n  }\n  function recorrer(on){\n    relojes.forEach(clearTimeout); relojes = [];\n    if (!on) { marcar(0); return; }\n    marcar(0);\n    relojes.push(setTimeout(function(){ marcar(1); }, 900));\n    relojes.push(setTimeout(function(){ marcar(2); }, 1900));\n  }\n\n  function pintar(){\n    var antes = modo.parentNode.classList.contains('on');\n    els.forEach(function(e){ e.classList.toggle('on', +e.getAttribute('data-paso') <= paso); });\n    var ahora = paso >= 7;\n    if (ahora !== antes) recorrer(ahora);\n  }\n  function ir(n){\n    paso = Math.max(1, Math.min(MAX, n));\n    pintar();\n    ayuda.style.opacity = 0;\n  }\n  function escalar(){\n    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);\n    esc.style.transform = 'translate(-50%,-50%) scale(' + s + ')';\n  }\n\n  document.addEventListener('keydown', function(ev){\n    var k = ev.key;\n    if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter') { ir(paso + 1); ev.preventDefault(); }\n    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { ir(paso - 1); ev.preventDefault(); }\n    else if (k === 'Home') ir(1);\n    else if (k === 'End') ir(MAX);\n  });\n  document.addEventListener('click', function(){ ir(paso + 1); });\n  window.addEventListener('resize', escalar);\n\n  escalar();\n  marcar(0);\n  /* #todo muestra la ficha completa (útil para sacar una imagen); #paso=N empieza en el paso N */\n  var hs = location.hash, mm = hs.match(/paso=(\\d+)/);\n  if (hs === '#todo') { paso = MAX; ayuda.style.display = 'none';
