e-linecap=\"round\" stroke-linejoin=\"round\"/>\n  <\/svg>\n  <div class=\"canales paso\" data-paso=\"4\" style=\"transition-delay:.4s\">\n    <span class=\"canal si\">Notifica-PNT<\/span><span class=\"canal\">BandeJA<\/span><span class=\"canal\">SIR<\/span>\n    <span class=\"canal\">Postal<\/span><span class=\"canal\">Edicto en el BOE<\/span>\n  <\/div>\n\n  <!-- 5 · Cuándo: dos fechas distintas -->\n  <div class=\"sub paso\" data-paso=\"5\" style=\"left:690px;top:340px\">Cuándo<small>dos fechas, cada una con su efecto<\/small><\/div>\n  <div class=\"linea paso\" data-paso=\"5\"><\/div>\n  <div class=\"hito paso\" data-paso=\"5\" style=\"left:800px;color:var(--ida);transition-delay:.2s\">\n    <span class=\"d\">3 jun<\/span><span class=\"punto\"><\/span>\n    <span class=\"q\">puesta a disposición<\/span><span class=\"s\">cumple el deber de notificar<\/span>\n  <\/div>\n  <div class=\"hito paso\" data-paso=\"5\" style=\"left:1090px;color:var(--vuelta);transition-delay:.5s\">\n    <span class=\"d\">6 jun<\/span><span class=\"punto\"><\/span>\n    <span class=\"q\">leída<\/span><span class=\"s\">surte efectos: corren sus plazos<\/span>\n  <\/div>\n\n  <!-- 6 · En papel: dos intentos y, si fallan, el BOE -->\n  <div class=\"nota paso\" data-paso=\"6\" style=\"left:40px;top:520px\"><b>En papel<\/b>, si no se puede entregar:<\/div>\n  <div class=\"escalada paso\" data-paso=\"6\" style=\"transition-delay:.2s\">\n    <span class=\"p mal\">1.er intento fallido<\/span><span class=\"f\">→<\/span>\n    <span class=\"p mal\">2.º intento fallido<\/span><span class=\"f\">→<\/span>\n    <span class=\"p boe\">anuncio en el BOE<\/span>\n  <\/div>\n<\/div>\n\n<div id=\"ayuda\">← → o clic para avanzar<\/div>\n\n<script>\n(function(){\n  var els = [].slice.call(document.querySelectorAll('[data-paso]'));\n  var MAX = Math.max.apply(null, els.map(function(e){ return +e.getAttribute('data-paso'); }));\n  var paso = 1;\n  var esc = document.getElementById('escenario');\n  var ayuda = document.getElementById('ayuda');\n\n  function pintar(){\n    els.forEach(function(e){ e.classList.toggle('on', +e.getAttribute('data-paso') <= paso); });\n  }\n  function ir(n){\n    paso = Math.max(1, Math.min(MAX, n));\n    pintar();\n    ayuda.style.opacity = 0;\n  }\n  function escalar(){\n    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);\n    esc.style.transform = 'translate(-50%,-50%) scale(' + s + ')';\n  }\n\n  document.addEventListener('keydown', function(ev){\n    var k = ev.key;\n    if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter') { ir(paso + 1); ev.preventDefault(); }\n    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { ir(paso - 1); ev.preventDefault(); }\n    else if (k === 'Home') ir(1);\n    else if (k === 'End') ir(MAX);\n  });\n  document.addEventListener('click', function(){ ir(paso + 1); });\n  window.addEventListener('resize', escalar);\n\n  escalar();\n  /* #todo muestra la ficha completa (útil para sacar una imagen); #paso=N empieza en el paso N */\n  var hs = location.hash, mm = hs.match(/paso=(\\d+)/);\n  if (hs === '#todo') { paso = MAX; ayuda.style.display = 'none'; }\n  else if (mm) paso = Math.max(1, Math.min(MAX, +mm[1]));\n  requestAnimationFrame(pintar);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"titulo": "Ficha 13 · Plazos", "html": "<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Ficha 13 · Plazos<\/title>\n<style>\n/* ===== Base común de las fichas BDDAT: copiar tal cual a cada ficha ===== */\n:root{\n  --fondo:#fff; --tarjeta:#F7F6F2; --borde:#D3D1C7; --borde-fuerte:#888780;\n  --texto:#2C2C2A; --texto-2:#5F5E5A;\n  --ida:#185FA5;      /* lo que va */\n  --vuelta:#3B6D11;   /* lo que vuelve */\n  --plan:#854F0B;     /* reservado */\n}\n*{box-sizing:border-box;margin:0}\nhtml,body{height:100%;background:var(--fondo);overflow:hidden}\nbody{font-family:\"Segoe UI\",Roboto,Arial,sans-serif;color:var(--texto)}\n\n/* Lienzo fijo de 1280x720 que se escala para caber en cualquier ventana */\n#escenario{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center}\n\n/* Aparición por pasos: cada elemento lleva data-paso=\"N\" y se muestra al llegar a N;\n   con data-hasta=\"M\" se vuelve a ocultar al llegar a M */\n.paso{opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s ease}\n.paso.on{opacity:var(--op,1);transform:none}\n\n#ayuda{position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:14px;color:#B4B2A9;\n  transition:opacity .4s}\n@media (prefers-reduced-motion:reduce){.paso,#ayuda,.relleno{transition:none}}\n\n/* ===== Propio de esta ficha ===== */\n.titulo{position:absolute;left:0;right:0;top:34px;text-align:center;font-size:30px;font-weight:600}\n:root{--tiempo:#7A3E9D;--tiempo-claro:#EFE6F4;--rojo:#A32D2D}\n\n/* Izquierda: una entrada del catálogo */\n.entrada{position:absolute;left:40px;top:104px;width:430px;border:2.5px solid var(--texto);border-radius:12px;\n  background:var(--tarjeta);padding:12px 16px}\n.entrada h3{font-size:21px;font-weight:700}\n.entrada h3 small{font-size:14px;font-weight:600;color:var(--texto-2);margin-left:6px}\n.entrada .ej{font-size:15px;color:var(--texto-2);margin:2px 0 8px}\n.campo{display:grid;grid-template-columns:104px 1fr;gap:8px;padding:6px 0;border-top:1px solid var(--borde);font-size:17px}\n.campo span:first-child{font-size:14px;font-weight:700;color:var(--texto-2);text-transform:uppercase;letter-spacing:.4px;padding-top:2px}\n.campo b{font-weight:700}\n.campo.tiempo b{color:var(--tiempo)}\n.campo.efecto b{color:var(--rojo)}\n\n/* Derecha: el cómputo sobre el calendario */\n.cal{position:absolute;left:520px;top:150px;width:720px;height:250px}\n.dia{position:absolute;z-index:1;top:58px;width:44px;height:40px;border:1.5px solid var(--borde);background:transparent;\n  font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;color:var(--texto-2)}\n.dia.inh{background:repeating-linear-gradient(135deg,transparent 0 5px,rgba(136,135,128,.22) 5px 9px);color:#B4B2A9}\n.dia.disparo{border-color:var(--texto);color:var(--texto)}\n.cuenta{position:absolute;top:102px;width:44px;text-align:center;font-size:13px;font-weight:700;color:var(--tiempo)}\n.relleno{position:absolute;z-index:0;top:58px;height:40px;background:var(--tiempo-claro);border:2px solid var(--tiempo);\n  border-radius:4px;transition:width .8s ease}\n.marca{position:absolute;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:15px;font-weight:700;\n  translate:-50% 0;white-space:nowrap}\n.marca .palo{width:2px;height:22px;background:currentColor}\n.pildoc{display:flex;align-items:center;gap:6px;border:1.8px solid currentColor;border-radius:999px;padding:3px 11px;\n  background:#fff;font-size:14px;font-weight:600}\n.pildoc svg{width:14px;height:17px}\n.estado{position:absolute;font-size:17px;font-weight:700;border-radius:999px;padding:4px 14px;white-space:nowrap}\n.estado.corre{background:var(--tiempo-claro);color:var(--tiempo)}\n.estado.cumplido{background:#E7F0DF;color:var(--vuelta)}\n.nota{position:absolute;font-size:16px;color:var(--texto-2);white-space:nowrap}\n.nota b{color:var(--texto)}\n\n/* Abajo: el plazo de resolver y la suspensión */\n.resolver{position:absolute;left:40px;right:40px;top:470px;height:180px}\n.resolver .rot{position:absolute;left:0;top:0;font-size:21px;font-weight:700}\n.resolver .rot small{font-size:16px;font-weight:600;color:var(--texto-2);margin-left:8px}\n.barra{position:absolute;top:58px;height:34px;border:2px solid var(--tiempo);background:var(--tiempo-claro);border-radius:6px}\n.barra.parada{background:repeating-linear-gradient(135deg,#fff 0 6px,var(--tiempo-claro) 6px 12px);border-style:dashed}\n.barra.extra{border-style:dashed;background:#fff}\n.hito{position:absolute;top:100px;translate:-50% 0;font-size:15px;font-weight:600;color:var(--texto-2);white-space:nowrap;text-align:center}\n.hito b{display:block;color:var(--texto)}\n<\/style>\n<\/head>\n<body>\n<script>\n(function(){\n  var st = document.createElement('style');\n  st.textContent = '#ayuda{display:none!important}';\n  document.head.appendChild(st);\n\n  function conPaso(){ return [].slice.call(document.querySelectorAll('[data-paso]')); }\n  function maximo(){\n    return Math.max.apply(null, conPaso().map(function(e){ return +e.getAttribute('data-paso'); }));\n  }\n  function actual(){\n    var v = conPaso().filter(function(e){ return e.classList.contains('on'); })\n      .map(function(e){ return +e.getAttribute('data-paso'); });\n    return Math.max.apply(null, [1].concat(v));\n  }\n  function tecla(k){ document.dispatchEvent(new KeyboardEvent('keydown', {key: k, bubbles: true})); }\n\n  window.addEventListener('message', function(ev){\n    var m = ev.data || {};\n    if (m.cmd === 'next') {\n      if (actual() >= maximo()) parent.postMessage({fin: 'fin'}, '*'); else tecla('ArrowRight');\n    } else if (m.cmd === 'prev') {\n      if (actual() <= 1) parent.postMessage({fin: 'inicio'}, '*'); else tecla('ArrowLeft');\n    } else if (m.cmd === 'ultimo') {\n      tecla('End');\n    }\n  });\n\n  var NAV = {ArrowRight:1, ArrowLeft:1, ArrowUp:1, ArrowDown:1, ' ':1, PageDown:1, PageUp:1,\n             Enter:1, Backspace:1, Home:1, End:1, f:1, F:1};\n  document.addEventListener('keydown', function(e){\n    if (!e.isTrusted || !NAV[e.key]) return;\n    e.stopImmediatePropagation(); e.preventDefault();\n    parent.postMessage({tecla: e.key}, '*');\n  }, true);\n  document.addEventListener('click', function(e){\n    if (!e.isTrusted) return;\n    e.stopImmediatePropagation();\n    parent.postMessage({cmd: 'next'}, '*');\n  }, true);\n\n  window.addEventListener('load', function(){\n    setTimeout(function(){\n      window.dispatchEvent(new Event('resize'));\n      parent.postMessage({listo: true}, '*');\n    }, 60);\n  });\n})();\n<\/script>\n\n<svg width=\"0\" height=\"0\" style=\"position:absolute\" aria-hidden=\"true\">\n  <symbol id=\"i-doc\" viewBox=\"0 0 40 46\" fill=\"#fff\" stroke=\"currentColor\" stroke-width=\"2.8\" stroke-linejoin=\"round\">\n    <path d=\"M8 3h18l9 9v31H8z\"/><path d=\"M26 3v9h9\"/>\n  <\/symbol>\n<\/svg>\n\n<div id=\"escenario\">\n  <div class=\"bloque-tag\" style=\"position:absolute;left:28px;top:16px;font-size:13px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#B4B2A9\">4 · Con quién y cuándo<\/div>\n  <div class=\"titulo\">Plazos<\/div>\n\n  <!-- 2 · Una entrada del catálogo -->\n  <div class=\"entrada paso\" data-paso=\"2\">\n    <h3>Catálogo de plazos<small>editable<\/small><\/h3>\n    <div class=\"ej\">una entrada: el requerimiento de subsanación<\/div>\n    <div class=\"campo\"><span>Dónde<\/span><span>Análisis de solicitud › Requerimiento › Esperar plazo<\/span><\/div>\n    <div class=\"campo\"><span>Desde<\/span><span>el justificante de la notificación<\/span><\/div>\n    <div class=\"campo tiempo\"><span>Cuánto<\/span><b>10 días hábiles<\/b><\/div>\n    <div class=\"campo\"><span>Cumple<\/span><span>la documentación de subsanación<\/span><\/div>\n    <div class=\"campo efecto\"><span>Si vence<\/span><b>se le tiene por desistido<\/b><\/div>\n    <div class=\"campo\"><span>Norma<\/span><span>LPACAP art. 68.1<\/span><\/div>\n  <\/div>\n\n  <!-- 3 a 5 · El cómputo, sobre el calendario -->\n  <div class=\"cal\" id=\"cal\"><\/div>\n<\/div>\n\n<div id=\"ayuda\">← → o clic para avanzar<\/div>\n\n<script>\n(function(){\n  var esc = document.getElementById('escenario');\n  var cal = document.getElementById('cal');\n  function poner(padre, html, clase, paso, hasta, estilo, retardo){\n    var d = document.createElement('div');\n    d.className = clase + ' paso';\n    d.setAttribute('data-paso', paso);\n    if (hasta) d.setAttribute('data-hasta', hasta);\n    if (estilo) d.setAttribute('style', estilo);\n    if (retardo) d.style.transitionDelay = retardo + 's';\n    d.innerHTML = html;\n    padre.appendChild(d);\n    return d;\n  }\n  var DOC = '<svg><use href=\"#i-doc\"/><\/svg>';\n\n  /* Quince días de calendario, del lunes 4 al lunes 18; sábados y domingos, inhábiles */\n  var W = 44, X0 = 20, INH = {9: 1, 10: 1, 16: 1, 17: 1};\n  function x(dia){ return X0 + (dia - 4) * W; }\n  var habil = 0;\n  for (var d = 4; d <= 18; d++) {\n    var c = poner(cal, String(d), 'dia' + (INH[d] ? ' inh' : '') + (d === 4 ? ' disparo' : ''), 3, null,\n                  'left:' + x(d) + 'px', .02 * (d - 4));\n    if (d > 4 && !INH[d]) poner(cal, String(++habil), 'cuenta', 3, null, 'left:' + x(d) + 'px', .3 + .03 * habil);\n  }\n  /* disparo: el justificante de la notificación; vencimiento: el décimo hábil */\n  poner(cal, '<span class=\"pildoc\" style=\"color:var(--ida)\">' + DOC + 'justificante de la notificación<\/span><span class=\"palo\"><\/span>',\n        'marca', 3, null, 'left:' + (x(4) + 21) + 'px;top:0;color:var(--ida);translate:0 0;align-items:flex-start');\n  poner(cal, '<span>vence<\/span><span class=\"palo\"><\/span>', 'marca', 3, null,\n        'left:' + (x(18) + 22) + 'px;top:10px;color:var(--rojo)', .6);\n  poner(cal, '<b>sin sábados, domingos ni festivos<\/b>', 'nota', 3, null, 'left:' + x(4) + 'px;top:130px', .7);\n\n  /* 4 · hoy, corriendo */\n  var r1 = poner(cal, '', 'relleno', 4, 5, 'left:' + x(5) + 'px;width:0');\n  poner(cal, '<span>hoy<\/span><span class=\"palo\"><\/span>', 'marca', 4, 5,\n        'left:' + (x(11) + 44) + 'px;top:10px;color:var(--tiempo)');\n  poner(cal, 'En plazo · quedan 5 días', 'estado corre', 4, 5, 'left:' + x(4) + 'px;top:170px');\n\n  /* 5 · llega lo esperado: el plazo para y queda cumplido */\n  var r2 = poner(cal, '', 'relleno', 5, null, 'left:' + x(5) + 'px;width:0;border-color:var(--vuelta)');\n  poner(cal, '<span class=\"palo\"><\/span><span class=\"pildoc\" style=\"color:var(--vuelta)\">' + DOC + 'documentación de subsanación<\/span>',\n        'marca', 5, null, 'left:' + (x(13) + 44) + 'px;top:98px;color:var(--vuelta)', .5);\n  poner(cal, 'Cumplido', 'estado cumplido', 5, null, 'left:' + x(4) + 'px;top:170px', .7);\n  poner(cal, 'Para en lo primero que llegue: <b>cumplimiento<\/b>, <b>vencimiento<\/b> u <b>hoy<\/b>', 'nota', 5, null,\n        'left:' + (x(4) + 140) + 'px;top:175px', .9);\n\n  /* 6 y 7 · Abajo, el plazo de resolver y la suspensión */\n  var res = document.createElement('div');\n  res.className = 'resolver';\n  esc.appendChild(res);\n  poner(res, 'Plazo de resolver y notificar<small>la AAP: 3 meses desde la solicitud<\/small>', 'rot', 6);\n  poner(res, '', 'barra', 6, 7, 'left:120px;width:900px', .2);\n  poner(res, '<b>Solicitud<\/b>registro de entrada', 'hito', 6, null, 'left:120px', .3);\n  poner(res, '<b>Vence<\/b>3 meses', 'hito', 6, 7, 'left:1020px', .4);\n  /* 7: el plazo del tercero se ve como un tramo parado y el final se desplaza */\n  poner(res, '', 'barra', 7, null, 'left:120px;width:280px');\n  poner(res, '', 'barra parada', 7, null, 'left:400px;width:110px', .2);\n  poner(res, '', 'barra', 7, null, 'left:510px;width:510px', .3);\n  poner(res, '', 'barra extra', 7, null, 'left:1020px;width:110px', .5);\n  poner(res, '<b>Requerimiento<\/b>suspende', 'hito', 7, null, 'left:455px', .3);\n  poner(res, '<b>Vence<\/b>más tarde', 'hito', 7, null, 'left:1130px', .6);\n\n  /* La barra morada crece hasta su parada al llegar el paso */\n  var els = [].slice.call(document.querySelectorAll('[data-paso]'));\n  var MAX = Math.max.apply(null, els.map(function(e){ return +e.getAttribute('data-paso'); }));\n  var paso = 1;\n  var ayuda = document.getElementById('ayuda');\n\n  function pintar(){\n    els.forEach(function(e){\n      var n = +e.getAttribute('data-paso'), hasta = e.getAttribute('data-hasta');\n      e.classList.toggle('on', n <= paso && (!hasta || paso < +hasta));\n    });\n    r1.style.width = paso === 4 ? (x(12) - x(5)) + 'px' : '0';\n    r2.style.width = paso >= 5 ? (x(14) - x(5)) + 'px' : '0';\n  }\n  function ir(n){\n    paso = Math.max(1, Math.min(MAX, n));\n    pintar();\n    ayuda.style.opacity = 0;\n  }\n  function escalar(){\n    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);\n    esc.style.transform = 'translate(-50%,-50%) scale(' + s + ')';\n  }\n\n  document.addEventListener('keydown', function(ev){\n    var k = ev.key;\n    if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter') { ir(paso + 1); ev.preventDefault(); }\n    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { ir(paso - 1); ev.preventDefault(); }\n    else if (k === 'Home') ir(1);\n    else if (k === 'End') ir(MAX);\n  });\n  document.addEventListener('click', function(){ ir(paso + 1); });\n  window.addEventListener('resize', escalar);\n\n  escalar();\n  /* #todo muestra la ficha completa (útil para sacar una imagen); #paso=N empieza en el paso N */\n  var hs = location.hash, mm = hs.match(/paso=(\\d+)/);\n  if (hs === '#todo') { paso = MAX; ayuda.style.display = 'none'; }\n  else if (mm) paso = Math.max(1, Math.min(MAX, +mm[1]));\n  requestAnimationFrame(pintar);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"titulo": "Ficha 14 · Una solicitud, varios actos", "html": "<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Ficha 14 · Una solicitud, varios actos<\/title>\n<style>\n/* ===== Base común de las fichas BDDAT: copiar tal cual a cada ficha ===== */\n:root{\n  --fondo:#fff; --tarjeta:#F7F6F2; --borde:#D3D1C7; --borde-fuerte:#888780;\n  --texto:#2C2C2A; --texto-2:#5F5E5A;\n  --ida:#185FA5;      /* lo que va */\n  --vuelta:#3B6D11;   /* lo que vuelve */\n  --plan:#854F0B;     /* reservado */\n}\n*{box-sizing:border-box;margin:0}\nhtml,body{height:100%;background:var(--fondo);overflow:hidden}\nbody{font-family:\"Segoe UI\",Roboto,Arial,sans-serif;color:var(--texto)}\n\n/* Lienzo fijo de 1280x720 que se escala para caber en cualquier ventana */\n#escenario{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center}\n\n/* Aparición por pasos: cada elemento lleva data-paso=\"N\" y se muestra al llegar a N */\n.paso{opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s ease}\n.paso.on{opacity:var(--op,1);transform:none}\n\n#ayuda{position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:14px;color:#B4B2A9;\n  transition:opacity .4s}\n@media (prefers-reduced-motion:reduce){.paso,#ayuda,.barra i{transition:none}}\n\n/* ===== Propio de esta ficha ===== */\n.titulo{position:absolute;left:0;right:0;top:34px;text-align:center;font-size:30px;font-weight:600}\n:root{--tiempo:#7A3E9D;--tiempo-claro:#EFE6F4}\n\n.solicitud{position:absolute;left:30px;top:244px;width:220px;border:2.5px solid var(--texto);border-radius:12px;background:var(--tarjeta);\n  padding:12px 14px;text-align:center}\n.solicitud .t{font-size:15px;font-weight:700;color:var(--texto-2);text-transform:uppercase;letter-spacing:.5px}\n.solicitud .n{font-size:21px;font-weight:700;margin-top:2px;white-space:nowrap}\n#ramas{position:absolute;left:0;top:0;width:1280px;height:720px;overflow:visible}\n#ramas path{fill:none;stroke:var(--borde-fuerte);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}\n\n.acto{position:absolute;left:300px;width:160px;height:58px;border:2px solid var(--borde-fuerte);border-radius:10px;background:#fff;\n  display:flex;flex-direction:column;justify-content:center;padding:0 12px}\n.acto b{font-size:22px}\n.acto small{font-size:13px;font-weight:600;color:var(--texto-2)}\n\n/* El plazo de cada acto, desde la misma fecha */\n.barra{position:absolute;left:490px;height:30px}\n.barra i{position:absolute;left:0;top:0;bottom:0;width:0;border:2px solid var(--tiempo);background:var(--tiempo-claro);border-radius:6px;\n  transition:width 1s ease}\n.barra span{position:absolute;right:8px;top:4px;font-size:15px;font-weight:700;color:var(--tiempo);opacity:0;transition:opacity .4s ease .8s}\n.barra.on span{opacity:1}\n.eje-nota{position:absolute;font-size:16px;color:var(--texto-2);white-space:nowrap}\n.eje-nota b{color:var(--tiempo)}\n\n/* Una instrucción común */\n.comun{position:absolute;left:490px;top:150px;width:230px;height:254px;border:2px dashed var(--borde-fuerte);border-radius:10px;\n  background:rgba(247,246,242,.6)}\n.comun span{position:absolute;left:0;right:0;top:-28px;text-align:center;font-size:16px;font-weight:700;color:var(--texto-2)}\n\n/* Las resoluciones */\n.res{position:absolute;display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;background:#fff;border:2.5px solid var(--texto);\n  border-radius:10px;padding:6px 12px;white-space:nowrap}\n.res small{display:block;font-size:13px;font-weight:600;color:var(--texto-2)}\n.res svg{width:22px;height:26px;color:var(--texto)}\n\n/* Abajo: por qué la DUP va aparte */\n.via{position:absolute;top:510px;width:560px;border:2px solid var(--borde-fuerte);border-radius:12px;background:#fff;padding:12px 16px}\n.via h3{font-size:19px;font-weight:700;margin-bottom:6px}\n.via div{display:flex;justify-content:space-between;font-size:16px;padding:4px 0;border-top:1px solid var(--borde)}\n.via div span:first-child{color:var(--texto-2)}\n.via b{font-weight:700}\n.via.dup{border-color:var(--texto)}\n<\/style>\n<\/head>\n<body>\n<script>\n(function(){\n  var st = document.createElement('style');\n  st.textContent = '#ayuda{display:none!important}';\n  document.head.appendChild(st);\n\n  function conPaso(){ return [].slice.call(document.querySelectorAll('[data-paso]')); }\n  function maximo(){\n    return Math.max.apply(null, conPaso().map(function(e){ return +e.getAttribute('data-paso'); }));\n  }\n  function actual(){\n    var v = conPaso().filter(function(e){ return e.classList.contains('on'); })\n      .map(function(e){ return +e.getAttribute('data-paso'); });\n    return Math.max.apply(null, [1].concat(v));\n  }\n  function tecla(k){ document.dispatchEvent(new KeyboardEvent('keydown', {key: k, bubbles: true})); }\n\n  window.addEventListener('message', function(ev){\n    var m = ev.data || {};\n    if (m.cmd === 'next') {\n      if (actual() >= maximo()) parent.postMessage({fin: 'fin'}, '*'); else tecla('ArrowRight');\n    } else if (m.cmd === 'prev') {\n      if (actual() <= 1) parent.postMessage({fin: 'inicio'}, '*'); else tecla('ArrowLeft');\n    } else if (m.cmd === 'ultimo') {\n      tecla('End');\n    }\n  });\n\n  var NAV = {ArrowRight:1, ArrowLeft:1, ArrowUp:1, ArrowDown:1, ' ':1, PageDown:1, PageUp:1,\n             Enter:1, Backspace:1, Home:1, End:1, f:1, F:1};\n  document.addEventListener('keydown', function(e){\n    if (!e.isTrusted || !NAV[e.key]) return;\n    e.stopImmediatePropagation(); e.preventDefault();\n    parent.postMessage({tecla: e.key}, '*');\n  }, true);\n  document.addEventListener('click', function(e){\n    if (!e.isTrusted) return;\n    e.stopImmediatePropagation();\n    parent.postMessage({cmd: 'next'}, '*');\n  }, true);\n\n  window.addEventListener('load', function(){\n    setTimeout(function(){\n      window.dispatchEvent(new Event('resize'));\n      parent.postMessage({listo: true}, '*');\n    }, 60);\n  });\n})();\n<\/script>\n\n<svg width=\"0\" height=\"0\" style=\"position:absolute\" aria-hidden=\"true\">\n  <symbol id=\"i-doc\" viewBox=\"0 0 40 46\" fill=\"#fff\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linejoin=\"round\">\n    <path d=\"M8 3h18l9 9v31H8z\"/><path d=\"M26 3v9h9\"/>\n  <\/symbol>\n<\/svg>\n\n<div id=\"escenario\">\n  <div class=\"bloque-tag\" style=\"position:absolute;left:28px;top:16px;font-size:13px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#B4B2A9\">4 · Con quién y cuándo<\/div>\n  <div class=\"titulo\">Una solicitud, varios actos<\/div>\n\n  <!-- 2 · Una solicitud que pide tres actos -->\n  <div class=\"solicitud paso\" data-paso=\"2\"><div class=\"t\">Solicitud<\/div><div class=\"n\">AAP + AAC + DUP<\/div><\/div>\n  <svg id=\"ramas\" viewBox=\"0 neral<\/b><\/div>\n    <div><span>Contra ellas<\/span><b>recurso de alzada<\/b><\/div>\n  <\/div>\n  <div class=\"via dup paso\" data-paso=\"6\" style=\"left:680px;transition-delay:.25s\">\n    <h3>Declaración de utilidad pública<\/h3>\n    <div><span>Se considera dictada por<\/span><b>la Consejería<\/b><\/div>\n    <div><span>Agota la vía administrativa<\/span><b>reposición<\/b><\/div>\n  <\/div>\n<\/div>\n\n<div id=\"ayuda\">← → o clic para avanzar<\/div>\n\n<script>\n(function(){\n  var els = [].slice.call(document.querySelectorAll('[data-paso]'));\n  var MAX = Math.max.apply(null, els.map(function(e){ return +e.getAttribute('data-paso'); }));\n  var paso = 1;\n  var esc = document.getElementById('escenario');\n  var ayuda = document.getElementById('ayuda');\n  var barras = [].slice.call(document.querySelectorAll('.barra'));\n\n  function pintar(){\n    els.forEach(function(e){ e.classList.toggle('on', +e.getAttribute('data-paso') <= paso); });\n    /* las barras crecen hasta su duración al aparecer */\n    barras.forEach(function(b){\n      var w = b.getAttribute('data-ancho') + 'px';\n      b.style.width = w;\n      b.querySelector('i').style.width = paso >= 3 ? w : '0';\n    });\n  }\n  function ir(n){\n    paso = Math.max(1, Math.min(MAX, n));\n    pintar();\n    ayuda.style.opacity = 0;\n  }\n  function escalar(){\n    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);\n    esc.style.transform = 'translate(-50%,-50%) scale(' + s + ')';\n  }\n\n  document.addEventListener('keydown', function(ev){\n    var k = ev.key;\n    if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter') { ir(paso + 1); ev.preventDefault(); }\n    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { ir(paso - 1); ev.preventDefault(); }\n    else if (k === 'Home') ir(1);\n    else if (k === 'End') ir(MAX);\n  });\n  document.addEventListener('click', function(){ ir(paso + 1); });\n  window.addEventListener('resize', escalar);\n\n  esca equestAnimationFrame(pintar);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"titulo": "Ficha 17 · Organismos consultados", "html": "<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Ficha 17 · Organismos consultados<\/title>\n<style>\n/* ===== Base común de las fichas BDDAT: copiar tal cual a cada ficha ===== */\n:root{\n  --fondo:#fff; --tarjeta:#F7F6F2; --borde:#D3D1C7; --borde-fuerte:#888780;\n  --texto:#2C2C2A; --texto-2:#5F5E5A;\n  --ida:#185FA5;      /* lo que va */\n  --vuelta:#3B6D11;   /* lo que vuelve */\n  --plan:#854F0B;     /* reservado */\n}\n*{box-sizing:border-box;margin:0}\nhtml,body{height:100%;background:var(--fondo);overflow:hidden}\nbody{font-family:\"Segoe UI\",Roboto,Arial,sans-serif;color:var(--texto)}\n\n/* Lienzo fijo de 1280x720 que se escala para caber en cualquier ventana */\n#escenario{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center}\n\n/* Aparición por pasos: cada elemento lleva data-paso=\"N\" y se muestra al llegar a N */\n.paso{opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s ease}\n.paso.on{opacity:var(--op,1);transform:none}\n\n#ayuda{position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:14px;color:#B4B2A9;\n  transition:opacity .4s}\n@media (prefers-reduced-motion:reduce){.paso,#ayuda{transition:none}}\n\n/* ===== Propio de esta ficha ===== */\n.titulo{position:absolute;left:0;right:0;top:34px;text-align:center;font-size:30px;font-weight:600}\n:root{--tiempo:#7A3E9D}\n\n.fase{position:absolute;left:40px;top:104px;display:flex;align-items:baseline;gap:12px}\n.fase b{font-size:24px;font-weight:700;background:var(--tarjeta);border:2px solid var(--borde-fuerte);border-radius:10px;padding:5px 16px}\n.fase span{font-size:18px;color:var(--texto-2)}\n\n/* Una calle por organismo */\n.calle{position:absolute;left:40px;right:30px;height:56px;display:fle so]')); }\n  function maximo(){\n    return Math.max.apply(null, conPaso().map(function(e){ return +e.getAttribute('data-paso'); }));\n  }\n  function actual(){\n    var v = conPaso().filter(function(e){ return e.classList.contains('on'); })\n      .map(function(e){ return +e.getAttribute('data-paso'); });\n    return Math.max.apply(null, [1].concat(v));\n  }\n  function tecla(k){ document.dispatchEvent(new KeyboardEvent('keydown', {key: k, bubbles: true})); }\n\n  window.addEventListener('message', function(ev){\n    var m = ev.data || {};\n    if (m.cmd === 'next') {\n      if (actual() >= maximo()) parent.postMessage({fin: 'fin'}, '*'); else tecla('ArrowRight');\n    } else if (m.cmd === 'prev') {\n      if (actual() <= 1) parent.postMessage({fin: 'inicio'}, '*'); else tecla('ArrowLeft');\n    } else if (m.cmd === 'ultimo') {\n      tecla('End');\n    }\n  });\n\n  var NAV = {ArrowRight:1, ArrowLeft:1, ArrowUp:1, ArrowDown:1, ' ':1, PageDown:1, PageUp:1,\n             Enter:1, Backspace:1, Home:1, End:1, f:1, F:1};\n  document.addEventListener('keydown', function(e){\n    if (!e.isTrusted || !NAV[e.key]) return;\n    e.stopImmediatePropagation(); e.preventDefault();\n    parent.postMessage({tecla: e.key}, '*');\n  }, true);\n  document.addEventListener('click', function(e){\n    if (!e.isTrusted) return;\n    e.stopImmediatePropagation();\n    parent.postMessage({cmd: 'next'}, '*');\n  }, true);\n\n  window.addEventListener('load', function(){\n    setTimeout(function(){\n      window.dispatchEvent(new Event('resize'));\n      parent.postMessage({listo: true}, '*');\n    }, 60);\n  });\n})();\n<\/script>\n\n<svg width=\"0\" height=\"0\" style=\"position:absolute\" aria-hidden=\"true\">\n  <symbol id=\"i-sello\" viewBox=\"0 0 52 52\">\n    <path fill=\"#fff\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linejoin=\"round\"\n      d=\"M26 3l5 4 6-1 2 6 6 3-1 6 4 5-4 5 1 6-6 3-2 6-6-1-5 4-5-4-6 1-2-6-6-3 1-6-4-5 4-5-1-6 6-3 2-6 6 1z\"/>\n    <circle cx=\"26\" cy=\"26\" r=\"12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n    <path fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M20 26l4 4 8-8\"/>\n  <\/symbol>\n<\/svg>\n\n<div id=\"escenario\">\n  <div class=\"bloque-tag\" style=\"position:absolute;left:28px;top:16px;font-size:13px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#B4B2A9\">5 · Fases del procedimiento<\/div>\n  <div class=\"titulo\">Organismos consultados<\/div>\n  <div class=\"fase paso\" data-paso=\"2\"><b>Fase Consultas<\/b><span>un camino propio por organismo, cada uno a su ritmo<\/span><\/div>\n<\/div>\n\n<div id=\"ayuda\">← → o clic para avanzar<\/div>\n\n<script>\n(function(){\n  /* Cada calle: organismo y sus pasos. t = trámite (lo que va), r = respuesta (lo que vuelve;\n     con «~» delante, tiempo: calla), ok = terminado. El número es el paso en que aparece. */\n  var CALLES = [\n    ['ADIF', [[2, 't', 'Separata'], [3, 'r', '~calla 30 días'], [3, 'ok', 'conformidad']]],\n    ['Distribuidora', [[2, 't', 'Separata'], [4, 'r', 'condicionado'], [4, 't', 'Traslado al titular'],\n                       [4, 'r', 'conforme'], [4, 'ok', 'condicionado aceptado']]],\n    ['Ayuntamiento', [[2, 't', 'Separata'], [5, 'r', 'oposición'], [5, 't', 'Traslado al titular'],\n                      [5, 'r', 'reparos'], [5, 't', 'Traslado al organismo'], [5, 'r', '~calla 15 días'],\n                      [5, 'ok', 'favorable']]],\n    ['Confederación', [[2, 't', 'Separata'], [6, 'r', 'informe'], [6, 't', 'Traslado al titular'],\n                       [6, 'r', 'conforme'], [6, 'ok', 'favorable']]],\n  ];\n  var esc = document.getElementById('escenario');\n  var FLECHA = '<svg viewBox=\"0 0 70 12\" preserveAspectRatio=\"none\"><path d=\"M2 6H66M60 1l6 5-6 5\"/><\/svg>';\n\n  CALLES.forEach(function(c, k){\n    var calle = document.createElement('div');\n    calle.className = 'calle';\n    calle.style.top = (170 + k * 86) + 'px';\n    var org = document.createElement('div');\n    org.className = 'org paso';\n    org.setAttribute('data-paso', 2);\n    org.style.transitionDelay = (k * .12) + 's';\n    org.textContent = c[0];\n    calle.appendChild(org);\n    var visto = {};\n    c[1].forEach(function(it){\n      var p = it[0], e = document.createElement('div');\n      visto[p] = (visto[p] || 0) + 1;\n      e.setAttribute('data-paso', p);\n      e.style.transitionDelay = (p === 2 ? .15 + k * .12 : (visto[p] - 1) * .3) + 's';\n      if (it[1] === 't') { e.className = 't paso'; e.textContent = it[2]; }\n      else if (it[1] === 'r') {\n        var tiempo = it[2].charAt(0) === '~';\n        e.className = 'r paso' + (tiempo ? ' tiempo' : '');\n        e.innerHTML = '<span><\/span>' + FLECHA;\n        e.firstChild.textContent = tiempo ? it[2].slice(1) : it[2];\n      } else { e.className = 'ok paso'; e.innerHTML = '<i>✓<\/i><span><\/span>'; e.lastChild.textContent = it[2]; }\n      calle.appendChild(e);\n    });\n    esc.appendChild(calle);\n  });\n\n  /* 6 · lo que dice la norma */\n  var reglas = document.createElement('div');\n  reglas.className = 'reglas paso';\n  reglas.setAttribute('data-paso', 6);\n  reglas.style.transitionDelay = '1.4s';\n  reglas.innerHTML = '<span class=\"pil\">si el organismo calla: <b>conformidad<\/b><\/span>' +\n    '<span class=\"pil\">una sola vuelta de reparos<\/span><span class=\"pil\">RD 1955/2000, arts. 127 y 131<\/span>';\n  esc.appendChild(reglas);\n\n  /* 7 · todos terminados: la fase se puede cerrar */\n  var cierre = document.createElement('div');\n  cierre.className = 'cierre paso';\n  cierre.setAttribute('data-paso', 7);\n  cierre.innerHTML = '<svg><use href=\"#i-sello\"/><\/svg>Todos terminados<span>la fase se cierra con su certificado<\/span>';\n  esc.appendChild(cierre);\n\n  var els = [].slice.call(document.querySelectorAll('[data-paso]'));\n  var MAX = Math.max.apply(null, els.map(function(e){ return +e.getAttribute('data-paso'); }));\n  var paso = 1;\n  var ayuda = document.getElementById('ayuda');\n\n  function pintar(){\n    els.forEach(function(e){ e.classList.toggle('on', +e.getAttribute('data-paso') <= paso); });\n  }\n  function ir(n){\n    paso = Math.max(1, Math.min(MAX, n));\n    pintar();\n    ayuda.style.opacity = 0;\n  }\n  function escalar(){\n    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);\n    esc.style.transform = 'translate(-50%,-50%) scale(' + s + ')';\n  }\n\n  document.addEventListener('keydown', function(ev){\n    var k = ev.key;\n    if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter') { ir(paso + 1); ev.preventDefault(); }\n    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { ir(paso - 1); ev.preventDefault(); }\n    else if (k === 'Home') ir(1);\n    else if (k === 'End') ir(MAX);\n  });\n  document.addEventListener('click', function(){ ir(paso + 1); });\n  window.addEventListener('resize', escalar);\n\n  escalar();\n  /* #todo muestra la ficha completa (útil para sacar una imagen); #paso=N empieza en el paso N */\n  var hs = location.hash, mm = hs.match(/paso=(\\d+)/);\n  if (hs === '#todo') { paso = MAX; ayuda.style.display = 'none'; }\n  else if (mm) paso = Math.max(1, Math.min(MAX, +mm[1]));\n  requestAnimationFrame(pintar);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"titulo": "Ficha 18 · Reformados de proyecto", "html": "<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Ficha 18 · Reformados de proyecto<\/title>\n<style>\n/* ===== Base común de las fichas BDDAT: copiar tal cual a cada ficha ===== */\n:root{\n  --fondo:#fff; --tarjeta:#F7F6F2; --borde:#D3D1C7; --borde-fuerte:#888780;\n  --texto:#2C2C2A; --texto-2:#5F5E5A;\n  --ida:#185FA5;      /* lo que va */\n  --vuelta:#3B6D11;   /* lo que vuelve */\n  --plan:#854F0B;     /* reservado */\n}\n*{box-sizing:border-box;margin:0}\nhtml,body{height:100%;background:var(--fondo);overflow:hidden}\nbody{font-family:\"Segoe UI\",Roboto,Arial,sans-serif;color:var(--texto)}\n\n/* Lienzo fijo de 1280x720 que se escala para caber en cualquier ventana */\n#escenario{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center}\n\n/* Aparición por pasos: cada elemento lleva data-paso=\"N\" y se muestra al llegar a N;\n   con data-hasta=\"M\" se vuelve a ocultar al llegar a M */\n.paso{opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s ease}\n.paso.on{opacity:var(--op,1);transform:none}\n\n#ayuda{position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:14px;color:#B4B2A9;\n  transition:opacity .4s}\n@media (prefers-reduced-motion:reduce){.paso,#ayuda{transition:none}}\n\n/* ===== Propio de esta ficha ===== */\n.titulo{position:absolute;left:0;right:0;top:34px;text-align:center;font-size:30px;font-weight:600}\n.c{position:absolute;translate:-50% -50%;white-space:nowrap}\n\n/* La línea de los documentos del proyecto y las versiones */\n.eje{position:absolute;left:80px;width:1120px;top:226px;height:3px;background:var(--borde-fuerte)}\n.ver{position:absolute;top:112px;height:178px;border-radius:12px;border:2px solid var(--borde-fuerte);\n  display:flex;justify-content:center;padding-top:10px;font-size:20px;font-weight:700;background:var(--tarjeta);z-index:-1}\n.ver.v2{background:#fff;border-color:var(--texto)}\n.doc{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:15px;font-weight:600;color:var(--texto-2);text-align:center}\n.doc small{font-size:13px;font-weight:600;color:var(--texto-2)}\n.doc svg{width:36px;height:44px;color:var(--borde-fuerte)}\n.doc.fuerte{color:var(--texto)}\n.doc.fuerte svg{color:var(--texto)}\n.corte{position:absolute;left:640px;top:104px;height:194px;border-left:3px solid var(--texto)}\n.pregunta{font-size:15px;font-weight:600;border:1.5px solid var(--borde-fuerte);border-radius:999px;padding:3px 11px;background:#fff;color:var(--texto-2)}\n.pregunta b{color:var(--texto)}\n\n/* Las fases cuelgan de la versión que cubren */\n.fase{position:absolute;font-size:17px;font-weight:600;background:var(--tarjeta);border:2px solid var(--borde-fuerte);\n  border-radius:9px;padding:6px 14px;white-space:nowrap;transition:opacity .5s ease,transform .5s ease,background .5s ease,color .5s ease}\n.fase small{font-size:14px;color:var(--texto-2);margin-left:6px}\n.fase.res{border:2.5px solid var(--texto);font-size:19px;font-weight:700}\n.ayer .fase.v1{background:#fff;color:var(--texto-2);border-style:dashed}\n.cuelga{position:absolute;border-left:2px dotted var(--borde-fuerte)}\n.lema{position:absolute;font-size:17px;color:var(--texto-2);white-space:nowrap}\n.lema b{color:var(--texto)}\n.pil{font-size:16px;font-weight:600;color:var(--texto-2);border:1.5px solid var(--borde-fuerte);border-radius:999px;padding:4px 13px;background:#fff}\n<\/style>\n<\/head>\n<body>\n<script>\n(function(){\n  var st = document.createElement('style');\n  st.textContent = '#ayuda{display:none!important}';\n  document.head.appendChild(st);\n\n  function conPaso(){ return [].slice.call(document.querySelectorAll('[data-paso]')); }\n  function maximo(){\n    return Math.max.apply(null, conPaso().map(function(e){ return +e.getAttribute('data-paso'); }));\n  }\n  function actual(){\n    var v = conPaso().filter(function(e){ return e.classList.contains('on'); })\n      .map(function(e){ return +e.getAttribute('data-paso'); });\n    return Math.max.apply(null, [1].concat(v));\n  }\n  function tecla(k){ document.dispatchEvent(new KeyboardEvent('keydown', {key: k, bubbles: true})); }\n\n  window.addEventListener('message', function(ev){\n    var m = ev.data || {};\n    if (m.cmd === 'next') {\n      if (actual() >= maximo()) parent.postMessage({fin: 'fin'}, '*'); else tecla('ArrowRight');\n    } else if (m.cmd === 'prev') {\n      if (actual() <= 1) parent.postMessage({fin: 'inicio'}, '*'); else tecla('ArrowLeft');\n    } else if (m.cmd === 'ultimo') {\n      tecla('End');\n    }\n  });\n\n  var NAV = {ArrowRight:1, ArrowLeft:1, ArrowUp:1, ArrowDown:1, ' ':1, PageDown:1, PageUp:1,\n             Enter:1, Backspace:1, Home:1, End:1, f:1, F:1};\n  document.addEventListener('keydown', function(e){\n    if (!e.isTrusted || !NAV[e.key]) return;\n    e.stopImmediatePropagation(); e.preventDefault();\n    parent.postMessage({tecla: e.key}, '*');\n  }, true);\n  document.addEventListener('click', function(e){\n    if (!e.isTrusted) return;\n    e.stopImmediatePropagation();\n    parent.postMessage({cmd: 'next'}, '*');\n  }, true);\n\n  window.addEventListener('load', function(){\n    setTimeout(function(){\n      window.dispatchEvent(new Event('resize'));\n      parent.postMessage({listo: true}, '*');\n    }, 60);\n  });\n})();\n<\/script>\n\n<svg width=\"0\" height=\"0\" style=\"position:absolute\" aria-hidden=\"true\">\n  <symbol id=\"i-doc\" viewBox=\"0 0 40 46\" fill=\"#fff\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linejoin=\"round\">\n    <path d=\"M8 3h18l9 9v31H8z\"/><path d=\"M26 3v9h9\"/>\n    <path fill=\"none\" stroke-width=\"1.8\" stroke-linecap=\"round\" opacity=\".55\" d=\"M13 20h17M13 26h17M13 32h11\"/>\n  <\/symbol>\n<\/svg>\n\n<div id=\"escenario\">\n  <div class=\"bloque-tag\" style=\"position:absolute;left:28px;top:16px;font-size:13px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#B4B2A9\">5 · Fases del procedimiento<\/div>\n  <div class=\"titulo\">Reformados de proyecto: la versión como eje<\/div>\n\n  <!-- 2 · El proyecto principal abre la versión 1 -->\n  <div class=\"eje paso\" data-paso=\"2\"><\/div>\n  <div class=\"ver paso\" data-paso=\"2\" style=\"left:100px;width:540px\">Versión 1<\/div>\n  <div class=\"c doc fuerte paso\" data-paso=\"2\" style=\"left:170px;top:236px\"><svg><use href=\"#i-doc\"/><\/svg>Proyecto<\/div>\n\n  <!-- 3 · Las fases de la instrucción cuelgan de la versión 1 -->\n  <div class=\"cuelga paso\" data-paso=\"3\" style=\"left:170px;top:270px;height:222px\"><\/div>\n  <div class=\"fase v1 paso\" data-paso=\"3\" style=\"left:190px;top:350px\">Análisis de solicitud<\/div>\n  <div class=\"fase v1 paso\" data-paso=\"3\" style=\"left:190px;top:402px;transition-delay:.15s\">Consultas<\/div>\n  <div class=\"fase v1 paso\" data-paso=\"3\" style=\"left:190px;top:454px;transition-delay:.3s\">Información pública<\/div>\n\n  <!-- 4 · Un documento del proyecto que no corta -->\n  <div class=\"c doc paso\" data-paso=\"4\" style=\"left:450px;top:236px\"><svg><use href=\"#i-doc\"/><\/svg>Anexo de planos<\/div>\n  <div class=\"c pregunta paso\" data-paso=\"4\" style=\"left:450px;top:312px;transition-delay:.25s\">¿Produce un reformado? <b>No<\/b><\/div>\n\n  <!-- 5 · Un reformado: corte y versión 2 -->\n  <div class=\"corte paso\" data-paso=\"5\"><\/div>\n  <div class=\"ver v2 paso\" data-paso=\"5\" style=\"left:640px;width:540px;transition-delay:.3s\">Versión 2<\/div>\n  <div class=\"c doc fuerte paso\" data-paso=\"5\" style=\"left:720px;top:244px\"><svg><use href=\"#i-doc\"/><\/svg>Reformado<small>requerido o voluntario<\/small><\/div>\n  <div class=\"c pregunta paso\" data-paso=\"5\" style=\"left:720px;top:312px;transition-delay:.25s\">¿Produce un reformado? <b>Sí<\/b><\/div>\n\n  <!-- 6 · Las fases afectadas se repiten para la versión 2; la historia no se pierde -->\n  <div class=\"cuelga paso\" data-paso=\"6\" style=\"left:720px;top:330px;height:146px\"><\/div>\n  <div class=\"fase paso\" data-paso=\"6\" style=\"left:740px;top:402px\">Consultas<small>2.ª ronda<\/small><\/div>\n  <div class=\"fase paso\" data-paso=\"6\" style=\"left:740px;top:454px;transition-delay:.15s\">Información pública<small>2.ª ronda<\/small><\/div>\n  <div class=\"lema paso\" data-paso=\"6\" style=\"left:190px;top:510px;transition-delay:.4s\">la historia de la versión 1 <b>se conserva<\/b><\/div>\n\n  <!-- 7 · La resolución dice sobre qué versión resuelve -->\n  <div class=\"fase res paso\" data-paso=\"7\" style=\"left:940px;top:520px\">Resolución<small>sobre la versión 2<\/small><\/div>\n  <div class=\"lema paso\" data-paso=\"7\" style=\"left:190px;top:604px;transition-delay:.3s\">\n    <span class=\"pil\">repetir una fase en la misma versión: <b>la regla lo bloquea<\/b><\/span>\n    <span class=\"pil\" style=\"margin-left:8px\">la resolución, congruente con lo pedido<\/span>\n  <\/div>\n<\/div>\n\n<div id=\"ayuda\">← → o clic para avanzar<\/div>\n\n<script>\n(function(){\n  var els = [].slice.call(document.querySelectorAll('[data-paso]'));\n  var MAX = Math.max.apply(null, els.map(function(e){ return +e.getAttribute('data-paso'); }));\n  var paso = 1;\n  var esc = document.getElementById('escenario');\n  var ayuda = document.getElementById('ayuda');\n\n  function pintar(){\n    els.forEach(function(e){\n      var n = +e.getAttribute('data-paso'), hasta = e.getAttribute('data-hasta');\n      e.classList.toggle('on', n <= paso && (!hasta || paso < +hasta));\n    });\n    /* con la versión 2, las fases de la versión 1 pasan a ser historia */\n    esc.classList.toggle('ayer', paso >= 6);\n  }\n  function ir(n){\n    paso = Math.max(1, Math.min(MAX, n));\n    pintar();\n    ayuda.style.opacity = 0;\n  }\n  function escalar(){\n    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);\n    esc.style.transform = 'translate(-50%,-50%) scale(' + s + ')';\n  }\n\n  document.addEventListener('keydown', function(ev){\n    var k = ev.key;\n    if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter') { ir(paso + 1); ev.preventDefault(); }\n    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { ir(paso - 1); ev.preventDefault(); }\n    else if (k === 'Home') ir(1);\n    else if (k === 'End') ir(MAX);\n  });\n  document.addEventListener('click', function(){ ir(paso + 1); });\n  window.addEventListener('resize', escalar);\n\n  escalar();\n  /* #todo muestra la ficha completa (útil para sacar una imagen); #paso=N empieza en el paso N */\n  var hs = locat 240px\"><svg width=\"72\" height=\"50\"><use href=\"#i-usuarios\"/><\/svg>Usuarios<\/div>\n  <div class=\"c bddat paso\" data-paso=\"2\" style=\"left:430px;top:250px\">BDDAT<\/div>\n  <div class=\"c pieza paso\" data-paso=\"2\" style=\"left:290px;top:430px\"><svg width=\"72\" height=\"56\"><use href=\"#i-carpeta\"/><\/svg>Carpeta de red<\/div>\n  <div class=\"nota paso\" data-paso=\"2\" style=\"left:40px;top:150px\">los dos escriben en la misma carpeta<\/div>\n\n  <!-- 3 · El problema -->\n  <div class=\"c malo paso\" data-paso=\"3\" style=\"left:290px;top:520px\">✗ resolución.pdf, cambiada desde Windows<\/div>\n  <div class=\"nota roja paso\" data-paso=\"3\" style=\"left:40px;top:560px;transition-delay:.3s\">BDDAT no se entera: dos fuentes de la verdad<\/div>\n\n  <!-- 4 · Ahora: solo BDDAT entra en el almacén -->\n  <div class=\"lado paso\" data-paso=\"4\" style=\"left:600px\">Ahora<\/div>\n  <svg class=\"lineas paso\" data-paso=\"4\" viewBox=\"0 0 1280 720\" aria-hidden=\"true\">\n    <path class=\"azul\" d=\"M720 250 H808\"/><path class=\"azul\" d=\"M800 243 l8 7 -8 7\"/>\n    <path class=\"azul\" d=\"M1002 250 H1078\"/><path class=\"azul\" d=\"M1070 243 l8 7 -8 7\"/>\n  <\/svg>\n  <div class=\"c pieza paso\" data-paso=\"4\" style=\"left:660px;top:240px\"><svg width=\"72\" height=\"50\"><use href=\"#i-usuarios\"/><\/svg>Usuarios<\/div>\n  <div class=\"c bddat paso\" data-paso=\"4\" style=\"left:905px;top:250px\">BDDAT<\/div>\n  <div class=\"c pieza paso\" data-paso=\"4\" style=\"left:1150px;top:244px\">\n    <svg width=\"72\" height=\"66\"><use href=\"#i-almacen\"/><\/svg>Almacén\n  <\/div>\n  <div class=\"nota paso\" data-paso=\"4\" style=\"left:600px;top:150px\">los usuarios no tocan los ficheros: <b>solo BDDAT entra<\/b><\/div>\n\n  <!-- 5 · Cada contenido, una vez y con su huella -->\n  <div class=\"huella paso\" data-paso=\"5\" style=\"position:absolute;left:1000px;top:330px\">\n    <svg><use href=\"#i-huella\"/><\/svg>\n    <div><div class=\"t\">Con su huella<\/div><div class=\"s\">si cambia, se nota<\/div><\/div>\n  <\/div>\n\n  <!-- 6 · Un manifiesto por expediente: se reconstruye sin BDDAT -->\n  <svg class=\"lineas paso\" data-paso=\"6\" viewBox=\"0 0 1280 720\" aria-hidden=\"true\">\n    <path d=\"M905 280 V420\"/><path d=\"M898 412 l7 8 7-8\"/>\n  <\/svg>\n  <div class=\"paso\" data-paso=\"6\" style=\"position:absolute;left:600px;top:430px;width:600px\">\n    <div class=\"nota\" style=\"position:static;margin-bottom:8px\"><b>Un manifiesto por expediente<\/b>: sin BDDAT, se recuperan las carpetas<\/div>\n    <div class=\"carpetas\"><b>AT-1234<\/b>/\n  AAP/\n    Análisis de solicitud/  Requerimiento de subsanación/ …\n    Consultas/  Separata ADIF/ …\n  proyecto.pdf · resolución.pdf · …<\/div>\n  <\/div>\n<\/div>\n\n<div id=\"ayuda\">← → o clic para avanzar<\/div>\n\n<script>\n(function(){\n  var els = [].slice.call(document.querySelectorAll('[data-paso]'));\n  var MAX = Math.max.apply(null, els.map(function(e){ return +e.getAttribute('data-paso'); }));\n  var paso = 1;\n  var esc = document.getElementById('escenario');\n  var ayuda = document.getElementById('ayuda');\n\n  function pintar(){\n    els.forEach(function(e){ e.classList.toggle('on', +e.getAttribute('data-paso') <= paso); });\n  }\n  function ir(n){\n    paso = Math.max(1, Math.min(MAX, n));\n    pintar();\n    ayuda.style.opacity = 0;\n  }\n  function escalar(){\n    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);\n    esc.style.transform = 'translate(-50%,-50%) scale(' + s + ')';\n  }\n\n  document.addEventListener('keydown', function(ev){\n    var k = ev.key;\n    if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter') { ir(paso + 1); ev.preventDefault(); }\n    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { ir(paso - 1); ev.preventDefault(); }\n    else if (k === 'Home') ir(1);\n    else if (k === 'End') ir(MAX);\n  });\n  document.addEventListener('click', function(){ ir(paso + 1); });\n  window.addEventListener('resize', escalar);\n\n  escalar();\n  /* #todo muestra la ficha completa (útil para sacar una imagen); #paso=N empieza en el paso N */\n  var hs = location.hash, mm = hs.match(/paso=(\\d+)/);\n  if (hs === '#todo') { paso = MAX; ayuda.style.display = 'none'; }\n  else if (mm) paso = Math.max(1, Math.min(MAX, +mm[1]));\n  requestAnimationFrame(pintar);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"titulo": "Ficha 21 · Usuarios y roles", "html": "<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Ficha 21 · Usuarios y roles<\/title>\n<style>\n/* ===== Base común de las fichas BDDAT: copiar tal cual a cada ficha ===== */\n:root{\n  --fondo:#fff; --tarjeta:#F7F6F2; --borde:#D3D1C7; --borde-fuerte:#888780;\n  --texto:#2C2C2A; --texto-2:#5F5E5A;\n  --ida:#185FA5;      /* lo que va */\n  --vuelta:#3B6D11;   /* lo que vuelve */\n  --plan:#854F0B;     /* reservado */\n}\n*{box-sizing:border-box;margin:0}\nhtml,body{height:100%;background:var(--fondo);overflow:hidden}\nbody{font-family:\"Segoe UI\",Roboto,Arial,sans-serif;color:var(--texto)}\n\n/* Lienzo fijo de 1280x720 que se escala para caber en cualquier ventana */\n#escenario{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center}\n\n/* Aparición por pasos: cada elemento lleva data-paso=\"N\" y se muestra al llegar a N */\n.paso{opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s ease}\n.paso.on{opacity:var(--op,1);transform:none}\n\n#ayuda{position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:14px;color:#B4B2A9;\n  transition:opacity .4s}\n@media (prefers-reduced-motion:reduce){.paso,#ayuda{transition:none}}\n\n/* ===== Propio de esta ficha ===== */\n.titulo{position:absolute;left:0;right:0;top:34px;text-align:center;font-size:30px;font-weight:600}\n\n/* Arriba: los cuatro roles */\n.rol{position:absolute;top:104px;width:280px;height:250px;border:2px solid var(--borde-fuerte);border-radius:12px;background:#fff;\n  padding:14px 16px;display:flex;flex-direction:column}\n.rol svg{width:38px;height:38px;color:var(--texto)}\n.rol svg *{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}\n.rol h3{font-size:24px;font-weight:700;margin:6px 0 6px}\n.rol p{font-size:17px;line-height:1.35;color:var(--texto)}\n.rol .mt{margin-top:auto;border-top:1px solid var(--borde);padding-top:8px;font-size:14px;color:var(--texto-2)}\n.rol .mt b{display:block;font-size:17px;color:var(--ida)}\n\n/* Abajo izquierda: un usuario, varios roles */\n.usuario{position:absolute;left:40px;top:400px;width:560px;border:2px solid var(--texto);border-radius:12px;background:var(--tarjeta);\n  padding:14px 18px}\n.usuario h3{font-size:21px;font-weight:700}\n.usuario .roles{display:flex;gap:8px;margin:8px 0 12px}\n.usuario .roles span{font-size:16px;font-weight:600;border:1.5px solid var(--borde-fuerte);border-radius:999px;padding:3px 12px;background:#fff}\n.usuario .entra{display:flex;align-items:center;gap:10px;font-size:17px}\n.usuario .sel{border:2px solid var(--ida);border-radius:8px;padding:4px 12px;background:#fff;font-weight:700;color:var(--ida)}\n\n/* Abajo derecha: ver y actuar */\n.ver{position:absolute;left:660px;top:400px;width:580px;display:flex;flex-direction:column;gap:12px}\n.fila{display:flex;align-items:center;gap:14px;border:2px solid var(--borde-fuerte);border-radius:12px;background:#fff;padding:10px 16px}\n.fila svg{width:36px;height:36px;flex:none;color:var(--texto)}\n.fila svg *{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}\n.fila .t{font-size:20px;font-weight:700}\n.fila .s{font-size:16px;color:var(--texto-2)}\n.fila.bita{border-color:var(--texto);background:var(--tarjeta)}\n<\/style>\n<\/head>\n<body>\n<script>\n(function(){\n  var st = document.createElement('style');\n  st.textContent = '#ayuda{display:none!important}';\n  document.head.appendChild(st);\n\n  function conPaso(){ return [].slice.call(document.querySelectorAll('[data-paso]')); }\n  function maximo(){\n    return Math.max.apply(null, conPaso().map(function(e){ return +e.getAttribute('data-paso'); }));\n  }\n  function actual(){\n    var v = conPaso().filter(function(e){ return e.classList.contains('on'); })\n      .map(function(e){ return +e.getAttribute('data-paso'); });\n    return Math.max.apply(null, [1].concat(v));\n  }\n  function tecla(k){ document.dispatchEvent(new KeyboardEvent('keydown', {key: k, bubbles: true})); }\n\n  window.addEventListener('message', function(ev){\n    var m = ev.data || {};\n    if (m.cmd === 'next') {\n      if (actual() >= maximo()) parent.postMessage({fin: 'fin'}, '*'); else tecla('ArrowRight');\n    } else if (m.cmd === 'prev') {\n      if (actual() <= 1) parent.postMessage({fin: 'inicio'}, '*'); else tecla('ArrowLeft');\n    } else if (m.cmd === 'ultimo') {\n      tecla('End');\n    }\n  });\n\n  var NAV = {ArrowRight:1, ArrowLeft:1, ArrowUp:1, ArrowDown:1, ' ':1, PageDown:1, PageUp:1,\n             Enter:1, Backspace:1, Home:1, End:1, f:1, F:1};\n  document.addEventListener('keydown', function(e){\n    if (!e.isTrusted || !NAV[e.key]) return;\n    e.stopImmediatePropagation(); e.preventDefault();\n    parent.postMessage({tecla: e.key}, '*');\n  }, true);\n  document.addEventListener('click', function(e){\n    if (!e.isTrusted) return;\n    e.stopImmediatePropagation();\n    parent.postMessage({cmd: 'next'}, '*');\n  }, true);\n\n  window.addEventListener('load', function(){\n    setTimeout(function(){\n      window.dispatchEvent(new Event('resize'));\n      parent.postMessage({listo: true}, '*');\n    }, 60);\n  });\n})();\n<\/script>\n\n<svg width=\"0\" height=\"0\" style=\"position:absolute\" aria-hidden=\"true\">\n  <symbol id=\"i-carpeta\" viewBox=\"0 0 38 38\"><path d=\"M3 8h12l4 4h16v22H3z\"/><path d=\"M10 22h18M10 28h12\"/><\/symbol>\n  <symbol id=\"i-bandeja\" v e.getAttribute('data-paso'); }));\n  var paso = 1;\n  var esc = document.getElementById('escenario');\n  var ayuda = document.getElementById('ayuda');\n\n  function pintar(){\n    els.forEach(function(e){ e.classList.toggle('on', +e.getAttribute('data-paso') <= paso); });\n  }\n  function ir(n){\n    paso = Math.max(1, Math.min(MAX, n));\n    pintar();\n    ayuda.style.opacity = 0;\n  }\n  function escalar(){\n    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);\n    esc.style.transform = 'translate(-50%,-50%) scale(' + s + ')';\n  }\n\n  document.addEventListener('keydown', function(ev){\n    var k = ev.key;\n    if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter') { ir(paso + 1); ev.preventDefault(); }\n    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { ir(paso - 1); ev.preventDefault(); }\n    else if (k === 'Home') ir(1);\n    else if (k === 'End') ir(MAX);\n  });\n  document.addEventListener('click', function(){ ir(paso + 1); });\n  window.addEventListener('resize', escalar);\n\n  escalar();\n  /* #todo muestra la ficha completa (útil para sacar una imagen); #paso=N empieza en el paso N */\n  var hs = location.hash, mm = hs.match(/paso=(\\d+)/);\n  if (hs === '#todo') { paso = MAX; ayuda.style.display = 'none'; }\n  else if (mm) paso = Math.max(1, Math.min(MAX, +mm[1]));\n  requestAnimationFrame(pintar);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"titulo": "Ficha 22 · Un expediente de principio a fin", "html": "<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Ficha 22 · Un expediente de principio a fin<\/title>\n<style>\n/* ===== Base común de las fichas BDDAT: copiar tal cual a cada ficha ===== */\n:root{\n  --fondo:#fff; --tarjeta:#F7F6F2; --borde:#D3D1C7; --borde-fuerte:#888780;\n  --texto:#2C2C2A; --texto-2:#5F5E5A;\n  --ida:#185FA5;      /* lo que va */\n  --vuelta:#3B6D11;   /* lo que vuel      d.style.transitionDelay = (.1 + i * .18) + 's';\n      d.innerHTML = '<div class=\"q\"><svg><use href=\"#' + it[2] + '\"/><\/svg><span><\/span><\/div><div class=\"t\"><\/div>';\n      d.querySelector('.q span').textContent = it[1];\n      d.querySelector('.t').textContent = it[3];\n      cont.appendChild(d);\n      if (i) {\n        var f = document.createElementNS('http://www.w3.org/2000/svg', 'svg');\n        f.setAttribute('class', 'f paso');\n        f.setAttribute('data-paso', paso);\n        f.setAttribute('viewBox', '0 0 26 20');\n        f.style.left = (X0 + i * PX - 30) + 'px';\n        f.style.top = (y + 38) + 'px';\n        f.style.transitionDelay = (.05 + i * .18) + 's';\n        f.innerHTML = '<path d=\"M3 10h18M15 4l6 6-6 6\"/>';\n        cont.appendChild(f);\n      }\n    });\n  }\n  carril(HOY, 160, 2, 'Hoy', 'cada salida y cada vuelta pasan por una persona');\n  carril(DESPUES, 420, 3, 'Después', 'BDDAT hace los recados');\n\n  var els = [].slice.call(document.querySelectorAll('[data-paso]'));\n  var MAX = Math.max.apply(null, els.map(function(e){ return +e.getAttribute('data-paso'); }));\n  var paso = 1;\n  var ayuda = document.getElementById('ayuda');\n\n  function pintar(){\n    els.forEach(function(e){ e.classList.toggle('on', +e.getAttribute('data-paso') <= paso); });\n  }\n  function ir(n){\n    paso = Math.max(1, Math.min(MAX, n));\n    pintar();\n    ayuda.style.opacity = 0;\n  }\n  function escalar(){\n    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);\n    esc.style.transform = 'translate(-50%,-50%) scale(' + s + ')';\n  }\n\n  document.addEventListener('keydown', function(ev){\n    var k = ev.key;\n    if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter') { ir(paso + 1); ev.preventDefault(); }\n    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { ir(paso - 1); ev.preventDefault(); }\n    else if (k === 'Home') ir(1);\n    else if (k === 'End') ir(MAX);\n  });\n  document.
