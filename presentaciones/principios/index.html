e({cmd: 'next'}, '*');\n  }, true);\n\n  window.addEventListener('load', function(){\n    setTimeout(function(){\n      window.dispatchEvent(new Event('resize'));\n      parent.postMessage({listo: true}, '*');\n    }, 60);\n  });\n})();\n<\/script>\n\n<svg width=\"0\" height=\"0\" style=\"position:absolute\" aria-hidden=\"true\">\n  <symbol id=\"i-doc\" viewBox=\"0 0 13 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linejoin=\"round\">\n    <path d=\"M1.5 1h7l3 3v11h-10z\"/><path d=\"M8.5 1v3h3\"/>\n  <\/symbol>\n  <symbol id=\"i-hoja\" viewBox=\"0 0 60 76\">\n    <path fill=\"#fff\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linejoin=\"round\" d=\"M3 3h38l16 16v54H3z\"/>\n    <path fill=\"#F7F6F2\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linejoin=\"round\" d=\"M41 3v16h16\"/>\n    <path fill=\"none\" stroke=\"#D3D1C7\" stroke-width=\"2\" stroke-linecap=\"round\" d=\"M12 32h36M12 42h36M12 52h24\"/>\n  <\/symbol>\n  <symbol id=\"i-sello\" viewBox=\"0 0 52 52\">\n    <path fill=\"#fff\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linejoin=\"round\"\n      d=\"M26 3l5 4 6-1 2 6 6 3-1 6 4 5-4 5 1 6-6 3-2 6-6-1-5 4-5-4-6 1-2-6-6-3 1-6-4-5 4-5-1-6 6-3 2-6 6 1z\"/>\n    <circle cx=\"26\" cy=\"26\" r=\"12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/>\n    <path fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M20 26l4 4 8-8\"/>\n  <\/symbol>\n<\/svg>\n\n<div id=\"escenario\">\n  <div class=\"bloque-tag\" style=\"position:absolute;left:28px;top:16px;font-size:13px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#B4B2A9\">8 · Lo que viene<\/div>\n  <div class=\"titulo\">El expediente que sale<\/div>\n\n  <!-- 2 · Lo que BDDAT ya sabe: el árbol y sus documentos -->\n  <div class=\"sub paso\" data-paso=\"2\" style=\"left:40px\">Lo que ya está en BDDAT<small>cada documento, en su sitio y con su fecha<\/small><\/div>\n  <div class=\"arbol paso\" data-paso=\"2\">\n    <div class=\"n\">AT-7 · AAP+AAC<\/div>\n    <div class=\"n f\">Análisis de solicitud<\/div>\n    <div class=\"d\"><svg><use href=\"#i-doc\"/><\/svg>Solicitud y proyecto<\/div>\n    <div class=\"d\"><svg><use href=\"#i-doc\"/><\/svg>Diagnóstico de análisis<\/div>\n    <div class=\"d aux\"><svg><use href=\"#i-doc\"/><\/svg>Borrador del requerimiento<\/div>\n    <div class=\"d\"><svg><use href=\"#i-doc\"/><\/svg>Requerimiento firmado y justificante<\/div>\n    <div class=\"n f\">Consultas<\/div>\n    <div class=\"d\"><svg><use href=\"#i-doc\"/><\/svg>Separatas y respuestas<\/div>\n    <div class=\"d aux\"><svg><use href=\"#i-doc\"/><\/svg>Nota interna de reunión<\/div>\n    <div class=\"n f\">Resolución<\/div>\n    <div class=\"d\"><svg><use href=\"#i-doc\"/><\/svg>Resolución firmada y notificaciones<\/div>\n  <\/div>\n\n  <!-- 3 · Lo auxiliar no forma parte -->\n  <div class=\"nota paso\" data-paso=\"3\" style=\"left:40px;top:466px\">borradores y notas: no forman parte (art. 70.4)<\/div>\n\n  <!-- 4 · El índice numerado, en orden -->\n  <svg class=\"flecha paso\" data-paso=\"4\" width=\"1280\" height=\"720\" style=\"left:0;top:0\">\n    <path d=\"M428 330 H460\"/><path d=\"M452 322 l8 8 -8 8\"/>\n  <\/svg>\n  <div class=\"sub paso\" data-paso=\"4\" style=\"left:470px\">Índice numerado<small>en orden, con sus folios<\/small><\/div>\n  <div class=\"indice paso\" data-paso=\"4\" style=\"transition-delay:.2s\">\n    <h3>Índice · AT-7<\/h3>\n    <div class=\"fila\"><b>1<\/b><span>Solicitud de autorización<\/span><span>1–4<\/span><\/div>\n    <div class=\"fila\"><b>2<\/b><span>Proyecto técnico<\/span><span>5–212<\/span><\/div>\n    <div class=\"fila\"><b>3<\/b><span>Diagnóstico de análisis<\/span><span>213–214<\/span><\/div>\n    <div class=\"fila\"><b>4<\/b><span>Requerimiento de subsanación<\/span><span>215–216<\/span><\/div>\n    <div class=\"fila\"><b>5<\/b><span>Justificante de notificación<\/span><span>217<\/span><\/div>\n    <div class=\"fila\"><b>…<\/b><span>…<\/span><span><\/span><\/div>\n    <div class=\"fila\"><b>31<\/b><span>Resolución<\/span><span>402–409<\/span><\/div>\n  <\/div>\n\n  <!-- 5 · Completo, foliado y con el índice autentificado -->\n  <svg class=\"flecha paso\" data-paso=\"5\" width=\"1280\" height=\"720\" style=\"left:0;top:0\">\n    <path d=\"M858 330 H898\"/><path d=\"M890 322 l8 8 -8 8\"/>\n  <\/svg>\n  <div class=\"paquete paso\" data-paso=\"5\" style=\"transition-delay:.2s\">\n    <div class=\"pila\">\n      <svg width=\"104\" height=\"132\" style=\"left:30px;top:0;color:#B4B2A9\"><use href=\"#i-hoja\"/><\/svg>\n      <svg width=\"104\" height=\"132\" style=\"left:16px;top:12px;color:#888780\"><use href=\"#i-hoja\"/><\/svg>\n      <svg width=\"104\" height=\"132\" style=\"left:2px;top:24px;color:#2C2C2A\"><use href=\"#i-hoja\"/><\/svg>\n      <svg width=\"58\" height=\"58\" style=\"left:76px;top:108px;color:#2C2C2A\"><use href=\"#i-sello\"/><\/svg>\n    <\/div>\n    <div class=\"t\">Completo y foliado<small>con el índice autentificado<\/small><\/div>\n    <div class=\"destino paso\" data-paso=\"5\" style=\"transition-delay:.5s\">→<span>Al órgano del recurso de alzada<small>en diez días, con el informe (art. 121.2)<\/small><\/span><\/div>\n    <div class=\"destino paso\" data-paso=\"5\" style=\"transition-delay:.7s\">→<span>Al juzgado<small>en el contencioso<\/small><\/span><\/div>\n  <\/div>\n\n  <!-- 6 · La ley -->\n  <div class=\"cita paso\" data-paso=\"6\">\n    <b>Art. 70.3 LPACAP<\/b>: el expediente se remite «completo, foliado, autentificado y acompañado de un índice, asimismo autentificado»\n  <\/div>\n<\/div>\n\n<div id=\"ayuda\">← → o clic para avanzar<\/div>\n\n<script>\n(function(){\n  var els = [].slice.call(document.querySelectorAll('[data-paso]'));\n  var MAX = Math.max.apply(null, els.map(function(e){ return +e.getAttribute('data-paso'); }));\n  var paso = 1;\n  var esc = document.getElementById('escenario');\n  var ayuda = document.getElementById('ayuda');\n\n  function pintar(){\n    els.forEach(function(e){ e.classList.toggle('on', +e.getAttribute('data-paso') <= paso); });\n    esc.classList.toggle('fuera', paso >= 3);\n  }\n  function ir(n){\n    paso = Math.max(1, Math.min(MAX, n));\n    pintar();\n    ayuda.style.opacity = 0;\n  }\n  function escalar(){\n    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);\n    esc.style.transform = 'translate(-50%,-50%) scale(' + s + ')';\n  }\n\n  document.addEventListener('keydown', function(ev){\n    var k = ev.key;\n    if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter') { ir(paso + 1); ev.preventDefault(); }\n    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { ir(paso - 1); ev.preventDefault(); }\n    else if (k === 'Home') ir(1);\n    else if (k === 'End') ir(MAX);\n  });\n  document.addEventListener('click', function(){ ir(paso + 1); });\n  window.addEventListener('resize', escalar);\n\n  escalar();\n  /* #todo muestra la ficha completa (útil para sacar una imagen); #paso=N empieza en el paso N */\n  var hs = location.hash, mm = hs.match(/paso=(\\d+)/);\n  if (hs === '#todo') { paso = MAX; ayuda.style.display = 'none'; }\n  else if (mm) paso = Math.max(1, Math.min(MAX, +mm[1]));\n  requestAnimationFrame(pintar);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"titulo": "Ficha 27 · Ver venir los vencimientos", "html": "<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Ficha 27 · Ver venir los vencimientos<\/title>\n<style>\n/* ===== Base común de las fichas BDDAT: copiar tal cual a cada ficha ===== */\n:root{\n  --fondo:#fff; --tarjeta:#F7F6F2; --borde:#D3D1C7; --borde-fuerte:#888780;\n  --texto:#2C2C2A; --texto-2:#5F5E5A;\n  --ida:#185FA5;      /* lo que va */\n  --vuelta:#3B6D11;   /* lo que vuelve */\n  --plan:#854F0B;     /* reservado */\n}\n*{box-sizing:border-box;margin:0}\nhtml,body{height:100%;background:var(--fondo);overflow:hidden}\nbody{font-family:\"Segoe UI\",Roboto,Arial,sans-serif;color:var(--texto)}\n\n/* Lienzo fijo de 1280x720 que se escala para caber en cualquier ventana */\n#escenario{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center}\n\n/* Aparición por pasos: cada elemento lleva data-paso=\"N\" y se muestra al llegar a N */\n.paso{opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s ease}\n.paso.on{opacity:var(--op,1);transform:none}\n\n#ayuda{position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:14px;color:#B4B2A9;\n  transition:opacity .4s}\n@media (prefers-reduced-motion:reduce){.paso,#ayuda{transition:none}}\n\n/* ===== Propio de esta ficha ===== */\n.titulo{position:absolute;left:0;right:0;top:34px;text-align:center;font-size:30px;font-weight:600}\n:root{--tiempo:#7A3E9D;--rojo:#A32D2D}\n\n/* El horizonte: tres semanas, una calle por tramitador */\n.horizonte{position:absolute;left:40px;top:100px;width:1200px;height:300px}\n.semana{position:absolute;top:0;height:300px;border-left:1.5px dashed var(--borde);font-size:14px;font-weight:700;color:var(--texto-2);padding-left:8px}\n.hoy{position:absolute;top:34px;height:262px;border-left:3px solid var(--texto)}\n.hoy span{position:absolute;top:262px;left:-14px;font-size:14px;font-weight:700}\n.calle{position:absolute;left:0;width:1200px;height:66px;border-top:1px solid var(--borde)}\n.calle .quien{position:absolute;left:0;top:0;width:120px;height:66px;display:flex;align-items:center;font-size:17px;font-weight:700;\n  background:#fff;border-right:2px solid var(--borde-fuerte);padding-left:4px}\n.marca{position:absolute;top:12px;translate:-50% 0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;font-weight:700;white-space:nowrap}\n.marca i{width:16px;height:16px;border-radius:50%;background:var(--tiempo)}\n.marca.res i{border-radius:3px;rotate:45deg;background:var(--rojo)}\n.marca.res{color:var(--rojo)}\n.marca{color:var(--tiempo)}\n.leyenda{position:absolute;left:40px;top:414px;display:flex;gap:22px;font-size:15px;color:var(--texto-2)}\n.leyenda span{display:flex;align-items:center;gap:7px}\n.leyenda i{width:13px;height:13px;border-radius:50%;background:var(--tiempo)}\n.leyenda i.res{border-radius:2px;rotate:45deg;background:var(--rojo)}\n\n/* Abajo: el aviso a la persona y el informe para servicios centrales */\n.aviso{position:absolute;left:40px;top:470px;width:560px;display:flex;gap:14px;border:2.5px solid var(--rojo);border-radius:12px;background:#FBEFEF;padding:14px 16px}\n.aviso svg{width:34px;height:34px;flex:none;color:var(--rojo)}\n.aviso svg *{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}\n.aviso .t{font-size:18px;font-weight:700}\n.aviso .s{font-size:16px;color:var(--texto-2);margin-top:3px}\n.informe{position:absolute;left:660px;top:470px;width:580px;border:2.5px solid var(--texto);border-radius:12px;background:var(--tarjeta);padding:12px 16px}\n.informe h3{font-size:18px;font-weight:700;margin-bottom:8px}\n.informe h3 small{font-size:14px;font-weight:600;color:var(--texto-2);margin-left:8px}\n.cifras{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}\n.cifra{background:#fff;border:1.5px solid var(--borde-fuerte);border-radius:8px;padding:6px 10px}\n.cifra b{display:block;font-size:24px}\n.cifra span{font-size:14px;color:var(--texto-2)}\n.cifra.mal b{color:var(--rojo)}\n<\/style>\n<\/head>\n<body>\n<script>\n(function(){\n  var st = document.createElement('style');\n  st.textContent = '#ayuda{display:none!important}';\n  document.head.appendChild(st);\n\n  function conPaso(){ return [].slice.call(document.querySelectorAll('[data-paso]')); }\n  function maximo(){\n    return Math.max.apply(null, conPaso().map(function(e){ return +e.getAttribute('data-paso'); }));\n  }\n  function actual(){\n    var v = conPaso().filter(function(e){ return e.classList.contains('on'); })\n      .map(function(e){ return +e.getAttribute('data-paso'); });\n    return Math.max.apply(null, [1].concat(v));\n  }\n  function tecla(k){ document.dispatchEvent(new KeyboardEvent('keydown', {key: k, bubbles: true})); }\n\n  window.addEventListener('message', function(ev){\n    var m = ev.data || {};\n    if (m.cmd === 'next') {\n      if (actual() >= maximo()) parent.postMessage({fin: 'fin'}, '*'); else tecla('ArrowRight');\n    } else if (m.cmd === 'prev') {\n      if (actual() <= 1) parent.postMessage({fin: 'inicio'}, '*'); else tecla('ArrowLeft');\n    } else if (m.cmd === 'ultimo') {\n      tecla('End');\n    }\n  });\n\n  var NAV = {ArrowRight:1, ArrowLeft:1, ArrowUp:1, ArrowDown:1, ' ':1, PageDown:1, PageUp:1,\n             Enter:1, Backspace:1, Home:1, End:1, f:1, F:1};\n  document.addEventListener('keydown', function(e){\n    if (!e.isTrusted || !NAV[e.key]) return;\n    e.stopImmediatePropagation(); e.preventDefault();\n    parent.postMessage({tecla: e.key}, '*');\n  }, true);\n  document.addEventListener('click', function(e){\n    if (!e.isTrusted) return;\n    e.stopImmediatePropagation();\n    parent.postMessage({cmd: 'next'}, '*');\n  }, true);\n\n  window.addEventListener('load', function(){\n    setTimeout(function(){\n      window.dispatchEvent(new Event('resize'));\n      parent.postMessage({listo: true}, '*');\n    }, 60);\n  });\n})();\n<\/script>\n\n<svg width=\"0\" height=\"0\" style=\"position:absolute\" aria-hidden=\"true\">\n  <symbol id=\"i-campana\" viewBox=\"0 0 34 34\"><path d=\"M9 24V15a8 8 0 0 1 16 0v9l3 3H6z\"/><path d=\"M14 30a3 3 0 0 0 6 0\"/><\/symbol>\n<\/svg>\n\n<div id=\"escenario\">\n  <div class=\"bloque-tag\" style=\"position:absolute;left:28px;top:16px;font-size:13px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#B4B2A9\">8 · Lo que viene<\/div>\n  <div class=\"titulo\">Ver venir los vencimientos<\/div>\n  <div class=\"horizonte paso\" data-paso=\"2\" id=\"horizonte\"><\/div>\n  <div class=\"leyenda paso\" data-paso=\"2\">\n    <span><i><\/i>plazo de un tercero (alegaciones, informe, subsanación)<\/span>\n    <span><i class=\"res\"><\/i>plazo de resolver de un acto<\/span>\n  <\/div>\n\n  <!-- 3 · El aviso a quien le toca -->\n  <div class=\"aviso paso\" data-paso=\"3\">\n    <svg><use href=\"#i-campana\"/><\/svg>\n    <div><div class=\"t\">Tomás: el plazo de resolver la AAC de AT-12 vence en 5 días<\/div>\n      <div class=\"s\">el aviso llega a quien lleva el expediente, sin buscarlo<\/div><\/div>\n  <\/div>\n\n  <!-- 4 · El informe para los servicios centrales -->\n  <div class=\"informe paso\" data-paso=\"4\">\n    <h3>Informe de situación<small>a demanda · cifras de ejemplo<\/small><\/h3>\n    <div class=\"cifras\">\n      <div class=\"cifra\"><b>214<\/b><span>solicitudes en trámite<\/span><\/div>\n      <div class=\"cifra mal\"><b>6<\/b><span>con el plazo de resolver vencido<\/span><\/div>\n      <div class=\"cifra\"><b>2,4 meses<\/b><span>tiempo medio de una AAP<\/span><\/div>\n    <\/div>\n  <\/div>\n<\/div>\n\n<div id=\"ayuda\">← → o clic para avanzar<\/div>\n\n<script>\n(function(){\n  /* Tres semanas desde el lunes 19; una calle por tramitador con sus vencimientos.\n     [día desde el lunes 19 (0..20), texto, ¿plazo de resolver?] */\n  var CALLES = [\n    ['Tomás', [[3, 'AT-3 · alegaciones'], [9, 'AT-12 · AAC', true], [15, 'AT-7 · ADIF']]],\n    ['Ana',   [[4, 'AT-21 · subsanación'], [8, 'AT-19 · Ministerio'], [18, 'AT-19 · AAP', true]]],\n    ['Luis',  [[5, 'AT-30 · DUP', true], [12, 'AT-28 · CHG'], [16, 'AT-31 · subsanación']]],\n  ];\n  var h = document.getElementById('horizonte');\n  var X0 = 140, DIA = 50;   /* 21 días × 50 px desde x = 140 */\n  function x(d){ return X0 + d * DIA + 25; }\n  ['Semana del 19', 'Semana del 26', 'Semana del 2'].forEach(function(t, i){\n    var s = document.createElement('div');\n    s.className = 'semana';\n    s.style.left = (X0 + i * 7 * DIA) + 'px';\n    s.textContent = t;\n    h.appendChild(s);\n  });\n  var hoy = document.createElement('div');\n  hoy.className = 'hoy';\n  hoy.style.left = (X0 + 2 * DIA) + 'px';\n  hoy.innerHTML = '<span>hoy<\/span>';\n  h.appendChild(hoy);\n  CALLES.forEach(function(c, k){\n    var calle = document.createElement('div');\n    calle.className = 'calle';\n    calle.style.top = (40 + k * 84) + 'px';\n    calle.innerHTML = '<div class=\"quien\"><\/div>';\n    calle.firstChild.textContent = c[0];\n    c[1].forEach(function(m){\n      var e = document.createElement('div');\n      e.className = 'marca' + (m[2] ? ' res' : '');\n      e.style.left = x(m[0]) + 'px';\n      e.innerHTML = '<i><\/i><span><\/span>';\n      e.lastChild.textContent = m[1];\n      calle.appendChild(e);\n    });\n    h.appendChild(calle);\n  });\n\n  var esc = document.getElementById('escenario');\n  var els = [].slice.call(document.querySelectorAll('[data-paso]'));\n  var MAX = Math.max.apply(null, els.map(function(e){ return +e.getAttribute('data-paso'); }));\n  var paso = 1;\n  var ayuda = document.getElementById('ayuda');\n\n  function pintar(){\n    els.forEach(function(e){ e.classList.toggle('on', +e.getAttribute('data-paso') <= paso); });\n  }\n  function ir(n){\n    paso = Math.max(1, Math.min(MAX, n));\n    pintar();\n    ayuda.style.opacity = 0;\n  }\n  function escalar(){\n    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);\n    esc.style.transform = 'translate(-50%,-50%) scale(' + s + ')';\n  }\n\n  document.addEventListener('keydown', function(ev){\n    var k = ev.key;\n    if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter') { ir(paso + 1); ev.preventDefault(); }\n    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { ir(paso - 1); ev.preventDefault(); }\n    else if (k === 'Home') ir(1);\n    else if (k === 'End') ir(MAX);\n  });\n  document.addEventListener('click', function(){ ir(paso + 1); });\n  window.addEventListener('resize', escalar);\n\n  escalar();\n  /* #todo muestra la ficha completa (útil para sacar una imagen); #paso=N empieza en el paso N */\n  var hs = location.hash, mm = hs.match(/paso=(\\d+)/);\n  if (hs === '#todo') { paso = MAX; ayuda.style.display = 'none'; }\n  else if (mm) paso = Math.max(1, Math.min(MAX, +mm[1]));\n  requestAnimationFrame(pintar);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"titulo": "Ficha 28 · La instalación en el mapa", "html": "<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Ficha 28 · La instalación en el mapa<\/title>\n<style>\n/* ===== Base común de las fichas BDDAT: copiar tal cual a cada ficha ===== */\n:root{\n  --fondo:#fff; --tarjeta:#F7F6F2; --borde:#D3D1C7; --borde-fuerte:#888780;\n  --texto:#2C2C2A; --texto-2:#5F5E5A;\n  --ida:#185FA5;      /* lo que va */\n  --vuelta:#3B6D11;   /* lo que vuelve */\n  --plan:#854F0B;     /* reservado */\n}\n*{box-sizing:border-box;margin:0}\nhtml,body{height:100%;background:var(--fondo);overflow:hidden}\nbody{font-family:\"Segoe UI\",Roboto,Arial,sans-serif;color:var(--texto)}\n\n/* Lienzo fijo de 1280x720 que se escala para caber en cualquier ventana */\n#escenario{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center}\n\n/* Aparición por pasos: cada elemento lleva data-paso=\"N\" y se muestra al llegar a N */\n.paso{opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s ease}\n.paso.on{opacity:var(--op,1);transform:none}\n\n#ayuda{position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:14px;color:#B4B2A9;\n  transition:opacity .4s}\n@media (prefers-reduced-motion:reduce){.paso,#ayuda,.finca{transition:none}}\n\n/* ===== Propio de esta ficha ===== */\n.titulo{position:absolute;left:0;right:0;top:34px;text-align:center;font-size:30px;font-weight:600}\n\n/* Izquierda: el mapa */\n.mapa{position:absolute;left:40px;top:100px;width:640px;height:480px;border:2px solid var(--borde-fuerte);border-radius:12px;overflow:hidden;\n  background:#FBFAF6}\n.mapa svg{position:absolute;left:0;top:0}\n.finca{fill:none;stroke:#D3D1C7;stroke-width:1.5;transition:fill .6s ease,stroke .6s ease}\n.ver-fincas .finca.afectada{fill:url(#rayado);stroke:var(--texto-2)}\n.camino{fill:none;stroke:#E2E0D8;stroke-width:9;stroke-linecap:round}\n.tramo{fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}\n.tramo.servicio{stroke:var(--vuelta)}\n.tramo.autorizada{stroke:var(--ida)}\n.tramo.tramite{stroke:var(--borde-fuerte);stroke-dasharray:10 8}\n.set{fill:#fff;stroke:var(--texto);stroke-width:3}\n.ct{fill:#fff;stroke:var(--ida);stroke-width:3}\n.rot{font-size:14px;font-weight:700;fill:var(--texto)}\n.rot.claro{fill:var(--texto-2);font-weight:600}\n\n/* Derecha: los elementos y el acto que los ampara */\n.lista{position:absolute;left:720px;top:100px;width:520px;border:2px solid var(--borde-fuerte);border-radius:12px;background:#fff;overflow:hidden}\n.lista .cab,.lista .f{display:grid;grid-template-columns:1fr 130px 120px;align-items:center}\n.lista .cab{background:var(--tarjeta);font-size:13px;font-weight:700;color:var(--texto-2);text-transform:uppercase;letter-spacing:.4px}\n.lista span{padding:7px 12px}\n.lista .f{border-top:1px solid var(--borde);font-size:16px}\n.estado{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700}\n.estado i{width:22px;height:5px;border-radius:3px}\n.e-servicio{color:var(--vuelta)} .e-servicio i{background:var(--vuelta)}\n.e-autorizada{color:var(--ida)} .e-autorizada i{background:var(--ida)}\n.e-tramite{color:var(--texto-2)} .e-tramite i{background:repeating-linear-gradient(90deg,var(--borde-fuerte) 0 6px,transparent 6px 10px)}\n.acto{font-size:14px;color:var(--texto-2)}\n\n.fincas{position:absolute;left:720px;top:380px;width:520px;display:flex;gap:14px;align-items:center;border:2px solid var(--texto-2);border-radius:12px;\n  background:#fff;padding:12px 16px}\n.fincas i{width:44px;height:30px;flex:none;border:2px solid var(--texto-2);border-radius:4px;\n  background:repeating-linear-gradient(135deg,#F3F2EE 0 4px,#B4B2A9 4px 6px)}\n.fincas b{font-size:18px}\n.fincas span{font-size:16px;color:var(--texto-2)}\n.lema{position:absolute;left:720px;top:500px;width:520px;font-size:20px;line-height:1.4;color:var(--texto-2)}\n.lema b{color:var(--texto)}\n<\/style>\n<\/head>\n<body>\n<script>\n(function(){\n  var st = document.createElement('style');\n  st.textContent = '#ayuda{display:none!important}';\n  document.head.appendChild(st);\n\n  function conPaso(){ return [].slice.call(document.querySelectorAll('[data-paso]')); }\n  function maximo(){\n    return Math.max.apply(null, conPaso().map(function(e){ return +e.getAttribute('data-paso'); }));\n  }\n  function actual(){\n    var v = conPaso().filter(function(e){ return e.classList.contains('on'); })\n      .map(function(e){ return +e.getAttribute('data-paso'); });\n    return Math.max.apply(null, [1].concat(v));\n  }\n  function tecla(k){ document.dispatchEvent(new KeyboardEvent('keydown', {key: k, bubbles: true})); }\n\n  window.addEventListener('message', function(ev){\n    var m = ev.data || {};\n    if (m.cmd === 'next') {\n      if (actual() >= maximo()) parent.postMessage({fin: 'fin'}, '*'); else tecla('ArrowRight');\n    } else if (m.cmd === 'prev') {\n      if (actual() <= 1) parent.postMessage({fin: 'inicio'}, '*'); else tecla('ArrowLeft');\n    } else if (m.cmd === 'ultimo') {\n      tecla('End');\n    }\n  });\n\n  var NAV = {ArrowRight:1, ArrowLeft:1, ArrowUp:1, ArrowDown:1, ' ':1, PageDown:1, PageUp:1,\n             Enter:1, Backspace:1, Home:1, End:1, f:1, F:1};\n  document.addEventListener('keydown', function(e){\n    if (!e.isTrusted || !NAV[e.key]) return;\n    e.stopImmediatePropagation(); e.preventDefault();\n    parent.postMessage({tecla: e.key}, '*');\n  }, true);\n  document.addEventListener('click', function(e){\n    if (!e.isTrusted) return;\n    e.stopImmediatePropagation();\n    parent.postMessage({cmd: 'next'}, '*');\n  }, true);\n\n  window.addEventListener('load', function(){\n    setTimeout(function(){\n      window.dispatchEvent(new Event('resize'));\n      parent.postMessage({listo: true}, '*');\n    }, 60);\n  });\n})();\n<\/script>\n\n<div id=\"escenario\">\n  <div class=\"bloque-tag\" style=\"position:absolute;left:28px;top:16px;font-size:13px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#B4B2A9\">8 · Lo que viene<\/div>\n  <div class=\"titulo\">La instalación, no solo el expediente<\/div>\n\n  <!-- 2 · El mapa: fincas, caminos y las dos subestaciones -->\n  <div class=\"mapa paso\" data-paso=\"2\">\n    <svg width=\"640\" height=\"480\" viewBox=\"0 0 640 480\">\n      <defs>\n        <pattern id=\"rayado\" width=\"9\" height=\"9\" patternUnits=\"userSpaceOnUse\" patternTransform=\"rotate(45)\">\n          <rect width=\"9\" height=\"9\" fill=\"#F3F2EE\"/><path d=\"M0 0 V9\" stroke=\"#B4B2A9\" stroke-width=\"3\"/>\n        <\/pattern>\n      <\/defs>\n      <g id=\"fincas\">\n        <path class=\"finca afectada\" d=\"M0 0 H180 L160 150 H0z\"/>\n        <path class=\"finca afectada\" d=\"M180 0 H330 L320 170 L160 150z\"/>\n        <path class=\"finca\" d=\"M330 0 H640 V120 L320 170z\"/>\n        <path class=\"finca afectada\" d=\"M0 150 H160 L320 170 L300 330 L0 300z\"/>\n        <path class=\"finca afectada\" d=\"M320 170 L640 120 V300 L470 330 L300 330z\"/>\n        <path class=\"finca\" d=\"M0 300 L300 330 L280 480 H0z\"/>\n        <path class=\"finca\" d=\"M300 330 L470 330 L520 480 H280z\"/>\n        <path class=\"finca afectada\" d=\"M470 330 L640 300 V480 H520z\"/>\n      <\/g>\n      <path class=\"camino\" d=\"M0 230 C160 240 360 200 640 210\"/>\n      <path class=\"camino\" d=\"M410 0 C400 160 430 320 400 480\"/>\n      <!-- 3 · la línea, por tramos según su estado -->\n      <g class=\"paso\" data-paso=\"3\">\n        <path class=\"tramo servicio\" d=\"M70 110 L240 150\"/>\n        <path class=\"tramo autorizada\" d=\"M240 150 L360 260\"/>\n        <path class=\"tramo tramite\" d=\"M360 260 L560 390\"/>\n        <circle class=\"ct\" cx=\"240\" cy=\"150\" r=\"9\"/>\n      <\/g>\n      <rect class=\"set\" x=\"52\" y=\"92\" width=\"36\" height=\"36\" rx=\"4\"/>\n      <rect class=\"set\" x=\"542\" y=\"372\" width=\"36\" height=\"36\" rx=\"4\"/>\n      <text class=\"rot\" x=\"40\" y=\"80\">SET Cartuja<\/text>\n      <text class=\"rot\" x=\"480\" y=\"430\">SET Guadalcacín<\/text>\n      <text class=\"rot claro paso\" data-paso=\"3\" x=\"252\" y=\"140\">CT 1<\/text>\n    <\/svg>\n  <\/div>\n\n  <!-- 4 · Cada elemento con su estado y el acto que lo ampara -->\n  <div class=\"lista paso\" data-paso=\"4\">\n    <div class=\"cab\"><span>Elemento<\/span><span>Estado<\/span><span>Lo ampara<\/span><\/div>\n    <div class=\"f\"><span>Línea 66 kV, tramo 1<\/span><span class=\"estado e-servicio\"><i><\/i>en servicio<\/span><span class=\"acto\">AE 2025<\/span><\/div>\n    <div class=\"f\"><span>Centro de transformación 1<\/span><span class=\"estado e-autorizada\"><i><\/i>autorizado<\/span><span class=\"acto\">AAC 2026<\/span><\/div>\n    <div class=\"f\"><span>Línea 66 kV, tramo 2<\/span><span class=\"estado e-autorizada\"><i><\/i>autorizado<\/span><span class=\"acto\">AAC 2026<\/span><\/div>\n    <div class=\"f\"><span>Línea 66 kV, tramo 3<\/span><span class=\"estado e-tramite\"><i><\/i>en trámite<\/span><span class=\"acto\">reformado<\/span><\/div>\n  <\/div>\n\n  <!-- 5 · Las fincas que cruza -->\n  <div class=\"fincas paso\" data-paso=\"5\">\n    <i><\/i><div><b>Las fincas que cruza<\/b><br><span>la relación de bienes y derechos de la DUP, sobre el catastro<\/span><\/div>\n  <\/div>\n\n  <!-- 6 · La idea -->\n  <div class=\"lema paso\" data-paso=\"6\">El expediente dice <b>qué se autorizó<\/b>;<br>el mapa, <b>dónde está y en qué punto<\/b>.<\/div>\n<\/div>\n\n<div id=\"ayuda\">← → o clic para avanzar<\/div>\n\n<script>\n(function(){\n  var els = [].slice.call(document.querySelectorAll('[data-paso]'));\n  var MAX = Math.max.apply(null, els.map(function(e){ return +e.getAttribute('data-paso'); }));\n  var paso = 1;\n  var esc = document.getElementById('escenario');\n  var ayuda = document.getElementById('ayuda');\n\n  function pintar(){\n    els.forEach(function(e){ e.classList.toggle('on', +e.getAttribute('data-paso') <= paso); });\n    esc.classList.toggle('ver-fincas', paso >= 5);\n  }\n  function ir(n){\n    paso = Math.max(1, Math.min(MAX, n));\n    pintar();\n    ayuda.style.opacity = 0;\n  }\n  function escalar(){\n    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);\n    esc.style.transform = 'translate(-50%,-50%) scale(' + s + ')';\n  }\n\n  document.addEventListener('keydown', function(ev){\n    var k = ev.key;\n    if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter') { ir(paso + 1); ev.preventDefault(); }\n    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { ir(paso - 1); ev.preventDefault(); }\n    else if (k === 'Home') ir(1);\n    else if (k === 'End') ir(MAX);\n  });\n  document.addEventListener('click', function(){ ir(paso + 1); });\n  window.addEventListener('resize', escalar);\n\n  escalar();\n  /* #todo muestra la ficha completa (útil para sacar una imagen); #paso=N empieza en el paso N */\n  var hs = location.hash, mm = hs.match(/paso=(\\d+)/);\n  if (hs === '#todo') { paso = MAX; ayuda.style.display = 'none'; }\n  else if (mm) paso = Math.max(1, Math.min(MAX, +mm[1]));\n  requestAnimationFrame(pintar);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}];

(function(){
  var marco = document.getElementById('marco');
  var capa = document.getElementById('capa');
  var info = document.getElementById('info');
  var idx = 0, listo = false, alUltimo = false, aviso = null;

  function avisar(texto){
    info.textContent = texto;
    info.classList.add('ver');
    clearTimeout(aviso);
    aviso = setTimeout(function(){ info.classList.remove('ver'); }, 2600);
  }

  function mostrar(i, ultimo){
    idx = i; listo = false; alUltimo = !!ultimo;
    marco.srcdoc = FICHAS[i].html;
    document.title = FICHAS[i].titulo;
    try { history.replaceState(null, '', '#' + (i + 1)); } catch (e) {}
    avisar((i + 1) + ' / ' + FICHAS.length + '  ·  ' + FICHAS[i].titulo);
  }

  function enviar(cmd){ if (listo) marco.contentWindow.postMessage({cmd: cmd}, '*'); }
  function siguiente(){ enviar('next'); }
  function anterior(){ enviar('prev'); }

  function pantallaCompleta(){
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  }

  function tecla(k){
    if (k === 'ArrowRight' || k === 'ArrowDown' || k === ' ' || k === 'PageDown' || k === 'Enter') siguiente();
    else if (k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp' || k === 'Backspace') anterior();
    else if (k === 'Home') mostrar(0, false);
    else if (k === 'End') mostrar(FICHAS.length - 1, true);
    else if (k === 'f' || k === 'F') pantallaCompleta();
    else return false;
    return true;
  }

  window.addEventListener('message', function(ev){
    if (ev.source !== marco.contentWindow) return;
    var m = ev.data || {};
    if (m.listo) {
      listo = true;
      if (alUltimo) { alUltimo = false; enviar('ultimo'); }
    } else if (m.fin === 'fin') {
      if (idx < FICHAS.length - 1) mostrar(idx + 1, false); else avisar('fin de la presentación');
    } else if (m.fin === 'inicio') {
      if (idx > 0) mostrar(idx - 1, true);
    } else if (m.cmd === 'next') {
      siguiente();
    } else if (m.tecla) {
      tecla(m.tecla);
    }
  });

  document.addEventListener('keydown', function(e){
    if (e.ctrlKey || e.altKey || e.metaKey) return;
    if (tecla(e.key)) e.preventDefault();
  });
  capa.addEventListener('click', siguiente);

  /* #N empieza en la ficha N (empezando por 1) */
  var n = parseInt(location.hash.slice(1), 10);
  mostrar(n >= 1 && n <= FICHAS.length ? n - 1 : 0, false);
  window.__ficha = function(){ return idx; };
})();
</script>
