var FICHAS = [{"titulo": "BDDAT · Cómo funciona", "html": "<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>BDDAT · Cómo funciona<\/title>\n<style>\n/* ===== Base común de las fichas BDDAT: copiar tal cual a cada ficha ===== */\n:root{\n  --fondo:#fff; --tarjeta:#F7F6F2; --borde:#D3D1C7; --borde-fuerte:#888780;\n  --texto:#2C2C2A; --texto-2:#5F5E5A;\n  --ida:#185FA5;      /* lo que va */\n  --vuelta:#3B6D11;   /* lo que vuelve */\n  --plan:#854F0B;     /* reservado */\n}\n*{box-sizing:border-box;margin:0}\nhtml,body{height:100%;background:var(--fondo);overflow:hidden}\nbody{font-family:\"Segoe UI\",Roboto,Arial,sans-serif;color:var(--texto)}\n\n/* Lienzo fijo de 1280x720 que se escala para caber en cualquier ventana */\n#escenario{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center}\n\n/* Aparición por pasos: cada elemento lleva data-paso=\"N\" y se muestra al llegar a N;\n   con data-hasta=\"M\" se vuelve a ocultar al llegar a M */\n.paso{opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s ease}\n.paso.on{opacity:var(--op,1);transform:none}\n\n#ayuda{position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:14px;color:#B4B2A9;\n  transition:opacity .4s}\n@media (prefers-reduced-motion:reduce){.paso,#ayuda,.cabecera{transition:none}}\n\n/* ===== Propio de esta ficha ===== */\n/* La cabecera empieza en el centro y sube para dejar sitio al índice */\n.cabecera{position:absolute;left:0;right:0;top:250px;text-align:center;transition:top .7s ease}\n.indice-on .cabecera{top:60px}\n.cabecera h1{font-size:96px;font-weight:700;letter-spacing:2px;transition:font-size .7s ease}\n.indice-on .cabecera h1{font-size:60px}\n.cabecera .sub{font-size:34px;font-weight:600;color:var(--texto-2);margin-top:2px;transition:font-size .7s ease}\n.indice-on .cabecera .sub{font-size:26px}\n.cabecera .que{font-size:19px;color:var(--texto-2);margin-top:18px}\n.raya{width:120px;height:4px;border-radius:2px;background:var(--texto);margin:22px auto 0}\n\n/* El índice: los bloques de la presentación */\n.indice{position:absolute;left:170px;right:170px;top:290px;display:grid;grid-template-columns:1fr 1fr;column-gap:40px;row-gap:12px}\n.bloque{display:flex;align-items:center;gap:14px;border:2px solid var(--borde-fuerte);border-radius:12px;background:#fff;padding:9px 14px}\n.bloque .n{flex:none;width:36px;height:36px;border-radius:50%;background:var(--tarjeta);border:2px solid var(--borde-fuerte);\n  display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;color:var(--texto-2)}\n.bloque .t{font-size:19px;font-weight:700}\n.bloque .t small{display:block;font-size:14px;font-weight:600;color:var(--texto-2)}\n<\/style>\n<\/head>\n<body>\n<script>\n(function(){\n  var st = document.createElement('style');\n  st.textContent = '#ayuda{display:none!important}';\n  document.head.appendChild(st);\n\n  function conPaso(){ return [].slice.call(document.querySelectorAll('[data-paso]')); }\n  function maximo(){\n    return Math.max.apply(null, conPaso().map(function(e){ return +e.getAttribute('data-paso'); }));\n  }\n  function actual(){\n    var v = conPaso().filter(function(e){ return e.classList.contains('on'); })\n      .map(function(e){ return +e.getAttribute('data-paso'); });\n    return Math.max.apply(null, [1].concat(v));\n  }\n  function tecla(k){ document.dispatchEvent(new KeyboardEvent('keydown', {key: k, bubbles: true})); }\n\n  window.addEventListener('message', function(ev){\n    var m = ev.data || {};\n    if (m.cmd === 'next') {\n      if (actual() >= maximo()) parent.postMessage({fin: 'fin'}, '*'); else tecla('ArrowRight');\n    } else if (m.cmd === 'prev') {\n      if (actual() <= 1) parent.postMessage({fin: 'inicio'}, '*'); else tecla('ArrowLeft');\n    } else if (m.cmd === 'ultimo') {\n      tecla('End');\n    }\n  });\n\n  var NAV = {ArrowRight:1, ArrowLeft:1, ArrowUp:1, ArrowDown:1, ' ':1, PageDown:1, PageUp:1,\n             Enter:1, Backspace:1, Home:1, End:1, f:1, F:1};\n  document.addEventListener('keydown', function(e){\n    if (!e.isTrusted || !NAV[e.key]) return;\n    e.stopImmediatePropagation(); e.preventDefault();\n    parent.postMessage({tecla: e.key}, '*');\n  }, true);\n  document.addEventListener('click', function(e){\n    if (!e.isTrusted) return;\n    e.stopImmediatePropagation();\n    parent.postMessage({cmd: 'next'}, '*');\n  }, true);\n\n  window.addEventListener('load', function(){\n    setTimeout(function(){\n      window.dispatchEvent(new Event('resize'));\n      parent.postMessage({listo: true}, '*');\n    }, 60);\n  });\n})();\n<\/script>\n\n<div id=\"escenario\">\n  <div class=\"cabecera\">\n    <h1>BDDAT<\/h1>\n    <div class=\"sub\">Cómo funciona<\/div>\n    <div class=\"raya\"><\/div>\n    <div class=\"que paso\" data-paso=\"1\" data-hasta=\"2\">Tramitación de autorizaciones de instalaciones eléctricas de alta tensión<\/div>\n  <\/div>\n\n  <!-- 2 · El índice -->\n  <div class=\"indice\" id=\"indice\"><\/div>\n<\/div>\n\n<div id=\"ayuda\">← → o clic para avanzar<\/div>\n\n<script>\n(function(){\n  var BLOQUES = [\n    ['El problema y los principios', 'el procedimiento, rígido o libre'],\n    ['La estructura', 'documento, expediente, tareas, estado'],\n    ['El control', 'reglas e invariantes'],\n    ['Con quién y cuándo', 'entidades, notificaciones, plazos, certificados'],\n    ['Fases del procedimiento', 'análisis, organismos, reformados'],\n    ['Los documentos', 'escritos y almacén'],\n    ['Las personas', 'usuarios y roles'],\n    ['De principio a fin', 'dónde estamos y lo que viene'],\n  ];\n  var indice = document.getElementById('indice');\n  BLOQUES.forEach(function(b, i){\n    var d = document.createElement('div');\n    d.className = 'bloque paso';\n    d.setAttribute('data-paso', 2);\n    /* en columnas: primero baja la izquierda, luego la derecha */\n    d.style.gridColumn = i < 4 ? 1 : 2;\n    d.style.gridRow = (i % 4) + 1;\n    d.style.transitionDelay = (.35 + i * .1) + 's';\n    d.innerHTML = '<span class=\"n\">' + (i + 1) + '<\/span><span class=\"t\"><\/span>';\n    var t = d.querySelector('.t');\n    t.textContent = b[0];\n    var s = document.createElement('small'); s.textContent = b[1]; t.appendChild(s);\n    indice.appendChild(d);\n  });\n\n  var els = [].slice.call(document.querySelectorAll('[data-paso]'));\n  var MAX = Math.max.apply(null, els.map(function(e){ return +e.getAttribute('data-paso'); }));\n  var paso = 1;\n  var esc = document.getElementById('escenario');\n  var ayuda = document.getElementById('ayuda');\n\n  function pintar(){\n    els.forEach(function(e){\n      var n = +e.getAttribute('data-paso'), hasta = e.getAttribute('data-hasta');\n      e.classList.toggle('on', n <= paso && (!hasta || paso < +hasta));\n    });\n    esc.classList.toggle('indice-on', paso >= 2);\n  }\n  function ir(n){\n    paso = Math.max(1, Math.min(MAX, n));\n    pintar();\n    ayuda.style.opacity = 0;\n  }\n  function escalar(){\n    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);\n    esc.style.transform = 'translate(-50%,-50%) scale(' + s + ')';\n  }\n\n  document.addEventListener('keydown', function(ev){\n    var k = ev.key;\n    if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter') { ir(paso + 1); ev.preventDefault(); }\n    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { ir(paso - 1); ev.preventDefault(); }\n    else if (k === 'Home') ir(1);\n    else if (k === 'End') ir(MAX);\n  });\n  document.addEventListener('click', function(){ ir(paso + 1); });\n  window.addEventListener('resize', escalar);\n\n  escalar();\n  /* #todo muestra la ficha completa (útil para sacar una imagen); #paso=N empieza en el paso N */\n  var hs = location.hash, mm = hs.match(/paso=(\\d+)/);\n  if (hs === '#todo') { paso = MAX; ayuda.style.display = 'none'; }\n  else if (mm) paso = Math.max(1, Math.min(MAX, +mm[1]));\n  requestAnimationFrame(pintar);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"titulo": "Ficha 1 · El procedimiento de autorización", "html": "<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Ficha 1 · El procedimiento de autorización<\/title>\n<style>\n/* ===== Base común de las fichas BDDAT: copiar tal cual a cada ficha ===== */\n:root{\n  --fondo:#fff; --tarjeta:#F7F6F2; --borde:#D3D1C7; --borde-fuerte:#888780;\n  --texto:#2C2C2A; --texto-2:#5F5E5A;\n  --ida:#185FA5;      /* lo que va */\n  --vuelta:#3B6D11;   /* lo que vuelve */\n  --plan:#854F0B;     /* reservado */\n}\n*{box-sizing:border-box;margin:0}\nhtml,body{height:100%;background:var(--fondo);overflow:hidden}\nbody{font-family:\"Segoe UI\",Roboto,Arial,sans-serif;color:var(--texto)}\n\n/* Lienzo fijo de 1280x720 que se escala para caber en cualquier ventana */\n#escenario{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center}\n\n/* Aparición por pasos: cada elemento lleva data-paso=\"N\" y se muestra al llegar a N */\n.paso{opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s ease}\n.paso.on{opacity:var(--op,1);transform:none}\n\n#ayuda{position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:14px;color:#B4B2A9;\n  transition:opacity .4s}\n@media (prefers-reduced-motion:reduce){.paso,#ayuda,.arco path,.arco .cabeza,.arco text{transition:none}}\n\n/* ===== Propio de esta ficha ===== */\n.titulo{position:absolute;left:0;right:0;top:34px;text-align:center;font-size:30px;font-weight:600}\n\n/* La nube: cada concepto se coloca por su centro (data-x, data-y) */\n.c{position:absolute;translate:-50% -50%;white-space:nowrap;font-weight:600;line-height:1.05;z-index:2;\n  text-shadow:0 0 4px #fff,0 0 8px #fff,0 0 12px #fff}\n/* Principal: recuadro. Secundario: píldora */\n.c.caja{background:var(--tarjeta);border:2px solid var(--borde-fuerte);border-radius:10px;\n  padding:8px 16px;text-shadow:none}\n.c.chip{font-size:16px;font-weight:600;color:var(--texto-2);border:1.5px solid var(--borde-fuerte);\n  border-radius:999px;padding:3px 12px;background:#fff;text-shadow:none}\n/* los satélites de un concepto entran un poco después que él */\n.c.tarde{transition-delay:.25s}\n.c.tarde2{transition-delay:.45s}\n\n/* Las relaciones: se dibujan debajo de las palabras */\n#relaciones,#rotulos{position:absolute;left:0;top:0;width:1280px;height:720px;z-index:1;overflow:visible}\n#rotulos{z-index:3;pointer-events:none}\n.arco path{fill:none;stroke-width:2.5;stroke-linecap:round;transition:stroke-dashoffset .9s ease}\n.arco .cabeza{stroke:none;opacity:0;transition:opacity .2s ease .85s}\n.arco text{font-size:17px;font-weight:600;paint-order:stroke;stroke:#fff;stroke-width:6px;stroke-linejoin:round;\n  opacity:0;transition:opacity .3s ease .5s}\n.arco.on .cabeza,.arco.on text{opacity:1}\n.arco.ida{color:var(--ida)}\n.arco.vuelta{color:var(--vuelta)}\n.arco.tiempo{color:#7A3E9D}\n.arco path{stroke:currentColor}\n.arco .cabeza,.arco text{fill:currentColor}\n<\/style>\n<\/head>\n<body>\n<script>\n(function(){\n  var st = document.createElement('style');\n  st.textContent = '#ayuda{display:none!important}';\n  document.head.appendChild(st);\n\n  function conPaso(){ return [].slice.call(document.querySelectorAll('[data-paso]')); }\n  function maximo(){\n    return Math.max.apply(null, conPaso().map(function(e){ return +e.getAttribute('data-paso'); }));\n  }\n  function actual(){\n    var v = conPaso().filter(function(e){ return e.classList.contains('on'); })\n      .map(function(e){ return +e.getAttribute('data-paso'); });\n    return Math.max.apply(null, [1].concat(v));\n  }\n  function tecla(k){ document.dispatchEvent(new KeyboardEvent('keydown', {key: k, bubbles: true})); }\n\n  window.addEventListener('message', function(ev){\n    var m = ev.data || {};\n    if (m.cmd === 'next') {\n      if (actual() >= maximo()) parent.postMessage({fin: 'fin'}, '*'); else tecla('ArrowRight');\n    } else if (m.cmd === 'prev') {\n      if (actual() <= 1) parent.postMessage({fin: 'inicio'}, '*'); else tecla('ArrowLeft');\n    } else if (m.cmd === 'ultimo') {\n      tecla('End');\n    }\n  });\n\n  var NAV = {ArrowRight:1, ArrowLeft:1, ArrowUp:1, ArrowDown:1, ' ':1, PageDown:1, PageUp:1,\n             Enter:1, Backspace:1, Home:1, End:1, f:1, F:1};\n  document.addEventListener('keydown', function(e){\n    if (!e.isTrusted || !NAV[e.key]) return;\n    e.stopImmediatePropagation(); e.preventDefault();\n    parent.postMessage({tecla: e.key}, '*');\n  }, true);\n  document.addEventListener('click', function(e){\n    if (!e.isTrusted) return;\n    e.stopImmediatePropagation();\n    parent.postMessage({cmd: 'next'}, '*');\n  }, true);\n\n  window.addEventListener('load', function(){\n    setTimeout(function(){\n      window.dispatchEvent(new Event('resize'));\n      parent.postMessage({listo: true}, '*');\n    }, 60);\n  });\n})();\n<\/script>\n\n<div id=\"escenario\">\n  <div class=\"bloque-tag\" style=\"position:absolute;left:28px;top:16px;font-size:13px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#B4B2A9\">1 · El problema y los principios<\/div>\n  <div class=\"titulo\">El procedimiento de autorización de instalaciones eléctricas<\/div>\n\n  <svg id=\"relaciones\" viewBox=\"0 0 1280 720\" aria-hidden=\"true\"><\/svg>\n  <svg id=\"rotulos\" viewBox=\"0 0 1280 720\" aria-hidden=\"true\"><\/svg>\n\n  <!-- 2 · Normativa -->\n  <div class=\"c caja paso\" data-paso=\"2\" id=\"normativa\" data-x=\"250\" data-y=\"205\" style=\"font-size:56px\">Normativa<\/div>\n  <div class=\"c chip paso tarde\" data-paso=\"2\" data-x=\"130\" data-y=\"132\" style=\"font-size:22px\">RD 1955/2000<\/div>\n  <div class=\"c chip paso tarde\" data-paso=\"2\" data-x=\"372\" data-y=\"128\" style=\"font-size:24px\">LSE<\/div>\n  <div class=\"c chip paso tarde\" data-paso=\"2\" data-x=\"96\" data-y=\"268\" style=\"font-size:19px\">RD 337/2014<\/div>\n  <div class=\"c chip paso tarde\" data-paso=\"2\" data-x=\"440\" data-y=\"250\" style=\"font-size:19px\">RD 223/2008<\/div>\n  <div class=\"c chip paso tarde2\" data-paso=\"2\" data-x=\"136\" data-y=\"318\" style=\"font-size:17px\">decretos de simplificación<\/div>\n  <div class=\"c chip paso tarde2\" data-paso=\"2\" data-x=\"440\" data-y=\"296\" style=\"font-size:17px\">medidas urgentes<\/div>\n\n  <!-- 3 · Promotor -->\n  <div class=\"c caja paso\" data-paso=\"3\" id=\"promotor\" data-x=\"720\" data-y=\"160\" style=\"font-size:48px\">Promotor<\/div>\n\n  <!-- 4 · Distribuidora -->\n  <div class=\"c caja paso\" data-paso=\"4\" id=\"distribuidora\" data-x=\"1080\" data-y=\"140\" style=\"font-size:34px\">Distribuidora<\/div>\n\n  <!-- 5 · Información pública -->\n  <div class=\"c caja paso\" data-paso=\"5\" id=\"ip\" data-x=\"590\" data-y=\"470\" style=\"font-size:38px\">Información pública<\/div>\n\n  <!-- 6 · Organismos -->\n  <div class=\"c caja paso\" data-paso=\"6\" id=\"organismos\" data-x=\"1020\" data-y=\"320\" style=\"font-size:46px\">Organismos<\/div>\n\n  <!-- 7 · Solicitudes simples -->\n  <div class=\"c caja paso\" data-paso=\"7\" id=\"solicitudes\" data-x=\"700\" data-y=\"270\" style=\"font-size:32px\">Solicitudes<\/div>\n  <div class=\"c chip paso tarde\" data-paso=\"7\" data-x=\"586\" data-y=\"322\">AAP<\/div>\n  <div class=\"c chip paso tarde\" data-paso=\"7\" data-x=\"646\" data-y=\"322\">AAC<\/div>\n  <div class=\"c chip paso tarde\" data-paso=\"7\" data-x=\"706\" data-y=\"322\">DUP<\/div>\n  <div class=\"c chip paso tarde\" data-paso=\"7\" data-x=\"760\" data-y=\"322\">AE<\/div>\n  <div class=\"c chip paso tarde\" data-paso=\"7\" data-x=\"816\" data-y=\"322\">AAT<\/div>\n  <div class=\"c chip paso tarde2\" data-paso=\"7\" data-x=\"626\" data-y=\"360\">Modificación<\/div>\n  <div class=\"c chip paso tarde2\" data-paso=\"7\" data-x=\"730\" data-y=\"360\">Cierre<\/div>\n  <div class=\"c chip paso tarde2\" data-paso=\"7\" data-x=\"808\" data-y=\"360\">…<\/div>\n\n  <!-- 8 · Proyecto -->\n  <div class=\"c caja paso\" data-paso=\"8\" id=\"proyecto\" data-x=\"300\" data-y=\"430\" style=\"font-size:52px\">Proyecto<\/div>\n  <div class=\"c chip paso tarde\" data-paso=\"8\" data-x=\"166\" data-y=\"500\">distribución<\/div>\n  <div class=\"c chip paso tarde\" data-paso=\"8\" data-x=\"282\" data-y=\"500\">transporte<\/div>\n  <div class=\"c chip paso tarde\" data-paso=\"8\" data-x=\"398\" data-y=\"500\">renovables<\/div>\n\n  <!-- 9 · Documentación -->\n  <div class=\"c caja paso\" data-paso=\"9\" id=\"documentacion\" data-x=\"160\" data-y=\"570\" style=\"font-size:30px\">Documentación<\/div>\n\n  <!-- 10 · Recursos -->\n  <div class=\"c caja paso\" data-paso=\"10\" id=\"recursos\" data-x=\"1170\" data-y=\"450\" style=\"font-size:28px\">Recursos<\/div>\n\n  <!-- 11 · Plazos -->\n  <div class=\"c caja paso\" data-paso=\"11\" id=\"plazos\" data-x=\"880\" data-y=\"610\" style=\"font-size:50px\">Plazos<\/div>\n\n  <!-- 12 · Excepciones -->\n  <div class=\"c caja paso\" data-paso=\"12\" id=\"excepciones\" data-x=\"470\" data-y=\"625\" style=\"font-size:28px\">Excepciones<\/div>\n  <div class=\"c chip paso tarde\" data-paso=\"12\" data-x=\"420\" data-y=\"665\" style=\"font-size:20px\">suelo urbano<\/div>\n  <div class=\"c chip paso tarde\" data-paso=\"12\" data-x=\"545\" data-y=\"665\" style=\"font-size:20px\">tensión<\/div>\n\n  <!-- 13 · Figura ambiental -->\n  <div class=\"c caja paso\" data-paso=\"13\" id=\"ambiental\" data-x=\"1110\" data-y=\"560\" style=\"font-size:32px\">Figura ambiental<\/div>\n  <div class=\"c chip paso tarde\" data-paso=\"13\" data-x=\"1046\" data-y=\"610\">AAU<\/div>\n  <div class=\"c chip paso tarde\" data-paso=\"13\" data-x=\"1162\" data-y=\"610\">Licencia ambiental<\/div>\n<\/div>\n\n<div id=\"ayuda\">← → o clic para avanzar<\/div>\n\n<script>\n(function(){\n  /* Relaciones: [paso, de, a, rótulo, tipo, curvatura]. No pretenden ser exactas:\n     solo enseñan que todo está relacionado con todo. */\n  var RELACIONES = [\n    [14, 'promotor', 'solicitudes', 'solicitud', 'ida', .25],\n    [14, 'promotor', 'proyecto', 'redacta', 'ida', -.18],\n    [14, 'normativa', 'plazos', 'fija', 'tiempo', .22],\n    [14, 'documentacion', 'promotor', 'requerimiento', 'ida', -.12],\n    [14, 'normativa', 'proyecto', 'requisitos', 'ida', -.15],\n    [14, 'normativa', 'excepciones', 'exime', 'ida', .32],\n\n    [15, 'proyecto', 'organismos', 'separata', 'ida', .14],\n    [15, 'organismos', 'promotor', 'condicionados', 'vuelta', .25],\n    [15, 'organismos', 'plazos', 'espera de plazo', 'tiempo', -.25],\n    [15, 'solicitudes', 'distribuidora', 'notificación', 'ida', -.2],\n\n    [16, 'ip', 'promotor', 'alegaciones', 'vuelta', -.3],\n    [16, 'proyecto', 'ip', 'anuncio', 'ida', .3],\n    [16, 'ambiental', 'ip', 'informe', 'vuelta', -.2],\n    [16, 'ip', 'plazos', 'plazo', 'tiempo', .25],\n\n    [17, 'solicitudes', 'recursos', 'resolución', 'ida', -.15],\n    [17, 'recursos', 'plazos', 'plazo', 'tiempo', .3],\n    [17, 'excepciones', 'ip', 'sin IP', 'ida', .35],\n    [17, 'excepciones', 'ambiental', 'exenta', 'ida', -.12],\n    [17, 'plazos', 'documentacion', 'notificación', 'ida', .2],\n    [17, 'distribuidora', 'organismos', 'alegaciones', 'vuelta', .3],\n  ];\n\n  var NS = 'http://www.w3.org/2000/svg';\n  var svg = document.getElementById('relaciones');\n  var svgR = document.getElementById('rotulos');   /* rótulos por encima de las palabras */\n\n  /* Coloca cada concepto en su centro */\n  [].forEach.call(document.querySelectorAll('.c'), function(c){\n    c.style.left = c.getAttribute('data-x') + 'px';\n    c.style.top = c.getAttribute('data-y') + 'px';\n  });\n\n  /* Caja de un concepto en coordenadas del lienzo (sin escalar ni transformar) */\n  function caja(id){\n    var c = document.getElementById(id);\n    var x = +c.getAttribute('data-x'), y = +c.getAttribute('data-y');\n    return {x: x, y: y, w: c.offsetWidth / 2 + 4, h: c.offsetHeight / 2 + 4};\n  }\n  /* Punto donde la recta del centro hacia (tx,ty) sale de la caja */\n  function borde(b, tx, ty){\n    var dx = tx - b.x, dy = ty - b.y;\n    var k = Math.min(Math.abs(b.w / (dx || 1e-6)), Math.abs(b.h / (dy || 1e-6)));\n    return {x: b.x + dx * k, y: b.y + dy * k};\n  }\n  function el(tag, attrs){\n    var e = document.createElementNS(NS, tag);\n    for (var k in attrs) e.setAttribute(k, attrs[k]);\n    return e;\n  }\n\n  function dibujar(){\n    svg.innerHTML = '';\n    svgR.innerHTML = '';\n    RELACIONES.forEach(function(r){\n      var A = caja(r[1]), B = caja(r[2]);\n      var p0 = borde(A, B.x, B.y), p2 = borde(B, A.x, A.y);\n      var mx = (p0.x + p2.x) / 2, my = (p0.y + p2.y) / 2;\n      var dx = p2.x - p0.x, dy = p2.y - p0.y, d = Math.hypot(dx, dy);\n      var cx = mx - dy * r[5], cy = my + dx * r[5];               /* punto de control */\n      var g = el('g', {'class': 'arco paso ' + r[4], 'data-paso': r[0]});\n      var path = el('path', {d: 'M' + p0.x + ' ' + p0.y + ' Q' + cx + ' ' + cy + ' ' + p2.x + ' ' + p2.y});\n      g.appendChild(path);\n      /* punta orientada según la tangente final de la curva */\n      var tx = p2.x - cx, ty = p2.y - cy, tl = Math.hypot(tx, ty);\n      tx /= tl; ty /= tl;\n      var L = 14, W = 6.5;\n      var pts = [[p2.x, p2.y], [p2.x - tx * L - ty * W, p2.y - ty * L + tx * W],\n                 [p2.x - tx * L + ty * W, p2.y - ty * L - tx * W]];\n      g.appendChild(el('polygon', {'class': 'cabeza', points: pts.map(function(p){ return p.join(','); }).join(' ')}));\n      /* rótulo en el punto medio de la curva */\n      var lx = .25 * p0.x + .5 * cx + .25 * p2.x, ly = .25 * p0.y + .5 * cy + .25 * p2.y;\n      var t = el('text', {x: lx, y: ly + 6, 'text-anchor': 'middle'});\n      t.textContent = r[3];\n      var gr = el('g', {'class': 'arco paso ' + r[4], 'data-paso': r[0]});\n      gr.appendChild(t);\n      svg.appendChild(g);\n      svgR.appendChild(gr);\n      var largo = path.getTotalLength();\n      path.style.strokeDasharray = largo;\n      path.style.strokeDashoffset = largo;\n    });\n  }\n\n  dibujar();\n\n  var els = [].slice.call(document.querySelectorAll('[data-paso]'));\n  var MAX = Math.max.apply(null, els.map(function(e){ return +e.getAttribute('data-paso'); }));\n  var paso = 1;\n  var esc = document.getElementById('escenario');\n  var ayuda = document.getElementById('ayuda');\n\n  function pintar(){\n    els.forEach(function(e){\n      var on = +e.getAttribute('data-paso') <= paso;\n      e.classList.toggle('on', on);\n      var p = e.querySelector && e.querySelector('path');\n      if (p) p.style.strokeDashoffset = on ? 0 : p.style.strokeDasharray;\n    });\n  }\n  function ir(n){\n    paso = Math.max(1, Math.min(MAX, n));\n    pintar();\n    ayuda.style.opacity = 0;\n  }\n  function escalar(){\n    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);\n    esc.style.transform = 'translate(-50%,-50%) scale(' + s + ')';\n  }\n\n  document.addEventListener('keydown', function(ev){\n    var k = ev.key;\n    if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter') { ir(paso + 1); ev.preventDefault(); }\n    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { ir(paso - 1); ev.preventDefault(); }\n    else if (k === 'Home') ir(1);\n    else if (k === 'End') ir(MAX);\n  });\n  document.addEventListener('click', function(){ ir(paso + 1); });\n  window.addEventListener('resize', escalar);\n\n  escalar();\n  /* #todo muestra la ficha completa (útil para sacar una imagen); #paso=N empieza en el paso N */\n  var h = location.hash, m = h.match(/paso=(\\d+)/);\n  if (h === '#todo') { paso = MAX; ayuda.style.display = 'none'; }\n  else if (m) paso = Math.max(1, Math.min(MAX, +m[1]));\n  requestAnimationFrame(pintar);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"titulo": "Ficha 2 · Flujo rígido frente a libertad total", "html": "<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Ficha 2 · Flujo rígido frente a libertad total<\/title>\n<style>\n/* ===== Base común de las fichas BDDAT: copiar tal cual a cada ficha ===== */\n:root{\n  --fondo:#fff; --tarjeta:#F7F6F2; --borde:#D3D1C7; --borde-fuerte:#888780;\n  --texto:#2C2C2A; --texto-2:#5F5E5A;\n  --ida:#185FA5;      /* lo que va */\n  --vuelta:#3B6D11;   /* lo que vuelve */\n  --plan:#854F0B;     /* reservado */\n}\n*{box-sizing:border-box;margin:0}\nhtml,body{height:100%;background:var(--fondo);overflow:hidden}\nbody{font-family:\"Segoe UI\",Roboto,Arial,sans-serif;color:var(--texto)}\n\n/* Lienzo fijo de 1280x720 que se escala para caber en cualquier ventana */\n#escenario{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center}\n\n/* Aparición por pasos: cada elemento lleva data-paso=\"N\" y se muestra al llegar a N */\n.paso{opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s ease}\n.paso.on{opacity:var(--op,1);transform:none}\n\n#ayuda{position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:14px;color:#B4B2A9;\n  transition:opacity .4s}\n@media (prefers-reduced-motion:reduce){.paso,#ayuda{transition:none}}\n\n/* ===== Propio de esta ficha ===== */\n.titulo{position:absolute;left:0;right:0;top:34px;text-align:center;font-size:30px;font-weight:600}\n\n/* Cada elemento se coloca por su centro (data-x, data-y) */\n.c{position:absolute;translate:-50% -50%;white-space:nowrap;z-index:2}\n\n/* Saltos de la libertad total: una flecha cada vez, debajo de las cajas */\n#saltos{position:absolute;left:0;top:0;width:1280px;height:720px;z-index:1;overflow:visible}\n.salto{color:var(--ida)}\n.salto path{fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;transition:stroke-dashoffset .7s ease}\n.salto polygon{fill:currentColor;opacity:0;transition:opacity .2s ease .65s}\n.salto.on polygon{opacity:1}\n.lado{font-size:28px;font-weight:600}\n.lema{font-size:19px;color:var(--texto-2)}\n.caja{background:var(--tarjeta);border:2px solid var(--borde-fuerte);border-radius:10px;\n  padding:7px 16px;font-size:22px;font-weight:600}\n.bddat{background:#fff;border:3px solid var(--texto);border-radius:14px;padding:14px 30px;\n  font-size:46px;font-weight:700;letter-spacing:.5px}\n\n/* Flecha vertical entre dos cajas del flujo rígido */\n.baja{width:22px;height:34px;color:var(--borde-fuerte)}\n.baja path{fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}\n<\/style>\n<\/head>\n<body>\n<script>\n(function(){\n  var st = document.createElement('style');\n  st.textContent = '#ayuda{display:none!important}';\n  document.head.appendChild(st);\n\n  function conPaso(){ return [].slice.call(document.querySelectorAll('[data-paso]')); }\n  function maximo(){\n    return Math.max.apply(null, conPaso().map(function(e){ return +e.getAttribute('data-paso'); }));\n  }\n  function actual(){\n    var v = conPaso().filter(function(e){ return e.classList.contains('on'); })\n      .map(function(e){ return +e.getAttribute('data-paso'); });\n    return Math.max.apply(null, [1].concat(v));\n  }\n  function tecla(k){ document.dispatchEvent(new KeyboardEvent('keydown', {key: k, bubbles: true})); }\n\n  window.addEventListener('message', function(ev){\n    var m = ev.data || {};\n    if (m.cmd === 'next') {\n      if (actual() >= maximo()) parent.postMessage({fin: 'fin'}, '*'); else tecla('ArrowRight');\n    } else if (m.cmd === 'prev') {\n      if (actual() <= 1) parent.postMessage({fin: 'inicio'}, '*'); else tecla('ArrowLeft');\n    } else if (m.cmd === 'ultimo') {\n      tecla('End');\n    }\n  });\n\n  var NAV = {ArrowRight:1, ArrowLeft:1, ArrowUp:1, ArrowDown:1, ' ':1, PageDown:1, PageUp:1,\n             Enter:1, Backspace:1, Home:1, End:1, f:1, F:1};\n  document.addEventListener('keydown', function(e){\n    if (!e.isTrusted || !NAV[e.key]) return;\n    e.stopImmediatePropagation(); e.preventDefault();\n    parent.postMessage({tecla: e.key}, '*');\n  }, true);\n  document.addEventListener('click', function(e){\n    if (!e.isTrusted) return;\n    e.stopImmediatePropagation();\n    parent.postMessage({cmd: 'next'}, '*');\n  }, true);\n\n  window.addEventListener('load', function(){\n    setTimeout(function(){\n      window.dispatchEvent(new Event('resize'));\n      parent.postMessage({listo: true}, '*');\n    }, 60);\n  });\n})();\n<\/script>\n\n<div id=\"escenario\">\n  <div class=\"bloque-tag\" style=\"position:absolute;left:28px;top:16px;font-size:13px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#B4B2A9\">1 · El problema y los principios<\/div>\n  <div class=\"titulo\">Flujo rígido frente a libertad total<\/div>\n\n  <!-- 2 · Izquierda: flujo rígido, una sola secuencia -->\n  <div class=\"c lado paso\" data-paso=\"2\" data-x=\"250\" data-y=\"112\">Flujo rígido<\/div>\n  <div class=\"c lema paso\" data-paso=\"2\" data-x=\"250\" data-y=\"145\">el sistema decide el siguiente paso<\/div>\n  <div id=\"rigido\"><\/div>\n\n  <!-- 3 · Derecha: libertad total, los mismos elementos sueltos -->\n  <div class=\"c lado paso\" data-paso=\"3\" data-x=\"1040\" data-y=\"112\">Libertad total<\/div>\n  <div class=\"c lema paso\" data-paso=\"3\" data-x=\"1040\" data-y=\"145\">todo cabe, nada se controla<\/div>\n  <div id=\"libre\"><\/div>\n  <!-- 4 a 8 · saltos de un bloque a otro: cada flecha borra la anterior -->\n  <svg id=\"saltos\" viewBox=\"0 0 1280 720\" aria-hidden=\"true\"><\/svg>\n\n  <!-- 9 · En medio: BDDAT (la última flecha se quita) -->\n  <div class=\"c bddat paso\" data-paso=\"9\" data-x=\"640\" data-y=\"410\">BDDAT<\/div>\n  <div class=\"c lema paso\" data-paso=\"9\" data-x=\"640\" data-y=\"488\" style=\"transition-delay:.3s\">se sitúa en un punto intermedio<\/div>\n<\/div>\n\n<div id=\"ayuda\">← → o clic para avanzar<\/div>\n\n<script>\n(function(){\n  var ELEMENTOS = ['Solicitud', 'Requerimiento', 'Información pública', 'Consultas', 'Resolución', 'Recursos'];\n  var esc = document.getElementById('escenario');\n\n  function nuevo(clase, paso, x, y, texto, retardo){\n    var d = document.createElement('div');\n    d.className = 'c paso ' + clase;\n    d.setAttribute('data-paso', paso);\n    d.setAttribute('data-x', x);\n    d.setAttribute('data-y', y);\n    d.style.transitionDelay = retardo + 's';\n    if (texto) d.textContent = texto;\n    esc.appendChild(d);\n    return d;\n  }\n\n  /* Izquierda: columna con flechas, en cascada de arriba abajo */\n  var y0 = 205, dy = 92;\n  ELEMENTOS.forEach(function(t, i){\n    nuevo('caja', 2, 250, y0 + i * dy, t, .15 + i * .3);\n    if (i < ELEMENTOS.length - 1) {\n      var f = nuevo('baja', 2, 250, y0 + i * dy + dy / 2, '', .3 + i * .3);\n      f.innerHTML = '<svg class=\"baja\" viewBox=\"0 0 22 34\"><path d=\"M11 3v26M4 22l7 8 7-8\"/><\/svg>';\n    }\n  });\n\n  /* Derecha: los mismos, sin conexión, repartidos a igual distancia en círculo\n     y en otro orden (no hay secuencia) */\n  var ORDEN = [5, 3, 0, 2, 4, 1];   /* índices de ELEMENTOS, en el sentido de las agujas */\n  var cx = 1040, cy = 420, rx = 150, ry = 200;\n  ORDEN.forEach(function(k, i){\n    var a = -Math.PI / 2 + i * Math.PI / 3;\n    nuevo('caja', 3, Math.round(cx + rx * Math.cos(a)), Math.round(cy + ry * Math.sin(a)),\n          ELEMENTOS[k], .15 + i * .2).id = 'libre' + k;\n  });\n\n  [].forEach.call(document.querySelectorAll('.c'), function(c){\n    c.style.left = c.getAttribute('data-x') + 'px';\n    c.style.top = c.getAttribute('data-y') + 'px';\n  });\n\n  /* Saltos: [paso, de, a, curvatura], con índices de ELEMENTOS. Cada uno solo se ve en\n     su paso (data-solo): al llegar el siguiente, el anterior se borra. */\n  var SALTOS = [\n    [4, 0, 5, -.3],   /* Solicitud → Recursos */\n    [5, 5, 1, -.2],   /* Recursos → Requerimiento */\n    [6, 2, 4, .3],    /* Información pública → Resolución */\n    [7, 3, 0, -.25],  /* Consultas → Solicitud */\n    [8, 4, 3, .2],    /* Resolución → Consultas */\n  ];\n  var NS = 'http://www.w3.org/2000/svg';\n  var svg = document.getElementById('saltos');\n  function caja(k){\n    var c = document.getElementById('libre' + k);\n    return {x: +c.getAttribute('data-x'), y: +c.getAttribute('data-y'),\n            w: c.offsetWidth / 2 + 5, h: c.offsetHeight / 2 + 5};\n  }\n  function borde(b, tx, ty){\n    var dx = tx - b.x, dy = ty - b.y;\n    var k = Math.min(Math.abs(b.w / (dx || 1e-6)), Math.abs(b.h / (dy || 1e-6)));\n    return {x: b.x + dx * k, y: b.y + dy * k};\n  }\n  function el(tag, attrs){\n    var e = document.createElementNS(NS, tag);\n    for (var k in attrs) e.setAttribute(k, attrs[k]);\n    return e;\n  }\n  SALTOS.forEach(function(s){\n    var A = caja(s[1]), B = caja(s[2]);\n    var p0 = borde(A, B.x, B.y), p2 = borde(B, A.x, A.y);\n    var dx = p2.x - p0.x, dy = p2.y - p0.y;\n    var qx = (p0.x + p2.x) / 2 - dy * s[3], qy = (p0.y + p2.y) / 2 + dx * s[3];\n    var g = el('g', {'class': 'salto paso', 'data-paso': s[0], 'data-solo': '1'});\n    var path = el('path', {d: 'M' + p0.x + ' ' + p0.y + ' Q' + qx + ' ' + qy + ' ' + p2.x + ' ' + p2.y});\n    g.appendChild(path);\n    var tx = p2.x - qx, ty = p2.y - qy, tl = Math.hypot(tx, ty);\n    tx /= tl; ty /= tl;\n    var L = 16, W = 7.5;\n    g.appendChild(el('polygon', {points: [p2.x, p2.y, p2.x - tx * L - ty * W, p2.y - ty * L + tx * W,\n                                          p2.x - tx * L + ty * W, p2.y - ty * L - tx * W].join(' ')}));\n    svg.appendChild(g);\n    var largo = path.getTotalLength();\n    path.style.strokeDasharray = largo;\n    path.style.strokeDashoffset = largo;\n  });\n\n  var els = [].slice.call(document.querySelectorAll('[data-paso]'));\n  var MAX = Math.max.apply(null, els.map(function(e){ return +e.getAttribute('data-paso'); }));\n  var paso = 1;\n  var ayuda = document.getElementById('ayuda');\n\n  function pintar(){\n    els.forEach(function(e){\n      var n = +e.getAttribute('data-paso');\n      var on = e.hasAttribute('data-solo') ? n === paso : n <= paso;   /* data-solo: solo en su paso */\n      e.classList.toggle('on', on);\n      var p = e.querySelector && e.querySelector('path');\n      if (p && p.style.strokeDasharray) p.style.strokeDashoffset = on ? 0 : p.style.strokeDasharray;\n    });\n  }\n  function ir(n){\n    paso = Math.max(1, Math.min(MAX, n));\n    pintar();\n    ayuda.style.opacity = 0;\n  }\n  function escalar(){\n    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);\n    esc.style.transform = 'translate(-50%,-50%) scale(' + s + ')';\n  }\n\n  document.addEventListener('keydown', function(ev){\n    var k = ev.key;\n    if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter') { ir(paso + 1); ev.preventDefault(); }\n    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { ir(paso - 1); ev.preventDefault(); }\n    else if (k === 'Home') ir(1);\n    else if (k === 'End') ir(MAX);\n  });\n  document.addEventListener('click', function(){ ir(paso + 1); });\n  window.addEventListener('resize', escalar);\n\n  escalar();\n  /* #todo muestra la ficha completa (útil para sacar una imagen); #paso=N empieza en el paso N */\n  var h = location.hash, m = h.match(/paso=(\\d+)/);\n  if (h === '#todo') { paso = MAX; ayuda.style.display = 'none'; }\n  else if (m) paso = Math.max(1, Math.min(MAX, +m[1]));\n  requestAnimationFrame(pintar);\n})();\n<\/script>\n<\/body>\n<\/html>\n"}, {"titulo": "Ficha 3 · Principios de diseño de BDDAT", "html": "<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Ficha 3 · Principios de diseño de BDDAT<\/title>\n<style>\n/* ===== Base común de las fichas BDDAT: copiar tal cual a cada ficha ===== */\n:root{\n  --fondo:#fff; --tarjeta:#F7F6F2; --borde:#D3D1C7; --borde-fuerte:#888780;\n  --texto:#2C2C2A; --texto-2:#5F5E5A;\n  --ida:#185FA5;      /* lo que va */\n  --vuelta:#3B6
