<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha 19 · Dónde estamos</title>
<style>
/* ===== Base común de las fichas BDDAT: copiar tal cual a cada ficha ===== */
:root{
  --fondo:#fff; --tarjeta:#F7F6F2; --borde:#D3D1C7; --borde-fuerte:#888780;
  --texto:#2C2C2A; --texto-2:#5F5E5A;
  --ida:#185FA5;      /* lo que va */
  --vuelta:#3B6D11;   /* lo que vuelve */
  --plan:#854F0B;     /* reservado */
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--fondo);overflow:hidden}
body{font-family:"Segoe UI",Roboto,Arial,sans-serif;color:var(--texto)}

/* Lienzo fijo de 1280x720 que se escala para caber en cualquier ventana */
#escenario{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center}

/* Aparición por pasos: cada elemento lleva data-paso="N" y se muestra al llegar a N */
.paso{opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s ease}
.paso.on{opacity:var(--op,1);transform:none}

#ayuda{position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:14px;color:#B4B2A9;
  transition:opacity .4s}
@media (prefers-reduced-motion:reduce){.paso,#ayuda{transition:none}}

/* ===== Propio de esta ficha ===== */
.titulo{position:absolute;left:0;right:0;top:34px;text-align:center;font-size:30px;font-weight:600}

.col{position:absolute;top:100px;width:370px}
.col h3{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:700;padding-bottom:8px;margin-bottom:8px;
  border-bottom:3px solid currentColor}
.col h3 i{font-style:normal;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:17px;color:#fff;background:var(--c)}
.col.hecho{--c:var(--vuelta);color:var(--c)} .col.curso{--c:var(--ida);color:var(--c)} .col.antes{--c:var(--texto);color:var(--c)}
.item{font-size:17px;line-height:1.3;color:var(--texto);padding:6px 0 6px 18px;position:relative;border-bottom:1px solid var(--borde)}
.item::before{content:"";position:absolute;left:2px;top:13px;width:8px;height:8px;border-radius:50%}
.hecho .item::before{background:var(--vuelta)}
.curso .item::before{background:var(--ida)}
.antes .item::before{border:2px solid var(--texto);width:5px;height:5px}
.item small{display:block;font-size:14px;color:var(--texto-2)}

.limite{position:absolute;left:40px;right:40px;top:604px;display:flex;align-items:center;gap:16px;border:2px dashed var(--borde-fuerte);
  border-radius:12px;padding:10px 18px;background:#fff}
.limite b{font-size:19px;white-space:nowrap}
.limite span{font-size:16px;color:var(--texto-2)}
</style>
</head>
<body>

<div id="escenario">
  <div class="titulo">Dónde estamos</div>
  <div id="cols"></div>

  <!-- 5 · Los límites de hoy -->
  <div class="limite paso" data-paso="5">
    <b>Fuera de BDDAT, por ahora</b>
    <span>la firma (Port@firmas) y el envío de las notificaciones (Notifica-PNT, BandeJA): se sube el resultado</span>
  </div>
</div>

<div id="ayuda">← → o clic para avanzar</div>

<script>
(function(){
  var COLUMNAS = [
    ['hecho', '✓', 'Hecho', 2, [
      ['Estructura y árbol del expediente'],
      ['Reglas con escape e invariantes'],
      ['Plazos por acto, con su catálogo'],
      ['Certificados', 'fin de instrucción y cierres'],
      ['Análisis de la solicitud y consultas'],
      ['Reformados de proyecto'],
      ['Notificaciones', 'destinatarios, fechas y edicto'],
      ['Escritos desde plantillas y almacén'],
      ['Roles, listados y bitácora'],
    ]],
    ['curso', '◐', 'En curso', 3, [
      ['Interfaz', 'inspector y listados homogéneos'],
      ['Notificaciones: las pantallas que faltan', 'edicto, sede del solicitante, visibilidad'],
      ['Fase de resolución de la DUP'],
    ]],
    ['antes', '○', 'Antes de producción', 4, [
      ['El resto de fases', 'y lo particular de cada una'],
      ['Importar los expedientes de Access'],
      ['Almacén: lo que queda', 'exportar en ZIP, plantillas, PDF para firma, papelera'],
      ['Proyección de plazos'],
      ['Puesta en producción', 'HTTPS, ENS, copias de seguridad, servidor'],
    ]],
  ];
  var esc = document.getElementById('escenario');
  var cols = document.getElementById('cols');
  COLUMNAS.forEach(function(c, k){
    var d = document.createElement('div');
    d.className = 'col paso ' + c[0];
    d.setAttribute('data-paso', c[3]);
    d.style.left = (40 + k * 415) + 'px';
    var h = document.createElement('h3');
    h.innerHTML = '<i><span></span></i>';
    h.querySelector('span').textContent = c[1];
    h.appendChild(document.createTextNode(c[2]));
    d.appendChild(h);
    c[4].forEach(function(it, i){
      var e = document.createElement('div');
      e.className = 'item paso';
      e.setAttribute('data-paso', c[3]);
      e.style.transitionDelay = (.1 + i * .07) + 's';
      e.textContent = it[0];
      if (it[1]) { var s = document.createElement('small'); s.textContent = it[1]; e.appendChild(s); }
      d.appendChild(e);
    });
    cols.appendChild(d);
  });

  var els = [].slice.call(document.querySelectorAll('[data-paso]'));
  var MAX = Math.max.apply(null, els.map(function(e){ return +e.getAttribute('data-paso'); }));
  var paso = 1;
  var ayuda = document.getElementById('ayuda');

  function pintar(){
    els.forEach(function(e){ e.classList.toggle('on', +e.getAttribute('data-paso') <= paso); });
  }
  function ir(n){
    paso = Math.max(1, Math.min(MAX, n));
    pintar();
    ayuda.style.opacity = 0;
  }
  function escalar(){
    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
    esc.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
  }

  document.addEventListener('keydown', function(ev){
    var k = ev.key;
    if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter') { ir(paso + 1); ev.preventDefault(); }
    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { ir(paso - 1); ev.preventDefault(); }
    else if (k === 'Home') ir(1);
    else if (k === 'End') ir(MAX);
  });
  document.addEventListener('click', function(){ ir(paso + 1); });
  window.addEventListener('resize', escalar);

  escalar();
  /* #todo muestra la ficha completa (útil para sacar una imagen); #paso=N empieza en el paso N */
  var hs = location.hash, mm = hs.match(/paso=(\d+)/);
  if (hs === '#todo') { paso = MAX; ayuda.style.display = 'none'; }
  else if (mm) paso = Math.max(1, Math.min(MAX, +mm[1]));
  requestAnimationFrame(pintar);
})();
</script>
</body>
</html>
