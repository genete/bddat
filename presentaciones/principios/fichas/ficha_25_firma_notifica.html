<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha 25 · Firmar y notificar sin salir</title>
<style>
/* ===== Base común de las fichas BDDAT: copiar tal cual a cada ficha ===== */
:root{
  --fondo:#fff; --tarjeta:#F7F6F2; --borde:#D3D1C7; --borde-fuerte:#888780;
  --texto:#2C2C2A; --texto-2:#5F5E5A;
  --ida:#185FA5;      /* lo que va */
  --vuelta:#3B6D11;   /* lo que vuelve */
  --plan:#854F0B;     /* reservado */
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--fondo);overflow:hidden}
body{font-family:"Segoe UI",Roboto,Arial,sans-serif;color:var(--texto)}

/* Lienzo fijo de 1280x720 que se escala para caber en cualquier ventana */
#escenario{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center}

/* Aparición por pasos: cada elemento lleva data-paso="N" y se muestra al llegar a N */
.paso{opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s ease}
.paso.on{opacity:var(--op,1);transform:none}

#ayuda{position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:14px;color:#B4B2A9;
  transition:opacity .4s}
@media (prefers-reduced-motion:reduce){.paso,#ayuda{transition:none}}

/* ===== Propio de esta ficha ===== */
.titulo{position:absolute;left:0;right:0;top:34px;text-align:center;font-size:30px;font-weight:600}
.carril{position:absolute;left:40px;font-size:24px;font-weight:700}
.carril small{font-size:16px;font-weight:600;color:var(--texto-2);margin-left:10px}

.p{position:absolute;width:212px;height:96px;border:2px solid var(--borde-fuerte);border-radius:12px;background:#fff;padding:10px 12px;
  display:flex;flex-direction:column;justify-content:center;gap:4px}
.p .q{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--texto-2)}
.p .q svg{width:18px;height:18px}
.p .q svg *{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.p .t{font-size:17px;font-weight:600;line-height:1.25}
.p.mano{background:var(--tarjeta)}
.p.ida{border-color:var(--ida)} .p.ida .q{color:var(--ida)}
.p.vuelta{border-color:var(--vuelta)} .p.vuelta .q{color:var(--vuelta)}
.f{position:absolute;width:26px;height:20px;color:var(--borde-fuerte)}
.f path{fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

.pies{position:absolute;left:40px;right:40px;top:600px;display:flex;justify-content:center;gap:12px}
.pil{font-size:16px;font-weight:600;color:var(--texto-2);border:1.5px solid var(--borde-fuerte);border-radius:999px;padding:5px 14px;background:#fff}
.pil b{color:var(--texto)}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-persona" viewBox="0 0 18 18"><circle cx="9" cy="5" r="3.2"/><path d="M2.5 17c0-4 3-6.5 6.5-6.5s6.5 2.5 6.5 6.5"/></symbol>
  <symbol id="i-auto" viewBox="0 0 18 18"><circle cx="9" cy="9" r="3"/><path d="M9 1.5v3M9 13.5v3M1.5 9h3M13.5 9h3M3.7 3.7l2.1 2.1M12.2 12.2l2.1 2.1M3.7 14.3l2.1-2.1M12.2 5.8l2.1-2.1"/></symbol>
  <symbol id="i-doc" viewBox="0 0 18 18"><path d="M4 1.5h7l3.5 3.5v11.5H4z"/><path d="M11 1.5V5h3.5"/></symbol>
</svg>

<div id="escenario">
  <div class="bloque-tag" style="position:absolute;left:28px;top:16px;font-size:13px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#B4B2A9">8 · Lo que viene</div>
  <div class="titulo">Firmar y notificar sin salir de BDDAT</div>
  <div id="pasos"></div>

  <!-- 4 · Lo que no cambia -->
  <div class="pies paso" data-paso="4">
    <span class="pil">actúa <b>en nombre del funcionario</b>, con sus credenciales</span>
    <span class="pil">todo queda en la <b>bitácora</b></span>
    <span class="pil">el procedimiento <b>no cambia</b>: se ahorran pasos</span>
  </div>
</div>

<div id="ayuda">← → o clic para avanzar</div>

<script>
(function(){
  /* Dos carriles, cinco pasos cada uno: [clase, etiqueta, icono, texto] */
  var HOY = [
    ['', 'ELABORAR', 'i-doc', 'Borrador listo para firma'],
    ['mano', 'a mano', 'i-persona', 'Alta en BandeJA y envío a Port@firmas'],
    ['mano', 'a mano', 'i-persona', 'Bajar el firmado y subirlo a BDDAT'],
    ['mano', 'a mano', 'i-persona', 'Alta de la notificación en Notifica-PNT'],
    ['mano', 'a mano', 'i-persona', 'Bajar el justificante, subirlo y poner su fecha'],
  ];
  var DESPUES = [
    ['', 'ELABORAR', 'i-doc', 'Borrador listo para firma'],
    ['ida', 'BDDAT', 'i-auto', 'Lo envía a firma'],
    ['vuelta', 'vuelve solo', 'i-auto', 'Firmado: se reconoce por su pie y se coloca'],
    ['ida', 'BDDAT', 'i-auto', 'Lo notifica al destinatario de la tarea'],
    ['vuelta', 'vuelve solo', 'i-auto', 'Justificante: fechas y resultado, leídos'],
  ];
  var esc = document.getElementById('escenario');
  var cont = document.getElementById('pasos');
  var X0 = 40, PX = 246, ANCHO = 212;

  function carril(lista, y, paso, rotulo, sub){
    var r = document.createElement('div');
    r.className = 'carril paso';
    r.setAttribute('data-paso', paso);
    r.style.top = (y - 52) + 'px';
    r.innerHTML = '<span></span><small></small>';
    r.firstChild.textContent = rotulo;
    r.lastChild.textContent = sub;
    cont.appendChild(r);
    lista.forEach(function(it, i){
      var d = document.createElement('div');
      d.className = 'p paso ' + it[0];
      d.setAttribute('data-paso', paso);
      d.style.left = (X0 + i * PX) + 'px';
      d.style.top = y + 'px';
      d.style.transitionDelay = (.1 + i * .18) + 's';
      d.innerHTML = '<div class="q"><svg><use href="#' + it[2] + '"/></svg><span></span></div><div class="t"></div>';
      d.querySelector('.q span').textContent = it[1];
      d.querySelector('.t').textContent = it[3];
      cont.appendChild(d);
      if (i) {
        var f = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        f.setAttribute('class', 'f paso');
        f.setAttribute('data-paso', paso);
        f.setAttribute('viewBox', '0 0 26 20');
        f.style.left = (X0 + i * PX - 30) + 'px';
        f.style.top = (y + 38) + 'px';
        f.style.transitionDelay = (.05 + i * .18) + 's';
        f.innerHTML = '<path d="M3 10h18M15 4l6 6-6 6"/>';
        cont.appendChild(f);
      }
    });
  }
  carril(HOY, 160, 2, 'Hoy', 'cada salida y cada vuelta pasan por una persona');
  carril(DESPUES, 420, 3, 'Después', 'BDDAT hace los recados');

  var els = [].slice.call(document.querySelectorAll('[data-paso]'));
  var MAX = Math.max.apply(null, els.map(function(e){ return +e.getAttribute('data-paso'); }));
  var paso = 1;
  var ayuda = document.getElementById('ayuda');

  function pintar(){
    els.forEach(function(e){ e.classList.toggle('on', +e.getAttribute('data-paso') <= paso); });
  }
  function ir(n){
    paso = Math.max(1, Math.min(MAX, n));
    pintar();
    ayuda.style.opacity = 0;
  }
  function escalar(){
    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
    esc.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
  }

  document.addEventListener('keydown', function(ev){
    var k = ev.key;
    if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter') { ir(paso + 1); ev.preventDefault(); }
    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { ir(paso - 1); ev.preventDefault(); }
    else if (k === 'Home') ir(1);
    else if (k === 'End') ir(MAX);
  });
  document.addEventListener('click', function(){ ir(paso + 1); });
  window.addEventListener('resize', escalar);

  escalar();
  /* #todo muestra la ficha completa (útil para sacar una imagen); #paso=N empieza en el paso N */
  var hs = location.hash, mm = hs.match(/paso=(\d+)/);
  if (hs === '#todo') { paso = MAX; ayuda.style.display = 'none'; }
  else if (mm) paso = Math.max(1, Math.min(MAX, +mm[1]));
  requestAnimationFrame(pintar);
})();
</script>
</body>
</html>
