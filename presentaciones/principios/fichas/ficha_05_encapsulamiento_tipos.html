<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha 5 · Encapsulamiento y semántica</title>
<style>
/* ===== Base común de las fichas BDDAT: copiar tal cual a cada ficha ===== */
:root{
  --fondo:#fff; --tarjeta:#F7F6F2; --borde:#D3D1C7; --borde-fuerte:#888780;
  --texto:#2C2C2A; --texto-2:#5F5E5A;
  --ida:#185FA5;      /* lo que va */
  --vuelta:#3B6D11;   /* lo que vuelve */
  --plan:#854F0B;     /* reservado */
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--fondo);overflow:hidden}
body{font-family:"Segoe UI",Roboto,Arial,sans-serif;color:var(--texto)}

/* Lienzo fijo de 1280x720 que se escala para caber en cualquier ventana */
#escenario{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center}

/* Aparición por pasos: cada elemento lleva data-paso="N" y se muestra al llegar a N;
   con data-hasta="M" se vuelve a ocultar al llegar a M */
.paso{opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s ease}
.paso.on{opacity:var(--op,1);transform:none}

#ayuda{position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:14px;color:#B4B2A9;
  transition:opacity .4s}
@media (prefers-reduced-motion:reduce){.paso,#ayuda{transition:none}}

/* ===== Propio de esta ficha ===== */
.titulo{position:absolute;left:0;right:0;top:34px;text-align:center;font-size:30px;font-weight:600}
.c{position:absolute;translate:-50% -50%;white-space:nowrap}

/* Izquierda: los niveles, cada uno envuelto por el anterior con una llave */
.nivel{background:var(--tarjeta);border:2px solid var(--borde-fuerte);border-radius:10px;
  padding:8px 26px;font-size:28px;font-weight:600;min-width:220px;text-align:center}
.llave path{fill:none;stroke:var(--borde-fuerte);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}

/* Derecha: los tipos del nivel en curso; se sustituyen al bajar de nivel */
.tipos{position:absolute;left:680px;top:140px;width:560px}
.tipos h2{font-size:24px;font-weight:600;color:var(--texto-2);margin-bottom:22px}
.tipos .pildoras{display:flex;flex-wrap:wrap;gap:14px}
.pil{font-size:23px;font-weight:600;border:2px solid var(--borde-fuerte);border-radius:999px;
  padding:6px 18px;background:#fff;white-space:nowrap}
.pil.mas{color:var(--texto-2)}
</style>
</head>
<body>

<div id="escenario">
  <div class="titulo">Encapsulamiento y semántica</div>
  <div id="niveles"></div>
</div>

<div id="ayuda">← → o clic para avanzar</div>

<script>
(function(){
  /* Cada nivel: nombre y sus tipos. Las listas largas acaban en «…». */
  var NIVELES = [
    ['Expediente', ['Transporte', 'Distribución', 'Distribución cedida', 'Renovable', 'Autoconsumo',
                    'Línea directa', 'Convencional', 'Otros']],
    ['Solicitud',  ['AAP', 'AAC', 'DUP', 'AE provisional', 'AE definitiva', 'AAT', 'Modificación',
                    'Cierre', 'Desistimiento', 'Renuncia', 'Recurso', 'RAIPEE', 'y combinadas: AAP+AAC…']],
    ['Fase',       ['Análisis de solicitud', 'Consultas', 'Información pública', 'Compatibilidad ambiental',
                    'Figura ambiental externa', 'Datos catastrales', 'Consulta al Ministerio',
                    'Resolución', 'Resolución DUP', '…']],
    ['Trámite',    ['Análisis documental', 'Requerimiento de subsanación', 'Comunicación de inicio',
                    'Separata a organismo', 'Traslado al titular', 'Anuncio en el BOE',
                    'Tablón de ayuntamientos', '…']],
    ['Tarea',      ['ANALIZAR', 'ELABORAR', 'NOTIFICAR', 'ESPERAR PLAZO']],
  ];
  var X = 320, Y0 = 140, DY = 115, ANCHO_LLAVE = 560, ALTO_LLAVE = 40;
  var esc = document.getElementById('escenario');

  function llave(w, h){
    /* llave horizontal con la punta arriba (hacia el nivel que envuelve) y los brazos abajo */
    var m = w / 2, r = 22, y = h / 2;
    return '<svg class="llave" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '">' +
      '<path d="M2 ' + h + ' Q2 ' + y + ' ' + r + ' ' + y + ' H' + (m - r) + ' Q' + m + ' ' + y + ' ' + m + ' 2' +
      ' Q' + m + ' ' + y + ' ' + (m + r) + ' ' + y + ' H' + (w - r) + ' Q' + (w - 2) + ' ' + y + ' ' + (w - 2) + ' ' + h + '"/></svg>';
  }
  function poner(html, clase, paso, hasta, x, y, retardo){
    var d = document.createElement('div');
    d.className = clase + ' paso';
    d.setAttribute('data-paso', paso);
    if (hasta) d.setAttribute('data-hasta', hasta);
    if (x !== null) { d.style.left = x + 'px'; d.style.top = y + 'px'; }
    if (retardo) d.style.transitionDelay = retardo + 's';
    d.innerHTML = html;
    esc.appendChild(d);
    return d;
  }

  NIVELES.forEach(function(n, k){
    var pasoNivel = 2 + 2 * k, pasoTipos = 3 + 2 * k;
    var y = Y0 + k * DY;
    if (k > 0) {
      /* la llave entra con el nivel, entre él y el que lo envuelve */
      poner(llave(ANCHO_LLAVE, ALTO_LLAVE), 'c', pasoNivel, null, X, y - DY / 2 + 4, 0);
    }
    poner('', 'c nivel', pasoNivel, null, X, y, k > 0 ? .25 : 0).textContent = n[0];

    /* los tipos a la derecha: se quitan cuando aparece el nivel siguiente (salvo el último) */
    var hasta = k < NIVELES.length - 1 ? pasoTipos + 1 : null;
    var bloque = poner('', 'tipos', pasoTipos, hasta, null, null, 0);
    var h = document.createElement('h2');
    h.textContent = 'Tipos de ' + n[0].toLowerCase();
    bloque.appendChild(h);
    var p = document.createElement('div');
    p.className = 'pildoras';
    n[1].forEach(function(t, i){
      var s = document.createElement('span');
      s.className = 'pil paso' + (/…$/.test(t) ? ' mas' : '');
      s.setAttribute('data-paso', pasoTipos);
      if (hasta) s.setAttribute('data-hasta', hasta);
      s.style.transitionDelay = (.1 + i * .08) + 's';
      s.textContent = t;
      p.appendChild(s);
    });
    bloque.appendChild(p);
  });

  var els = [].slice.call(document.querySelectorAll('[data-paso]'));
  var MAX = Math.max.apply(null, els.map(function(e){ return +e.getAttribute('data-paso'); }));
  var paso = 1;
  var ayuda = document.getElementById('ayuda');

  function pintar(){
    els.forEach(function(e){
      var n = +e.getAttribute('data-paso'), hasta = e.getAttribute('data-hasta');
      e.classList.toggle('on', n <= paso && (!hasta || paso < +hasta));
    });
  }
  function ir(n){
    paso = Math.max(1, Math.min(MAX, n));
    pintar();
    ayuda.style.opacity = 0;
  }
  function escalar(){
    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
    esc.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
  }

  document.addEventListener('keydown', function(ev){
    var k = ev.key;
    if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter') { ir(paso + 1); ev.preventDefault(); }
    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { ir(paso - 1); ev.preventDefault(); }
    else if (k === 'Home') ir(1);
    else if (k === 'End') ir(MAX);
  });
  document.addEventListener('click', function(){ ir(paso + 1); });
  window.addEventListener('resize', escalar);

  escalar();
  /* #todo muestra la ficha completa (útil para sacar una imagen); #paso=N empieza en el paso N */
  var hs = location.hash, m = hs.match(/paso=(\d+)/);
  if (hs === '#todo') { paso = MAX; ayuda.style.display = 'none'; }
  else if (m) paso = Math.max(1, Math.min(MAX, +m[1]));
  requestAnimationFrame(pintar);
})();
</script>
</body>
</html>
