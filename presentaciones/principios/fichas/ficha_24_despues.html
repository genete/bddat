<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha 24 · Después de producción</title>
<style>
/* ===== Base común de las fichas BDDAT: copiar tal cual a cada ficha ===== */
:root{
  --fondo:#fff; --tarjeta:#F7F6F2; --borde:#D3D1C7; --borde-fuerte:#888780;
  --texto:#2C2C2A; --texto-2:#5F5E5A;
  --ida:#185FA5;      /* lo que va */
  --vuelta:#3B6D11;   /* lo que vuelve */
  --plan:#854F0B;     /* reservado */
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--fondo);overflow:hidden}
body{font-family:"Segoe UI",Roboto,Arial,sans-serif;color:var(--texto)}

/* Lienzo fijo de 1280x720 que se escala para caber en cualquier ventana */
#escenario{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center}

/* Aparición por pasos: cada elemento lleva data-paso="N" y se muestra al llegar a N */
.paso{opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s ease}
.paso.on{opacity:var(--op,1);transform:none}

#ayuda{position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:14px;color:#B4B2A9;
  transition:opacity .4s}
@media (prefers-reduced-motion:reduce){.paso,#ayuda{transition:none}}

/* ===== Propio de esta ficha ===== */
.titulo{position:absolute;left:0;right:0;top:34px;text-align:center;font-size:30px;font-weight:600}
.lema{position:absolute;left:0;right:0;top:80px;text-align:center;font-size:19px;color:var(--texto-2)}

.rejilla{position:absolute;left:40px;right:40px;top:130px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.idea{display:flex;gap:14px;border:2px solid var(--borde-fuerte);border-radius:12px;background:#fff;padding:14px 16px;min-height:150px}
.idea svg{width:40px;height:40px;flex:none;color:var(--texto)}
.idea svg *{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.idea h3{font-size:20px;font-weight:700;line-height:1.2}
.idea p{font-size:16px;line-height:1.35;color:var(--texto-2);margin-top:6px}
.idea.proc{border-color:var(--texto);background:var(--tarjeta)}
.leyenda{position:absolute;left:40px;top:664px;font-size:15px;color:var(--texto-2);display:flex;align-items:center;gap:10px}
.leyenda i{display:inline-block;width:22px;height:14px;border:2px solid var(--texto);border-radius:4px;background:var(--tarjeta)}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-firma" viewBox="0 0 40 40"><path d="M6 28c3-8 6-13 8-10s-2 10 1 10 5-9 8-9 1 7 4 7 4-4 5-5 3 1 4 1"/><path d="M5 34h30"/></symbol>
  <symbol id="i-vuelve" viewBox="0 0 40 40"><path d="M10 5h14l7 7v23H10z"/><path d="M24 5v7h7"/><path d="M15 24l4 4 7-8"/></symbol>
  <symbol id="i-sale" viewBox="0 0 40 40"><path d="M6 9h11l3 4h14v20H6z"/><path d="M13 20h14M13 25h14M13 30h9"/></symbol>
  <symbol id="i-reloj" viewBox="0 0 40 40"><circle cx="20" cy="21" r="14"/><path d="M20 12v9l6 4"/><path d="M15 3h10"/></symbol>
  <symbol id="i-aviso" viewBox="0 0 40 40"><path d="M5 9h30v19H17l-8 7v-7H5z"/><path d="M12 16h16M12 21h10"/></symbol>
  <symbol id="i-mapa" viewBox="0 0 40 40"><path d="M4 9l10-4 12 4 10-4v26l-10 4-12-4-10 4z"/><path d="M14 5v26M26 9v26"/></symbol>
  <symbol id="i-ayuda" viewBox="0 0 40 40"><circle cx="20" cy="20" r="15"/><path d="M15 15a5 5 0 1 1 7 5c-2 1-2 2-2 4"/><path d="M20 29v.5"/></symbol>
  <symbol id="i-hoja" viewBox="0 0 40 40"><rect x="6" y="6" width="28" height="28" rx="2"/><path d="M6 14h28M6 22h28M6 30h28M16 6v28"/></symbol>
  <symbol id="i-titular" viewBox="0 0 40 40"><circle cx="13" cy="12" r="5"/><path d="M4 30c0-6 4-10 9-10s9 4 9 10"/><path d="M24 18h12M31 13l5 5-5 5"/></symbol>
</svg>

<div id="escenario">
  <div class="bloque-tag" style="position:absolute;left:28px;top:16px;font-size:13px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#B4B2A9">8 · Lo que viene</div>
  <div class="titulo">Después de producción</div>
  <div class="lema">mejoras que no hacen falta para funcionar</div>
  <div class="rejilla" id="rejilla"></div>
  <div class="leyenda paso" data-paso="5"><i></i>las que tocan el procedimiento: se ven a continuación</div>
</div>

<div id="ayuda">← → o clic para avanzar</div>

<script>
(function(){
  /* [icono, título, qué es, paso, ¿toca el procedimiento?] */
  var IDEAS = [
    ['i-firma', 'Firmar y notificar sin salir', 'BDDAT lleva el escrito a Port@firmas y la notificación a Notifica o BandeJA', 2, true],
    ['i-vuelve', 'Lo que vuelve, se coloca solo', 'el firmado se reconoce por su pie; del justificante se leen las fechas', 2, true],
    ['i-sale', 'El expediente que sale', 'índice y compilación para el recurso o el juzgado', 2, true],
    ['i-reloj', 'Ver venir los vencimientos', 'alertas por persona e informes para los servicios centrales', 3, true],
    ['i-aviso', 'Avisos y encargos', 'el tramitador encarga tareas al administrativo, con aviso', 3, false],
    ['i-mapa', 'La instalación en el mapa', 'líneas, centros y subestaciones, con su estado', 3, true],
    ['i-ayuda', 'Ayuda donde se trabaja', 'manual contextual dentro de la aplicación', 4, false],
    ['i-hoja', 'A hoja de cálculo', 'listados y datos agregados a Excel o CSV', 4, false],
    ['i-titular', 'Titularidad en bloque', 'cambiar el titular de varios expedientes a la vez', 4, false],
  ];
  var rejilla = document.getElementById('rejilla');
  IDEAS.forEach(function(it, i){
    var d = document.createElement('div');
    d.className = 'idea paso' + (it[4] ? ' proc' : '');
    d.setAttribute('data-paso', it[3]);
    d.style.transitionDelay = ((i % 3) * .12) + 's';
    d.innerHTML = '<svg><use href="#' + it[0] + '"/></svg><div><h3></h3><p></p></div>';
    d.querySelector('h3').textContent = it[1];
    d.querySelector('p').textContent = it[2];
    rejilla.appendChild(d);
  });

  var esc = document.getElementById('escenario');
  var els = [].slice.call(document.querySelectorAll('[data-paso]'));
  var MAX = Math.max.apply(null, els.map(function(e){ return +e.getAttribute('data-paso'); }));
  var paso = 1;
  var ayuda = document.getElementById('ayuda');

  function pintar(){
    els.forEach(function(e){ e.classList.toggle('on', +e.getAttribute('data-paso') <= paso); });
  }
  function ir(n){
    paso = Math.max(1, Math.min(MAX, n));
    pintar();
    ayuda.style.opacity = 0;
  }
  function escalar(){
    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
    esc.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
  }

  document.addEventListener('keydown', function(ev){
    var k = ev.key;
    if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter') { ir(paso + 1); ev.preventDefault(); }
    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { ir(paso - 1); ev.preventDefault(); }
    else if (k === 'Home') ir(1);
    else if (k === 'End') ir(MAX);
  });
  document.addEventListener('click', function(){ ir(paso + 1); });
  window.addEventListener('resize', escalar);

  escalar();
  /* #todo muestra la ficha completa (útil para sacar una imagen); #paso=N empieza en el paso N */
  var hs = location.hash, mm = hs.match(/paso=(\d+)/);
  if (hs === '#todo') { paso = MAX; ayuda.style.display = 'none'; }
  else if (mm) paso = Math.max(1, Math.min(MAX, +mm[1]));
  requestAnimationFrame(pintar);
})();
</script>
</body>
</html>
