<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha 22 · Un expediente de principio a fin</title>
<style>
/* ===== Base común de las fichas BDDAT: copiar tal cual a cada ficha ===== */
:root{
  --fondo:#fff; --tarjeta:#F7F6F2; --borde:#D3D1C7; --borde-fuerte:#888780;
  --texto:#2C2C2A; --texto-2:#5F5E5A;
  --ida:#185FA5;      /* lo que va */
  --vuelta:#3B6D11;   /* lo que vuelve */
  --plan:#854F0B;     /* reservado */
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--fondo);overflow:hidden}
body{font-family:"Segoe UI",Roboto,Arial,sans-serif;color:var(--texto)}

/* Lienzo fijo de 1280x720 que se escala para caber en cualquier ventana */
#escenario{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center}

/* Aparición por pasos: cada elemento lleva data-paso="N" y se muestra al llegar a N */
.paso{opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s ease}
.paso.on{opacity:var(--op,1);transform:none}

#ayuda{position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:14px;color:#B4B2A9;
  transition:opacity .4s}
@media (prefers-reduced-motion:reduce){.paso,#ayuda{transition:none}}

/* ===== Propio de esta ficha ===== */
.titulo{position:absolute;left:0;right:0;top:34px;text-align:center;font-size:30px;font-weight:600}

/* Arriba: el procedimiento, etapa a etapa */
.etapa{position:absolute;top:100px;width:156px;display:flex;flex-direction:column;align-items:stretch;gap:6px}
.etapa .n{font-size:19px;font-weight:700;background:var(--tarjeta);border:2px solid var(--borde-fuerte);border-radius:10px;
  padding:8px 6px;text-align:center;line-height:1.15}
.etapa .n small{display:block;font-size:13px;font-weight:600;color:var(--texto-2)}
.etapa .sub{font-size:15px;font-weight:600;text-align:center;border:1.5px solid var(--borde-fuerte);border-radius:8px;padding:4px 4px;background:#fff}
.etapa.clave .n{border-color:var(--texto)}
.chev{position:absolute;left:0;top:116px;width:14px;height:22px;color:var(--borde-fuerte)}
.chev path{fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}

/* Debajo: lo que pone BDDAT en cada etapa */
.pone{position:absolute;top:300px;width:156px;display:flex;flex-direction:column;gap:6px}
.pone span{font-size:14px;font-weight:600;line-height:1.25;color:var(--ida);border:1.5px solid var(--ida);border-radius:8px;padding:4px 7px;background:#fff;text-align:center}
.raya{position:absolute;left:40px;right:40px;top:280px;border-top:1px dashed var(--borde)}
.rotulo{position:absolute;font-size:14px;font-weight:700;color:var(--texto-2);text-transform:uppercase;letter-spacing:.5px}
.despues{position:absolute;left:1072px;top:420px;width:156px;font-size:14px;font-weight:600;color:var(--texto-2);border:1.5px dashed var(--borde-fuerte);
  border-radius:8px;padding:5px 8px;text-align:center;line-height:1.3}

/* Abajo: lo que está siempre */
.siempre{position:absolute;left:40px;right:40px;top:560px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.siempre div{border:2px solid var(--texto);border-radius:10px;background:var(--tarjeta);padding:8px 12px;font-size:17px;font-weight:700;text-align:center}
.siempre div small{display:block;font-size:14px;font-weight:600;color:var(--texto-2)}
</style>
</head>
<body>

<div id="escenario">
  <div class="titulo">Un expediente de principio a fin</div>
  <div id="cosas"></div>
</div>

<div id="ayuda">← → o clic para avanzar</div>

<script>
(function(){
  /* Las etapas del procedimiento y, debajo, lo que BDDAT pone en cada una.
     [nombre, subtítulo, subetapas, piezas, paso de las piezas, ¿clave?] */
  var ETAPAS = [
    ['Solicitud', 'entra por registro', [], ['entidades y roles', 'uno o varios actos', 'el reloj de cada acto empieza'], 3],
    ['Análisis', '¿está completa?', [], ['requisitos según el proyecto', 'diagnóstico', 'requerimiento y su plazo'], 3],
    ['Instrucción', 'en paralelo', ['Consultas', 'Información pública', 'Ambiental'],
      ['un camino por organismo', 'anuncios y alegaciones', 'reformados: nueva versión'], 4],
    ['Fin de instrucción', '', [], ['certificado: la bisagra'], 5, true],
    ['Resolución', 'elaborar y firmar', [], ['plantilla con los datos', 'firma'], 5],
    ['Notificación', 'a todos', [], ['un destinatario cada una', 'el canal, del justificante', 'cumplimiento y efectos'], 6],
    ['Cierre', '', [], ['certificados de cierre', '¿en plazo?, acto por acto'], 6, true],
  ];
  var X0 = 40, PASO_X = 172;
  var cosas = document.getElementById('cosas');
  function poner(html, clase, paso, estilo, retardo){
    var d = document.createElement('div');
    d.className = clase + ' paso';
    d.setAttribute('data-paso', paso);
    if (estilo) d.setAttribute('style', estilo);
    if (retardo) d.style.transitionDelay = retardo + 's';
    d.innerHTML = html;
    cosas.appendChild(d);
    return d;
  }
  function texto(t){ var s = document.createElement('span'); s.textContent = t; return s.outerHTML; }

  ETAPAS.forEach(function(e, k){
    var x = X0 + k * PASO_X;
    /* 2 · la etapa */
    var html = '<div class="n">' + texto(e[0]).replace(/^<span>|<\/span>$/g, '') +
      (e[1] ? '<small>' + texto(e[1]).replace(/^<span>|<\/span>$/g, '') + '</small>' : '') + '</div>';
    e[2].forEach(function(s){ html += '<div class="sub">' + texto(s).replace(/^<span>|<\/span>$/g, '') + '</div>'; });
    poner(html, 'etapa' + (e[5] ? ' clave' : ''), 2, 'left:' + x + 'px', .1 + k * .12);
    if (k) poner('<svg class="chev" viewBox="0 0 14 22"><path d="M3 3l8 8-8 8"/></svg>', '', 2,
                 'position:absolute;left:' + (x - 15) + 'px;top:0', .1 + k * .12);
    /* 3 a 6 · lo que pone BDDAT */
    poner(e[3].map(texto).join(''), 'pone', e[4], 'left:' + x + 'px', .1 + (k % 2) * .15);
  });
  poner('', 'raya', 3);
  poner('Lo que pone BDDAT', 'rotulo', 3, 'left:40px;top:258px');
  poner('Después: recurso, modificación, explotación… <b>es otra solicitud</b>', 'despues', 6, null, .5);

  /* 7 · lo que está siempre, de principio a fin */
  poner('<div>Reglas e invariantes<small>en cada paso, con escape</small></div>' +
        '<div>Estado calculado<small>árbol y listado</small></div>' +
        '<div>Documentos<small>en el almacén, con fecha</small></div>' +
        '<div>Bitácora<small>quién, cuándo, por qué</small></div>', 'siempre', 7);
  poner('De principio a fin', 'rotulo', 7, 'left:40px;top:536px');

  var esc = document.getElementById('escenario');
  var els = [].slice.call(document.querySelectorAll('[data-paso]'));
  var MAX = Math.max.apply(null, els.map(function(e){ return +e.getAttribute('data-paso'); }));
  var paso = 1;
  var ayuda = document.getElementById('ayuda');

  function pintar(){
    els.forEach(function(e){ e.classList.toggle('on', +e.getAttribute('data-paso') <= paso); });
  }
  function ir(n){
    paso = Math.max(1, Math.min(MAX, n));
    pintar();
    ayuda.style.opacity = 0;
  }
  function escalar(){
    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
    esc.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
  }

  document.addEventListener('keydown', function(ev){
    var k = ev.key;
    if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter') { ir(paso + 1); ev.preventDefault(); }
    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { ir(paso - 1); ev.preventDefault(); }
    else if (k === 'Home') ir(1);
    else if (k === 'End') ir(MAX);
  });
  document.addEventListener('click', function(){ ir(paso + 1); });
  window.addEventListener('resize', escalar);

  escalar();
  /* #todo muestra la ficha completa (útil para sacar una imagen); #paso=N empieza en el paso N */
  var hs = location.hash, mm = hs.match(/paso=(\d+)/);
  if (hs === '#todo') { paso = MAX; ayuda.style.display = 'none'; }
  else if (mm) paso = Math.max(1, Math.min(MAX, +mm[1]));
  requestAnimationFrame(pintar);
})();
</script>
</body>
</html>
