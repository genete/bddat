<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha 2 · Flujo rígido frente a libertad total</title>
<style>
/* ===== Base común de las fichas BDDAT: copiar tal cual a cada ficha ===== */
:root{
  --fondo:#fff; --tarjeta:#F7F6F2; --borde:#D3D1C7; --borde-fuerte:#888780;
  --texto:#2C2C2A; --texto-2:#5F5E5A;
  --ida:#185FA5;      /* lo que va */
  --vuelta:#3B6D11;   /* lo que vuelve */
  --plan:#854F0B;     /* reservado */
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--fondo);overflow:hidden}
body{font-family:"Segoe UI",Roboto,Arial,sans-serif;color:var(--texto)}

/* Lienzo fijo de 1280x720 que se escala para caber en cualquier ventana */
#escenario{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center}

/* Aparición por pasos: cada elemento lleva data-paso="N" y se muestra al llegar a N */
.paso{opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s ease}
.paso.on{opacity:var(--op,1);transform:none}

#ayuda{position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:14px;color:#B4B2A9;
  transition:opacity .4s}
@media (prefers-reduced-motion:reduce){.paso,#ayuda{transition:none}}

/* ===== Propio de esta ficha ===== */
.titulo{position:absolute;left:0;right:0;top:34px;text-align:center;font-size:30px;font-weight:600}

/* Cada elemento se coloca por su centro (data-x, data-y) */
.c{position:absolute;translate:-50% -50%;white-space:nowrap}
.lado{font-size:28px;font-weight:600}
.lema{font-size:19px;color:var(--texto-2)}
.caja{background:var(--tarjeta);border:2px solid var(--borde-fuerte);border-radius:10px;
  padding:7px 16px;font-size:22px;font-weight:600}
.bddat{background:#fff;border:3px solid var(--texto);border-radius:14px;padding:14px 30px;
  font-size:46px;font-weight:700;letter-spacing:.5px}

/* Flecha vertical entre dos cajas del flujo rígido */
.baja{width:22px;height:34px;color:var(--borde-fuerte)}
.baja path{fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>

<div id="escenario">
  <div class="titulo">Flujo rígido frente a libertad total</div>

  <!-- 2 · Izquierda: flujo rígido, una sola secuencia -->
  <div class="c lado paso" data-paso="2" data-x="250" data-y="112">Flujo rígido</div>
  <div class="c lema paso" data-paso="2" data-x="250" data-y="145">el sistema decide el siguiente paso</div>
  <div id="rigido"></div>

  <!-- 3 · Derecha: libertad total, los mismos elementos sueltos -->
  <div class="c lado paso" data-paso="3" data-x="1040" data-y="112">Libertad total</div>
  <div class="c lema paso" data-paso="3" data-x="1040" data-y="145">todo cabe, nada se controla</div>
  <div id="libre"></div>

  <!-- 4 · En medio: BDDAT -->
  <div class="c bddat paso" data-paso="4" data-x="640" data-y="410">BDDAT</div>
</div>

<div id="ayuda">← → o clic para avanzar</div>

<script>
(function(){
  var ELEMENTOS = ['Solicitud', 'Requerimiento', 'Información pública', 'Consultas', 'Resolución', 'Recursos'];
  var esc = document.getElementById('escenario');

  function nuevo(clase, paso, x, y, texto, retardo){
    var d = document.createElement('div');
    d.className = 'c paso ' + clase;
    d.setAttribute('data-paso', paso);
    d.setAttribute('data-x', x);
    d.setAttribute('data-y', y);
    d.style.transitionDelay = retardo + 's';
    if (texto) d.textContent = texto;
    esc.appendChild(d);
    return d;
  }

  /* Izquierda: columna con flechas, en cascada de arriba abajo */
  var y0 = 205, dy = 92;
  ELEMENTOS.forEach(function(t, i){
    nuevo('caja', 2, 250, y0 + i * dy, t, .15 + i * .3);
    if (i < ELEMENTOS.length - 1) {
      var f = nuevo('baja', 2, 250, y0 + i * dy + dy / 2, '', .3 + i * .3);
      f.innerHTML = '<svg class="baja" viewBox="0 0 22 34"><path d="M11 3v26M4 22l7 8 7-8"/></svg>';
    }
  });

  /* Derecha: los mismos, sin conexión, repartidos a igual distancia en círculo
     y en otro orden (no hay secuencia) */
  var ORDEN = [5, 3, 0, 2, 4, 1];   /* índices de ELEMENTOS, en el sentido de las agujas */
  var cx = 1040, cy = 420, rx = 150, ry = 200;
  ORDEN.forEach(function(k, i){
    var a = -Math.PI / 2 + i * Math.PI / 3;
    nuevo('caja', 3, Math.round(cx + rx * Math.cos(a)), Math.round(cy + ry * Math.sin(a)),
          ELEMENTOS[k], .15 + i * .2);
  });

  [].forEach.call(document.querySelectorAll('.c'), function(c){
    c.style.left = c.getAttribute('data-x') + 'px';
    c.style.top = c.getAttribute('data-y') + 'px';
  });

  var els = [].slice.call(document.querySelectorAll('[data-paso]'));
  var MAX = Math.max.apply(null, els.map(function(e){ return +e.getAttribute('data-paso'); }));
  var paso = 1;
  var ayuda = document.getElementById('ayuda');

  function pintar(){
    els.forEach(function(e){ e.classList.toggle('on', +e.getAttribute('data-paso') <= paso); });
  }
  function ir(n){
    paso = Math.max(1, Math.min(MAX, n));
    pintar();
    ayuda.style.opacity = 0;
  }
  function escalar(){
    var s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
    esc.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
  }

  document.addEventListener('keydown', function(ev){
    var k = ev.key;
    if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter') { ir(paso + 1); ev.preventDefault(); }
    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { ir(paso - 1); ev.preventDefault(); }
    else if (k === 'Home') ir(1);
    else if (k === 'End') ir(MAX);
  });
  document.addEventListener('click', function(){ ir(paso + 1); });
  window.addEventListener('resize', escalar);

  escalar();
  /* #todo muestra la ficha completa (útil para sacar una imagen); #paso=N empieza en el paso N */
  var h = location.hash, m = h.match(/paso=(\d+)/);
  if (h === '#todo') { paso = MAX; ayuda.style.display = 'none'; }
  else if (m) paso = Math.max(1, Math.min(MAX, +m[1]));
  requestAnimationFrame(pintar);
})();
</script>
</body>
</html>
