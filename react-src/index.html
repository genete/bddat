<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expediente-árbol — desarrollo standalone</title>
  <!-- Standalone: replica el contexto CSS de Flask (base de la Junta + iconos) para que
       las clases de utilidad y los iconos bi-* rendericen igual que sobre el shell.
       Las rutas salen de app/static/vendor, servido como publicDir en vite.config.js (#984). -->
  <link rel="stylesheet" href="/jda/css/fonts.css">
  <link rel="stylesheet" href="/jda/css/all.css">
  <link rel="stylesheet" href="/jda/css/custom-jda-bootstrap.css">
  <link rel="stylesheet" href="/bootstrap-icons/bootstrap-icons.css">
  <style>
    html, body { margin: 0; height: 100%; }
    #root { width: 100vw; height: 100vh; }

    /* Fallback SOLO dev standalone: sobre el shell de Flask estos tokens los
     * define app/static/css/v2-theme.css (:root); aquí no hay shell, así que
     * el árbol (arbol.css) los inyecta a mano para que var(--sem-…) resuelva.
     * Mismos valores que v2-theme.css — mantener sincronizados (#571). */
    :root {
      --sem-rojo:     #cc3b3b;
      --sem-naranja:  #e0892b;
      --sem-amarillo: #e9c43d;
      --sem-azul:     #3b78cc;
      --sem-gris:     #9a9a9a;
      --sem-verde:    #3a9b4e;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/expediente-arbol/main.jsx"></script>
</body>
</html>
